<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B2118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lumi's Magic Map — Lumio English</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Story v2 — premium animated storybook.
   Same story-content pages, same text, same art, same unlock
   rules as story.html; only the presentation and motion change.
   ============================================================ */
:root{
  --tb:56px;
  --bg:#2B2118; --bg2:#3A2A1C;
  --chrome:rgba(43,33,24,.82);
  --paper:#FFF9EE; --paper2:#FFF1DA;
  --ink:#43301F; --muted:#8A7160;
  --accent:#F97316; --accent2:#EA580C; --accentInk:#fff;
  --glass:rgba(255,251,243,.94);
  --line:rgba(67,48,31,.12);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-story:'Baloo 2','Nunito',sans-serif;
}
body.theme-teen{
  --bg:#17120D; --bg2:#2A2017;
  --chrome:rgba(23,18,13,.82);
  --paper:#2B2119; --paper2:#211912;
  --ink:#FFF3D6; --muted:#C9B59B;
  --accent:#F59E0B; --accent2:#D97706;
  --glass:rgba(28,22,16,.86);
  --line:rgba(255,243,214,.12);
  --font-story:'Nunito','Baloo 2',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
img{user-select:none;-webkit-user-drag:none}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--tb) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0 16px;
  background:var(--chrome);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
#topbar .brand{color:#FFF3D6;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbBtns{display:flex;align-items:center;gap:6px;flex:none}
.tbBtn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;
  font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.tbBtn:hover{background:rgba(255,255,255,.22)}
.tbBtn .ico{font-size:1.05rem;line-height:1}
@media (max-height:500px){ :root{--tb:48px} #nav{height:62px} .navbtn{height:46px} }
@media (max-width:640px), (max-height:500px){ .tbBtn .lbl{display:none} .tbBtn{padding:0;width:44px} #topbar .brand{font-size:.98rem} }

/* ---------- book area ---------- */
#book{position:fixed;left:0;right:0;bottom:0;top:calc(var(--tb) + env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden}
#ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ambient i{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFD59A;opacity:.0;box-shadow:0 0 12px 3px rgba(255,200,120,.45);animation:float 9s ease-in-out infinite}
body.theme-teen #ambient i{background:#FFE7B8;box-shadow:0 0 10px 2px rgba(255,220,160,.25);animation-duration:16s}
@keyframes float{0%{transform:translate3d(0,30px,0) scale(.6);opacity:0}30%{opacity:.7}70%{opacity:.5}100%{transform:translate3d(14px,-60px,0) scale(1);opacity:0}}
#pages{position:relative;flex:1;min-height:0;margin:14px 16px 0;perspective:2400px;perspective-origin:50% 45%;touch-action:pan-y}

.sheet{position:absolute;left:50%;top:50%;width:var(--sw);height:var(--sh);margin-left:calc(var(--sw) / -2);margin-top:calc(var(--sh) / -2);
  background:var(--paper);border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.05) inset;will-change:transform}
.art{position:relative;overflow:hidden;background:#d9c7a8}
/* The whole picture always shows (contain); a blurred copy fills any space around it. */
.sceneFill{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(18px) saturate(1.15) brightness(.9);transform:scale(1.05)}
.kb{position:absolute;inset:0;will-change:transform}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform;transform-origin:50% 50%}
.artShade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 22%,transparent 62%,rgba(0,0,0,.22) 100%)}
.partbadge{position:absolute;left:16px;top:14px;z-index:4;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.86rem;
  padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,#F97316,#EA580C);box-shadow:0 8px 18px rgba(0,0,0,.25);
  max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.theme-teen .partbadge{font-family:'Nunito',sans-serif;letter-spacing:.01em}
.turnShade,.glare{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:30}
.turnShade{background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.18) 60%,rgba(0,0,0,.35))}
.glare{background:linear-gradient(90deg,transparent 55%,rgba(255,255,255,.0) 70%,rgba(255,255,255,.38) 88%,rgba(0,0,0,.28) 100%)}
.textCol{position:relative}
.caption{transition:opacity .3s ease,transform .3s var(--ease)}
.caption.text-hidden{opacity:0;transform:translateY(16px);pointer-events:none}
.caption p{font-family:var(--font-story);font-weight:700;color:var(--ink);line-height:1.55}
body.theme-teen .caption p{font-weight:600;line-height:1.6}
.caption p b{color:var(--accent2);font-weight:800}
body.theme-teen .caption p b{color:#FBBF24}
.caption p.ar{direction:rtl;text-align:right;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:700;margin-top:10px;line-height:1.7}
.caption p.ar b,body.theme-teen .caption p.ar b{color:inherit}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em 0 .14em;margin:-.08em 0 -.14em}
.wi{display:inline-block;will-change:transform}

/* --- mode: stack (portrait phones / tablets) --- */
.mode-stack .sheet{display:flex;flex-direction:column}
.mode-stack .art{flex:0 0 auto;width:100%;height:calc(var(--sw) * .5625)}
.mode-stack .textCol{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 18px;display:flex;flex-direction:column}
.mode-stack .caption{margin:auto 0}
.mode-stack .caption p{font-size:1.2rem}
body.theme-teen .mode-stack .caption p{font-size:1.1rem}
.mode-stack .caption p.ar{font-size:1rem}
.mode-stack .textCol::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.35}
/* --- mode: side (short landscape) --- */
.mode-side .sheet{display:grid;grid-template-columns:1.45fr 1fr}
.mode-side .art{height:100%}
.mode-side .textCol{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column}
.mode-side .caption{margin:auto 0}
.mode-side .caption p{font-size:1.02rem}
.mode-side .caption p.ar{font-size:.9rem}
/* --- mode: overlay (laptop / big landscape) --- */
.mode-overlay .art{position:absolute;inset:0}
.mode-overlay .textCol{display:contents}
.mode-overlay .partbadge{left:calc(var(--u)*40px);top:calc(var(--u)*34px);font-size:max(13px,calc(var(--u)*19px));padding:calc(var(--u)*10px) calc(var(--u)*24px)}
.mode-overlay .caption{position:absolute;z-index:10;left:calc(var(--u)*60px);right:calc(var(--u)*60px);bottom:calc(var(--u)*44px);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:calc(var(--u)*28px);
  padding:calc(var(--u)*26px) calc(var(--u)*40px);box-shadow:0 20px 46px rgba(0,0,0,.3);max-height:52%;overflow-y:auto}
.mode-overlay .caption p{font-size:max(15px,calc(var(--u)*27px))}
.mode-overlay .caption p.ar{font-size:max(13px,calc(var(--u)*19px))}

/* ---------- nav / progress ---------- */
#nav{flex:none;height:76px;padding:0 16px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:14px;position:relative;z-index:20}
.navbtn{flex:none;height:50px;min-width:50px;padding:0 20px;border-radius:999px;font-weight:900;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative}
#prevBtn{background:rgba(255,255,255,.12);color:#fff;transition:opacity .3s}
#prevBtn:disabled{opacity:0;pointer-events:none}
#nextBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 12px 24px -8px rgba(249,115,22,.65)}
#nextBtn::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid var(--accent);opacity:0;pointer-events:none}
#nextBtn.ready::after{animation:ring 2.2s var(--ease) infinite}
body.theme-teen #nextBtn.ready::after{animation-duration:3.4s}
@keyframes ring{0%{transform:scale(.92);opacity:.7}70%,100%{transform:scale(1.22);opacity:0}}
@media (max-width:420px){ .navbtn .lbl{display:none} .navbtn{padding:0;width:56px} }
.prog{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.segs{display:flex;gap:5px;width:100%;max-width:420px}
.segs span{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.segs b{position:absolute;inset:0;background:linear-gradient(90deg,#FFC53D,var(--accent));border-radius:8px;transform:scaleX(0);transform-origin:0 50%}
.segs span.on b{box-shadow:0 0 10px rgba(255,197,61,.8)}
.progLbl{color:#E9D9BF;font-weight:800;font-size:.82rem;letter-spacing:.02em}
.progLbl b{color:#fff}

/* ---------- color game (Pre-A part 1 page 3) ---------- */
#colorGame{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;z-index:20}
#colorGame .swatch{width:48px;height:48px;border-radius:50%;cursor:pointer;border:4px solid #fff;box-shadow:0 8px 16px rgba(67,48,31,.25);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#colorGame .swatch.done{border-color:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.5),0 8px 16px rgba(67,48,31,.25)}
#colorGame .swatch.shake{animation:shakeAnim .45s}
@keyframes shakeAnim{20%,60%{transform:translateX(-8px) rotate(-4deg)}40%,80%{transform:translateX(8px) rotate(4deg)}}
.mode-stack #colorGame{margin-bottom:14px}
.mode-side #colorGame{margin-bottom:10px;gap:8px}
.mode-side #colorGame .swatch{width:44px;height:44px}
.mode-overlay #colorGame{position:absolute;left:0;right:0;top:53%;gap:calc(var(--u)*18px)}
.mode-overlay #colorGame .swatch{width:max(46px,calc(var(--u)*78px));height:max(46px,calc(var(--u)*78px));border-width:max(3px,calc(var(--u)*5px));font-size:max(1.2rem,calc(var(--u)*1.8rem))}

/* ---------- overlays inside the book ---------- */
.ov{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden}
.btnP,.btnG{height:52px;padding:0 26px;border-radius:999px;font-weight:900;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btnP{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 28px -10px rgba(249,115,22,.75)}
.btnG{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}
.light .btnG{background:#fff;color:var(--ink);border:1px solid #F1E4DA}

/* cover */
#cover{background:#120d08;transform-origin:0% 50%}
.cvBg{position:absolute;inset:-4%}
.cvBg img{width:100%;height:100%;object-fit:cover;filter:blur(3px) saturate(1.1) brightness(.82)}
.cvShade{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 38%,rgba(255,200,120,.22),transparent 70%),linear-gradient(180deg,rgba(20,13,6,.2) 0%,rgba(20,13,6,.5) 45%,rgba(20,13,6,.92) 100%)}
body.theme-teen .cvShade{background:linear-gradient(180deg,rgba(10,8,6,.45) 0%,rgba(10,8,6,.7) 50%,rgba(10,8,6,.95) 100%)}
.cvIn{position:relative;z-index:2;width:100%;max-width:1040px;height:100%;padding:20px 22px 26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;gap:6px}
.cvLumi{width:min(42vw,190px);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));margin-bottom:4px;transform-origin:50% 100%}
.cvEyebrow{display:inline-flex;align-items:center;gap:8px;color:#FFD59A;font-weight:900;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;overflow:hidden}
.cvEyebrow::before,.cvEyebrow::after{content:"";width:26px;height:2px;background:currentColor;opacity:.6}
.cvTitle{font-family:'Baloo 2',sans-serif;font-weight:800;color:#fff;font-size:clamp(2.1rem,8.6vw,4.4rem);line-height:1.02;text-shadow:0 6px 30px rgba(0,0,0,.45);margin:4px 0 2px}
body.theme-teen .cvTitle{font-family:'Nunito',sans-serif;font-weight:900;letter-spacing:-.01em}
.cvTitle .cw{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em 0 .1em}
.cvTitle .cc{display:inline-block}
.cvStory{color:#E9D9BF;font-weight:800;font-size:.98rem}
.cvBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
#cvStart{position:relative}
#cvStart::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:3px solid var(--accent);opacity:0;animation:ring 2.4s var(--ease) infinite 1.4s}
@media (min-width:900px) and (min-height:560px){
  .cvIn{flex-direction:row;align-items:flex-end;justify-content:space-between;text-align:left;padding:40px 56px 56px}
  .cvText{display:flex;flex-direction:column;align-items:flex-start;max-width:640px}
  .cvBtns{justify-content:flex-start}
  .cvLumi{order:2;width:260px;margin:0}
}
@media (max-height:560px) and (orientation:landscape){
  .cvIn{flex-direction:row;align-items:flex-end;justify-content:space-between;text-align:left;padding:14px 28px 18px}
  .cvText{display:flex;flex-direction:column;align-items:flex-start}
  .cvBtns{justify-content:flex-start;margin-top:10px}
  .cvTitle{font-size:clamp(1.8rem,6vw,3rem)}
  .cvLumi{order:2;width:150px;margin:0}
}

/* lock + celebration (light paper) */
.paperOv{background:radial-gradient(120% 90% at 50% 0%,#FFF8EA 0%,#FDE8CC 70%,#F9D9AE 100%)}
body.theme-teen .paperOv{background:radial-gradient(120% 90% at 50% 0%,#3A2A1C 0%,var(--lumio-night-deep,#1C1610) 75%)}
.ovCard{position:relative;z-index:2;width:100%;max-width:560px;max-height:100%;overflow-y:auto;overflow-x:hidden;padding:22px 20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ovCard h2{font-family:'Baloo 2',sans-serif;color:var(--ink);font-size:clamp(1.7rem,6.4vw,2.3rem);line-height:1.1;margin:6px 0 8px}
body.theme-teen .ovCard h2{font-family:'Nunito',sans-serif;font-weight:900}
.ovCard p{color:var(--muted);font-weight:700;font-size:1.06rem;max-width:460px;line-height:1.5}
.ovCard .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
body:not(.theme-teen) .paperOv .btnG{background:#fff;color:var(--ink);border:1px solid #F1E4DA;box-shadow:0 8px 18px -10px rgba(80,40,10,.35)}
.lockIcon{font-size:4rem;line-height:1;transform-origin:50% 10%}
#lockMap{margin-top:12px}

#celebrate .confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
.ceBg{position:absolute;inset:-6%;z-index:0}
.ceBg img{width:100%;height:100%;object-fit:cover;filter:blur(16px) saturate(1.2);opacity:.55}
.ceBg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 35%,rgba(255,248,234,.55),rgba(253,232,204,.92) 75%)}
body.theme-teen .ceBg img{opacity:.45;filter:blur(18px) saturate(.9)}
body.theme-teen .ceBg::after{background:radial-gradient(70% 60% at 50% 35%,rgba(42,32,23,.55),rgba(23,18,13,.94) 75%)}
.ceHero{position:relative;display:flex;justify-content:center;align-items:flex-end}
.rays{position:absolute;left:50%;top:50%;width:min(110vw,520px);aspect-ratio:1;margin:calc(min(110vw,520px) / -2) 0 0 calc(min(110vw,520px) / -2);border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,197,61,.28) 0deg 9deg,transparent 9deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 40s linear infinite}
body.theme-teen .rays{background:repeating-conic-gradient(from 0deg,rgba(255,220,160,.08) 0deg 6deg,transparent 6deg 18deg);animation-duration:90s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.rays{animation:none}}
@media (min-width:900px){.ceLumi{width:200px}}
#celebrate .confetti svg{width:100%!important;height:100%!important}
.ceLumi{width:min(40vw,170px);height:auto;filter:drop-shadow(0 16px 22px rgba(80,40,10,.3));transform-origin:50% 100%}
.ceTitle .cc{display:inline-block}
.stars{display:flex;gap:14px;margin:14px 0 4px}
.stars .st{position:relative;width:54px;height:54px}
.stars .st svg.s{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(194,83,10,.35))}
.stars .st .pop{position:absolute;inset:-60%;pointer-events:none}
.stars .st:nth-child(2){transform:translateY(-10px)}
.ceCount{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:1px solid rgba(249,115,22,.25);color:var(--ink);font-weight:900;padding:8px 16px;border-radius:999px;margin:8px 0 10px}
body.theme-teen .ceCount{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.ceCount b{font-size:1.2rem;color:var(--accent2);min-width:1.2em;display:inline-block;text-align:center}
.trail{display:flex;align-items:center;margin:12px 0 4px}
.trail .stop{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;color:var(--muted);border:3px solid #F1E4DA;font-size:.95rem}
body.theme-teen .trail .stop{background:#2B2119;border-color:rgba(255,255,255,.14)}
.trail .stop.done,body.theme-teen .trail .stop.done{background:linear-gradient(135deg,#34D399,#10B981);color:#fff;border-color:#fff}
.trail .stop.cur{box-shadow:0 0 0 5px rgba(52,211,153,.3)}
.trail .stop.locked{opacity:.55}
.trail .ln{width:34px;height:4px;border-radius:4px;background:rgba(138,113,96,.25);position:relative;overflow:hidden}
.trail .ln b{position:absolute;inset:0;background:#10B981;transform:scaleX(0);transform-origin:0 50%}
.trail .ln.full b{transform:scaleX(1)}

/* ---------- story map (menu) ---------- */
#mapOv{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center}
#mapOv .scrim{position:absolute;inset:0;background:rgba(15,10,6,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mapPanel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#FFF8EA,#FDEBD2);color:#43301F;
  border-radius:26px 26px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px rgba(0,0,0,.4)}
body.theme-teen .mapPanel{background:linear-gradient(180deg,#2E2319,#1C1610);color:#FFF3D6}
@media (min-width:700px){ #mapOv{align-items:center} .mapPanel{border-radius:26px;max-height:88%} }
.grab{width:44px;height:5px;border-radius:5px;background:rgba(138,113,96,.35);margin:0 auto 10px}
.mapHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.mapHead h3{font-family:'Baloo 2',sans-serif;font-size:1.45rem;line-height:1.1}
body.theme-teen .mapHead h3{font-family:'Nunito',sans-serif;font-weight:900}
.mapHead small{display:block;font-weight:800;color:#8A7160;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
body.theme-teen .mapHead small{color:#C9B59B}
.mapClose{width:44px;height:44px;border-radius:50%;background:rgba(138,113,96,.15);font-size:1.1rem;font-weight:900;flex:none}
.mapList{position:relative;display:flex;flex-direction:column;gap:14px;padding:10px 0 4px}
.mapPath{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mapPath path{fill:none;stroke:#F97316;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12;opacity:.55}
body.theme-teen .mapPath path{stroke:#F59E0B;opacity:.4}
.mpItem{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:86%;text-align:left;background:#fff;border-radius:20px;padding:10px;
  box-shadow:0 10px 24px -14px rgba(80,40,10,.45);border:2px solid transparent}
body.theme-teen .mpItem{background:#2B2119;box-shadow:0 10px 24px -14px rgba(0,0,0,.8);border-color:rgba(255,255,255,.06)}
.mpItem:nth-child(even){align-self:flex-end}
.mpItem.here{border-color:var(--accent)}
.mpThumb{position:relative;width:112px;flex:none;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#e8d8bd}
.mpThumb img{width:100%;height:100%;object-fit:cover}
.mpItem.locked .mpThumb img{filter:grayscale(.85) blur(1.5px) brightness(.9)}
.mpThumb .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(40,28,18,.35)}
.mpTxt{min-width:0;display:flex;flex-direction:column;gap:2px}
.mpTxt small{font-weight:900;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8A7160}
body.theme-teen .mpTxt small{color:#C9B59B}
.mpTxt b{font-family:'Baloo 2',sans-serif;font-size:1.05rem;line-height:1.15}
body.theme-teen .mpTxt b{font-family:'Nunito',sans-serif;font-weight:900}
.chip{align-self:flex-start;margin-top:4px;font-style:normal;font-weight:900;font-size:.76rem;padding:4px 10px;border-radius:999px;background:rgba(138,113,96,.14);color:#8A7160}
.done .chip{background:rgba(16,185,129,.15);color:#047857}
.open .chip{background:rgba(249,115,22,.15);color:#C2410C}
body.theme-teen .done .chip{color:#6EE7B7} body.theme-teen .open .chip{color:#FBBF24}
.mpMark{position:absolute;right:-12px;top:-14px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.25);background:#FFE9C7;object-fit:cover}
.mpItem.shake{animation:shakeAnim .45s}

/* misc */
.flyStar{position:fixed;z-index:400;width:34px;height:34px;pointer-events:none;left:0;top:0}
#notFound{color:#FFF3D6;padding:40px;font-weight:800}

@media (prefers-reduced-motion: reduce){
  #ambient{display:none}
  #nextBtn.ready::after,#cvStart::after{animation:none}
  .caption{transition:none}
}

<body>

<div id="topbar">
  <div class="brand">📖 Lumi's Magic Map</div>
  <div class="tbBtns">
    <button class="tbBtn tap" id="mapBtn" type="button" aria-label="Story map"><span class="ico">🗺️</span><span class="lbl">Story map</span></button>
    <button class="tbBtn tap" id="lumioSoundBtn" type="button" aria-label="Sound">🔊</button>
    <button class="tbBtn tap" id="toggleTextBtn" type="button" onclick="toggleText()" aria-label="Hide text"><span class="ico">🙈</span><span class="lbl">Hide text</span></button>
    <button class="tbBtn tap" id="exitBtn" type="button" onclick="location.href='student.html'" aria-label="Exit Story"><span class="ico">✕</span><span class="lbl">Exit Story</span></button>
  </div>
</div>

<main id="book" class="mode-stack">
  <div id="ambient" aria-hidden="true"></div>
  <div id="pages" aria-live="polite"></div>
  <nav id="nav" hidden>
    <button class="navbtn tap" id="prevBtn" type="button" aria-label="Back"><span aria-hidden="true">←</span><span class="lbl">Back</span></button>
    <div class="prog" role="progressbar" aria-valuemin="1" id="prog">
      <div class="segs" id="segs"></div>
      <div class="progLbl" id="progLbl"></div>
    </div>
    <button class="navbtn tap" id="nextBtn" type="button" aria-label="Next"><span class="lbl" id="nextLbl">Next</span><span aria-hidden="true" id="nextIco">→</span></button>
  </nav>
</main>

<script>
(function() {
  // Same shared-script loader as story.html (js/version.json cache-busting).
  var v = "20260918a";
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "js/version.json?_=" + Date.now(), false);
    xhr.send(null);
    if (xhr.status === 200) {
      var parsed = JSON.parse(xhr.responseText);
      if (parsed && parsed.v) v = parsed.v;
    }
  } catch (e) {}
  window.LUMIO_V = v;
  document.write('<script src="js/app.js?v=' + v + '"><' + '/script>');
  document.write('<script src="js/lumio-schedule.js?v=' + v + '"><' + '/script>');
})();
</script>
<script src="vendor/gsap-3.12.5.min.js"></script>
<script src="vendor/lottie-light-5.12.2.min.js"></script>
<script>
const qs = k => new URLSearchParams(location.search).get(k);
const partNum = parseInt(qs("part") || "1", 10);

// ---- identical story data + unlock rules to story.html ----
const STORIES = {
  "pre-a": {
    title: "Lumi's Magic Map",
    parts: [
      { id: 1, name: "The Mysterious Map", unlockLesson: 5, pages: 4 },
      { id: 2, name: "The Whispering Forest", unlockLesson: 10, pages: 5 },
      { id: 3, name: "The Family Picnic Village", unlockLesson: 15, pages: 5 },
      { id: 4, name: "The Treasure Celebration", unlockLesson: 20, pages: 5 },
    ],
  },
  "level1": {
    title: "The Treehouse Club",
    parts: [
      { id: 1, name: "The Big Idea", unlockLesson: 5, pages: 6 },
      { id: 2, name: "Building Day", unlockLesson: 10, pages: 6 },
      { id: 3, name: "Grand Opening Prep", unlockLesson: 15, pages: 6 },
      { id: 4, name: "The Backyard Party", unlockLesson: 20, pages: 6 },
    ],
  },
  "level2": {
    title: "The Twelve Months Club",
    parts: [
      { id: 1, name: "New Friends, New Family", unlockLesson: 5, pages: 10 },
      { id: 2, name: "School Days", unlockLesson: 10, pages: 10 },
      { id: 3, name: "A Year of Birthdays", unlockLesson: 15, pages: 10 },
      { id: 4, name: "The Big Poster Party", unlockLesson: 20, pages: 10 },
    ],
  },
  "level3": {
    title: "The Crew",
    parts: [
      { id: 1, name: "Meet the Crew", unlockLesson: 5, pages: 10 },
      { id: 2, name: "Around School", unlockLesson: 10, pages: 10 },
      { id: 3, name: "Game Night", unlockLesson: 15, pages: 10 },
      { id: 4, name: "The Big Match", unlockLesson: 20, pages: 10 },
    ],
  },
};

function currentUserLevel() {
  try { const u = Lumio.user(); return (u && u.level) || "pre-a"; } catch (e) { return "pre-a"; }
}
const storyLevel = qs("level") || currentUserLevel();
const storyIsTeen = ["level3", "level4", "level5", "level6"].includes(storyLevel);
if (storyIsTeen) document.body.classList.add("theme-teen");
const story = STORIES[storyLevel] || STORIES["pre-a"];
const PARTS = story.parts;
document.querySelector(".brand").textContent = `📖 ${story.title}`;
document.title = `${story.title} — Lumio English`;

function getDoneCount() {
  try {
    const u = Lumio.user();
    if (!u) return 0;
    return Lumio.lessonsDoneCount(u.name, storyLevel);
  } catch (e) { return 0; }
}
function isTeacherSession() {
  try { return localStorage.getItem("lumio_teacher") === "1"; } catch (e) { return false; }
}
const previewMode = qs("preview") === "1" && isTeacherSession(); // preview is for teachers only

const part = PARTS.find(p => p.id === partNum);
const doneCount = getDoneCount();
let currentPage = 1;

/* ============================================================
   motion helpers (same language as design-previews/landing-tryit)
   ============================================================ */
const G = window.gsap, LOT = window.lottie;
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const MO = !!G && !RM;                       // motion on?
const TEEN = storyIsTeen;
const POP = TEEN ? "power3.out" : "back.out(1.9)";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const wait = ms => new Promise(r => setTimeout(r, ms));
const book = $("#book"), pagesEl = $("#pages"), nav = $("#nav");
const STAR_SVG = '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFC53D" stroke="#C2410C" stroke-width="1.2" stroke-linejoin="round" d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z"/></svg>';
const LUMI = TEEN
  ? { cover: "assets/story/characters/lumi-teen-read.png", party: "assets/story/characters/lumi-teen-celebrate.png", face: "assets/avatars/lumi-teen.png" }
  : { cover: "assets/story/characters/lumi-wave-book.png", party: "assets/site/lumi-celebrate.png", face: "assets/avatars/lumi.png" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function lot(el, name, loop) {
  if (!LOT || !el || RM) return null;
  try { return LOT.loadAnimation({ container: el, renderer: "svg", loop: !!loop, autoplay: true, path: "assets/lottie/" + name + ".json" }); } catch (e) { return null; }
}
// springy press feedback on every .tap
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".tap, .swatch, .mpItem");
  if (!b || !MO || b.disabled) return;
  G.to(b, { scale: TEEN ? .96 : .92, duration: .12, ease: "power2.out", overwrite: "auto" });
  const up = () => { window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    G.to(b, { scale: 1, duration: TEEN ? .4 : .7, ease: TEEN ? "power2.out" : "elastic.out(1.2,.45)", overwrite: "auto" }); };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}, true);
// idle breathing + blink-squash for a character image (kids bouncy, teens subtle)
function idle(el) {
  if (!MO || !el) return [];
  const a = [];
  a.push(G.to(el, { scaleY: TEEN ? 1.012 : 1.03, scaleX: TEEN ? .996 : .985, transformOrigin: "50% 100%", duration: TEEN ? 2.6 : 1.6, yoyo: true, repeat: -1, ease: "sine.inOut" }));
  if (!TEEN) {
    a.push(G.to(el, { rotation: 2.5, transformOrigin: "50% 100%", duration: 1.9, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    const bl = G.timeline({ repeat: -1, repeatDelay: 2.8, delay: 2 });
    bl.to(el, { y: -10, duration: .18, ease: "power2.out" }).to(el, { y: 0, duration: .5, ease: "bounce.out" });
    a.push(bl);
  } else {
    a.push(G.to(el, { y: -4, duration: 3.2, yoyo: true, repeat: -1, ease: "sine.inOut" }));
  }
  return a;
}
// soft ambient sparkles behind the book
(function ambient() {
  if (RM) return;
  const amb = $("#ambient"); const n = TEEN ? 10 : 16;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("i");
    s.style.left = (Math.random() * 100) + "%"; s.style.top = (20 + Math.random() * 80) + "%";
    s.style.animationDelay = (-Math.random() * 12) + "s";
    const sz = 3 + Math.random() * 5; s.style.width = s.style.height = sz + "px";
    amb.appendChild(s);
  }
})();

/* ============================================================
   sound: same background music as story.html (app.js only auto-
   starts it for paths ending in story.html, so start it here)
   ============================================================ */
(function sound() {
  const b = $("#lumioSoundBtn");
  const has = typeof Lumio !== "undefined" && Lumio.music && Lumio.setSound;
  if (!has) { b.hidden = true; return; }
  b.onclick = () => { Lumio.setSound(!Lumio.soundOn()); if (Lumio.soundOn()) Lumio.music("story"); };
  Lumio.setSound(Lumio.soundOn());
  const start = () => { document.removeEventListener("pointerdown", start, true); if (Lumio.soundOn()) Lumio.music("story"); };
  document.addEventListener("pointerdown", start, true);
})();

/* ============================================================
   layout: stack (portrait) / side (short landscape) / overlay
   ============================================================ */
let mode = "stack";
function layout() {
  const w = pagesEl.clientWidth, h = pagesEl.clientHeight;
  if (!w || !h) return;
  mode = (w / h < 1.15) ? "stack" : (h < 560 ? "side" : "overlay");
  let sw, sh;
  if (mode === "overlay") { sw = Math.min(w, h * 16 / 9); sh = sw * 9 / 16; }
  else if (mode === "stack") { sw = Math.min(w, 640); sh = h; }
  else { sw = Math.min(w, h * 2.4); sh = h; }
  pagesEl.style.setProperty("--sw", Math.floor(sw) + "px");
  pagesEl.style.setProperty("--sh", Math.floor(sh) + "px");
  pagesEl.style.setProperty("--u", (sw / 1600).toFixed(4));
  book.classList.remove("mode-stack", "mode-side", "mode-overlay");
  book.classList.add("mode-" + mode);
}
window.addEventListener("resize", layout);

/* ============================================================
   page loading (same story-content files + cache-busting)
   ============================================================ */
const pageCache = new Map();
function fetchPage(partId, n) {
  const key = partId + "-" + n;
  if (!pageCache.has(key)) {
    pageCache.set(key, fetch(`story-content/${storyLevel}/part${partId}-page${n}.html?v=${window.LUMIO_V || ""}`)
      .then(r => { if (!r.ok) throw new Error("page " + r.status); return r.text(); })
      .then(parsePage)
      .catch(e => { pageCache.delete(key); throw e; }));
  }
  return pageCache.get(key);
}
function parsePage(html) {
  const t = document.createElement("template"); t.innerHTML = html;
  const c = t.content, img = c.querySelector("img.scene"), badge = c.querySelector(".partbadge");
  return {
    src: img ? img.getAttribute("src") : "",
    badgeHTML: badge ? badge.innerHTML : "",
    badgeStyle: badge ? (badge.getAttribute("style") || "") : "",
    ps: $$(".caption p", c).map(p => p.outerHTML),
    colorGame: !!c.querySelector("#colorGame"),
  };
}
function preload(partId, n) {
  if (n < 1 || n > part.pages) return;
  fetchPage(partId, n).then(d => { if (d.src) { const i = new Image(); i.src = d.src; } }).catch(() => {});
}
function buildSheet(d, n) {
  const el = document.createElement("article");
  el.className = "sheet"; el.dataset.page = n;
  el.setAttribute("aria-label", `Page ${n} of ${part.pages}`);
  el.innerHTML =
    `<div class="art"><img class="sceneFill" src="${esc(d.src)}" alt="" aria-hidden="true" draggable="false"><div class="kb"><img class="scene" src="${esc(d.src)}" alt="" draggable="false"></div><div class="artShade"></div>` +
    `<div class="partbadge" style="${esc(d.badgeStyle)}">${d.badgeHTML}</div></div>` +
    `<div class="textCol">${d.colorGame ? '<div id="colorGame"></div>' : ""}<div class="caption"><div class="capIn">${d.ps.join("")}</div></div></div>` +
    `<div class="turnShade"></div><div class="glare"></div>`;
  $$(".capIn p:not(.ar)", el).forEach(splitWords);
  return el;
}
function imgReady(el) {
  const img = $("img.scene", el);
  if (!img) return Promise.resolve();
  const p = img.decode ? img.decode().catch(() => {}) : new Promise(r => { img.onload = img.onerror = r; });
  return Promise.race([p, wait(2000)]);
}

/* ---------- text: split into word masks, reveal line by line ---------- */
function splitWords(root) {
  Array.from(root.childNodes).forEach(ch => {
    if (ch.nodeType === 3) {
      const frag = document.createDocumentFragment();
      ch.textContent.split(/(\s+)/).forEach(s => {
        if (!s) return;
        if (/^\s+$/.test(s)) { frag.appendChild(document.createTextNode(s)); return; }
        const w = document.createElement("span"); w.className = "w";
        const i = document.createElement("span"); i.className = "wi"; i.textContent = s;
        w.appendChild(i); frag.appendChild(w);
      });
      ch.replaceWith(frag);
    } else if (ch.nodeType === 1 && !ch.classList.contains("w")) splitWords(ch);
  });
}
function hideText(sheet) {
  if (!MO) return;
  G.set($$(".capIn p:not(.ar) .wi", sheet), { yPercent: 110, opacity: 0 });
  G.set($$(".capIn p.ar", sheet), { opacity: 0, y: 12 });
  const b = $(".partbadge", sheet); if (b) G.set(b, { opacity: 0, x: -24 });
}
function groupLines(p) {
  const lines = []; let last = null;
  $$(".w", p).forEach(w => {
    const t = w.getBoundingClientRect().top;
    if (last === null || Math.abs(t - last) > 6) { lines.push([]); last = t; }
    lines[lines.length - 1].push(w.firstChild);
  });
  return lines;
}
function revealText(sheet, quick) {
  if (!MO) { onRevealed(); return; }
  const tl = G.timeline({ onComplete: onRevealed });
  const b = $(".partbadge", sheet);
  if (b) tl.to(b, { opacity: 1, x: 0, duration: .6, ease: POP }, 0);
  let t = .12;
  $$(".capIn p:not(.ar)", sheet).forEach(p => {
    groupLines(p).forEach(ws => {
      tl.to(ws, { yPercent: 0, opacity: 1, duration: TEEN ? .8 : .6, ease: "power3.out", stagger: quick ? .006 : (TEEN ? .02 : .025) }, t);
      t += quick ? .07 : (TEEN ? .34 : .3);
    });
  });
  $$(".capIn p.ar", sheet).forEach(p => { tl.to(p, { opacity: 1, y: 0, duration: .7, ease: "power2.out" }, t + .05); t += .15; });
  sheet._reveal = tl;
}
function onRevealed() { $("#nextBtn").classList.add("ready"); }

/* ---------- Ken Burns + pointer parallax on the scene art ---------- */
function kenBurns(sheet, n) {
  if (!MO) return;
  const img = $("img.scene", sheet); const dir = n % 2 ? 1 : -1;
  // Gentle: the picture stays fully in view (owner: "the photo didn't fit").
  sheet._kb = G.fromTo(img, { scale: 1, xPercent: 0, yPercent: 0 },
    { scale: TEEN ? 1.02 : 1.035, xPercent: dir * .4, yPercent: -.3, duration: TEEN ? 24 : 16, ease: "sine.inOut", yoyo: true, repeat: -1 });
}
let curSheet = null;
if (MO && matchMedia("(pointer:fine)").matches) {
  book.addEventListener("pointermove", e => {
    if (!curSheet) return;
    const r = book.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
    const k = TEEN ? .6 : 1;
    G.to($(".kb", curSheet), { x: -nx * 5 * k, y: -ny * 3 * k, duration: 1.1, ease: "power3.out", overwrite: "auto" });
    const b = $(".partbadge", curSheet); if (b && b.style.opacity !== "0") G.to(b, { x: nx * 6 * k, y: ny * 4 * k, duration: 1.1, ease: "power3.out", overwrite: "auto" });
  });
}

/* ---------- page turn (3D page with moving shade + curl glare) ---------- */
function turn(oldS, newS, dir) {
  return new Promise(res => {
    if (!oldS) {
      pagesEl.appendChild(newS);
      if (MO) G.from(newS, { opacity: 0, scale: .97, duration: .5, ease: "power2.out", clearProps: "opacity,transform", onComplete: res }); else res();
      return;
    }
    const done = () => { if (oldS._kb) oldS._kb.kill(); if (oldS._reveal) oldS._reveal.kill(); oldS.remove(); G && G.set(newS, { clearProps: "zIndex,transform" }); res(); };
    if (!MO) {
      pagesEl.appendChild(newS);
      if (G) { G.fromTo(newS, { opacity: 0 }, { opacity: 1, duration: .22, onComplete: done }); } else done();
      return;
    }
    const D = TEEN ? 1.0 : .9, E = TEEN ? "power3.inOut" : "power2.inOut", deg = -112;
    const tl = G.timeline({ onComplete: done });
    if (dir > 0) {
      pagesEl.insertBefore(newS, oldS);
      G.set(oldS, { zIndex: 2 }); G.set(newS, { zIndex: 1 });
      tl.to(oldS, { rotationY: deg, transformOrigin: "0% 50%", duration: D, ease: E }, 0)
        .fromTo($(".turnShade", oldS), { opacity: 0 }, { opacity: TEEN ? .45 : .6, duration: D, ease: "power1.in" }, 0)
        .fromTo($(".glare", oldS), { opacity: 0 }, { opacity: 1, duration: D * .45, ease: "sine.out" }, 0)
        .to($(".glare", oldS), { opacity: 0, duration: D * .4, ease: "sine.in" }, D * .5)
        .fromTo($(".turnShade", newS), { opacity: .5 }, { opacity: 0, duration: D, ease: "power1.out" }, 0)
        .fromTo(newS, { scale: .975 }, { scale: 1, duration: D, ease: E }, 0);
    } else {
      pagesEl.appendChild(newS);
      G.set(oldS, { zIndex: 1 }); G.set(newS, { zIndex: 2 });
      tl.fromTo(newS, { rotationY: deg, transformOrigin: "0% 50%" }, { rotationY: 0, duration: D, ease: E }, 0)
        .fromTo($(".turnShade", newS), { opacity: .6 }, { opacity: 0, duration: D, ease: "power1.out" }, 0)
        .fromTo($(".glare", newS), { opacity: 1 }, { opacity: 0, duration: D * .8, ease: "sine.in" }, 0)
        .fromTo($(".turnShade", oldS), { opacity: 0 }, { opacity: .45, duration: D, ease: "power1.in" }, 0)
        .to(oldS, { scale: .975, duration: D, ease: E }, 0);
    }
  });
}

/* ---------- progress ---------- */
function buildProgress() {
  $("#segs").innerHTML = Array.from({ length: part.pages }, () => "<span><b></b></span>").join("");
  $("#prog").setAttribute("aria-valuemax", part.pages);
}
function paintProgress(n) {
  $$("#segs span").forEach((s, i) => {
    s.classList.toggle("on", i === n - 1);
    const b = s.firstChild, v = i < n ? 1 : 0;
    if (MO) G.to(b, { scaleX: v, duration: .7, delay: v ? Math.max(0, (i - (n - 2))) * .08 : 0, ease: "power3.out" });
    else b.style.transform = `scaleX(${v})`;
  });
  $("#progLbl").innerHTML = `Page <b>${n}</b> of ${part.pages}`;
  $("#prog").setAttribute("aria-valuenow", n);
  $("#prevBtn").disabled = n === 1;
  const last = n === part.pages;
  $("#nextLbl").textContent = last ? "Finish" : "Next";
  $("#nextIco").textContent = last ? "★" : "→";
  $("#nextBtn").setAttribute("aria-label", last ? "Finish" : "Next");
  $("#nextBtn").classList.remove("ready");
}

/* ---------- navigation ---------- */
let busy = false, finished = false;
async function showPage(n, dir) {
  if (busy) return; busy = true;
  try {
    const d = await fetchPage(part.id, n);
    const sheet = buildSheet(d, n);
    hideText(sheet);
    await imgReady(sheet);
    currentPage = n;
    paintProgress(n);
    const old = curSheet;
    curSheet = sheet;
    kenBurns(sheet, n);
    const turning = turn(old, sheet, dir);
    if (storyLevel === "pre-a" && part.id === 1 && n === 3) setupColorGame();
    applyTextVisibility();
    await turning;
    revealText(sheet, dir < 0);
    preload(part.id, n + 1); preload(part.id, n - 1);
  } catch (e) {
    console.warn(e);
  } finally { busy = false; }
}
function next() { if (busy || finished || !curSheet) return; if (currentPage < part.pages) showPage(currentPage + 1, 1); else finishPart(part); }
function prev() { if (busy || finished || !curSheet) return; if (currentPage > 1) showPage(currentPage - 1, -1); }
$("#nextBtn").onclick = next;
$("#prevBtn").onclick = prev;
document.addEventListener("keydown", e => {
  if ($("#mapOv")) { if (e.key === "Escape") closeMap(); return; }
  if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev();
});
// swipe to turn pages on touch screens
(function swipe() {
  let sx = null, sy = 0;
  pagesEl.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; sx = e.clientX; sy = e.clientY; });
  pagesEl.addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) { dx < 0 ? next() : prev(); }
  });
  pagesEl.addEventListener("pointercancel", () => { sx = null; });
})();

/* ---------- hide / show text (same as story.html) ---------- */
let textHidden = false;
function applyTextVisibility() {
  $$(".caption").forEach(cap => cap.classList.toggle("text-hidden", textHidden));
}
function toggleText() {
  textHidden = !textHidden;
  const b = $("#toggleTextBtn");
  b.innerHTML = textHidden ? '<span class="ico">&#128064;</span><span class="lbl">Show text</span>' : '<span class="ico">&#128584;</span><span class="lbl">Hide text</span>';
  b.setAttribute("aria-label", textHidden ? "Show text" : "Hide text");
  applyTextVisibility();
}

/* ============================================================
   part state (same rules as student.html's story trail)
   ============================================================ */
function storyProg() {
  try { return (JSON.parse(localStorage.getItem("lumio_story_progress") || "{}")[storyLevel]) || {}; } catch (e) { return {}; }
}
function partState(p) {
  const unlocked = previewMode || doneCount >= p.unlockLesson;
  const done = unlocked && !!storyProg()[p.id];
  return { unlocked, done };
}
function partHref(id) { return `story-v2.html?part=${id}&level=${encodeURIComponent(storyLevel)}${qs("preview") === "1" ? "&preview=1" : ""}`; }
function goPart(id) {
  if (!MO) { location.href = partHref(id); return; }
  G.to(book, { opacity: 0, scale: .98, duration: .35, ease: "power2.in", onComplete: () => { location.href = partHref(id); } });
}

/* ============================================================
   story map (unlock menu)
   ============================================================ */
function openMap() {
  if ($("#mapOv")) return;
  const ov = document.createElement("div");
  ov.id = "mapOv"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Story map");
  const items = PARTS.map(p => {
    const s = partState(p), here = part && p.id === part.id;
    const cls = !s.unlocked ? "locked" : (s.done ? "done" : "open");
    const chip = !s.unlocked ? `🔒 Finish ${p.unlockLesson} lessons · ${Math.min(doneCount, p.unlockLesson)}/${p.unlockLesson}`
      : (s.done ? "✓ Read · read again" : "▶ Read now");
    return `<button type="button" class="mpItem ${cls}${here ? " here" : ""}" data-id="${p.id}" ${!s.unlocked ? 'aria-disabled="true"' : ""}>
      <span class="mpThumb"><img src="assets/story/scenes/${esc(storyLevel)}/p${p.id}-01.jpg" alt="" loading="lazy">${!s.unlocked ? '<span class="lk">🔒</span>' : ""}</span>
      <span class="mpTxt"><small>Part ${p.id} of ${PARTS.length}</small><b>${esc(p.name)}</b><em class="chip">${chip}</em></span>
      ${here ? `<img class="mpMark" src="${LUMI.face}" alt="You are here">` : ""}
    </button>`;
  }).join("");
  ov.innerHTML = `<div class="scrim"></div><div class="mapPanel">
      <div class="grab"></div>
      <div class="mapHead"><div><small>Story map</small><h3>${esc(story.title)}</h3></div><button type="button" class="mapClose tap" aria-label="Close">✕</button></div>
      <div class="mapList"><svg class="mapPath" aria-hidden="true"><path d=""/></svg>${items}</div>
    </div>`;
  document.body.appendChild(ov);
  const panel = $(".mapPanel", ov);
  // winding dotted path joining the parts
  const drawPath = () => {
    const list = $(".mapList", ov), lr = list.getBoundingClientRect(), svg = $(".mapPath", ov);
    svg.setAttribute("viewBox", `0 0 ${lr.width} ${lr.height}`);
    const pts = $$(".mpThumb", ov).map(t => { const r = t.getBoundingClientRect(); return [r.left - lr.left + r.width / 2, r.top - lr.top + r.height / 2]; });
    let d = pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
    for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2; d += ` C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}`; }
    $("path", svg).setAttribute("d", d);
    return $("path", svg);
  };
  const path = drawPath();
  $(".scrim", ov).onclick = closeMap;
  $(".mapClose", ov).onclick = closeMap;
  $$(".mpItem", ov).forEach(b => b.onclick = () => {
    const p = PARTS.find(x => x.id === +b.dataset.id);
    if (!partState(p).unlocked) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
    if (part && p.id === part.id && !finished && $("#lockScreen") === null) { closeMap(); return; }
    goPart(p.id);
  });
  if (MO) {
    const tl = G.timeline();
    tl.from($(".scrim", ov), { opacity: 0, duration: .3 })
      .from(panel, { yPercent: matchMedia("(min-width:700px)").matches ? 0 : 100, y: matchMedia("(min-width:700px)").matches ? 30 : 0, opacity: matchMedia("(min-width:700px)").matches ? 0 : 1, duration: .55, ease: "power3.out" }, 0)
      .from($$(".mpItem", ov), { y: 26, opacity: 0, scale: .94, duration: .55, stagger: .08, ease: POP, clearProps: "transform,opacity" }, .2);
    try { const L = path.getTotalLength(); G.fromTo(path, { strokeDashoffset: L, strokeDasharray: `2 12` }, { strokeDashoffset: 0, duration: 1.2, delay: .25, ease: "power2.out" }); } catch (e) {}
    const mk = $(".mpMark", ov);
    if (mk) G.to(mk, { y: -6, duration: TEEN ? 1.6 : .9, yoyo: true, repeat: -1, ease: "sine.inOut", delay: .8 });
  }
  setTimeout(() => { const c = $(".mapClose", ov); c && c.focus({ preventScroll: true }); }, 60);
}
function closeMap() {
  const ov = $("#mapOv"); if (!ov) return;
  if (!MO) { ov.remove(); return; }
  G.to($(".mapPanel", ov), { y: 40, opacity: 0, duration: .25, ease: "power2.in" });
  G.to($(".scrim", ov), { opacity: 0, duration: .3, onComplete: () => ov.remove() });
}
$("#mapBtn").onclick = openMap;

/* ============================================================
   cinematic part cover
   ============================================================ */
function splitTitle(el, text) {
  el.innerHTML = text.split(" ").map(w => `<span class="cw">${Array.from(w).map(c => `<span class="cc">${esc(c)}</span>`).join("")}</span>`).join(" ");
}
function showCover(d) {
  return new Promise(resolve => {
    const ov = document.createElement("section");
    ov.id = "cover"; ov.className = "ov";
    ov.setAttribute("aria-label", `Part ${part.id}: ${part.name}`);
    ov.innerHTML = `<div class="cvBg"><img src="${esc(d.src)}" alt=""></div><div class="cvShade"></div>
      <div class="cvIn">
        <img class="cvLumi" src="${LUMI.cover}" alt="">
        <div class="cvText">
          <div class="cvEyebrow"><span>Part ${part.id} of ${PARTS.length}</span></div>
          <h1 class="cvTitle"></h1>
          <div class="cvStory">📖 ${esc(story.title)} · ${part.pages} pages</div>
          <div class="cvBtns"><button type="button" class="btnP tap" id="cvStart">▶ Start reading</button><button type="button" class="btnG tap" id="cvMap">🗺️ Story map</button></div>
        </div>
      </div>`;
    book.appendChild(ov);
    const title = $(".cvTitle", ov); splitTitle(title, part.name);
    const lumi = $(".cvLumi", ov);
    let anims = [];
    if (MO) {
      anims.push(G.fromTo($(".cvBg img", ov), { scale: 1.16 }, { scale: 1.04, duration: 9, ease: "power2.out" }));
      const tl = G.timeline({ delay: .1 });
      tl.from($(".cvShade", ov), { opacity: 0, duration: .8 })
        .from($(".cvEyebrow span", ov), { yPercent: 120, opacity: 0, duration: .6, ease: "power3.out" }, .25)
        .from($$(".cvTitle .cc", ov), { yPercent: 115, rotation: TEEN ? 0 : 8, duration: TEEN ? .9 : .7, stagger: TEEN ? .02 : .028, ease: TEEN ? "power4.out" : "back.out(1.6)" }, .35)
        .from($(".cvStory", ov), { y: 14, opacity: 0, duration: .6, ease: "power3.out" }, "-=.45")
        .from($$(".cvBtns > *", ov), { y: 22, opacity: 0, scale: .9, duration: .6, stagger: .08, ease: POP, clearProps: "transform,opacity" }, "-=.35");
      if (TEEN) tl.from(lumi, { y: 40, opacity: 0, duration: 1, ease: "power3.out" }, .4);
      else tl.fromTo(lumi, { y: -260, opacity: 0, scaleX: .84, scaleY: 1.2, transformOrigin: "50% 100%" }, { y: 0, opacity: 1, duration: .45, ease: "power2.in" }, .5)
        .to(lumi, { scaleX: 1.22, scaleY: .76, duration: .08, ease: "power1.out" })
        .to(lumi, { scaleX: 1, scaleY: 1, duration: .8, ease: "elastic.out(1.1,.32)" });
      tl.add(() => { anims = anims.concat(idle(lumi)); });
      anims.push(tl);
    }
    const open = () => {
      document.removeEventListener("keydown", onKey);
      anims.forEach(a => { try { a.kill(); } catch (e) {} });
      if (!MO) { ov.remove(); resolve(); return; }
      const tl = G.timeline({ onComplete: () => { ov.remove(); resolve(); } });
      tl.to(lumi, { y: -30, opacity: 0, duration: .35, ease: "power2.in" }, 0)
        .to($(".cvText", ov), { y: 20, opacity: 0, duration: .3, ease: "power2.in" }, 0)
        .to(ov, { rotationY: -100, transformPerspective: 2000, transformOrigin: "0% 50%", duration: .95, ease: "power3.inOut" }, .2)
        .to($(".cvShade", ov), { opacity: 1, background: "rgba(0,0,0,.85)", duration: .95 }, .2);
    };
    const onKey = e => { if (e.key === "Enter" && !$("#mapOv")) { e.preventDefault(); open(); } };
    document.addEventListener("keydown", onKey);
    $("#cvStart", ov).onclick = open;
    $("#cvMap", ov).onclick = openMap;
    setTimeout(() => { const b = $("#cvStart", ov); b && b.focus({ preventScroll: true }); }, 100);
  });
}

/* ============================================================
   start
   ============================================================ */
layout();
if (!part) {
  pagesEl.innerHTML = "<p id='notFound'>Story part not found.</p>";
} else if (doneCount < part.unlockLesson && !previewMode) {
  showLock();
} else {
  startPart(part);
}

async function startPart(part) {
  buildProgress();
  let d;
  try { d = await fetchPage(part.id, 1); } catch (e) { pagesEl.innerHTML = "<p id='notFound'>Story part not found.</p>"; return; }
  const sheet = buildSheet(d, 1);
  hideText(sheet);
  paintProgress(1);
  curSheet = sheet;
  pagesEl.appendChild(sheet);
  kenBurns(sheet, 1);
  applyTextVisibility();
  preload(part.id, 2);
  await showCover(d);
  nav.hidden = false;
  layout();
  if (MO) G.from(nav, { y: 40, opacity: 0, duration: .55, ease: "power3.out", clearProps: "transform,opacity" });
  revealText(sheet);
}

/* ---------- locked part (same message as story.html) ---------- */
function showLock() {
  const ov = document.createElement("section");
  ov.id = "lockScreen"; ov.className = "ov paperOv";
  ov.innerHTML = `<div class="ovCard">
      <div class="lockIcon">🔒</div>
      <h2>Part ${part.id} is locked</h2>
      <p>Finish ${part.unlockLesson} lessons to unlock "${esc(part.name)}"! You've completed ${doneCount} so far — keep going!</p>
      ${trailHTML(false)}
      <div class="btns"><button type="button" class="btnP tap" onclick="location.href='student.html'">Back to my lessons</button>
      <button type="button" class="btnG tap" id="lockMap">🗺️ Story map</button></div>
    </div>`;
  book.appendChild(ov);
  $("#lockMap").onclick = openMap;
  if (MO) {
    const tl = G.timeline();
    tl.from($(".lockIcon", ov), { scale: 0, rotation: -30, duration: .6, ease: POP })
      .from($$(".ovCard > :not(.lockIcon)", ov), { y: 20, opacity: 0, duration: .5, stagger: .07, ease: "power3.out", clearProps: "transform,opacity" }, "-=.3")
      .to($(".lockIcon", ov), { rotation: 8, duration: .12, yoyo: true, repeat: 5, ease: "sine.inOut" }, "+=.2");
  }
}
function trailHTML(animateThis) {
  return `<div class="trail" aria-hidden="true">` + PARTS.map((p, i) => {
    const s = partState(p);
    const isThis = part && p.id === part.id;
    const cls = !s.unlocked ? "locked" : (s.done ? "done" : "");
    const showDone = s.done && !(animateThis && isThis);
    const ln = i < PARTS.length - 1 ? `<div class="ln${partState(PARTS[i + 1]).unlocked && s.done && !(animateThis && isThis) ? " full" : ""}${animateThis && isThis ? " grow" : ""}"><b></b></div>` : "";
    return `<div class="stop ${showDone ? cls : (cls === "done" ? "" : cls)}${isThis ? " cur" : ""}${animateThis && isThis ? " me" : ""}">${showDone ? "✓" : (s.unlocked ? p.id : "🔒")}</div>${ln}`;
  }).join("") + `</div>`;
}

/* ============================================================
   end of part: same progress save as story.html, then celebrate
   ============================================================ */
function finishPart(part) {
  finished = true;
  try {
    const key = "lumio_story_progress";
    const prog = JSON.parse(localStorage.getItem(key) || "{}");
    if (!prog[storyLevel]) prog[storyLevel] = {};
    prog[storyLevel][part.id] = true;
    localStorage.setItem(key, JSON.stringify(prog));
  } catch (e) {}
  try { if (typeof Lumio !== "undefined" && Lumio.sfx) Lumio.sfx("complete"); } catch (e) {}
  const nextPart = PARTS.find(p => p.id === part.id + 1);
  const nextOpen = nextPart && partState(nextPart).unlocked;
  const ov = document.createElement("section");
  ov.id = "celebrate"; ov.className = "ov paperOv";
  const lastSrc = curSheet && $("img.scene", curSheet) ? $("img.scene", curSheet).getAttribute("src") : "";
  ov.innerHTML = `${lastSrc ? `<div class="ceBg"><img src="${esc(lastSrc)}" alt=""></div>` : ""}<div class="confetti"></div><div class="ovCard">
      <div class="ceHero"><div class="rays"></div><img class="ceLumi" src="${LUMI.party}" alt=""></div>
      <h2 class="ceTitle">Part ${part.id} complete!</h2>
      <p>Great reading! Come back after more lessons for the next part.</p>
      <div class="stars">${[0, 1, 2].map(() => `<div class="st"><span class="pop"></span>${STAR_SVG}</div>`).join("")}</div>
      <div class="ceCount">📖 <b id="ceN">${MO ? 0 : part.pages}</b> pages read</div>
      ${trailHTML(true)}
      <div class="btns">
        ${nextOpen ? `<button type="button" class="btnP tap" id="ceNext">Read Part ${nextPart.id} →</button>` : ""}
        <button type="button" class="${nextOpen ? "btnG" : "btnP"} tap" onclick="location.href='student.html'">Back to my lessons</button>
        <button type="button" class="btnG tap" id="ceAgain">↺ Read again</button>
      </div>
    </div>`;
  book.appendChild(ov);
  if (nextOpen) $("#ceNext").onclick = () => goPart(nextPart.id);
  $("#ceAgain").onclick = () => goPart(part.id);
  // the finished stop turns green with a check
  const me = $(".trail .stop.me", ov), grow = $(".trail .ln.grow b", ov);
  const markDone = () => { if (me) { me.classList.add("done"); me.textContent = "✓"; } };
  if (!MO) { markDone(); if (grow && nextOpen) grow.style.transform = "scaleX(1)"; nav.hidden = true; return; }

  const conf = $(".confetti", ov);
  G.to(nav, { y: 40, opacity: 0, duration: .4, ease: "power2.in", onComplete: () => { nav.hidden = true; } });
  const tl = G.timeline();
  tl.from(ov, { opacity: 0, duration: .45 }).from($(".rays", ov), { scale: 0, opacity: 0, duration: 1.1, ease: "power3.out" }, .2)
    .add(() => { const a = lot(conf, "confetti", false); if (a && TEEN) conf.style.opacity = ".6"; }, .1);
  const lumi = $(".ceLumi", ov);
  if (TEEN) tl.from(lumi, { y: 40, opacity: 0, duration: .9, ease: "power3.out" }, .15);
  else tl.fromTo(lumi, { y: -280, opacity: 0, scaleX: .84, scaleY: 1.2, transformOrigin: "50% 100%" }, { y: 0, opacity: 1, duration: .45, ease: "power2.in" }, .15)
    .to(lumi, { scaleX: 1.22, scaleY: .76, duration: .08 })
    .to(lumi, { scaleX: 1, scaleY: 1, duration: .8, ease: "elastic.out(1.1,.32)" });
  const h2 = $(".ceTitle", ov); splitTitle(h2, h2.textContent);
  tl.from($$(".ceTitle .cc", ov), { yPercent: 100, opacity: 0, scale: TEEN ? 1 : .4, duration: .5, stagger: .025, ease: POP }, .45)
    .from($(".ovCard > p", ov), { y: 14, opacity: 0, duration: .5, ease: "power3.out" }, "-=.3");
  $$(".stars .st", ov).forEach((st, i) => {
    tl.from($("svg.s", st), { scale: 0, rotation: TEEN ? 0 : -60, opacity: 0, duration: TEEN ? .6 : .55, ease: TEEN ? "power3.out" : "back.out(3)",
      onStart: () => { const a = lot($(".pop", st), "star-pop", false); if (a) a.addEventListener("complete", () => { $(".pop", st).innerHTML = ""; }); } }, 1.0 + i * .22);
  });
  const cnt = { v: 0 };
  tl.from($(".ceCount", ov), { y: 12, opacity: 0, duration: .45, ease: "power3.out" }, 1.55)
    .to(cnt, { v: part.pages, duration: Math.min(1.4, .15 * part.pages + .3), ease: "power1.out", onUpdate: () => { $("#ceN").textContent = Math.round(cnt.v); } }, 1.7)
    .fromTo($("#ceN"), { scale: 1.5 }, { scale: 1, duration: .6, ease: "elastic.out(1.2,.4)" })
    .from($(".trail", ov), { y: 12, opacity: 0, duration: .45, ease: "power3.out" }, 1.75);
  if (me) tl.add(() => { markDone(); }, 2.3).fromTo(me, { scale: .4 }, { scale: 1, duration: .7, ease: TEEN ? "power3.out" : "elastic.out(1.2,.4)" }, 2.3);
  if (grow && nextOpen) tl.to(grow, { scaleX: 1, duration: .6, ease: "power2.inOut" }, 2.5);
  tl.from($$(".ovCard .btns > *", ov), { y: 20, opacity: 0, duration: .5, stagger: .08, ease: POP, clearProps: "transform,opacity" }, 2.2)
    .add(() => { idle(lumi); });
}

/* ============================================================
   Pre-A Part 1, Page 3: tap the colours in order (same game)
   ============================================================ */
function setupColorGame() {
  const colors = [
    { name: "white", hex: "#FFFFFF" },
    { name: "red", hex: "#EF4444" }, { name: "orange", hex: "#F97316" }, { name: "yellow", hex: "#FACC15" },
    { name: "green", hex: "#22C55E" }, { name: "blue", hex: "#3B82F6" }, { name: "purple", hex: "#A855F7" },
    { name: "black", hex: "#1F2937" },
  ];
  const shuffled = [...colors].sort(() => Math.random() - 0.5);
  let nextIndex = 0;
  const gameEl = document.getElementById("colorGame");
  if (!gameEl) return;
  gameEl.innerHTML = shuffled.map(c =>
    `<button type="button" class="swatch" data-name="${c.name}" aria-label="${c.name}" style="background:${c.hex}${c.name === "white" ? ";border-color:#D6CFC4;box-shadow:inset 0 0 0 3px #F3EEE6, 0 8px 16px rgba(67,48,31,.25)" : ""}" title="${c.name}"></button>`).join("");
  const swatches = gameEl.querySelectorAll(".swatch");
  if (MO) G.from(swatches, { scale: 0, y: 20, rotation: -30, duration: .6, stagger: .06, delay: 1, ease: "back.out(2.2)", clearProps: "transform" });
  swatches.forEach(sw => {
    sw.onclick = () => {
      if (sw.classList.contains("done")) return;
      if (sw.dataset.name === colors[nextIndex].name) {
        sw.classList.add("done");
        sw.innerHTML = "✓";
        nextIndex++;
        if (MO) G.fromTo(sw, { scale: 1.3 }, { scale: 1, duration: .7, ease: "elastic.out(1.2,.4)" });
        if (typeof Lumio !== "undefined" && Lumio.speak) Lumio.speak(sw.dataset.name);
        if (nextIndex === colors.length) {
          if (typeof Lumio !== "undefined" && Lumio.confetti) Lumio.confetti(60);
          const p3 = document.getElementById("p3text"), p3a = document.getElementById("p3textAr");
          p3.innerHTML = '<b>"You did it!"</b> The compass glowed with every color at once — white, red, orange, yellow, green, blue, purple, and black!';
          p3a.textContent = "لقد نجحتم! توهجت البوصلة بكل الألوان معًا — أبيض، وأحمر، وبرتقالي، وأصفر، وأخضر، وأزرق، وبنفسجي، وأسود!";
          if (MO) {
            splitWords(p3);
            G.set($$(".wi", p3), { yPercent: 110, opacity: 0 });
            groupLines(p3).forEach((ws, i) => G.to(ws, { yPercent: 0, opacity: 1, duration: .55, stagger: .02, delay: i * .25, ease: "power3.out" }));
            G.fromTo(p3a, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .6, delay: .5 });
            G.fromTo(swatches, { y: 0 }, { y: -14, duration: .25, stagger: .05, yoyo: true, repeat: 1, ease: "power2.out" });
          }
        }
      } else {
        sw.classList.add("shake");
        setTimeout(() => sw.classList.remove("shake"), 450);
      }
    };
  });
}
