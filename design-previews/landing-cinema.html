<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function () { var l = 'ar'; try { l = localStorage.getItem('lumio_lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lumio English — Cinematic story (preview)</title>
<meta name="description" content="Design preview, landing round 2: a cinematic 3D story told by scrolling, from a night over a Gulf city into Lumi's book and through the seven Lumio levels.">
<meta name="theme-color" content="#0a1033">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F97316;--o2:#C2410C;--o3:#FDBA74;--peach:#FFF6EF;--cream:#FFFBF6;--ink:#17110C;--mute:#6B5B4E;
  --ar:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:var(--display);--txt:var(--body);
  --top-h:94px;
}
html[lang=ar]{--head:var(--ar);--txt:var(--ar)}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:#070b1f;color:var(--ink);font-family:var(--txt);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- fixed header: preview strip + bar + progress ---------- */
.top{position:fixed;inset:0 0 auto;z-index:60;pointer-events:none}
.strip{pointer-events:auto;height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0B0B12;color:#fff;font:700 11.5px/1 var(--body);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
html[lang=ar] .strip{font-family:var(--ar);font-size:12px}
.strip::-webkit-scrollbar{display:none}
.strip b{color:var(--o3);font-weight:900}
.strip nav{display:flex;gap:4px;margin-inline-start:auto}
.strip a{color:#fff;text-decoration:none;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12)}
.strip a:hover{background:var(--o)}
.bar{pointer-events:auto;position:relative;margin:8px 10px 0;height:56px;border-radius:18px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 10px 30px -12px rgba(10,8,30,.45),inset 0 0 0 1px rgba(255,255,255,.6);display:flex;align-items:center;gap:6px;padding:0 6px;overflow:hidden;max-width:1180px}
@media (min-width:1220px){.bar{margin-inline:auto}}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px;padding:0 4px}
.logo img{height:36px;width:auto;display:block}
.chap{font:800 12.5px/1.1 var(--txt);color:var(--mute);display:flex;flex-direction:column;gap:2px;padding-inline-start:10px;border-inline-start:1px solid rgba(0,0,0,.1)}
.chap small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--o2)}
.bar .sp{flex:1}
.bar .bt{min-height:44px;min-width:44px;padding:0 13px;border-radius:13px;border:0;background:transparent;color:var(--ink);font:800 14.5px/1 var(--txt);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.bar .bt:hover{background:rgba(249,115,22,.1)}
.bar .bt.pri{background:var(--o);color:#fff;box-shadow:0 6px 16px -6px rgba(194,65,12,.7)}
.bar .bt.pri:hover{background:var(--o2)}
.bar .bt.lang{border:1.5px solid rgba(0,0,0,.12);font-family:var(--ar);font-size:14px}
html[lang=ar] .bar .bt.lang{font-family:var(--body)}
.bar .bt svg{width:20px;height:20px}
.bar .lgtxt{display:inline}
.prog{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(249,115,22,.14)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#FDBA74,#F97316,#C2410C);transform:scaleX(0);transform-origin:left}
html[dir=rtl] .prog i{transform-origin:right}
@media (max-width:640px){
  .chap{display:none}
  .bar{margin:6px 8px 0;height:56px;gap:2px}
  .bar .bt{padding:0 10px;font-size:14px}
  .bar .lgtxt{display:none}
  .logo img{height:32px}
}
@media (max-width:360px){.bar .bt{padding:0 7px;font-size:13px}}

/* ---------- the film ---------- */
.film{position:relative;height:calc(var(--units,138) * 12vh + 100vh)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#070b1f;isolation:isolate}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
.scrim{background:linear-gradient(180deg,var(--scrim,rgba(0,0,0,0)) 0%,transparent 48%);opacity:.9}
html[dir=ltr]{--scrim-dir:90deg}
@media (min-aspect-ratio:10/9){.scrim{background:linear-gradient(var(--scrim-dir,270deg),var(--scrim,rgba(0,0,0,0)) 0%,transparent 55%)}}
.vig{background:radial-gradient(125% 95% at 50% 46%,transparent 52%,rgba(4,4,18,.62) 100%);opacity:var(--vig,1)}
.flash{background:radial-gradient(circle at 50% 50%,#FFFFFF 0,#FFF5E6 45%,#FFD9AE 100%);opacity:0}
.gold{background:linear-gradient(180deg,rgba(255,249,238,.97) 0%,rgba(255,243,224,.93) 46%,rgba(255,222,170,.45) 72%,rgba(255,200,120,.06) 100%);opacity:0}
@media (max-aspect-ratio:10/9){.gold{background:linear-gradient(180deg,rgba(255,249,238,.97) 0%,rgba(255,243,224,.93) 58%,rgba(255,222,170,.4) 80%,rgba(255,200,120,.05) 100%)}}
.grain{inset:-60%;background-image:var(--grain);background-size:180px 180px;opacity:.085;mix-blend-mode:overlay;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
.letterbox{position:absolute;inset-inline:0;height:0;background:#000;pointer-events:none;z-index:4}

.beats{position:absolute;inset:0;pointer-events:none;z-index:3}
.beat{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--top-h) + 20px) clamp(20px,6.2vw,96px) 84px;visibility:hidden;opacity:0;color:var(--c,#fff)}
.beat a,.beat button{pointer-events:auto}
.beat .bi{position:relative;max-width:min(50vw,740px)}
.beat.c{align-items:center;text-align:center}
.beat.c .bi{max-width:980px;margin-inline:auto}
.beat.low{justify-content:flex-end;padding-bottom:96px}
.beat.low .bi{max-width:min(92vw,1040px)}
.ill{display:none}
.beat.topd{justify-content:flex-start}
.beat.low{isolation:isolate}
.beat.low::before{content:"";position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(0deg,rgba(26,12,52,.62),rgba(26,12,52,0));z-index:-1;pointer-events:none}
@media (max-aspect-ratio:10/9){.beat.low::before{inset:0 0 auto 0;background:linear-gradient(180deg,rgba(26,12,52,.62),rgba(26,12,52,0))}}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.kick{display:inline-flex;align-items:center;gap:10px;font:800 13px/1.3 var(--txt);letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px;opacity:.95}
html[lang=ar] .kick{letter-spacing:0;font-size:16px;font-weight:700}
.kick::before{content:"";width:28px;height:2px;background:currentColor;border-radius:2px;opacity:.7}
.beat.c .kick::before{display:none}
.mega,.h1,.h2{margin:0;font-family:var(--head);font-weight:800;letter-spacing:-.035em;line-height:.93}
html[lang=ar] .mega,html[lang=ar] .h1,html[lang=ar] .h2{font-weight:900;letter-spacing:0;line-height:1.12}
.h1{font-size:clamp(48px,8.4vw,122px)}
.mega{font-size:clamp(52px,10vw,150px)}
.h2{font-size:clamp(34px,5.4vw,82px)}
.h2.sm{font-size:clamp(32px,5.6vw,76px)}
html[lang=ar] .h1{font-size:clamp(44px,7.6vw,112px)}
html[lang=ar] .h2{font-size:clamp(32px,5vw,76px)}
html[lang=ar] .h2.sm{font-size:clamp(30px,4.4vw,64px)}
html[lang=ar] .mega{font-size:clamp(50px,9.4vw,140px)}
.h1 em,.h2 em,.mega em{font-style:normal;color:var(--acc,var(--o))}
.lead{font:600 clamp(15.5px,1.55vw,21px)/1.55 var(--txt);margin:18px 0 0;max-width:34em;opacity:.94}
html[lang=ar] .lead{font-weight:500;line-height:1.75}
.beat.c .lead{margin-inline:auto}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .03em .16em;margin:-.1em -.03em -.16em}
html[lang=ar] .split .w{padding:.2em .06em .22em;margin:-.2em -.06em -.22em}
.split .wi{display:inline-block;will-change:transform}
.shadow{text-shadow:0 2px 24px rgba(0,0,0,.28)}
.ghost{position:absolute;inset-inline-start:-.04em;top:-.62em;font:800 clamp(140px,30vw,420px)/1 var(--display);color:transparent;-webkit-text-stroke:2px currentColor;opacity:.13;pointer-events:none;white-space:nowrap;letter-spacing:-.05em;z-index:-1}

.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.beat.c .ctas{justify-content:center}
.btn{min-height:52px;padding:0 24px;border-radius:16px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 16px/1.1 var(--txt);text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:var(--o);color:#fff;box-shadow:0 14px 30px -12px rgba(249,115,22,.9)}
.btn-p:hover{background:var(--o2)}
.btn-g{background:rgba(255,255,255,.14);color:inherit;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-d{background:var(--ink);color:#fff}
.btn-l{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(23,17,12,.14)}
.btn svg{width:18px;height:18px;flex:none}
html[dir=rtl] .btn svg.arr{transform:scaleX(-1)}

.stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 26px;margin-top:28px;justify-content:start}
.stats div{display:flex;flex-direction:column}
.stats b{font:800 clamp(38px,5.4vw,78px)/1 var(--display);letter-spacing:-.04em;color:var(--acc,#FDBA74)}
.stats span{font:700 13.5px/1.3 var(--txt);opacity:.85;margin-top:4px}
html[lang=ar] .stats span{font-size:15px}

/* level beats */
.lvtag{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--pill,rgba(255,255,255,.55));font:800 13px/1 var(--txt);margin:0 0 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[lang=ar] .lvtag{font-size:15px;font-weight:700}
.lvtag i{width:8px;height:8px;border-radius:50%;background:var(--acc,var(--o));font-style:normal}
.foot{display:grid;gap:10px;margin-top:22px;max-width:620px}
.join{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--card,rgba(255,255,255,.72));color:var(--cardc,#17110C);width:max-content;max-width:100%;box-shadow:0 10px 30px -14px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[dir=rtl] .join{padding:6px 6px 6px 14px}
.join img{width:40px;height:40px;border-radius:50%;flex:none;background:#FFE3CC}
.join span{font:700 14px/1.3 var(--txt);min-width:0}
.join q{font-style:italic;opacity:.75;quotes:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cards .gc{min-width:0}
.gc{position:relative;border-radius:18px;overflow:hidden;background:var(--card,rgba(255,255,255,.78));color:var(--cardc,#17110C);box-shadow:0 18px 40px -20px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gc img{display:block;width:100%;height:48px;object-fit:cover}
.gc div{padding:9px 12px 11px}
.gc small{display:block;font:800 11px/1.2 var(--txt);letter-spacing:.1em;text-transform:uppercase;color:var(--acc,var(--o2))}
html[lang=ar] .gc small{letter-spacing:0;font-size:12.5px}
.gc b{display:block;font:800 15.5px/1.25 var(--head);margin-top:3px}
html[lang=ar] .gc b{font-weight:800;font-size:16.5px}
.gc span{display:block;font:600 12.5px/1.45 var(--txt);opacity:.82;margin-top:3px}
html[lang=ar] .gc span{font-weight:500;font-size:13.5px;line-height:1.55}

/* moments */
.num{font:800 15px/1 var(--display);letter-spacing:.2em;color:var(--o2);margin-bottom:10px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{padding:8px 13px;border-radius:999px;background:#fff;color:var(--ink);font:800 13px/1 var(--txt);box-shadow:0 8px 20px -12px rgba(194,65,12,.6)}
html[lang=ar] .chips span{font-weight:700;font-size:14px}
.chips span::before{content:"✓ ";color:var(--o)}

/* hub items */
.hubtag{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(253,186,116,.18);color:#FDBA74;font:800 13px/1 var(--txt);margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(253,186,116,.4)}
.hubn{font:800 13px/1 var(--display);letter-spacing:.18em;opacity:.7;margin-inline-start:10px}
.wrnum{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--o);color:#fff;font:800 20px/1 var(--display);margin-bottom:14px}

/* final */
.plans3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:26px auto 0;max-width:760px}
.p3{background:rgba(255,255,255,.72);border-radius:18px;padding:12px 10px;box-shadow:0 14px 30px -18px rgba(150,70,0,.6),inset 0 0 0 1px rgba(255,255,255,.8);text-align:center}
.p3.f{background:var(--ink);color:#fff}
.p3 small{display:block;font:800 12px/1.2 var(--txt);opacity:.75}
.p3 b{display:block;font:800 clamp(18px,2.6vw,32px)/1.1 var(--display);margin-top:5px;letter-spacing:-.02em;white-space:nowrap}
.p3 b .sym{font-size:.55em;opacity:.7;margin-inline-end:3px;letter-spacing:0}
.p3 > span{display:block;font:700 11.5px/1.3 var(--txt);opacity:.7;margin-top:3px}
.conf{position:absolute;left:50%;top:40%;width:min(620px,120vw);height:min(620px,120vw);transform:translate(-50%,-50%);pointer-events:none;z-index:-1}

/* film UI */
.fui{position:absolute;inset:auto 0 0 0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 14px;pointer-events:none}
.fui > *{pointer-events:auto}
.chapp{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:40px;border-radius:999px;background:rgba(10,10,24,.42);color:#fff;font:800 12.5px/1 var(--txt);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[lang=ar] .chapp{font-size:13.5px}
.chapp b{font:800 12px/1 var(--display);color:var(--o3);letter-spacing:.1em}
.dots{display:flex;gap:0}
.dots button{width:30px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.dots button i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .3s;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.dots button.on i{width:22px;border-radius:6px;background:var(--o)}
.skipf{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.9);color:var(--ink);font:800 13.5px/1 var(--txt);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
@media (min-aspect-ratio:10/9){.hint{left:auto !important;transform:none !important;inset-inline-end:9vw}}
.hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:5;color:#fff;font:700 13px/1 var(--txt);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.9;pointer-events:none;transition:opacity .4s}
.hint i{width:24px;height:38px;border-radius:14px;border:2px solid rgba(255,255,255,.75);position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}

/* portrait (phones): text up top, the 3D subject below, level cards at the bottom */
@media (max-aspect-ratio:10/9){
  .beat{justify-content:flex-start;padding:calc(var(--top-h) + 14px) 20px 80px}
  .beat .bi{max-width:none;position:static}
  .beat.c.topd{justify-content:flex-start}
  .ghost{position:absolute;top:calc(var(--top-h) - 30px);inset-inline-start:10px}
  .p3 b{font-size:16.5px}
  .p3 b .sym{display:block;font-size:10px;margin:0}
  .p3 small{font-size:11px}
  .beat.low{justify-content:flex-start}
  .beat.c{justify-content:center}
  .beat.c.topp{justify-content:flex-start}
  .foot{position:absolute;inset-inline:16px;bottom:70px;margin:0;max-width:none}
  .stats{grid-template-columns:repeat(2,auto);gap:14px 30px}
  .dots{display:none}
  .ghost{font-size:44vw}
  .plans3{gap:6px}
  .p3{padding:10px 6px}
}
@media (max-aspect-ratio:10/9) and (max-height:700px){
  html[lang] .lead{font-size:14px;margin-top:10px}
  html[lang] .mega{font-size:44px}
  .gc span{display:none}
}
@media (max-width:420px){
  html[lang] .h1{font-size:clamp(42px,12vw,58px)}
  html[lang] .mega{font-size:clamp(44px,12.8vw,58px)}
  html[lang=ar] .mega{font-size:clamp(42px,12vw,54px)}
  html[lang] .h2{font-size:clamp(29px,8.2vw,38px)}
  html[lang] .h2.sm{font-size:clamp(27px,7.6vw,34px)}
  .lead{font-size:15px;line-height:1.5}
  html[lang=ar] .lead{font-size:15.5px;line-height:1.65}
  .gc img{height:34px}
  .gc div{padding:7px 10px 9px}
  .gc b{font-size:14.5px}
  html[lang=ar] .gc b{font-size:15px}
  .gc span{font-size:12px}
  html[lang=ar] .gc span{font-size:12.5px;line-height:1.45}
  .join img{width:32px;height:32px}
  .join span{font-size:13px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .join q,.gc .pl{display:none}
  .join{border-radius:18px}
  .btn{min-height:50px;padding:0 18px;font-size:15px}
  .chips span{font-size:12.5px;padding:7px 11px}
  .kick{margin-bottom:10px}
}

/* ---------- static fallback (no WebGL / reduced motion): the film becomes illustrated sections ---------- */
.static .film{height:auto}
.static .stage{position:relative;height:auto;overflow:visible;background:none}
.static .chap,.static #gl,.static .fx,.static .fui,.static .hint,.static .film-only,.static .ghost{display:none}
.static .beats{position:relative}
.static .beat{position:relative;inset:auto;visibility:visible;opacity:1;padding:64px 20px;background:var(--bgs,#0a1033);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:28px;align-items:center;justify-content:normal}
.static .beat:first-child{padding-top:calc(var(--top-h) + 40px)}
.static .beat > *{max-width:1120px}
.static .beat .bi{max-width:none}
.static .beat.c{text-align:start}
.static .beat.c .ctas{justify-content:flex-start}
.static .beat.c .lead{margin-inline:0}
.static .ill{display:block;width:100%;max-height:360px;object-fit:contain;justify-self:center}
.static .ill.ph{border-radius:20px;object-fit:cover;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.static .foot{position:static}
.static-only{display:none}
.static .static-only{display:block}
.static .h1{font-size:clamp(44px,8vw,96px)}
.static .mega{font-size:clamp(44px,8vw,110px)}
.static .h2{font-size:clamp(32px,5vw,64px)}
@media (max-width:760px){.static .beat{grid-template-columns:1fr}.static .ill{max-height:240px}}

  /* split a heading into masked words (never into letters: Arabic letters must stay joined) */
  function splitEl(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];

    nodes.forEach(function (n) {
      var frag = document.createDocumentFragment();
      n.nodeValue.split(/(\s+)/).forEach(function (p) {
        if (!p) return;
        if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
        var w = document.createElement('span'); w.className = 'w';
        var i = document.createElement('span'); i.className = 'wi'; i.textContent = p;
        w.appendChild(i); frag.appendChild(w);
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

      Z.miniL.scale.set(1, ms + 0.001, 1); Z.miniR.scale.setScalar(ms + 0.001); Z.miniR.visible = Z.miniL.visible = ms > 0.01;
      Z.fbook.g.rotation.y = Math.sin(time * 0.3) * 0.05;
      Z.fbook.g.position.y = seg(T, 130, 136) * 2 + Math.sin(time * 0.8) * 0.15;
      var gl = ease(seg(T, 130.4, 134));
      Z.finGlow.scale.setScalar(2 + gl * 90); Z.finGlow.material.opacity = gl * 0.95;
      Z.fbook.frontM.emissiveIntensity = 1 + gl * 2.5;
      Z.finDust.rotation.y = time * 0.04;
    }
  }

  /* =========================================================================================
     boot
     ========================================================================================= */
  function grainUrl() {
    var c = document.createElement('canvas'); c.width = c.height = 160; var x = c.getContext('2d'), d = x.createImageData(160, 160);
    for (var i = 0; i < d.data.length; i += 4) { var v = (Math.random() * 255) | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); return 'url(' + c.toDataURL('image/png') + ')';
  }

  function render() {
    buildChrome(); buildBeats(); buildAfter(); paintPrices();
    $('#film').style.setProperty('--units', D);
  }
  render();

  $('#langBtn').onclick = function () {
    lang = lang === 'ar' ? 'en' : 'ar'; rtl = lang === 'ar';
    try { localStorage.setItem('lumio_lang', lang); } catch (e) {}
    document.documentElement.lang = lang; document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    lastChap = -1; render();
    if (glOK) { layoutScreens(); layoutCards(); buildKeys(); Z.cards.forEach(function (c) { redrawTex(c.tex); }); }
    if (FILM) { buildTimeline(); ST.refresh(); }
    setupReveals();
  };

  /* reveal panels after the film */
  function setupReveals() {
    if (!G || !ST || reduce) return;
    $$('#after .rv').forEach(function (el) {
      G.fromTo(el, { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 90%', once: true } });
    });
  }

  var glOK = false;
  if (FILM) {
    glOK = initGL();
    if (!glOK) { FILM = false; document.documentElement.classList.add('static'); }
  }
  setupReveals();
  window.__cine = { film: FILM, gl: glOK, T: function () { return Tnow; }, dbg: function () { return { Z: Z, cam: cam, keys: keys }; } };
  if (!FILM) {
    var onScrollS = function () { var h = document.documentElement.scrollHeight - innerHeight; $('#progI').style.transform = 'scaleX(' + (h > 0 ? pageYOffset / h : 0).toFixed(4) + ')'; };
    addEventListener('scroll', onScrollS, { passive: true }); onScrollS();
    return;
  }

  tmp = new V3(); tmp2 = new V3(); _p = new V3(); _l = new V3(); _n0 = new V3(); _n1 = new V3();
  buildEnv(); layoutScreens(); layoutCards(); buildKeys();
  $('#grain').style.setProperty('--grain', grainUrl());
  layout();
  addEventListener('resize', function () { layout(); });
  if (!mobile) addEventListener('pointermove', function (e) { mouse.x = (e.clientX / innerWidth - 0.5); mouse.y = -(e.clientY / innerHeight - 0.5); }, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { Z.cards.forEach(function (c) { redrawTex(c.tex); }); });

  buildTimeline();
  ST.config({ ignoreMobileResize: true });
  ST.create({ trigger: '#film', start: 'top top', end: 'bottom bottom', onUpdate: function (s) { target = s.progress; }, onRefresh: function (s) { target = s.progress; } });

  // opening titles animate in once (not scrubbed)
  var first = beats[0].el;
  G.from($$('.split .wi', first), { yPercent: 120, duration: 1.2, stagger: 0.07, ease: 'power4.out', delay: 0.25 });
  G.from($$('.fade', first), { autoAlpha: 0, y: 24, duration: 0.9, stagger: 0.12, ease: 'power2.out', delay: 0.7 });

  var last = performance.now(), inFilm = true, lastT = -1, confDone = false;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var f = $('#film'), r = f.getBoundingClientRect();
    inFilm = r.bottom > 0 && r.top < innerHeight;
    document.body.classList.toggle('infilm', inFilm && r.bottom > innerHeight * 1.2);
    var k = 1 - Math.exp(-dt * 4.2);
    sp += (target - sp) * k; if (Math.abs(target - sp) < 0.00002) sp = target;
    Tnow = sp * D;
    var docH = document.documentElement.scrollHeight - innerHeight;
    updateChrome(Tnow, Math.min(1, target));
    if (!inFilm || document.hidden) return;
    if (Tnow !== lastT) { tl.progress(sp); lastT = Tnow; }
    pumpLazy(Tnow);
    update(Tnow, now);
    R.render(scene, cam);
    if (!confDone && Tnow > 132.5 && window.lottie) {
      confDone = true;
      try { window.lottie.loadAnimation({ container: $('#conf'), renderer: 'svg', loop: false, autoplay: true, path: '../assets/lottie/confetti.json' }); } catch (e) {}
    }
  }
  requestAnimationFrame(frame);
})();
</script>
