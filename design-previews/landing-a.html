<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* Language before first paint: Arabic by default, remembers the visitor's choice (shared key "lumio_lang"). */
(function () { var l = 'ar'; try { l = localStorage.getItem('lumio_lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  try { if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion'); } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F97316">
<title>Lumio English · Landing A</title>
<meta name="description" content="Design preview A for the Lumio English landing page: Lumi's 3D world of floating islands, one per level.">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F97316; --od:#C2410C; --o2:#EA580C; --o3:#FDBA74; --peach:#FFF6EF; --peach2:#FFEBDB; --peach3:#FFDCC2;
  --ink:#1C130D; --ink2:#5B4A3E; --ink3:#8A7566; --line:#F2DFCF; --white:#FFFFFF;
  --display:'Bricolage Grotesque','Nunito','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --ar:'Tajawal','Nunito',system-ui,sans-serif;
  --r:28px; --wrap:1180px; --gut:20px;
  --shadow:0 18px 50px -18px rgba(194,65,12,.35);
  --navh:68px;
}
html[lang=ar]{--display:var(--ar);--body:var(--ar)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--od)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:10px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{top:10px}

/* ---------- buttons: chunky, toy-like ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 26px;border-radius:18px;border:0;cursor:pointer;
  font:800 17px/1.2 var(--body);text-decoration:none;white-space:nowrap;transition:transform .15s ease, box-shadow .15s ease, background .2s}
.btn-p{background:linear-gradient(180deg,#FB8030,#EA580C);color:#fff;box-shadow:0 6px 0 var(--od),0 14px 28px -10px rgba(194,65,12,.55)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--od),0 18px 30px -10px rgba(194,65,12,.6)}
.btn-p:active{transform:translateY(4px);box-shadow:0 2px 0 var(--od)}
.btn-w{background:#fff;color:var(--od);box-shadow:0 6px 0 var(--peach3),0 14px 28px -12px rgba(194,65,12,.35);border:2px solid var(--peach3)}
.btn-w:hover{transform:translateY(-2px)}
.btn-w:active{transform:translateY(4px);box-shadow:0 2px 0 var(--peach3)}
.btn svg{flex:none}
html[dir=rtl] .flip{transform:scaleX(-1)}
.kicker{display:inline-flex;align-items:center;gap:8px;font:900 13px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--od);
  background:var(--peach2);padding:8px 14px;border-radius:999px}
html[lang=ar] .kicker{letter-spacing:0;font-size:15px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 0 4px rgba(249,115,22,.2)}
.sechead{max-width:720px;margin-bottom:40px}
.sechead.c{margin-inline:auto;text-align:center}
.sechead h2{margin-top:16px;font-size:clamp(32px,4.6vw,54px);font-weight:800}
.sechead p{margin-top:14px;color:var(--ink2);font-size:clamp(17px,1.5vw,19px)}
section{position:relative}
.sec{padding:clamp(72px,10vw,128px) 0}
.peach{background:var(--peach)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--peach2);color:var(--od);font-weight:800;font-size:14px;line-height:1.3}
.ltr{direction:ltr;unicode-bidi:isolate}

/* reveal (motion only) */
html.motion .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
html.motion .rv.in{opacity:1;transform:none}

/* ---------- preview strip ---------- */
.strip{background:var(--ink);color:#fff;font:700 13px/1.4 var(--body)}
.strip .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;padding-block:7px}
.strip b{color:var(--o3);font-weight:900}
.strip nav{display:flex;gap:4px;flex-wrap:wrap}
.strip a{color:#fff;text-decoration:none;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);min-height:28px;display:inline-flex;align-items:center}
.strip a:hover{background:var(--o)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(242,223,207,.8)}
.navin{height:var(--navh);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;flex:none;min-height:44px}
.brand img{height:54px;width:auto}
.links{display:flex;gap:2px;margin-inline:auto}
.links a{color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;padding:10px 11px;border-radius:12px;min-height:44px;display:inline-flex;align-items:center}
.links a:hover{background:var(--peach2);color:var(--od)}
.navr{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.links + .navr{margin-inline-start:0}
.lang{display:inline-flex;background:var(--peach2);border-radius:14px;padding:4px;gap:2px}
.lang button{border:0;background:transparent;min-width:44px;min-height:40px;border-radius:11px;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink2);padding:0 10px}
.lang button[data-l=ar]{font-family:var(--ar);font-size:15px}
.lang button[aria-pressed=true]{background:#fff;color:var(--od);box-shadow:0 2px 8px rgba(194,65,12,.18)}
.nav .login{min-height:44px;padding:10px 18px;font-size:15px;border-radius:14px;box-shadow:0 4px 0 var(--od)}
.menu{display:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--peach3);background:#fff;cursor:pointer;align-items:center;justify-content:center}
.drawer{display:none}
@media (max-width:1120px){
  .links{display:none}
  .menu{display:inline-flex}
  .drawer{position:absolute;inset-inline:12px;top:calc(var(--navh) + 6px);background:#fff;border-radius:22px;box-shadow:0 30px 60px -20px rgba(28,19,13,.35);padding:10px;
    display:grid;grid-template-columns:1fr 1fr;gap:4px;transform-origin:top;transform:scale(.96);opacity:0;pointer-events:none;transition:.2s}
  .drawer.open{transform:none;opacity:1;pointer-events:auto}
  .drawer a{display:flex;align-items:center;min-height:48px;padding:10px 14px;border-radius:14px;color:var(--ink);font-weight:800;text-decoration:none;background:var(--peach)}
}
@media (max-width:520px){
  :root{--navh:62px;--gut:16px}
  .brand img{height:46px}
  .nav .login{padding:10px 12px;font-size:14px}
  .navin{gap:8px}
  .lang button{min-width:40px;padding:0 7px}
}

/* ---------- WORLD: hero + levels share one sticky three.js stage ---------- */
.world{position:relative;background:linear-gradient(180deg,#FFD9BC 0%,#FFE9D8 30%,#FFF6EF 62%,#FFFFFF 100%)}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;z-index:0}
.stage::before{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;inset-inline-end:-18vmax;top:-30vmax;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,236,214,.6) 35%,rgba(255,236,214,0) 70%);pointer-events:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.gl-off #world{display:none}
.fallback{position:absolute;inset:0;display:none;pointer-events:none}
.gl-off .fallback{display:block}
.fallback .isl{position:absolute;width:160px;height:110px}
.fallback .isl::before{content:"";position:absolute;inset:0 0 auto;height:34px;border-radius:50%;background:#9ED26A;box-shadow:0 8px 0 #E07A3F}
.fallback .isl::after{content:"";position:absolute;left:18%;right:18%;top:30px;height:76px;background:linear-gradient(#E58A54,#C2410C);clip-path:polygon(0 0,100% 0,50% 100%)}
.fallback img{position:absolute;width:130px;bottom:94px;left:15px}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,246,239,.95) 0%,rgba(255,246,239,.85) 34%,rgba(255,246,239,.45) 50%,rgba(255,246,239,0) 62%)}
html[dir=rtl] .veil{transform:scaleX(-1)}
.flow{position:relative;z-index:1;margin-top:-100vh;pointer-events:none}
.flow a,.flow button,.flow .card-ui{pointer-events:auto}

/* hero */
.hero{min-height:calc(100vh - var(--navh) - 34px);display:flex;flex-direction:column;justify-content:center;padding-block:40px 30px}
.hero .copy{max-width:600px;position:relative}
@media (min-width:821px){.hero .copy::before{content:"";position:absolute;z-index:-1;inset:-60px -70px -40px -70px;border-radius:60px;background:radial-gradient(closest-side,rgba(255,246,239,.97) 55%,rgba(255,246,239,.85) 75%,rgba(255,246,239,0) 100%);filter:blur(6px);pointer-events:none}.hero .hstats{position:relative}.hero .hstats::before{content:"";position:absolute;z-index:-1;inset:-24px -50px;border-radius:50px;background:radial-gradient(closest-side,rgba(255,246,239,.95) 60%,rgba(255,246,239,0) 100%);pointer-events:none}}
.hero h1{font-size:clamp(46px,7.2vw,92px);font-weight:800;margin-top:20px}
.hero h1 .l{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .l > span{display:inline-block}
.hero h1 em{font-style:normal;color:var(--o);position:relative;white-space:nowrap}
html[lang=ar] .hero h1{font-size:clamp(42px,6vw,78px)}
.hero h1 em::after{content:"";position:absolute;inset-inline:2%;bottom:.04em;height:.16em;border-radius:99px;background:var(--o3);opacity:.55;z-index:-1}
.hero .lead{margin-top:20px;font-size:clamp(17px,1.6vw,21px);color:var(--ink2);max-width:31em;font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:16px;margin-top:30px}
.hstats{display:grid;grid-template-columns:repeat(4,auto);gap:10px 34px;margin-top:44px;justify-content:start}
.hstats div{display:flex;flex-direction:column}
.hstats b{font:800 clamp(30px,3.4vw,44px)/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.hstats span{font-size:14px;font-weight:800;color:var(--ink2);margin-top:4px}
.hint{display:inline-flex;align-items:center;gap:10px;margin-top:30px;font-weight:800;font-size:14px;color:var(--od);background:rgba(255,255,255,.75);padding:8px 14px 8px 10px;border-radius:999px;align-self:flex-start}
.hint i{width:22px;height:34px;border:2.5px solid var(--o);border-radius:12px;position:relative;flex:none}
.hint i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--o);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(-3px)}40%{opacity:1}100%{opacity:0;transform:translateY(10px)}}

/* levels: intro + one panel per island */
.lv-intro{min-height:80vh;display:flex;align-items:center}
.lv-intro .sechead{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:30px;border-radius:var(--r);box-shadow:var(--shadow);max-width:560px;margin:0}
.lv-panel{height:100vh;display:flex;align-items:center}
.lv-card{width:min(470px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:32px;padding:28px;
  box-shadow:0 30px 60px -24px rgba(194,65,12,.45), 0 0 0 1px rgba(242,223,207,.9);position:relative}
.lv-top{display:flex;align-items:center;gap:16px}
.lv-disc{flex:none;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:#fff;font:800 24px/1 var(--display);
  background:linear-gradient(160deg,#FB923C,#EA580C);box-shadow:0 6px 0 var(--od);direction:ltr}
.lv-disc.sm{font-size:20px}
.lv-top small{display:block;font-weight:900;color:var(--od);font-size:14px}
.lv-top h3{font-size:clamp(28px,3vw,36px);font-weight:800}
.lv-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lv-card p{margin-top:14px;color:var(--ink2);font-size:17px}
.lv-x{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.lv-x div{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.lv-x i{width:32px;height:32px;border-radius:10px;background:var(--peach2);color:var(--od);display:grid;place-items:center;flex:none}
.lv-x span{color:var(--ink3);font-weight:700}
.lv-spark{position:absolute;width:150px;height:150px;top:-56px;inset-inline-start:-8px;pointer-events:none}
.rail{position:absolute;inset-inline-end:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:2;opacity:0;transition:opacity .4s;pointer-events:none}
.rail.on{opacity:1;pointer-events:auto}
.rail button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.rail button span{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.85);color:var(--od);font:900 12px/34px var(--body);box-shadow:0 3px 0 var(--peach3);transition:.25s;direction:ltr}
.rail button[aria-current=true] span{background:var(--o);color:#fff;box-shadow:0 3px 0 var(--od);transform:scale(1.15)}
.islandtip{position:absolute;z-index:3;pointer-events:none;background:#fff;color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;font-size:14px;transform:translate(-50%,-140%);opacity:0;white-space:nowrap;box-shadow:var(--shadow)}

@media (max-width:820px){
  .veil{background:linear-gradient(180deg,rgba(255,246,239,.92) 0%,rgba(255,246,239,.55) 40%,rgba(255,246,239,0) 62%)}
  html[dir=rtl] .veil{transform:none}
  .hero{justify-content:flex-start;padding-block:22px 18px;min-height:calc(100svh - var(--navh) - 34px)}
  .hero h1{margin-top:14px}
  .hero .lead{margin-top:12px;font-size:16.5px}
  .ctas{margin-top:20px;gap:12px}
  .ctas .btn{flex:1 1 100%;min-height:54px}
  .hero .grow{flex:1;min-height:120px}
  .hstats{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:0;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:12px 10px;box-shadow:var(--shadow);text-align:center}
  .hstats b{font-size:26px}
  .hstats span{font-size:12px;line-height:1.25}
  .hint{display:none}
  .lv-panel{align-items:flex-end;padding-bottom:22px;height:100vh}
  .lv-card{padding:22px;border-radius:26px}
  .lv-disc{width:62px;height:62px;border-radius:20px;font-size:20px}
  .lv-disc.sm{font-size:17px}
  .lv-card p{font-size:16px}
  .lv-spark{width:120px;height:120px;top:-46px;inset-inline-start:-6px}
  .lv-intro{align-items:flex-start;padding-top:24px}
  .lv-intro .sechead{padding:22px}
  .rail{display:none}
}
@media (min-width:821px){ .hero .grow{display:none} }

/* ---------- how it works ---------- */
.moments{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
.moment{background:#fff;border-radius:var(--r);padding:26px;box-shadow:0 0 0 2px var(--line),0 8px 0 var(--line);display:flex;flex-direction:column;gap:14px;position:relative}
.moment .mh{display:flex;align-items:center;gap:14px}
.mnum{flex:none;width:56px;height:56px;border-radius:18px;background:var(--o);color:#fff;font:800 22px/56px var(--display);text-align:center;box-shadow:0 5px 0 var(--od);position:relative;direction:ltr}
.mnum .ck{position:absolute;width:62px;height:62px;top:-22px;inset-inline-end:-30px;pointer-events:none}
.moment h3{font-size:clamp(22px,2.2vw,28px);font-weight:800}
.moment p{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.device{margin-top:auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 20px 40px -24px rgba(28,19,13,.4);transform:perspective(900px) rotateX(4deg);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.moment:hover .device{transform:perspective(900px) rotateX(0) translateY(-4px)}
.device .bar{display:flex;gap:6px;padding:9px 12px;background:var(--peach);direction:ltr}
.device .bar i{width:9px;height:9px;border-radius:50%;background:var(--peach3)}
.device img{width:100%;aspect-ratio:1400/787;object-fit:cover}
.ppl{display:flex;gap:8px;padding:10px;background:#fff;direction:ltr}
.ppl div{flex:1;background:var(--peach);border-radius:12px;height:62px;position:relative;overflow:hidden;display:flex;justify-content:center}
.ppl div img{height:58px;width:auto;margin-top:6px;aspect-ratio:auto}
.ppl span{position:absolute;left:6px;bottom:4px;font-size:11px;font-weight:900;background:#fff;border-radius:6px;padding:0 5px;color:var(--ink)}
.ppl .live{background:var(--peach3)}
@media (max-width:820px){ .moments{grid-template-columns:1fr;gap:20px} .moment{padding:20px} }

/* ---------- hub ---------- */
.hubgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.hubdev{position:relative;border-radius:var(--r);overflow:visible}
.hubdev video{width:100%;aspect-ratio:1400/787;object-fit:cover;border-radius:var(--r);display:block;background:var(--peach2);box-shadow:0 0 0 8px #fff,0 40px 70px -30px rgba(194,65,12,.5)}
.hubdev .float{position:absolute;inset-inline-end:-10px;bottom:-26px;background:#fff;border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.hubdev .float b{font:800 44px/1 var(--display);color:var(--o)}
.hubdev .float span{font-weight:800;max-width:7em;line-height:1.25}
.hublist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hitem{background:#fff;border-radius:22px;padding:16px;box-shadow:0 0 0 2px var(--line),0 5px 0 var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.hitem:hover{transform:translateY(-3px)}
.hitem .ic{width:44px;height:44px;border-radius:14px;background:var(--peach2);color:var(--od);display:grid;place-items:center}
.hitem b{font:800 18px/1.2 var(--display)}
.hitem span{font-size:14.5px;color:var(--ink2);line-height:1.45}
.hitem em{font-style:normal;margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:900;color:var(--od);background:var(--peach);padding:3px 10px;border-radius:999px}
.hitem:last-child{grid-column:1/-1}
@media (max-width:900px){ .hubgrid{grid-template-columns:1fr;gap:56px} .hubdev .float{inset-inline-end:8px} }
@media (max-width:420px){ .hublist{gap:10px} .hitem{padding:14px} .hitem b{font-size:16.5px} .hitem span{font-size:14px} }

/* ---------- writing ---------- */
.wrgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.wrfeats{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.wrfeats li{display:flex;gap:16px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 0 0 2px var(--line)}
.wrn{flex:none;width:42px;height:42px;border-radius:14px;background:var(--o);color:#fff;font:800 19px/42px var(--display);text-align:center;box-shadow:0 4px 0 var(--od)}
.wrfeats b{font:800 19px/1.3 var(--display)}
.wrfeats p{color:var(--ink2);font-size:15.5px;margin-top:4px}
.wrcard{background:#fff;border-radius:30px;padding:24px;box-shadow:0 40px 80px -30px rgba(194,65,12,.45),0 0 0 2px var(--line);direction:ltr;text-align:left;position:relative;transform:rotate(-1.5deg)}
html[dir=rtl] .wrcard{transform:rotate(1.5deg)}
.wrtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;font-size:14px;color:var(--od);flex-wrap:wrap}
.wrtop .lvl{font-family:var(--body)}
html[lang=ar] .wrtop .lvl{font-family:var(--ar);direction:rtl}
.wrtabs{display:flex;background:var(--peach);border-radius:12px;padding:3px}
.wrtabs span{padding:6px 14px;border-radius:9px;color:var(--ink3)}
.wrtabs span.on{background:#fff;color:var(--od);box-shadow:0 2px 6px rgba(194,65,12,.15)}
.wrq{font:800 26px/1.25 var(--display);margin-top:18px;font-family:'Bricolage Grotesque',Nunito,sans-serif;letter-spacing:-.02em}
.wrqa{font-family:var(--ar);color:var(--ink2);font-weight:700;margin-top:6px;text-align:right}
.wrpaper{margin-top:16px;min-height:132px;border-radius:18px;padding:16px 18px;font:700 19px/34px var(--body);font-family:Nunito,system-ui,sans-serif;color:var(--ink);
  background:repeating-linear-gradient(180deg,#fff 0 33px,#FBE1CC 33px 34px);box-shadow:inset 0 0 0 2px var(--peach2)}
.caret{display:inline-block;width:2px;height:22px;background:var(--o);vertical-align:-4px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wrfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;font-weight:900;font-size:14px}
.wrsave{display:inline-flex;align-items:center;gap:4px;color:#15803D;background:#DCFCE7;padding:4px 12px 4px 4px;border-radius:999px;opacity:0;transition:opacity .3s}
.wrsave.on{opacity:1}
.wrsave i{width:28px;height:28px;display:block}
.wrsheet{color:var(--od);background:var(--peach);padding:6px 12px;border-radius:999px}
html[lang=ar] .wrfoot span{font-family:var(--ar)}
@media (max-width:900px){ .wrgrid{grid-template-columns:1fr;gap:40px} .wrq{font-size:22px} .wrpaper{font-size:17px} }

/* ---------- games ---------- */
.gtrack{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gcard{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 6px 0 var(--line);display:flex;flex-direction:column;transition:transform .25s}
.gcard:hover{transform:translateY(-5px) rotate(-.6deg)}
.gcard .poster{position:relative;height:118px;background:var(--peach3)}
.gcard .poster img{width:100%;height:100%;object-fit:cover}
.gcard .poster span{position:absolute;top:10px;inset-inline-start:10px;background:#fff;color:var(--od);font-weight:900;font-size:13px;padding:4px 10px;border-radius:999px}
.gcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard h3{font-size:21px;font-weight:800}
.gcard p{color:var(--ink2);font-size:15px;line-height:1.5}
.gcard .play{margin-top:auto;padding-top:6px;font-weight:900;font-size:14px;color:var(--od)}
.gmore{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.gmore span{background:var(--peach);border-radius:16px;padding:10px 16px;font-weight:700;color:var(--ink2);font-size:15px}
.gmore b{color:var(--o)}
@media (max-width:700px){
  .gscroll{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin-inline:calc(var(--gut) * -1);padding:4px var(--gut) 14px;scrollbar-width:none}
  .gscroll::-webkit-scrollbar{display:none}
  .gtrack{display:flex;gap:14px;width:max-content}
  .gcard{width:78vw;max-width:300px;scroll-snap-align:center}
}

/* ---------- stories ---------- */
.sgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:start}
.sframe{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:1100/619;background:var(--peach3);box-shadow:0 30px 60px -28px rgba(194,65,12,.55)}
.sframe img{width:100%;height:100%;object-fit:cover}
.sframe .cap{position:absolute;inset:auto 0 0;padding:60px 22px 18px;background:linear-gradient(transparent,rgba(28,19,13,.78));color:#fff}
.sframe .cap small{font-weight:800;color:var(--o3);font-size:14px}
.sframe .cap h3{font-size:clamp(24px,3vw,36px);color:#fff}
.sframe .pages{position:absolute;top:14px;inset-inline-end:14px;background:#fff;color:var(--od);font-weight:900;font-size:13px;border-radius:999px;padding:5px 12px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.part{background:#fff;border-radius:18px;padding:12px;box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;gap:2px}
.part small{font-weight:900;color:var(--o);font-size:12.5px}
.part b{font-size:14.5px;line-height:1.3}
.part span{font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:auto;padding-top:4px}
.sfeat{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stabs{display:grid;gap:10px}
.stab{display:flex;align-items:center;gap:12px;text-align:start;background:#fff;border:0;border-radius:20px;padding:12px;cursor:pointer;box-shadow:0 0 0 2px var(--line),0 5px 0 var(--line);min-height:64px;transition:.2s}
.stab img{width:74px;height:46px;object-fit:cover;border-radius:12px;flex:none}
.stab b{display:block;font:800 17px/1.25 var(--display)}
.stab span span{font-size:13.5px;color:var(--ink3);font-weight:700}
.stab[aria-pressed=true]{background:var(--o);box-shadow:0 5px 0 var(--od);color:#fff}
.stab[aria-pressed=true] span span{color:#FFE8D6}
@media (max-width:900px){ .sgrid{grid-template-columns:1fr} .parts{grid-template-columns:1fr 1fr} .stabs{grid-template-columns:1fr 1fr} .stab img{display:none} }

/* ---------- start free ---------- */
.freegrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.fcard{position:relative;overflow:hidden;border-radius:34px;padding:32px;padding-inline-end:200px;text-decoration:none;color:var(--ink);min-height:300px;display:flex;flex-direction:column;gap:12px;transition:transform .25s}
.fcard:hover{transform:translateY(-4px)}
.fcard.a{background:linear-gradient(150deg,#FFF1E4,#FFD9BC)}
.fcard.b{background:linear-gradient(150deg,#FB923C,#EA580C);color:#fff}
.fcard .tag{align-self:flex-start;background:#fff;color:var(--od);font-weight:900;font-size:13px;border-radius:999px;padding:5px 12px}
.fcard h3{font-size:clamp(26px,2.8vw,34px);font-weight:800}
.fcard p{opacity:.9;font-weight:600}
.fcard.b p{color:#FFF6EF}
.fcard .go{margin-top:auto;display:inline-flex;align-items:center;gap:10px;font-weight:900}
.fcard .go i{width:44px;height:44px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}
.fcard.b .go i{background:#fff;color:var(--od)}
.fcard > img{position:absolute;bottom:-10px;inset-inline-end:-6px;width:210px;filter:drop-shadow(0 18px 20px rgba(28,19,13,.25))}
@media (max-width:900px){
  .freegrid{grid-template-columns:1fr}
  .fcard{padding:24px;padding-bottom:150px;min-height:0}
  .fcard > img{width:150px}
}

/* ---------- crew ---------- */
.crewsec{overflow:hidden}
.spot{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
.portrait{position:relative;aspect-ratio:1/1;max-width:440px;width:100%;margin-inline:auto;display:grid;place-items:end center}
.portrait .pad{position:absolute;inset:8% 4% 0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0%,var(--peach2) 55%,var(--peach3) 100%)}
.portrait .ground{position:absolute;bottom:2%;left:14%;right:14%;height:14%;border-radius:50%;background:#9ED26A;box-shadow:0 10px 0 #E07A3F}
.portrait img{position:relative;height:86%;width:auto;object-fit:contain;margin-bottom:5%;filter:drop-shadow(0 18px 18px rgba(28,19,13,.22))}
.portrait .say{position:absolute;top:4%;inset-inline-end:0;background:#fff;border-radius:20px;padding:10px 16px;font-weight:900;box-shadow:var(--shadow);max-width:62%;font-size:16px}
.portrait .sparks{position:absolute;width:34%;aspect-ratio:1;top:6%;inset-inline-start:2%;pointer-events:none}
.bio .role{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bio .role b{font:800 clamp(34px,4vw,48px)/1.1 var(--display)}
.bio .role span{font-weight:900;color:var(--od);background:var(--peach2);border-radius:999px;padding:4px 12px}
.bio p{margin-top:14px;color:var(--ink2);min-height:7.5em}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}
.pick{border:0;background:var(--peach);border-radius:20px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;box-shadow:0 4px 0 var(--peach3);transition:transform .2s}
.pick img{height:74px;width:auto}
.pick span{font-weight:900;font-size:13px}
.pick[aria-selected=true]{background:var(--o);color:#fff;box-shadow:0 4px 0 var(--od);transform:translateY(-4px)}
@media (max-width:900px){
  .spot{grid-template-columns:1fr;gap:20px}
  .portrait{max-width:330px}
  .picks{grid-template-columns:repeat(3,1fr)}
  .bio p{min-height:0}
}

/* ---------- pricing ---------- */
.freehint{text-align:center;color:var(--ink2);font-weight:700;margin:-16px auto 20px;max-width:640px}
.curs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:34px}
.curs button{min-width:62px;min-height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer;direction:ltr}
.curs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
.plan{background:#fff;border-radius:30px;padding:28px;box-shadow:0 0 0 2px var(--line),0 8px 0 var(--line);display:flex;flex-direction:column;gap:14px;position:relative}
.plan.feat{background:linear-gradient(170deg,#FB923C,#EA580C 70%);color:#fff;box-shadow:0 10px 0 var(--od),0 40px 60px -26px rgba(194,65,12,.6);transform:translateY(-12px)}
.plan .nm{font:800 24px/1.2 var(--display)}
.plan .sm{color:var(--ink3);font-weight:800;font-size:15px}
.plan.feat .sm{color:#FFE8D6}
.plan .pr{display:flex;align-items:baseline;gap:8px;direction:ltr;justify-content:flex-start}
html[dir=rtl] .plan .pr{justify-content:flex-end}
.plan .pr .sym{font-weight:900;font-size:17px;color:var(--ink3)}
.plan.feat .pr .sym{color:#FFE8D6}
.plan .pr b{font:800 clamp(40px,4vw,50px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.plan .per{font-weight:800;font-size:14.5px;color:var(--ink2)}
.plan.feat .per{color:#FFF1E4}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plan li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15.5px;line-height:1.45}
.plan li svg{flex:none;color:var(--o);margin-top:2px}
.plan.feat li svg{color:#fff}
.plan > a{margin-top:auto}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badges span{background:#fff;color:var(--od);font-weight:900;font-size:13px;border-radius:999px;padding:4px 12px}
.badges .fl{width:34px;height:34px;margin-inline-start:-4px}
.plan.feat .btn-w{border-color:#fff;box-shadow:0 6px 0 var(--od)}
.prnote{text-align:center;color:var(--ink3);font-size:14px;margin:36px auto 0;max-width:720px;font-weight:600}
@media (max-width:980px){ .plans{grid-template-columns:1fr;max-width:480px;margin:0 auto} .plan.feat{transform:none;order:-1} }

/* ---------- handbook ---------- */
.hbgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.hbcover{position:relative;max-width:380px;margin-inline:auto;transform:rotate(-3deg)}
html[dir=rtl] .hbcover{transform:rotate(3deg)}
.hbcover img{border-radius:18px;box-shadow:0 40px 70px -28px rgba(28,19,13,.5),0 0 0 8px #fff;width:100%}
.hbcover span{position:absolute;top:-14px;inset-inline-end:-14px;background:var(--o);color:#fff;font-weight:900;border-radius:16px;padding:10px 14px;box-shadow:0 5px 0 var(--od)}
.hblist{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:10px}
.hblist li{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 0 0 2px var(--line);font-size:15.5px;color:var(--ink2)}
.hblist b{color:var(--ink)}
.hbctas{display:flex;flex-wrap:wrap;gap:14px}
@media (max-width:900px){ .hbgrid{grid-template-columns:1fr;gap:36px} .hbcover{max-width:240px} .hbctas .btn{flex:1 1 100%} }

/* ---------- FAQ ---------- */
.faqgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.ask{display:flex;align-items:center;gap:14px;background:var(--peach);border-radius:24px;padding:14px 18px;text-decoration:none;color:var(--ink);box-shadow:0 5px 0 var(--peach3)}
.ask img{height:76px;width:auto}
.ask b{display:block;font:800 19px/1.2 var(--display)}
.ask span{color:var(--ink2);font-weight:700;font-size:14.5px}
.fq{border-radius:22px;background:#fff;box-shadow:0 0 0 2px var(--line);margin-bottom:12px;overflow:hidden}
.fq button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:start;padding:18px 20px;border:0;background:transparent;cursor:pointer;font:800 17.5px/1.35 var(--display);min-height:60px}
.fq .ic{flex:none;width:36px;height:36px;border-radius:12px;background:var(--peach2);color:var(--od);display:grid;place-items:center;transition:transform .3s}
.fq.open{box-shadow:0 0 0 2px var(--o3)}
.fq.open .ic{transform:rotate(45deg);background:var(--o);color:#fff}
.ans{height:0;overflow:hidden}
.ans p{padding:0 20px 20px;color:var(--ink2)}
@media (max-width:900px){ .faqgrid{grid-template-columns:1fr;gap:20px} }

/* ---------- final ---------- */
.final{background:radial-gradient(120% 120% at 50% 0%,#FB923C 0%,#EA580C 55%,#C2410C 100%);color:#fff;text-align:center;overflow:hidden;padding:clamp(80px,11vw,140px) 0 0}
.final .kicker{background:rgba(255,255,255,.2);color:#fff}
.final .kicker::before{background:#fff;box-shadow:none}
.final h2{font-size:clamp(40px,7vw,86px);font-weight:800;margin:18px auto 0;max-width:12em;position:relative;z-index:1}
.final h2 em{font-style:normal;color:#FFE8D6;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
.final .row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:36px;position:relative;z-index:1}
.final .btn-w{border-color:#fff;box-shadow:0 6px 0 rgba(28,19,13,.25)}
.final .btn-p{background:var(--ink);box-shadow:0 6px 0 #000}
.confetti{position:absolute;inset:0;pointer-events:none}
.final .lumi{width:min(260px,52vw);margin:44px auto -10px;position:relative;filter:drop-shadow(0 20px 24px rgba(28,19,13,.3))}
footer{background:var(--ink);color:#fff;padding:26px 0 96px;position:relative;z-index:1}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
footer nav{display:flex;gap:6px;flex-wrap:wrap}
footer a{color:#fff;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08)}
footer a:hover{background:var(--o)}
footer img{height:44px;width:auto;background:#fff;border-radius:12px;padding:2px 6px}

/* ---------- trial dialog ---------- */
.tdlg{position:fixed;inset:0;z-index:90;background:rgba(28,19,13,.55);display:none;align-items:center;justify-content:center;padding:16px}
.tdlg.open{display:flex}
.tbox{background:#fff;border-radius:30px;padding:26px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.tbox h3{font-size:28px;font-weight:800;padding-inline-end:48px}
.tbox > p{color:var(--ink2);margin-top:8px}
.tclose{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:14px;border:0;background:var(--peach2);font-size:24px;cursor:pointer;color:var(--od)}
.tlevels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.tlevels button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;text-align:start;font-weight:800;cursor:pointer;min-height:56px;font-size:15px;line-height:1.3}
.tlevels button small{display:block;color:var(--ink3);font-weight:700;font-size:13px}
.tlevels button[aria-pressed=true]{border-color:var(--o);background:var(--peach)}
.tpick{display:none;margin-top:16px;position:relative}
.tpick.show{display:block}
.tpick .pts{display:grid;gap:6px;color:var(--ink2);font-size:15px;margin-bottom:14px}
.tpick .btn{width:100%;white-space:normal;text-align:center}
.tpick .conf{position:absolute;width:220px;height:220px;left:50%;top:-80px;margin-left:-110px;pointer-events:none}
@media (max-width:480px){ .tlevels{grid-template-columns:1fr} }

/* ---------- WhatsApp ---------- */
.wafab{position:fixed;bottom:18px;inset-inline-end:18px;z-index:70;width:62px;height:62px;border-radius:22px;background:#25D366;color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 0 #128C4B,0 18px 30px -10px rgba(18,140,75,.6);transition:transform .2s}
.wafab:hover{transform:translateY(-3px)}
@media (max-width:820px){.wafab.away{transform:translateY(120px);opacity:0;pointer-events:none}.wafab{transition:transform .3s,opacity .3s}}
.wafab svg{width:32px;height:32px}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
