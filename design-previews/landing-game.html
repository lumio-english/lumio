<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function () { var l = 'ar'; try { l = localStorage.getItem('lumio_lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<title>Lumio English: Lumi's Island Road</title>
<meta name="description" content="Design preview, landing round 2: a playable low-poly world. Walk Lumi across seven islands, one per level, to the free-trial castle.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@500;600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F97316;--o2:#C2410C;--o3:#FDBA74;--o4:#FFEDD5;--peach:#FFF6EF;--ink:#1C1917;--mut:#6B5B50;--line:#F1E2D3;
  --wa:#22C55E;--wa2:#15803D;--acc:#F97316;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;--body:'Nunito',ui-rounded,system-ui,sans-serif;--ar:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --top:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FFF1E4;color:var(--ink);font:600 16px/1.55 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[dir=rtl] body{font-family:var(--ar);font-weight:500}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.08;font-weight:800}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:var(--ar);letter-spacing:0;line-height:1.28}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
html:has(body.game){height:100%;overflow:hidden}
body.game{position:fixed;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;height:100%}
body.page{overflow-x:hidden}
[hidden]{display:none!important}

/* ---------- preview strip ---------- */
.strip{position:fixed;top:0;inset-inline:0;z-index:80;height:28px;background:#1C1917;color:#fff;font:700 12px/28px var(--body);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:12px;white-space:nowrap;overflow:hidden}
[dir=rtl] .strip{font-family:var(--ar)}
.strip b{color:var(--o3)}
.strip .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip nav{display:flex;gap:4px;flex:none}
.strip a{color:#fff;text-decoration:none;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.12);line-height:20px;display:inline-block}
.strip a:hover,.strip a[aria-current]{background:var(--o)}
@media (max-width:520px){.strip .long{display:none}.strip{padding-inline:8px}.strip nav{gap:3px}.strip a{padding:0 7px;font-size:11.5px}}

/* ---------- persistent bar ---------- */
.bar{position:fixed;top:36px;inset-inline:10px;z-index:70;height:56px;display:flex;align-items:center;gap:6px;padding-inline:8px;border-radius:20px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px -12px rgba(124,45,18,.35),0 0 0 1px rgba(249,115,22,.10)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;margin-inline-end:auto;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--o4)}
.brand span{font:800 21px/1 var(--display);color:var(--o);letter-spacing:-.03em}
.brand span i{font-style:normal;color:var(--ink);font-weight:700;font-size:15px;margin-inline-start:4px}
.bar .bb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding-inline:12px;border-radius:14px;font:800 14px/1 var(--body);text-decoration:none;color:var(--ink);white-space:nowrap}
[dir=rtl] .bar .bb{font-family:var(--ar);font-weight:800}
.bar .bb:hover{background:var(--o4)}
.bar .bb.trial{background:var(--wa);color:#fff;box-shadow:0 4px 0 var(--wa2)}
.bar .bb.trial:hover{background:#16A34A}
.bar .bb.trial:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wa2)}
.bar .bb.lang{border:2px solid var(--line);min-width:48px;padding-inline:8px}
.bar .bb svg{flex:none}
@media (max-width:760px){.brand span{display:none}}
@media (max-width:420px){.bar{inset-inline:6px;gap:2px;padding-inline:6px}.bar .bb{padding-inline:9px;font-size:13px}.bar .bb.trial svg{display:none}.brand img{width:36px;height:36px}}

/* ---------- 3D stage ---------- */
#stage{position:fixed;inset:0;z-index:1;background:linear-gradient(#FDC197,#FFF1E2 60%)}
#c{display:block;width:100%;height:100%;outline:none}
body.page #stage,body.page .hud,body.page #start,body.page .bubbles,body.page .joy,body.page #card,body.page .tapmark{display:none!important}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;visibility:hidden}
.hud.on{opacity:1;visibility:visible}
.hud > *{pointer-events:auto}
.toprow{position:absolute;top:102px;inset-inline:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
.toprow > *{pointer-events:auto}
.stars{display:flex;align-items:center;gap:7px;height:44px;padding-inline:10px 14px;border-radius:999px;background:#fff;box-shadow:0 6px 0 -1px #F3D9C2,0 10px 24px -10px rgba(124,45,18,.4);font:800 18px/1 var(--display);flex:none}
.stars svg{width:28px;height:28px;filter:drop-shadow(0 2px 0 #C2410C)}
.stars small{font:700 13px/1 var(--body);color:var(--mut)}
.track{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.82);box-shadow:0 10px 24px -12px rgba(124,45,18,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.track button{position:relative;min-width:30px;height:34px;padding-inline:6px;border-radius:999px;font:800 12px/1 var(--display);color:var(--mut);background:#FFF4EA;transition:background .25s,color .25s,transform .25s}
.track button.seen{background:var(--o4);color:var(--o2)}
.track button.here{background:var(--o);color:#fff;transform:scale(1.1);box-shadow:0 3px 0 var(--o2)}
.track button svg{width:16px;height:16px;display:block;margin:auto}
@media (max-width:520px){.toprow{inset-inline:10px;gap:6px}.stars{height:40px;padding-inline:8px 10px;gap:5px;font-size:16px}.stars svg{width:22px;height:22px}.stars small{font-size:11px}.track{gap:3px;padding:4px}.track button{min-width:26px;height:32px;padding-inline:4px;font-size:11.5px}}
@media (max-width:760px){body.carding .tools,body.carding .bottom{opacity:0;pointer-events:none}}
.tools,.bottom{transition:opacity .25s}
.tools{position:absolute;top:156px;inset-inline-end:12px;display:flex;flex-direction:column;gap:8px}
.tool{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 4px 0 #F3D9C2,0 8px 18px -8px rgba(124,45,18,.4);color:var(--o2)}
.tool[aria-pressed=false]{color:#B7A79A}
.tool svg{width:22px;height:22px}
.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.bottom > *{pointer-events:auto}
.hint{font:700 13px/1.3 var(--body);color:#7C2D12;background:rgba(255,255,255,.85);padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px -10px rgba(124,45,18,.5);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);text-align:center}
[dir=rtl] .hint{font-family:var(--ar)}
.hint kbd{font:800 11px/1 var(--body);background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:3px 6px;color:var(--ink)}
.nextb{display:inline-flex;align-items:center;gap:10px;height:54px;padding-inline:22px 16px;border-radius:999px;background:linear-gradient(#FB923C,#F97316);color:#fff;font:800 17px/1 var(--display);box-shadow:0 6px 0 var(--o2),0 18px 30px -12px rgba(194,65,12,.7)}
[dir=rtl] .nextb{font-family:var(--ar);padding-inline:22px 16px}
.nextb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--o2)}
.nextb i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
[dir=rtl] .nextb i svg{transform:scaleX(-1)}
.nextb small{font:700 12px/1 var(--body);opacity:.9}
.joy{position:fixed;z-index:25;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.25);box-shadow:0 10px 30px -10px rgba(124,45,18,.45);pointer-events:none;opacity:0;transition:opacity .15s;left:0;top:0}
.joy.on{opacity:1}
.joy b{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FDBA74,#F97316 60%,#C2410C);box-shadow:0 6px 14px -4px rgba(124,45,18,.6)}
.tapmark{position:fixed;z-index:22;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fff;pointer-events:none;left:0;top:0;opacity:0}
.toast{position:fixed;top:156px;left:50%;transform:translateX(-50%);z-index:45;background:#1C1917;color:#fff;font:800 15px/1.2 var(--body);padding:12px 18px;border-radius:999px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;white-space:nowrap}
[dir=rtl] .toast{font-family:var(--ar)}

/* speech bubbles above characters */
.bubbles{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;width:max-content;max-width:min(250px,70vw);pointer-events:auto;opacity:0;visibility:hidden}
.bub .in{transform-origin:50% 100%}
.bub .in{background:#fff;border-radius:18px;padding:10px 14px 12px;box-shadow:0 14px 30px -12px rgba(124,45,18,.55),0 0 0 2px var(--acc);position:relative}
.bub .in::after{content:"";position:absolute;bottom:-9px;left:var(--tx,50%);margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.bub .nm{font:800 12px/1 var(--display);color:var(--acc);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
[dir=rtl] .bub .nm{font-family:var(--ar);letter-spacing:0}
.bub q{display:block;font:800 16px/1.3 var(--body);quotes:none}
[dir=rtl] .bub q{font-family:var(--ar)}
.bub button{margin-top:8px;font:800 13px/1 var(--body);color:#fff;background:var(--acc);border-radius:999px;padding:9px 12px;min-height:34px}
[dir=rtl] .bub button{font-family:var(--ar)}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;padding:110px 20px max(22px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,241,228,0) 22%,rgba(255,244,235,.86) 44%,#FFF6EF 60%);overflow:auto}
.sc{width:100%;max-width:560px;margin-inline:auto;text-align:center}
.sc .logo{width:132px;margin:0 auto 6px;filter:drop-shadow(0 10px 18px rgba(194,65,12,.25))}
.eyebrow{display:inline-block;font:800 12px/1.2 var(--body);color:var(--o2);background:#fff;border:2px solid var(--o4);border-radius:999px;padding:7px 12px;margin-bottom:12px}
[dir=rtl] .eyebrow{font-family:var(--ar)}
.sc h1{font-size:clamp(34px,9vw,64px);margin-bottom:10px}
.sc h1 em{font-style:normal;color:var(--o);display:block}
.sc .lead{color:var(--mut);font-size:16px;max-width:460px;margin:0 auto 18px}
.playrow{display:flex;flex-direction:column;align-items:center;gap:12px}
.play{position:relative;display:inline-flex;align-items:center;gap:14px;height:68px;padding-inline:30px 14px;border-radius:999px;background:linear-gradient(#FB923C,#F97316);color:#fff;font:800 26px/1 var(--display);box-shadow:0 8px 0 var(--o2),0 26px 40px -14px rgba(194,65,12,.8)}
[dir=rtl] .play{font-family:var(--ar);padding-inline:30px 14px}
.play i{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--o);display:grid;place-items:center}
[dir=rtl] .play i svg{transform:scaleX(-1)}
.play::before{content:"";position:absolute;inset:-8px;border-radius:999px;border:3px solid rgba(249,115,22,.45);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.15);opacity:0}}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 var(--o2)}
.playsub{font:700 14px/1.4 var(--body);color:var(--mut);max-width:400px}
[dir=rtl] .playsub{font-family:var(--ar)}
.skip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding-inline:18px;border-radius:999px;background:#fff;border:2px solid var(--line);font:800 15px/1.2 var(--body);text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
[dir=rtl] .skip{font-family:var(--ar)}
.skip:hover{border-color:var(--o3)}
.statsrow{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.statsrow div{background:rgba(255,255,255,.8);border-radius:16px;padding:8px 12px;min-width:76px}
.statsrow b{display:block;font:800 22px/1 var(--display);color:var(--o)}
.statsrow span{font:700 12px/1.2 var(--body);color:var(--mut)}
[dir=rtl] .statsrow span{font-family:var(--ar)}
.keyshint{margin-top:12px;font:700 12px/1.3 var(--body);color:var(--mut)}
[dir=rtl] .keyshint{font-family:var(--ar)}
@media (min-width:900px){
  #start{align-items:center;padding:110px 6vw 40px;background:linear-gradient(90deg,#FFF6EF 0%,rgba(255,246,239,.92) 34%,rgba(255,246,239,0) 58%)}
  [dir=rtl] #start{background:linear-gradient(270deg,#FFF6EF 0%,rgba(255,246,239,.92) 34%,rgba(255,246,239,0) 58%)}
  .sc{margin-inline:0;text-align:start;max-width:520px}
  .sc .logo{margin-inline:0}
  .sc .lead{margin-inline:0}
  .playrow{align-items:flex-start}
  .sc .statsrow{justify-content:flex-start}
}
@media (max-width:899px) and (max-height:640px){.sc .lead{display:none}}
@media (max-width:899px){.sc .logo{display:none}#start{padding-top:300px;background:linear-gradient(180deg,rgba(255,241,228,0) 37%,rgba(255,244,235,.92) 47%,#FFF6EF 56%)}
  .eyebrow{font-size:11.5px;padding:6px 10px;margin-bottom:8px}.sc h1{font-size:34px;margin-bottom:6px}.sc .lead{font-size:14.5px;line-height:1.45;margin-bottom:14px}
  .play{height:60px;font-size:23px}.play i{width:40px;height:40px}.playrow{gap:10px}.playsub{font-size:12.5px}
  .statsrow{flex-wrap:nowrap;gap:5px;margin-top:12px}.statsrow div{min-width:0;flex:1;padding:6px 4px}.statsrow b{font-size:19px}.statsrow span{font-size:10.5px;display:block;line-height:1.15}
  .keyshint{margin-top:8px;font-size:11.5px}}
@media (max-width:899px) and (max-height:700px){.playsub{display:none}}

/* ---------- cards (game) ---------- */
.card{position:fixed;z-index:50;top:104px;inset-inline-end:20px;width:min(470px,42vw);max-height:calc(100dvh - 124px);display:flex;flex-direction:column;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 40px 80px -24px rgba(124,45,18,.55),0 0 0 1px rgba(249,115,22,.10);transform-origin:50% 100%}
@media (max-width:760px){.card{top:auto;bottom:8px;inset-inline:8px;width:auto;max-height:min(64dvh,560px);border-radius:28px}}
.hd{position:relative;flex:none;padding:18px 20px 26px;color:#fff;background-color:var(--acc);background-image:radial-gradient(circle at 92% -30%,rgba(255,255,255,.45),transparent 55%),repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 12px,transparent 12px 24px);display:flex;align-items:center;gap:14px}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;background:radial-gradient(circle at 10px 0,transparent 9.5px,#fff 10px) repeat-x;background-size:20px 12px}
.emb{flex:none;width:58px;height:58px;border-radius:18px;background:#fff;color:var(--acc);display:grid;place-items:center;font:800 19px/1 var(--display);transform:rotate(-6deg);box-shadow:0 6px 0 rgba(0,0,0,.14);overflow:hidden}
.emb svg{width:30px;height:30px}
.emb.sm{font-size:15px;letter-spacing:-.03em}
.emb img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hd .k{display:block;font:800 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;opacity:.92;margin-bottom:4px}
[dir=rtl] .hd .k{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:13px}
.hd h2{font-size:23px;line-height:1.12}
[dir=rtl] .hd h2{line-height:1.35}
.hd h2 em{font-style:normal;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.xbtn{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center}
.xbtn:hover{background:rgba(255,255,255,.35)}
.hd .tt{padding-inline-end:34px;min-width:0}
.bd{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;padding:18px 20px 10px;-webkit-overflow-scrolling:touch}
.ft{flex:none;display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);background:#fff}
.ft .btn{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:999px;font:800 15px/1.2 var(--body);text-decoration:none;text-align:center}
[dir=rtl] .btn{font-family:var(--ar)}
.btn-p{background:linear-gradient(#FB923C,#F97316);color:#fff;box-shadow:0 5px 0 var(--o2)}
.btn-p:active{transform:translateY(4px);box-shadow:0 1px 0 var(--o2)}
.btn-g{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 5px 0 var(--wa2)}
.btn-wa:active{transform:translateY(4px);box-shadow:0 1px 0 var(--wa2)}
.btn svg{flex:none}
[dir=rtl] .btn .arr{transform:scaleX(-1)}

/* card content */
.bd > * + *{margin-top:14px}
.lead2{color:var(--mut);font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:800 12.5px/1 var(--body);color:var(--o2);background:var(--o4);border-radius:999px;padding:8px 11px}
[dir=rtl] .chips span{font-family:var(--ar)}
.tile{display:flex;gap:12px;padding:10px;border-radius:20px;background:var(--peach);border:1px solid var(--line);align-items:flex-start}
.tile.v{flex-direction:column}
.tile.v > img{width:100%;height:130px}
.tile > img{width:104px;height:84px;object-fit:cover;border-radius:14px;flex:none;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.tile small{display:block;font:800 11.5px/1.2 var(--body);color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] .tile small{font-family:var(--ar);letter-spacing:0}
.tile b{display:block;font:800 17px/1.2 var(--display);margin:3px 0}
[dir=rtl] .tile b{font-family:var(--ar)}
.tile p{font-size:14px;color:var(--mut);line-height:1.45}
.tag2{display:inline-block;margin-top:6px;font:800 11.5px/1 var(--body);color:#fff;background:var(--acc);border-radius:999px;padding:6px 9px}
.parts{list-style:none;display:grid;gap:6px;margin-top:8px}
.parts li{display:flex;align-items:center;gap:8px;font-size:13.5px;line-height:1.3;background:#fff;border-radius:12px;padding:7px 9px}
.parts li i{flex:none;width:24px;height:24px;border-radius:8px;background:var(--acc);color:#fff;font:800 12px/24px var(--display);text-align:center;font-style:normal}
.parts li em{margin-inline-start:auto;font-style:normal;font-size:11.5px;color:var(--mut);white-space:nowrap}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.note a{color:var(--o2);font-weight:800}
.lvnote{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mut);background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 12px}
.lvnote b{font:800 26px/1 var(--display);color:var(--acc)}
/* how stepper */
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stabs button{border-radius:14px;padding:8px 4px;background:var(--peach);border:2px solid transparent;font:700 11.5px/1.2 var(--body);color:var(--mut);min-height:58px}
[dir=rtl] .stabs button{font-family:var(--ar)}

    var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, d = Math.hypot(dx, dy);

    if (ptr.joy) { var m = Math.min(d, 52), k = d ? m / d : 0; knob.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)'; var mag = Math.min(1, d / 52); joyV = { x: d ? dx / d * mag : 0, y: d ? dy / d * mag : 0 }; }
  });
  function up(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.joy && performance.now() - ptr.t < 400) tapMove(e.clientX, e.clientY);
    ptr = null; joyV = null; joy.classList.remove('on'); knob.style.transform = '';
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}
var ray = null;
function tapMove(cx, cy) {
  if (!ray) ray = new THREE.Raycaster();
  var nd = new THREE.Vector2(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  ray.setFromCamera(nd, camera);
  /* tap a crew member → walk to them */
  var hit = ray.intersectObjects(CREWM.map(function (s) { return s.mesh; }));
  if (hit.length) { var s = CREWM.filter(function (x) { return x.mesh === hit[0].object; })[0]; travel = null; moveTarget = { x: s.ax, z: s.az, stuck: 0 }; markTap(cx, cy); hideHint(); return; }
  var pl = new THREE.Plane(V(0, 1, 0), 0), p = V(0, 0, 0);
  if (ray.ray.intersectPlane(pl, p)) { travel = null; moveTarget = { x: p.x, z: p.z, stuck: 0 }; markTap(cx, cy); hideHint(); }
}
function markTap(x, y) { var m = $('#tapmark'); m.style.left = x + 'px'; m.style.top = y + 'px'; if (G) G.fromTo(m, { scale: .3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: .6, ease: 'power2.out' }); }

/* ---------- start / play ---------- */
function play() {
  if (playing) return;
  audioInit();
  playing = true; lumiSay(false);
  try { $('#c').focus({ preventScroll: true }); } catch (e) {}
  var st = $('#start');
  if (G && !reduce) {
    G.to(st, { autoAlpha: 0, y: 30, duration: .45, ease: 'power2.in', onComplete: function () { st.hidden = true; } });
    G.to({ k: 0 }, { k: 1, duration: 1.6, ease: 'power2.inOut', onUpdate: function () { introK = this.targets()[0].k; } });
    G.fromTo('#hud', { autoAlpha: 0 }, { autoAlpha: 1, duration: .6, delay: .8, onStart: function () { $('#hud').classList.add('on'); } });
    G.from('.toprow > *, .tools > *', { y: -30, opacity: 0, stagger: .06, duration: .5, delay: .9, ease: 'back.out(2)' });
    G.from('.bottom > *', { y: 40, opacity: 0, stagger: .08, duration: .5, delay: 1.1, ease: 'back.out(2)' });
  } else { st.hidden = true; introK = 1; $('#hud').classList.add('on'); }
  setTimeout(function () { lumiSay(true); L.vy = 7; L.ground = false; sfx('hi'); }, 900);
  setTimeout(function () { if (world.lumiBubOn) lumiSay(false); }, 6500);
  paintNext();
}

/* ---------- language ---------- */
function setLang(l) {
  lang = l; try { localStorage.setItem('lumio_lang', l); } catch (e) {}
  paintStatic();
  if (mode === 'page') { var y = window.pageYOffset; renderPage(); window.scrollTo(0, y); }
  if (world && world !== true) {
    redrawSigns(); CREWM.forEach(paintBubble);
    if (world.lumiBubOn) lumiSay(true);
    if (cardOpen) { var c = cardOpen; cardOpen = null; openCard(c.type, c.arg, c.station); }
    paintNext();
  }
}

/* ---------- boot ---------- */
paintStatic();
$('#bLang').onclick = function () { setLang(lang === 'ar' ? 'en' : 'ar'); };
$('#bPlans').onclick = function () { if (mode === 'game' && playing) { audioInit(); openCard('pricing', null, null); } else if (mode === 'page') { var el = $('#p-pricing'); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); } else showPage('p-pricing'); };
$('#brand').onclick = function (e) { e.preventDefault(); if (mode === 'page') { if (canGame && !reduce) showGame(); else window.scrollTo(0, 0); } else if (cardOpen) closeCard(); };
$('#skipB').onclick = function (e) { e.preventDefault(); showPage('p-pricing'); };
$('#playB').onclick = play;
$('#tPage').onclick = function () { showPage(null); };
$('#tSound').onclick = function () { sfxOn = !sfxOn; this.setAttribute('aria-pressed', String(sfxOn)); audioInit(); sfx('tick'); };
$('#tMusic').onclick = function () {
  musicOn = !musicOn; this.setAttribute('aria-pressed', String(musicOn));
  if (!music) { music = new Audio('../assets/sfx/music-games.mp3'); music.loop = true; music.volume = .22; }
  if (musicOn) { var p = music.play(); if (p && p.catch) p.catch(function () {}); } else music.pause();
};
$('#nextB').onclick = function () { audioInit(); travelTo(nextStation()); };

function hideLoader() { var ld = $('#loader'); if (G && !reduce) G.to(ld, { autoAlpha: 0, duration: .5, onComplete: function () { ld.remove(); } }); else ld.remove(); }
var hash = (location.hash || '').replace('#', '');
if (!canGame || reduce || hash === 'page' || hash === 'plans' || hash === 'pricing') {
  showPage(hash === 'plans' || hash === 'pricing' ? 'p-pricing' : null); hideLoader();
} else {
  try {
    initWorld(); startLoop();
    if (G && !reduce) {
      G.from('.sc > *', { y: 30, opacity: 0, duration: .7, stagger: .07, delay: .3, ease: 'power3.out' });
    }
    setTimeout(function () { if (!playing) lumiSay(true); }, 1400);
    hideLoader();
  } catch (err) {
    console.warn('Lumio game: falling back to the page version', err);
    canGame = false; showPage(null); hideLoader();
  }
}
})();
</script>
