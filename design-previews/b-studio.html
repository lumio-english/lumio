<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumio · Learning Studio</title>
<meta name="description" content="Design preview, Direction B: Learning Studio, an app-style bento dashboard for Lumio English students.">
<link rel="icon" href="../assets/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@500;600;700;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFAF5; --bg2:#FFF6EF; --surface:#FFFFFF; --surface2:#FFF6EF; --surface3:#FFEEDF;
  --ink:#1A1410; --ink2:#3B302A; --muted:#6E6159; --line:rgba(60,35,20,.09); --line2:rgba(60,35,20,.14);
  --accent:#F97316; --accent2:#EA580C; --deep:#C2410C; --soft:#FFEDD5; --soft2:#FFF4EA;
  --ok:#15803D; --okSoft:#DCFCE7; --warn:#B45309; --warnSoft:#FEF3C7; --bad:#B91C1C; --badSoft:#FEE2E2;
  --slate:#475569;
  --shadow:0 1px 2px rgba(120,60,20,.05), 0 10px 30px -12px rgba(194,65,12,.16);
  --shadowHi:0 2px 4px rgba(120,60,20,.06), 0 22px 44px -18px rgba(194,65,12,.30);
  --r:28px; --rs:18px; --rx:14px;
  --hero:linear-gradient(135deg,#FFF3E8 0%,#FFE3C8 55%,#FFD3AE 100%);
  --side:#FFFFFF;
  --ring-track:rgba(249,115,22,.14);
  --display:"Bricolage Grotesque", ui-rounded, "Nunito", system-ui, sans-serif;
  --body:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ar:"Tajawal", "Noto Naskh Arabic", system-ui, sans-serif;
  color-scheme: light;
}
body[data-theme="teen"]{
  --bg:#0B1226; --bg2:#0E1630; --surface:rgba(20,30,62,.78); --surface2:rgba(255,255,255,.045); --surface3:rgba(255,255,255,.08);
  --ink:#F5F7FF; --ink2:#DCE3F7; --muted:#A3AFD2; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --accent:#FB8A3C; --accent2:#F97316; --deep:#FDBA74; --soft:rgba(249,115,22,.16); --soft2:rgba(249,115,22,.08);
  --ok:#4ADE80; --okSoft:rgba(74,222,128,.13); --warn:#FCD34D; --warnSoft:rgba(252,211,77,.12); --bad:#FCA5A5; --badSoft:rgba(248,113,113,.14);
  --slate:#93A4D6;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -20px rgba(0,0,0,.6);
  --shadowHi:0 1px 0 rgba(255,255,255,.06) inset, 0 24px 50px -18px rgba(249,115,22,.28);
  --r:24px;
  --hero:radial-gradient(120% 140% at 85% 30%, rgba(249,115,22,.30) 0%, rgba(249,115,22,0) 48%), linear-gradient(135deg,#16224A 0%,#0F1836 100%);
  --side:#0A1022;
  --ring-track:rgba(255,255,255,.08);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .4s}
body[data-theme="teen"]{background:radial-gradient(900px 600px at 80% -10%, rgba(249,115,22,.10), transparent 60%), #0B1226;background-attachment:fixed}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.1}
p{margin:0}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* preview strip */
.strip{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 16px;font-size:12.5px;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:30}
.strip b{color:var(--ink);font-weight:800}
.strip nav{display:flex;gap:4px;flex-wrap:nowrap}
.strip nav a{text-decoration:none;padding:4px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.strip nav a[aria-current]{background:var(--soft);color:var(--deep)}
.strip nav a:hover{background:var(--surface3)}

/* layout */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{position:sticky;top:0;height:100vh;padding:22px 16px 18px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand img{height:34px;width:auto}
.brand span{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:0}
.navlabel{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:14px;font-weight:700;font-size:15px;color:var(--ink2);text-align:left;position:relative;transition:background .2s,color .2s}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--soft);color:var(--deep)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;font-weight:800}
.nav .sw{margin-left:auto}
.side .foot{margin-top:auto;padding-top:14px}
.sidecard{margin:10px 4px 0;padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sidecard img{width:44px;height:44px;object-fit:contain}
.sidecard p{font-size:13px;color:var(--muted);font-weight:600}
.sidecard b{display:block;color:var(--ink);font-size:14px}

.main{min-width:0;padding:26px 40px 90px;max-width:1220px;width:100%}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;grid-template-areas:"greet status actions av";align-items:center;gap:18px;margin-bottom:26px}
.greet{grid-area:greet;min-width:0}
.top .avatarbtn{grid-area:av}
.greet .hello{font-size:14px;color:var(--muted);font-weight:700}
.greet h1{font-size:34px;font-weight:800;margin-top:2px}
.greet .sub{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:4px}
.status{grid-area:status;display:flex;gap:8px}
.actions{grid-area:actions;display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.pill .ico{font-size:16px}
.pill.or{background:var(--soft);color:var(--deep);border-color:transparent;box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;box-shadow:var(--shadow)}
.iconbtn .dot{position:absolute;top:7px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.avatarbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--soft);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent);overflow:hidden}
.avatarbtn img{width:100%;height:100%;object-fit:cover}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.seg button{position:relative;z-index:1;min-height:36px;padding:0 13px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff}
.seg .knob{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:999px;background:linear-gradient(180deg,#F97316,#D9480F);box-shadow:0 4px 12px -4px rgba(234,88,12,.6)}

/* views */
.view[hidden]{display:none}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 18px;flex-wrap:wrap}
.vhead h2{font-size:28px;font-weight:800}
.vhead p{color:var(--muted);font-weight:600;font-size:14.5px;margin-top:4px}
.vhead .ar{font-size:14px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s-12{grid-column:span 12}.s-8{grid-column:span 8}.s-7{grid-column:span 7}.s-6{grid-column:span 6}.s-5{grid-column:span 5}.s-4{grid-column:span 4}.s-3{grid-column:span 3}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);min-width:0;overflow:hidden;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow .fn{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:700;font-size:12px;color:var(--muted);opacity:.8}
.tt{font-size:22px;font-weight:800;margin-top:8px}
.cap{font-size:13.5px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:15px;font-weight:800;font-size:15px;white-space:nowrap;transition:transform .15s, box-shadow .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#F3680E,#C9450C);color:#fff;box-shadow:0 8px 20px -8px rgba(234,88,12,.7), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover{box-shadow:0 12px 26px -8px rgba(234,88,12,.85), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sec{background:var(--surface2);border:1px solid var(--line2);color:var(--ink)}
.btn.sec:hover{background:var(--surface3)}
.btn.soft{background:var(--soft);color:var(--deep)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:13px}
.btn[disabled],.btn.locked{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.or{background:var(--soft);color:var(--deep);border-color:transparent}
.chip svg.i{width:14px;height:14px}

/* hero */
.hero{background:var(--hero);border-color:transparent;padding:30px 30px 28px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;align-items:center;min-height:300px}
body[data-theme="teen"] .hero{border:1px solid rgba(249,115,22,.22)}
.hero .lvl{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--deep);background:rgba(255,255,255,.6);padding:6px 12px;border-radius:999px}
body[data-theme="teen"] .hero .lvl{background:rgba(249,115,22,.14)}
.hero h2{font-size:44px;font-weight:800;margin-top:14px;letter-spacing:-.035em}
.hero h2 em{font-style:normal;color:var(--deep)}
.hero .meta{margin-top:18px;max-width:430px}
.bar{height:12px;border-radius:999px;background:rgba(194,65,12,.12);overflow:hidden;position:relative}
body[data-theme="teen"] .bar{background:rgba(255,255,255,.09)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FDBA74,#F97316 60%,#EA580C);box-shadow:0 0 12px rgba(249,115,22,.5)}
.barlab{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:8px}
.barlab span:last-child{color:var(--deep)}
.hero .stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.7);border-radius:16px;padding:9px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
body[data-theme="teen"] .hero .stat{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.hero .stat b{font-family:var(--display);font-size:20px}
.badge3d{position:relative;width:260px;height:260px;justify-self:end}
.badge3d canvas{width:100%!important;height:100%!important;display:block}
.badge3d .fb{position:absolute;inset:0;display:none}
.badge3d.nogl .fb{display:block}
.badge3d .cap3d{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}

/* mission */
.mission{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface),var(--surface))}
.mission .mascot{position:absolute;right:-8px;bottom:-6px;width:128px;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(194,65,12,.18))}
.mission .steps{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mstep{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--muted);min-height:30px}
.mstep .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:900;background:var(--surface2);border:1px solid var(--line2)}
.mstep.on{color:var(--ink)}
.mstep.on .n{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 0 0 5px var(--soft)}
.mission .cta{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 96px)}

/* trail */
.trail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:18px;position:relative}
.tnode{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px}
.tnode .dotw{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line2);position:relative;z-index:1}
.tnode.done .dotw{background:var(--okSoft);border-color:transparent}
.tnode.now .dotw{background:var(--soft);border-color:var(--accent)}
.tnode .dotw .lt{width:56px;height:56px}
.tnode .dotw svg.i{width:26px;height:26px}
.tnode.now .dotw svg.i{color:var(--deep)}
.tnode b{font-size:15px;font-weight:800}
.tnode .cap{font-size:12.5px}
.trail::before{content:"";position:absolute;top:32px;left:16.6%;right:16.6%;height:3px;background:repeating-linear-gradient(90deg,var(--line2) 0 8px,transparent 8px 14px);z-index:0}
.trail .prog{position:absolute;top:32px;left:16.6%;height:3px;width:0;background:var(--accent);z-index:0;border-radius:3px}
.mini-ring{position:absolute;inset:-5px;width:74px;height:74px;transform:rotate(-90deg)}

/* activity grid */
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.act{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:800;font-size:14px;text-align:left;transition:background .2s,border-color .2s}
.act:hover{border-color:var(--accent)}
.act .ai{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface);flex:none;color:var(--deep);position:relative}
.act.done .ai{background:var(--okSoft);color:var(--ok)}
.act .ai .lt{position:absolute;inset:-4px}
.act small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.act.next{border-color:var(--accent);background:var(--soft2)}

.hwgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hwc{border-radius:18px;padding:14px;background:var(--surface2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;transition:border-color .2s}
.hwc:hover{border-color:var(--accent)}
.hwc .ai{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--deep)}
.hwc b{font-size:15px}
.hwc small{font-size:12px;color:var(--muted);font-weight:700;display:block}

/* files */
.files{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.file{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);text-align:left;min-height:68px;transition:border-color .2s}
.file:hover{border-color:var(--accent)}
.file .fi{width:40px;height:46px;border-radius:9px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;color:var(--deep);position:relative;flex:none}
.file .fi::after{content:"PDF";position:absolute;bottom:-6px;right:-8px;font-size:9px;font-weight:900;background:var(--accent);color:#fff;padding:1px 4px;border-radius:5px}
.file b{font-size:14.5px;display:block}
.file small{font-size:12px;color:var(--muted);font-weight:700}
.file .dl{margin-left:auto;color:var(--muted)}

/* next class */
.nextc .when{font-family:var(--display);font-size:30px;font-weight:800;margin-top:10px;letter-spacing:-.03em}
.nextc .tz{font-weight:700;color:var(--muted);font-size:14px;margin-top:4px}
.teach{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.tav{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:linear-gradient(135deg,#FDBA74,#EA580C);font-size:19px;flex:none}
.tav.b{background:linear-gradient(135deg,#93C5FD,#4F46E5)}
.tav.c{background:linear-gradient(135deg,#86EFAC,#059669)}
.lockline{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--warn);background:var(--warnSoft);padding:9px 12px;border-radius:12px;margin-top:12px}

/* unlocked */
.unl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.ucard{border-radius:20px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;transition:transform .2s}
.ucard .cov{aspect-ratio:16/8;background:var(--soft);overflow:hidden;position:relative}
.ucard .cov img{width:100%;height:100%;object-fit:cover}
.ucard .cov .tag{position:absolute;left:10px;top:10px}
.ucard .bd{padding:12px 14px 14px}
.ucard b{font-size:15px;display:block}
.parts{display:flex;gap:5px;margin-top:8px}
.parts i{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.parts i.on{background:var(--accent)}

/* streak */
.streak{display:flex;flex-direction:column}
.streak .flame{width:96px;height:96px;margin:-6px 0 -8px -10px}
.bigN{font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:-.04em;line-height:1}
.bigN small{font-size:18px;color:var(--muted);letter-spacing:0;font-weight:700;margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.week span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--muted)}
.week span i{width:30px;height:30px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:14px}
.week span.on i{background:linear-gradient(180deg,#FDBA74,#F97316);border-color:transparent;color:#fff}
.week span.today i{box-shadow:0 0 0 3px var(--soft);border:2px dashed var(--accent);background:var(--surface)}

/* rings */
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.rcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 18px 22px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--ring-track);stroke-width:13}
.ring .fl{fill:none;stroke:url(#gOr);stroke-width:13;stroke-linecap:round}
body[data-theme="teen"] .ring .fl{filter:drop-shadow(0 0 6px rgba(249,115,22,.55))}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.04em}
.ring .val small{font-size:17px}
.rcard h3{font-size:17px;font-weight:800;margin-top:8px}
.rcard .cap{font-size:13px}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tot{padding:16px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.tot .bigN{font-size:40px}
.tot .cap{margin-top:4px}

.chart{display:flex;align-items:flex-end;gap:26px;height:190px;margin-top:22px;padding:0 6px;border-bottom:1px solid var(--line2);position:relative}
.chart .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);font-weight:700}
.cgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative;z-index:1}
.cbars{display:flex;gap:6px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cb{width:min(34px,38%);border-radius:9px 9px 4px 4px;position:relative;transform-origin:bottom}
.cb.p{background:linear-gradient(180deg,#FB923C,#EA580C)}
.cb.h{background:var(--slate)}
.cb.todo{background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 10px);border:1px dashed var(--line2)}
.cb span{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}
.clab{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:-28px;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:13px;font-weight:700;color:var(--muted);margin-top:38px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* map */
.mapwrap{position:relative;height:340px;margin-top:14px;border-radius:20px;background:radial-gradient(80% 90% at 50% 40%, var(--soft2), transparent 70%)}
.mapwrap canvas{width:100%!important;height:100%!important;display:block;border-radius:20px}
.mapwrap .fb{display:none}
.mapwrap.nogl canvas{display:none}
.mapwrap.nogl .fb{display:grid}
.mapfb{position:absolute;inset:0;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px;transform:perspective(700px) rotateX(38deg);transform-origin:50% 70%}
.mapfb i{border-radius:14px;background:var(--surface3);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px;color:var(--muted)}
.mapfb i.done{background:linear-gradient(180deg,#FDBA74,#F97316);color:#fff}
.mapfb i.now{background:var(--surface);border:3px solid var(--accent);color:var(--deep)}
.maplegend{position:absolute;left:14px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.maplist{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;max-height:340px;overflow:auto}
.maplist li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.maplist li .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--surface2);border:1px solid var(--line2);flex:none}
.maplist li.done .n{background:var(--accent);color:#fff;border-color:transparent}
.maplist li.now .n{background:var(--soft);color:var(--deep);border-color:var(--accent)}
.maplist li.lock{color:var(--muted)}

.lvlcol{display:flex;flex-direction:column;gap:20px}
.lockcard{display:flex;gap:14px;align-items:flex-start}
.lockcard .li{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);flex:none}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* lessons */
.filt{display:inline-flex;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);position:relative}
.filt button{position:relative;z-index:1;min-height:38px;padding:0 16px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.filt button[aria-pressed="true"]{color:var(--ink)}
.filt .knob{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:11px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid var(--line)}
body[data-theme="teen"] .filt .knob{background:rgba(255,255,255,.1)}
.lhead,.lrow{display:grid;grid-template-columns:48px minmax(0,1.6fr) 1.1fr 1.4fr .6fr .9fr 44px;align-items:center;gap:14px}
.lhead{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 16px 10px;margin-top:18px;border-bottom:1px solid var(--line)}
.lesson{border-bottom:1px solid var(--line)}
.lrow{width:100%;min-height:76px;padding:12px 16px;text-align:left;border-radius:18px;transition:background .2s}
.lrow:hover{background:var(--surface2)}
.lesson.open .lrow{background:var(--surface2)}
.lnum{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface2);border:1px solid var(--line2);position:relative}
.lesson.fin .lnum{background:linear-gradient(180deg,#FDBA74,#F97316);color:#fff;border-color:transparent}
.lesson.now .lnum{border:2px solid var(--accent);color:var(--deep);background:var(--soft)}
.lnum .lt{position:absolute;inset:-20px;pointer-events:none}
.ltitle b{display:block;font-size:16px;font-weight:800}
.ltitle small{font-size:12.5px;color:var(--muted);font-weight:700}
.stars{color:#F59E0B;letter-spacing:1px;font-size:15px}
.stars .off{color:var(--line2)}
.mbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.mbar .bar{height:7px;flex:1;max-width:80px}
.grade{font-family:var(--display);font-weight:800;font-size:20px}
.chev{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:transform .3s}
.lesson.open .chev{transform:rotate(180deg)}
.ldetail{overflow:hidden;height:0}
.ldetail .in{padding:6px 16px 20px 78px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.comment{padding:14px 16px;border-radius:16px;background:var(--soft2);border:1px solid var(--line);font-weight:700;font-size:14.5px;position:relative}
.comment small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.facts{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.facts div{display:flex;align-items:center;gap:8px}
.lbtns{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.mobstat{display:none}

/* classes */
.ulist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.uitem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.date{width:54px;height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date small{font-size:11px;font-weight:900;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em}
.date b{font-family:var(--display);font-size:22px;line-height:1}
.uitem .grow b{display:block;font-size:15px}
.uitem .grow small{font-size:12.5px;color:var(--muted);font-weight:700;display:block}
.stepper{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.stp h4{font-family:var(--body);font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.stp h4 .n{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--deep);display:grid;place-items:center;font-size:12px}
.opts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.opts::-webkit-scrollbar{display:none}
.opt{min-height:44px;padding:6px 14px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--line2);font-weight:800;font-size:14px;white-space:nowrap;text-align:center;flex:none;transition:border-color .2s, background .2s}
.opt small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--deep)}
.opt:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--surface2);border:1.5px solid var(--line2);text-align:left}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--soft2)}
.tcard b{font-size:14.5px}
.tcard small{font-size:12px;color:var(--muted);font-weight:700}
.seats{display:flex;gap:3px}
.seats i{width:12px;height:12px;border-radius:4px;background:var(--accent)}
.seats i.f{background:var(--line2)}
.rules{display:flex;gap:6px;flex-wrap:wrap}
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:16px}
.sched .day{display:flex;flex-direction:column;gap:6px}
.sched .day > b{font-size:12.5px;text-align:center;color:var(--muted);font-weight:900}
.sched .opt{width:100%;padding:6px 4px}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.swrow{display:flex;align-items:center;gap:12px;min-height:48px}
.rate{display:flex;gap:6px;margin-top:14px}
.rate button{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--line2)}
.rate button svg{width:26px;height:26px;fill:currentColor;stroke:none}
.rate button.on{color:#F59E0B;background:var(--warnSoft);border-color:transparent}

/* hub */
.hubfeat{display:flex;flex-direction:column;gap:14px}
.hubhead{display:flex;align-items:center;gap:14px}
.hubic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;font-size:24px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game{padding:14px 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);text-align:left;font-weight:800;font-size:14.5px;display:flex;flex-direction:column;gap:8px;min-height:96px;transition:border-color .2s}
.game:hover{border-color:var(--accent)}
.game .e{font-size:26px}
.hubsmall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.hcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:22px;transition:border-color .2s}
.hcard b{font-family:var(--display);font-size:19px;font-weight:800}
.hcard .cap{font-size:13px}
.prompt{padding:14px 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:800}
.prompt .ar{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;min-height:46px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-weight:700}
.answer input:focus{outline:none;border-color:var(--accent)}

/* rewards */
.points{background:var(--hero);border-color:transparent}
body[data-theme="teen"] .points{border:1px solid rgba(249,115,22,.22)}
.points .bigN{font-size:64px}
.redeem{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-top:16px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)}
.bdg .md{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(180deg,#FFE7D1,#FDBA74);box-shadow:inset 0 -4px 0 rgba(194,65,12,.25), 0 8px 16px -8px rgba(234,88,12,.6)}
.bdg.off .md{background:var(--surface3);box-shadow:none;filter:grayscale(1);opacity:.55}
.bdg b{font-size:13.5px;line-height:1.2}
.bdg small{font-size:11.5px;font-weight:700;color:var(--muted)}
.bdg .bar{height:5px;width:70%}
.crew{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}
.buddy{border-radius:20px;background:var(--surface2);border:1px solid var(--line);padding:12px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.buddy .ph{height:110px;display:flex;align-items:flex-end;justify-content:center}
.buddy img{max-height:110px;width:auto}
.buddy b{font-size:14.5px}
.buddy small{font-size:12px;color:var(--muted);font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,10,5,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:60;opacity:0;visibility:hidden}
body[data-theme="teen"] .scrim{background:rgba(2,5,15,.6)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:61;background:var(--bg);border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateX(105%);visibility:hidden}
body[data-theme="teen"] .drawer{background:#0D1530}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 22px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:20px;flex:1}
.dtabs{display:flex;gap:6px;padding:12px 22px 0}
.dtabs button{min-height:40px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.dtabs button[aria-pressed="true"]{background:var(--soft);color:var(--deep)}
.dbody{overflow-y:auto;padding:18px 22px 40px;flex:1;overscroll-behavior:contain}
.dsec{margin-bottom:26px}
.dsec > h3{font-size:12px;font-family:var(--body);font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.pcard{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--hero)}
.pav{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--surface);box-shadow:0 0 0 4px var(--accent);overflow:hidden;flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.pcard h3{font-size:24px}
.pcard p{font-weight:700;color:var(--muted);font-size:14px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.avs button{aspect-ratio:1;border-radius:16px;background:var(--surface2);border:2px solid var(--line);font-size:26px;display:grid;place-items:center;overflow:hidden;min-height:44px}
.avs button img{width:100%;height:100%;object-fit:cover;object-position:top}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{padding:12px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.field small{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field b{font-size:15.5px}
.lst{border-radius:18px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.li2{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li2:last-child{border-bottom:0}
button.li2:hover{background:var(--surface3)}
.li2 .lic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--deep);flex:none;border:1px solid var(--line)}
.li2 .grow b{display:block;font-size:14.5px}
.li2 .grow small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.li2 .unread{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.ref{padding:16px;border-radius:20px;background:var(--soft2);border:1px dashed var(--accent)}
.code{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em}

/* tab bar (phone) */
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:90;background:#1A1410;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:14px;box-shadow:0 16px 40px -10px rgba(0,0,0,.4);pointer-events:none;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
body[data-theme="teen"] .toast{background:#F5F7FF;color:#0B1226}
.toast .tag{font-size:11px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:7px}
.confetti{position:fixed;inset:0;z-index:95;pointer-events:none;display:grid;place-items:center;visibility:hidden}
.confetti div{width:min(90vmin,640px);height:min(90vmin,640px)}

/* responsive */
@media (max-width:1240px){
  .main{padding:24px 28px 90px}
  .hero{grid-template-columns:minmax(0,1fr) 220px}
  .badge3d{width:220px;height:220px}
  .badges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rings .ring{width:130px;height:130px}
}
@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));margin:0 auto}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .s-12,.s-8,.s-7{grid-column:span 2}.s-6,.s-5,.s-4,.s-3{grid-column:span 1}
  .rings{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .hubsmall{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
  body[data-theme="teen"] .tabbar{background:rgba(11,18,38,.86)}
  .tabbar .tk{position:absolute;top:8px;height:56px;left:0;border-radius:18px;background:var(--soft)}
  .tabbar button{position:relative;z-index:1;flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:18px}
  .tabbar button[aria-current="page"]{color:var(--deep)}
  .tabbar svg.i{width:23px;height:23px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .top{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av greet actions" "status status status";gap:12px 12px;margin-bottom:18px}
  .top .avatarbtn{grid-area:av}
  .greet h1{font-size:24px}
  .greet .hello{font-size:12.5px}
  .greet .sub{display:none}
  .status{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
  .status::-webkit-scrollbar{display:none}
  .status .pill{height:36px;font-size:13px;box-shadow:none}
  .drawer{width:100%;border-left:0;border-radius:0;transform:translateY(105%)}
  .dhead{padding-top:calc(12px + env(safe-area-inset-top))}
}
@media (max-width:759px){
  .strip .long{display:none}
  .bento{grid-template-columns:minmax(0,1fr)}
  .s-12,.s-8,.s-7,.s-6,.s-5,.s-4,.s-3{grid-column:1/-1}
  .tile{padding:20px;border-radius:24px}
  .vhead h2{font-size:24px}
  .hero{grid-template-columns:minmax(0,1fr);padding:16px 20px 22px;min-height:0}
  .badge3d{width:100%;height:200px;justify-self:stretch;order:-1;margin-bottom:-4px}
  .hero h2{font-size:32px;margin-top:10px}
  .hero .stats{margin-top:16px}
  .hero .stat{padding:8px 12px}
  .mission .mascot{width:104px}
  .mission .cta{max-width:calc(100% - 80px)}
  .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .files{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .file{flex-direction:column;align-items:flex-start;gap:10px}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
 const t=$('#toast'); t.innerHTML=`<span class="tag">Preview</span>${msg} — preview only`;
 clearTimeout(toastT);
 if(HAS_G&&!RM){ gsap.killTweensOf(t); gsap.fromTo(t,{y:30,opacity:0,x:'-50%'},{y:0,opacity:1,x:'-50%',duration:.35,ease:'back.out(1.6)'}); }
 else { t.style.opacity=1; t.style.transform='translate(-50%,0)'; }
 toastT=setTimeout(()=>{ if(HAS_G&&!RM) gsap.to(t,{y:30,opacity:0,duration:.3}); else t.style.opacity=0; },2000);
}

/* ---------- lottie ---------- */
const anims={};
function lotInit(root,key){
 (anims[key]||[]).forEach(a=>{try{a.destroy()}catch(e){}}); anims[key]=[];
 if(!window.lottie) return;
 $$('[data-lot]',root).forEach(el=>{
  el.innerHTML='';
  const a=lottie.loadAnimation({container:el,renderer:'svg',loop:!!el.dataset.loop,autoplay:false,path:'../assets/lottie/'+el.dataset.lot+'.json',rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
  a.addEventListener('DOMLoaded',()=>{ if(RM) a.goToAndStop(a.totalFrames-1,true); else if(el.dataset.lot!=='star-pop') setTimeout(()=>a.play(), 300+Math.random()*400); else a.goToAndStop(a.totalFrames-1,true); });
  el._a=a; anims[key].push(a);
 });
}
let confA=null;
function confetti(){
 const box=$('#confetti');
 if(!window.lottie||RM){ return; }
 if(!confA){ confA=lottie.loadAnimation({container:$('#confettiBox'),renderer:'svg',loop:false,autoplay:false,path:'../assets/lottie/confetti.json'}); confA.addEventListener('complete',()=>{box.style.visibility='hidden'}); }
 box.style.visibility='visible'; confA.goToAndPlay(0,true);
}

/* ---------- motion ---------- */
function countUps(root){
 $$('.cu',root).forEach(el=>{
  const to=+el.dataset.to, suf=el.dataset.suf||'';
  if(!HAS_G||RM){ el.textContent=to+suf; return; }
  const o={v:0}; el.textContent='0'+suf;
  gsap.to(o,{v:to,duration:1.2,ease:'power2.out',delay:.25,onUpdate:()=>{el.textContent=Math.round(o.v)+suf}});
 });
}
function fills(root){
 $$('.bar i[data-w], .trail .prog[data-w]',root).forEach(el=>{
  const w=el.dataset.w+'%';
  if(!HAS_G||RM){ el.style.width=el.classList.contains('prog')?`calc(${66.8*el.dataset.w/100}%)`:w; return; }
  const target=el.classList.contains('prog')?(66.8*el.dataset.w/100)+'%':w;
  gsap.fromTo(el,{width:0},{width:target,duration:1.3,ease:'power3.out',delay:.3});
 });
 $$('.ring .fl',root).forEach(c=>{
  const C=326.7, p=+c.dataset.p;
  if(!HAS_G||RM){ c.style.strokeDashoffset=C*(1-p/100); return; }
  gsap.fromTo(c,{strokeDashoffset:C},{strokeDashoffset:C*(1-p/100),duration:1.6,ease:'power3.out',delay:.2});
 });
 $$('.mr',root).forEach(c=>{
  const C=213.6, p=+c.dataset.p;
  if(!HAS_G||RM) return;
  gsap.fromTo(c,{strokeDashoffset:C},{strokeDashoffset:C*(1-p/100),duration:1.4,ease:'power3.out',delay:.4});
 });
}
function chartBars(root){
 const bars=$$('.cb',root); if(!bars.length||!HAS_G||RM) return;
 gsap.set(bars,{scaleY:0});
 const go=()=>gsap.to(bars,{scaleY:1,duration:.9,ease:'power3.out',stagger:.08});
 if(window.ScrollTrigger) ScrollTrigger.create({trigger:$('.chart',root),start:'top 88%',once:true,onEnter:go}); else go();
}
function hoverLift(root){
 if(!HAS_G||RM||!HOVER) return;
 $$('.tile, .ucard, .game, .file, .hwc',root).forEach(t=>{
  t.addEventListener('mouseenter',()=>gsap.to(t,{y:-4,boxShadow:getComputedStyle(document.body).getPropertyValue('--shadowHi'),duration:.3,ease:'power2.out'}));
  t.addEventListener('mouseleave',()=>gsap.to(t,{y:0,boxShadow:getComputedStyle(document.body).getPropertyValue('--shadow'),duration:.35,ease:'power2.out'}));
 });
}
function enter(v){

 if(window.ScrollTrigger) ScrollTrigger.getAll().forEach(t=>t.kill());

 if(HAS_G&&!RM){
  gsap.fromTo(root,{opacity:0,y:10},{opacity:1,y:0,duration:.35,ease:'power2.out'});
  if(window.ScrollTrigger){
   gsap.set(tiles,{opacity:0,y:28});
   ScrollTrigger.batch(tiles,{start:'top 95%',once:true,onEnter:b=>gsap.to(b,{opacity:1,y:0,duration:.7,ease:'power3.out',stagger:.07,overwrite:true})});
   ScrollTrigger.refresh();
  } else gsap.fromTo(tiles,{opacity:0,y:28},{opacity:1,y:0,duration:.6,stagger:.06,ease:'power3.out'});
 }
 countUps(root); fills(root); chartBars(root);

function moveKnob(seg,anim=true){

}
function go(v,first){
 view=v;
 $$('.view').forEach(el=>el.hidden=el.dataset.view!==v);
 $$('[data-go]').forEach(b=>{ if(b.closest('.side,.tabbar')) { if(b.dataset.go===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }});

 enter(v);

}

const drawer=$('#drawer'), scrim=$('#scrim');
let lastFocus=null;
function isPhone(){ return innerWidth<1024; }
function openDrawer(sec,scrollId){
 lastFocus=document.activeElement;
 drawer.style.visibility='visible'; scrim.style.visibility='visible';
 const from=isPhone()?{y:'105%',x:0}:{x:'105%',y:0};
 if(HAS_G&&!RM){ gsap.fromTo(drawer,from,{x:0,y:0,duration:.5,ease:'power4.out'}); gsap.to(scrim,{opacity:1,duration:.3}); }
 else { drawer.style.transform='none'; scrim.style.opacity=1; }
 document.body.style.overflow='hidden';
 dTab(sec,scrollId);
 setTimeout(()=>$('#dClose').focus(),60);
}
function closeDrawer(){
 const to=isPhone()?{y:'105%'}:{x:'105%'};
 const done=()=>{drawer.style.visibility='hidden';scrim.style.visibility='hidden'};
 if(HAS_G&&!RM){ gsap.to(drawer,{...to,duration:.4,ease:'power3.in',onComplete:done}); gsap.to(scrim,{opacity:0,duration:.3}); }
 else { scrim.style.opacity=0; done(); }
 document.body.style.overflow='';
 if(lastFocus) lastFocus.focus();
}
function dTab(sec,scrollId){
 $$('.dtabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dt===sec)));
 $('#dTitle').textContent=sec==='messages'?'Messages':sec==='more'?'More':'My profile';
 const target=$('#'+(scrollId||'d-'+sec));
 const body=$('#dbody');
 if(target){ const top=target.offsetTop-body.offsetTop-8; if(HAS_G&&!RM&&drawer.style.visibility==='visible') body.scrollTo({top,behavior:'smooth'}); else body.scrollTop=top; }
 if(target&&HAS_G&&!RM) gsap.fromTo(target,{backgroundColor:'rgba(249,115,22,.10)'},{backgroundColor:'rgba(249,115,22,0)',duration:1.4,delay:.3,clearProps:'backgroundColor'});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button, [data-toast]'); if(!t) return;
 if(t.dataset.mode){ setMode(t.dataset.mode); return; }
 if(t.dataset.go){ go(t.dataset.go); if(drawer.style.visibility==='visible') closeDrawer(); return; }
