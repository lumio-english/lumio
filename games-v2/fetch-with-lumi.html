<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fetch with Lumi's Puppy — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Fetch: Lumi and her puppy in the park. Three things lie on the grass; the child listens and taps one.
     The puppy really runs over (bouncy gallop, dust puffs), sniffs it, and either carries it back
     to Lumi in its mouth or shakes its head and trots home. */
  .fw{width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .fw-ask{width:100%;max-width:620px;display:flex;justify-content:center}
  .fw-ask .lp-bubble .tail{left:40px}
  .fw-yard{position:relative;width:100%;flex:1;min-height:440px;height:calc(100dvh - var(--lp-hud-h) - 150px);max-height:760px}
  .fw-item{position:absolute;width:clamp(100px,29vw,200px);transform:translate(-50%,0)}
  .fw-item .lp-card{width:100%}
  .fw-item .lp-card .pic{margin:9px}
  .fw-item::after{content:"";position:absolute;left:12%;right:12%;bottom:-16px;height:18px;border-radius:50%;background:rgba(30,50,0,.32);filter:blur(5px);z-index:-1}
  .fw-item.taken::after{opacity:0}
  .fw-lumi{position:absolute;left:0;bottom:0;height:clamp(150px,34%,360px);z-index:3;pointer-events:none}
  .fw-lumi .lp-actor{height:100%}
  .fw-pup{position:absolute;left:58%;bottom:2%;height:clamp(110px,24%,230px);z-index:4;margin-left:-60px}
  .fw-pup .lp-actor{height:100%}
  .fw-pup .flip{height:100%;transform-origin:50% 100%}
  .fw-pup .carry{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1/1;margin-left:-23%;border-radius:16px;background:#fff;box-shadow:0 6px 12px -4px rgba(0,0,0,.45);
    opacity:0;transform:scale(.3);pointer-events:none;z-index:5;overflow:hidden}
  .fw-pup .carry img{width:100%;height:100%;object-fit:contain;padding:8%}
  .fw-dust{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(255,250,235,.85);pointer-events:none;z-index:6}
  .fw-heart{position:fixed;left:0;top:0;font-size:30px;pointer-events:none;z-index:7;color:#FF4D7A;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .fw-sniff{position:absolute;left:62%;top:2%;font-family:var(--lp-display);font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);opacity:0;white-space:nowrap}
  @media (min-width:900px){
    .fw-yard{max-width:1100px}
    .fw-lumi{left:2%;height:min(52%,420px)}
    .fw-pup{left:36%;height:min(30%,230px)}
    .fw-item{width:clamp(150px,15vw,210px)}
  }
  @media (max-height:720px) and (max-width:899px){ .fw-yard{min-height:400px} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="fw" id="stageWrap">
    <div class="fw-ask">
      <button class="lp-bubble" id="promptCard" type="button" aria-label="Hear it again">
        <span class="lp-speak" id="hearBtn" aria-hidden="true"></span>
        <span class="txt" id="promptText">Listen! Tap what Lumi's puppy wants!</span>
        <span class="tail"></span>
      </button>
    </div>
    <div class="fw-yard" id="yard">
      <div class="fw-lumi" id="lumiZone"></div>
      <div class="fw-pup" id="pup"><span class="fw-sniff" id="sniff">sniff sniff…</span></div>
    </div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "pre-a";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from"); // "lesson" (student solo) sends them back to the map instead of Present
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;
const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const ROUNDS = Math.min(6, vocab.length);

LP.init({ scene: { bg: "assets/lesson-bg-kid/park.jpg", pos: "50% 60%", particles: "leaves", tint: "linear-gradient(180deg,rgba(255,240,200,.06),rgba(20,60,0,.16))" },
  hud: { rounds: Math.max(1, ROUNDS), exitHref: backHref } });
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };
document.getElementById("hearBtn").innerHTML = LP.ICON.speaker;

// Words whose pictures show the same thing: never offered together, so there is only one right picture.
const SAME_PIC = [["hello", "hi"], ["hands", "clap"], ["dog", "puppy", "pet"], ["cat", "kitten"], ["big", "elephant"], ["small", "mouse"],
  ["happy", "great"], ["boy", "sad"], ["fine", "okay"], ["draw", "picture"], ["cousin", "brother"], ["clock", "hour", "minute", "o'clock"]];
const clash = (a, b) => a === b || SAME_PIC.some(g => g.includes(a.toLowerCase()) && g.includes(b.toLowerCase()));

const yard = document.getElementById("yard"), pupHost = document.getElementById("pup");
const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "point", cheer: "celebrate", oops: "surprised", alt: "Lumi" });
// the puppy is the game's real puppy picture (assets/vocab/dog.png), brought to life by the kit's actor
const flip = document.createElement("div"); flip.className = "flip"; pupHost.appendChild(flip);
const pup = LP.actor(flip, { poses: { sit: LP.vocabImg("dog") }, pose: "sit", cheer: "sit", oops: "sit", alt: "Lumi's puppy" });
const carry = document.createElement("div"); carry.className = "carry"; carry.innerHTML = '<img alt="">'; pup.el.appendChild(carry);
const G = window.gsap, MOVE = G && !LP.RM;

if (!vocab.length) {
  yard.innerHTML = "<p class='lp-panel' style='padding:24px;margin:20px'>No lesson data found.</p>";
} else {
  const order = Lumio.shuffle([...vocab]).slice(0, ROUNDS);
  let r = 0, score = 0, locked = true;
  const hearBtn = document.getElementById("hearBtn"), promptText = document.getElementById("promptText");
  let items = [];

  // Only the word is spoken: "Fetch the <word>!" was never recorded (404); every vocab word has its own clip.
  const playPrompt = () => { if (order[r]) LP.say(order[r].en, hearBtn); };

  const SPOTS = { 3: [[18, 38], [50, 31], [82, 40]], 2: [[30, 36], [70, 32]], 1: [[50, 34]] };
  async function drawRound() {
    locked = true; LP.answer = null; LP.round(r); lumi.set("point");
    items.forEach(i => i.remove()); items = [];
    const target = order[r];
    const pool = Lumio.shuffle(vocab.filter(v => !clash(v.en, target.en)));
    const picks = [target];
    for (const v of pool) { if (picks.length >= Math.min(3, vocab.length)) break; if (!picks.some(p => clash(p.en, v.en))) picks.push(v); }
    const opts = Lumio.shuffle(picks);
    const spots = SPOTS[opts.length] || SPOTS[3];
    opts.forEach((o, i) => {
      const wrap = document.createElement("div"); wrap.className = "fw-item";
      // laptop: Lumi stands on the left, so the things lie on the grass to her right
      const wide = innerWidth >= 900;
      wrap.style.left = (wide ? 36 + spots[i][0] * .6 : spots[i][0]) + "%"; wrap.style.top = (wide ? spots[i][1] - 6 : spots[i][1]) + "%";
      const c = LP.picCard(o.en, { label: false, aria: "Picture" }); c.dataset.en = o.en; c.classList.add("item-card");
      c.style.rotate = ((i - 1) * 4) + "deg";
      c.onclick = () => choose(c, wrap, target);
      wrap.appendChild(c); yard.appendChild(wrap); items.push(wrap);
    });
    promptText.textContent = "Listen! Tap what Lumi's puppy wants!";
    items.forEach(w => w.firstChild.style.opacity = 0);
    await LP.banner("Fetch!", "Round " + (r + 1) + " of " + ROUNDS);
    await LP.deal(items.map(w => w.firstChild), pupHost);
    lumi.nod(); pup.nod();
    locked = false;
    LP.answer = target.en;    // read by the automated play-through tests
    setTimeout(playPrompt, 200);
  }

  // ---------- the puppy run ----------
  const P = { x: 0, y: 0, dir: 1 };      // puppy offset from its home spot
  function dust() {
    if (!MOVE) return;
    const b = pupHost.getBoundingClientRect(), d = document.createElement("div"); d.className = "fw-dust";
    document.body.appendChild(d);
    G.fromTo(d, { x: b.left + b.width / 2 - P.dir * b.width * .3, y: b.bottom - 6, scale: .4, opacity: .9 },
      { x: "-=" + (P.dir * 20), y: "-=" + (10 + Math.random() * 14), scale: 1.6 + Math.random(), opacity: 0, duration: .6, ease: "power1.out", onComplete: () => d.remove() });
  }
  function runTo(x, y) {
    if (!MOVE) { P.x = x; P.y = y; G && G.set(pupHost, { x, y }); return Promise.resolve(); }
    const dist = Math.hypot(x - P.x, y - P.y); if (dist < 4) return Promise.resolve();
    P.dir = x >= P.x ? 1 : -1;
    G.to(flip, { scaleX: P.dir, duration: .12 });
    const dur = Math.max(.45, Math.min(1.1, dist / 650));
    LP.sfx("whoosh");
    // gallop: quick hops with a forward lean, squash on landing, dust behind the paws
    const hops = Math.max(2, Math.round(dur / .17));
    const gal = G.timeline();
    for (let i = 0; i < hops; i++) gal.to(pup.el, { y: -16, rotation: 7 * P.dir, scaleY: 1.05, duration: dur / hops / 2, ease: "power1.out" })
      .to(pup.el, { y: 0, rotation: 2 * P.dir, scaleY: .93, duration: dur / hops / 2, ease: "power1.in", onComplete: dust });
    gal.to(pup.el, { rotation: 0, scaleY: 1, duration: .25, ease: "elastic.out(1,.4)" });
    return new Promise(res => G.to(P, { x, y, duration: dur, ease: "power1.inOut", onUpdate: () => G.set(pupHost, { x: P.x, y: P.y }), onComplete: () => setTimeout(res, 120) }));
  }
  // where the puppy should stand to pick up an item (just under the card)
  function spotFor(wrap) {
    const h = pupHost.getBoundingClientRect(), c = wrap.getBoundingClientRect();
    const homeX = h.left - P.x, homeBottom = h.bottom - P.y;
    return { x: (c.left + c.width / 2) - (homeX + h.width / 2), y: Math.min(0, (c.bottom + h.height * .55) - homeBottom) };
  }
  async function sniff() {
    const s = document.getElementById("sniff");
    if (!MOVE) return;
    G.fromTo(s, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .2 });
    await new Promise(r => G.timeline({ onComplete: r }).to(pup.el, { rotation: 8, y: 6, duration: .14 }).to(pup.el, { rotation: -4, y: 2, duration: .14 }).to(pup.el, { rotation: 8, y: 6, duration: .14 }).to(pup.el, { rotation: 0, y: 0, duration: .2 }));
    G.to(s, { opacity: 0, duration: .2 });
  }
  function hearts() {
    if (!MOVE) return;
    const b = pupHost.getBoundingClientRect();
    for (let i = 0; i < 3; i++) {
      const h = document.createElement("div"); h.className = "fw-heart"; h.textContent = "♥"; document.body.appendChild(h);
      G.fromTo(h, { x: b.left + b.width * (.3 + i * .2), y: b.top + 10, scale: .3, opacity: 0 }, { y: "-=" + (60 + i * 20), x: "+=" + ((i - 1) * 24), scale: 1, opacity: 1, duration: .8, delay: i * .12, ease: "power2.out",
        onComplete: () => G.to(h, { opacity: 0, duration: .3, onComplete: () => h.remove() }) });
    }
  }

  async function choose(card, wrap, target) {
    if (locked || card.disabled) return;
    locked = true; LP.answer = null;
    const ok = card.dataset.en === target.en;
    LP.sfx("tap");
    const s = spotFor(wrap);
    await runTo(s.x, s.y);
    await sniff();
    if (ok) {
      // pick it up: the card shrinks into the puppy's mouth
      carry.querySelector("img").src = card.querySelector(".pic img") ? card.querySelector(".pic img").src : LP.vocabImg(card.dataset.en);
      if (MOVE) {
        const a = LP.center(card), b = LP.center(carry);
        await new Promise(res => G.to(card, { x: b.x - a.x, y: b.y - a.y, scale: .3, rotation: 0, duration: .3, ease: "power2.in", onComplete: res }));
      }
      card.style.visibility = "hidden"; wrap.classList.add("taken");
      if (MOVE) G.to(carry, { opacity: 1, scale: 1, duration: .25, ease: "back.out(3)" }); else { carry.style.opacity = 1; carry.style.transform = "none"; }
      LP.sfx("pop");
      LP.clear(items.map(w => w.firstChild).filter(c => c !== card));
      // trot back home with it, tail held high
      await runTo(0, 0);
      if (MOVE) G.to(flip, { scaleX: 1, duration: .15 });
      score++;
      LP.fill(r);
      lumi.cheer("celebrate", false); hearts(); pup.cheer();
      LP.say(target.en, hearBtn);
      promptText.innerHTML = `Good puppy! <q>${LP.esc(target.en)}</q>!`;
      await LP.good(pup.el);
      if (MOVE) await new Promise(res => G.to(carry, { opacity: 0, scale: .2, y: -30, duration: .35, ease: "power2.in", onComplete: res }));
      G && G.set(carry, { y: 0 }); carry.style.opacity = 0;
      pup.el.classList.remove("good");
      await LP.wait(300);
      r++;
      r < ROUNDS ? drawRound() : endGame();
    } else {
      // not that one: the puppy shakes its head and trots home; gentle, no penalty, try again
      LP.bad(card); lumi.oops("surprised", "point");
      if (MOVE) await new Promise(res => G.timeline({ onComplete: res }).to(pup.el, { rotation: -10, duration: .08 }).to(pup.el, { rotation: 10, duration: .1 }).to(pup.el, { rotation: -6, duration: .1 }).to(pup.el, { rotation: 0, duration: .25, ease: "elastic.out(1,.4)" }));
      card.disabled = true; card.classList.add("dim");
      await runTo(0, 0);
      if (MOVE) G.to(flip, { scaleX: 1, duration: .15 });
      locked = false; LP.answer = target.en;
      setTimeout(playPrompt, 150);
    }
  }

  function endGame() {
    LP.round(-1);
    LP.results({ score, total: ROUNDS, title: "Great job!", scoreLabel: "Fetched", note: `The puppy fetched ${score} out of ${ROUNDS}!`,
      actor: { char: "lumi", pose: "thumbs", cheer: "celebrate" }, exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Back" });
  }

  document.getElementById("promptCard").onclick = playPrompt;
  LP.title({ kicker: "Listen and fetch", title: "Fetch with Lumi", sub: "Listen, then tap what Lumi's puppy should fetch!", ar: "استمع واختر ما سيحضره الجرو",
    actor: { char: "lumi", pose: "point", cheer: "celebrate" } }).then(() => { pup.enter("bottom"); drawRound(); });
}
</script>
</body>
</html>
