<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memory Match — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Memory Match: Lumi deals a deck of Lumio cards onto a play mat. Cards flip in real 3D; a matched
     picture + word pair flies together, bursts, and lands on Lumi's pile. */
  .mm{width:100%;max-width:1220px;display:grid;grid-template-columns:1fr;gap:8px;justify-items:center;align-content:start}
  .mm-side{width:100%;max-width:420px;display:flex;align-items:flex-end;gap:8px;min-height:118px}
  .mm-host{position:relative;flex:none;height:118px;width:96px;display:flex;justify-content:center;align-items:flex-end}
  .mm-host .lp-actor{height:100%}
  .mm-say{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-bottom:14px}
  .mm-say .lp-bubble{padding:8px 14px 8px 8px;gap:8px}
  .mm-say .lp-bubble .lp-speak{width:42px;height:42px}
  .mm-say .lp-bubble .lp-speak svg{width:20px;height:20px}
  .mm-say .lp-bubble .txt{font-size:clamp(17px,4.4vw,22px)}
  .mm-say .lp-bubble .tail{left:-7px;bottom:16px}
  .mm-tray{position:relative;flex:none;width:74px;height:92px;margin-bottom:12px}
  .mm-tray .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-family:var(--lp-display);font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
  .mm-mini{position:absolute;inset:0;border-radius:12px;overflow:hidden}

  /* play mat */
  .mm-mat{position:relative;width:100%;max-width:min(560px,calc((100dvh - 262px) * .6 + 26px));padding:12px;border-radius:28px;
    background:linear-gradient(180deg,rgba(255,250,240,.55),rgba(255,236,206,.42));border:2px solid rgba(255,255,255,.75);
    box-shadow:0 30px 60px -30px rgba(60,30,5,.75),inset 0 2px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2)}
  html[data-lp="teen"] .mm-mat{background:linear-gradient(180deg,rgba(18,22,48,.62),rgba(10,12,30,.7));border:1px solid rgba(150,160,255,.22);box-shadow:0 30px 70px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
  .mm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

  /* the 3D card */
  .mm-card{position:relative;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:4/5;perspective:1000px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
  .mm-card[disabled]{cursor:default}
  .mm-card::before{content:"";position:absolute;inset:4px;border-radius:16px;border:2.5px dashed rgba(255,255,255,.75);opacity:0;transition:opacity .4s}
  html[data-lp="teen"] .mm-card::before{border-color:rgba(160,170,255,.35)}
  .mm-card.gone::before{opacity:1}
  .mm-in{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .mm-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .mm-front{transform:rotateY(180deg);background:#fff;box-shadow:0 5px 0 #EBD3B0,0 16px 22px -12px rgba(60,30,5,.6);display:grid;place-items:center}
  html[data-lp="teen"] .mm-front{background:linear-gradient(180deg,#232a55,#161b3b);box-shadow:0 0 0 1px rgba(150,160,255,.3),0 18px 26px -14px rgba(0,0,0,.9)}
  .mm-front .plate{position:absolute;inset:7px;border-radius:13px;background:radial-gradient(90% 80% at 50% 35%,#FFFDF8,#FFEFD6);display:grid;place-items:center;overflow:hidden}
  html[data-lp="teen"] .mm-front .plate{background:radial-gradient(90% 80% at 50% 35%,#F7F8FF,#DCE2F7)}
  .mm-front .plate img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(60,30,5,.2))}
  .mm-front .emo{font-size:clamp(40px,12vw,72px);line-height:1}
  .mm-front.word{background:linear-gradient(160deg,#FFF8EA,#FFE7C2)}
  html[data-lp="teen"] .mm-front.word{background:linear-gradient(160deg,#2b2f66,#1a1d44)}
  .mm-front.word::before{content:"";position:absolute;inset:7px;border-radius:13px;border:2px solid rgba(249,115,22,.25)}
  html[data-lp="teen"] .mm-front.word::before{border-color:rgba(140,160,255,.35)}
  .mm-wordtxt{position:relative;padding:0 10px;text-align:center;font-family:var(--lp-display);font-weight:800;color:#3B2A17;line-height:1.05;overflow-wrap:anywhere;font-size:calc(var(--k,1) * 26px)}
  html[data-lp="teen"] .mm-wordtxt{color:#F4F6FF;text-shadow:0 0 18px rgba(130,150,255,.5)}
  .mm-wordtxt.l2{font-size:calc(var(--k,1) * 21px)} .mm-wordtxt.l3{font-size:calc(var(--k,1) * 17px)} .mm-wordtxt.l4{font-size:calc(var(--k,1) * 14px)}
  .mm-pip{position:absolute;width:16px;height:16px;opacity:.55}
  .mm-pip.a{left:10px;top:10px} .mm-pip.b{right:10px;bottom:10px;transform:rotate(180deg)}
  .mm-pip svg{width:100%;height:100%}

  /* card back: Lumio orange with a star weave and Lumi's mark */
  .mm-back{background:
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.0) 0 38%,transparent 39%),
      radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 2px) 0 0/16px 16px,
      linear-gradient(150deg,#FFB547 0%,#FF8A1F 45%,#F2620F 100%);
    box-shadow:0 5px 0 #C2530A,0 16px 22px -12px rgba(120,50,0,.7);display:grid;place-items:center}
  .mm-back::before{content:"";position:absolute;inset:6px;border-radius:13px;border:2px dashed rgba(255,255,255,.7)}
  .mm-back::after{content:"";position:absolute;top:-40%;left:-60%;width:45%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:rotate(20deg) translateX(-120%);opacity:0}
  .mm-card:hover .mm-back::after{opacity:1;transition:transform .7s ease,opacity .2s;transform:rotate(20deg) translateX(420%)}
  .mm-back .seal{position:relative;width:52%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFDF5,#FFE6B8);display:grid;place-items:center;
    box-shadow:0 0 0 4px rgba(255,255,255,.55),0 6px 12px -4px rgba(120,50,0,.6)}
  .mm-back .seal img{width:82%;height:82%;object-fit:contain}
  .mm-back .corner{position:absolute;width:15px;height:15px}
  .mm-back .corner svg{width:100%;height:100%}
  .mm-back .c1{left:11px;top:11px} .mm-back .c2{right:11px;top:11px} .mm-back .c3{left:11px;bottom:11px} .mm-back .c4{right:11px;bottom:11px}
  html[data-lp="teen"] .mm-back{background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px),
      radial-gradient(120% 90% at 30% 10%,#5B4BFF 0%,#2B2C8F 45%,#141743 100%);
    box-shadow:0 0 0 1px rgba(160,170,255,.4),0 0 24px -6px rgba(110,120,255,.6),0 18px 26px -14px rgba(0,0,0,.9)}
  html[data-lp="teen"] .mm-back::before{border:1.5px solid rgba(150,200,255,.55);box-shadow:inset 0 0 14px rgba(120,160,255,.35)}
  html[data-lp="teen"] .mm-back .seal{background:radial-gradient(circle at 40% 35%,#2a2f70,#151842);box-shadow:0 0 0 2px rgba(150,200,255,.7),0 0 22px rgba(120,160,255,.7)}

  .mm-card.match .mm-front{box-shadow:0 0 0 4px var(--lp-good),0 0 26px rgba(34,197,94,.65)}
  .mm-card.miss .mm-front{box-shadow:0 0 0 4px var(--lp-bad),0 0 20px rgba(244,63,94,.45)}
  .mm-card:focus-visible{outline:3px solid var(--lp-accent-2);outline-offset:3px;border-radius:18px}

  .mm-moves .k{opacity:.7;font-size:14px}
  @media (max-width:420px){.mm-moves .k{display:none}}

  @media (min-width:900px){
    .mm{grid-template-columns:300px auto;justify-content:center;align-items:center;column-gap:44px;min-height:calc(100dvh - 120px);align-content:center}
    .mm-side{flex-direction:column;align-items:center;max-width:300px;min-height:0;gap:14px}
    .mm-host{height:min(46vh,380px);width:280px;order:2}
    .mm-say{order:1;align-items:center;padding:0}
    .mm-say .lp-bubble .tail{left:50%;bottom:-9px;margin-left:-11px}
    .mm-tray{order:3;width:96px;height:120px;margin:4px 0 26px}
    .mm-mat{max-width:min(880px,calc((100dvh - 176px) * 1.0667 + 72px));padding:18px}
    .mm-grid{grid-template-columns:repeat(4,1fr);gap:16px}
    .mm-card{--k:1.35}
  }
  @media (min-width:900px) and (max-height:760px){ .mm-host{height:40vh} }
  @media (max-width:899px) and (max-height:720px){ .mm-side{min-height:96px} .mm-host{height:96px;width:80px} .mm-tray{width:60px;height:75px} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="mm">
    <div class="mm-side">
      <div class="mm-host" id="host"></div>
      <div class="mm-say">
        <button class="lp-bubble" id="sayBtn" type="button" aria-label="Hear the word again">
          <span class="lp-speak" id="speakIco" aria-hidden="true"></span>
          <span class="txt" id="sayTxt">Find the pairs!</span>
          <span class="tail"></span>
        </button>
      </div>
      <div class="mm-tray" id="tray" aria-hidden="true"><span class="lbl" id="trayLbl"></span></div>
    </div>
    <div class="mm-mat"><div class="mm-grid" id="mmGrid" aria-label="Memory cards"></div></div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
/* ================= Hub mini games: same word source, faces and saving rule as student.html ================= */
const u = Lumio.user();
const level = Lumio.qs("level") || (u && u.level) || "pre-a";
const TEEN = ["level3", "level4", "level5", "level6"].includes(level);
const backHref = "../student.html";
// Starts as this generic fallback list; loadLessonVocabForGames() swaps it for the real lesson words.
const FALLBACK_WORD_BANK = [
  { en: "Cat", ar: "قطة", em: "🐱" }, { en: "Dog", ar: "كلب", em: "🐶" },
  { en: "Sun", ar: "شمس", em: "☀️" }, { en: "Moon", ar: "قمر", em: "🌙" },
  { en: "Apple", ar: "تفاحة", em: "🍎" }, { en: "Banana", ar: "موزة", em: "🍌" },
  { en: "Red", ar: "أحمر", em: "🔴" }, { en: "Blue", ar: "أزرق", em: "🔵" },
  { en: "One", ar: "واحد", em: "1️⃣" }, { en: "Two", ar: "اثنان", em: "2️⃣" },
  { en: "Star", ar: "نجمة", em: "⭐" }, { en: "Book", ar: "كتاب", em: "📚" },
  { en: "Fish", ar: "سمكة", em: "🐟" }, { en: "Bird", ar: "طائر", em: "🐦" },
  { en: "House", ar: "بيت", em: "🏠" }, { en: "Ball", ar: "كرة", em: "⚽" },
  { en: "Tree", ar: "شجرة", em: "🌳" }, { en: "Car", ar: "سيارة", em: "🚗" },
];
let WORD_BANK = FALLBACK_WORD_BANK;
// Photo fix: these lesson words have no picture under their own name, but the same picture exists
// under its base form (visited -> visit.png ...). Without this they fell back to plain text.
const PIC_ALIAS = { visited: "visit", baked: "bake", rested: "rest", bought: "buy", met: "meet", forgot: "forget",
  balloons: "balloon", invitation: "invite", slowly: "slow", cheaper: "cheap", affordable: "cheap", healthier: "healthy-food",
  rehearsal: "rehearse", efficient: "efficiently", "double-check": "check" };
function sdVocabFile(v) {
  if (!v.image) { const k = String(v.en).toLowerCase().trim(); if (PIC_ALIAS[k]) return PIC_ALIAS[k]; }
  return String(v.image || v.en).toLowerCase().trim().replace(/'/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
const picSrc = w => `../assets/vocab/${w.pic || sdVocabFile(w)}.png`;
let gamesLessonNum = null, gamesUsingRealVocab = false;
function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pickWords(n, source) { const bank = source || WORD_BANK; return shuffled(bank).slice(0, Math.min(n, bank.length)); }
async function loadLessonVocabForGames() {
  // ?n= picks the lesson; without it, the student's most recently ATTEMPTED lesson in this level (lesson 1 before any).
  const prog = u ? ((Lumio.progressFor(u.name) || {})[level] || {}) : {};
  const attemptedNums = Object.keys(prog).map(Number);
  const nq = parseInt(Lumio.qs("n") || "", 10);
  const targetNum = nq > 0 ? nq : (attemptedNums.length ? Math.max(...attemptedNums) : 1);
  let lessonData = (window.LUMIO_LESSONS && window.LUMIO_LESSONS[level]) ? window.LUMIO_LESSONS[level][targetNum] : null;
  if (!lessonData) {
    try { const res = await fetch(`../lessons/${level}/lesson${String(targetNum).padStart(2, "0")}.json`); if (res.ok) lessonData = await res.json(); } catch (e) {}
  }
  const vocab = lessonData && Array.isArray(lessonData.vocab) ? lessonData.vocab : [];
  if (vocab.length < 3) return; // too few real words: keep the fallback bank
  WORD_BANK = vocab.map(v => ({ en: v.en, ar: v.ar || "", em: v.emoji || "", pic: sdVocabFile(v) }));
  gamesLessonNum = targetNum; gamesUsingRealVocab = true;
}
// Same "keep the best" rule as student.html; only touches a lesson already attempted.
function saveGameResultToLesson(stars, score, total) {
  if (!gamesUsingRealVocab || !gamesLessonNum || !u) return { counted: false, reason: "no-lesson" };
  let all; try { all = JSON.parse(localStorage.getItem("lumio_progress") || "{}"); } catch (e) { all = {}; }
  const existing = ((all[u.name] || {})[level] || {})[gamesLessonNum];
  if (!existing) return { counted: false, reason: "not-attempted", lessonNum: gamesLessonNum };
  if (stars < existing.stars) return { counted: false, reason: "not-better", lessonNum: gamesLessonNum };
  all[u.name] = all[u.name] || {}; all[u.name][level] = all[u.name][level] || {};
  all[u.name][level][gamesLessonNum] = { stars, score, total, date: Lumio.tzNow().date };
  try { localStorage.setItem("lumio_progress", JSON.stringify(all)); } catch (e) { return { counted: false, reason: "storage-failed" }; }
  return { counted: true, lessonNum: gamesLessonNum };
}
function gameResultNote(b) {
  if (b.counted) return `<span class="hub-note ok">🎯 Counted toward Lesson ${b.lessonNum}'s stars!</span>`;
  if (b.reason === "not-attempted") return `<span class="hub-note">Finish Lesson ${b.lessonNum} first, then this game can boost its stars!</span>`;
  if (b.reason === "not-better") return `<span class="hub-note">Your Lesson ${b.lessonNum} score is already this good — try beating it!</span>`;
  return "";
}
function gameStars(r) { if (r >= 0.85) return 3; if (r >= 0.6) return 2; return 1; } // same as lesson.js
// Results card: kit card + the hub's own lines (teens see XP, like student.html)
function hubResults(o, lines, quiet) {
  const keepRain = LP.rain, keepLottie = window.lottie;
  if (quiet) { LP.rain = () => {}; window.lottie = null; }
  LP.results(o);
  if (quiet) setTimeout(() => { LP.rain = keepRain; window.lottie = keepLottie; }, 1500);
  const note = document.querySelector(".lp-results .note");
  if (note) note.innerHTML = lines.filter(Boolean).join("") + (TEEN ? `<span class="hub-xp"><b>+${o.stars * 100} XP</b><i><s style="transform:scaleX(${o.stars / 3})"></s></i></span>` : "");
}
const hubCss = document.createElement("style");
hubCss.textContent = `.lp-results .note{display:flex;flex-direction:column;align-items:center;gap:6px}
.hub-line{font-family:var(--lp-display);font-weight:800;font-size:18px}
.hub-note{font-size:14px;opacity:.85;max-width:30em}.hub-note.ok{color:#0D9488;opacity:1}
html[data-lp="teen"] .hub-note.ok{color:#5EEAD4}
.hub-xp{display:flex;align-items:center;gap:10px;margin-top:4px}.hub-xp b{font-family:var(--lp-display);font-size:20px;color:#A78BFA}
.hub-xp i{display:block;width:140px;height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hub-xp s{display:block;height:100%;background:linear-gradient(90deg,#7C5CFF,#3BA0FF);transform-origin:0 50%;text-decoration:none}`;
document.head.appendChild(hubCss);

/* ================= Memory Match (rules from student.html) ================= */
const PAIRS = 6;
const movesChip = LP.el("div", "lp-chip mm-moves", '<span class="k">Moves</span><span class="n" id="mmMoves">0</span>');
movesChip.setAttribute("aria-label", "Moves");
LP.init({
  theme: TEEN ? "teen" : "kid",
  scene: TEEN
    ? { bg: "assets/story/backgrounds/game-night-room.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(20,14,40,.35),rgba(6,8,22,.55))" }
    : { bg: "assets/lesson-bg-kid/playroom.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(255,236,190,.08),rgba(60,30,0,.22))" },
  hud: { rounds: PAIRS, exitHref: backHref, extra: movesChip }
});
document.getElementById("speakIco").innerHTML = LP.ICON.speaker;
const CH = TEEN ? { char: "lumi-teen", pose: "think", cheer: "laugh", oops: "surprised" } : { char: "lumi", pose: "magnify", cheer: "celebrate", oops: "surprised" };
const host = LP.actor(document.getElementById("host"), Object.assign({ alt: "Lumi" }, CH));
const mmGrid = document.getElementById("mmGrid"), tray = document.getElementById("tray"), trayLbl = document.getElementById("trayLbl");
const sayTxt = document.getElementById("sayTxt"), sayBtn = document.getElementById("sayBtn"), movesN = document.getElementById("mmMoves");
const G = window.gsap, ANIM = !!G && !LP.RM;
const STAR_PIP = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.7 6 6.5.6-4.9 4.3 1.4 6.4L12 16.6 6.3 19.8l1.4-6.4L2.8 9.1l6.5-.6z" fill="currentColor"/></svg>';
const MARK = LP.asset("assets/site/lumi-mark.png");
let lastWord = "";
let mmState = null;

function say(t, speak) { sayTxt.textContent = t; if (ANIM) G.fromTo(sayBtn, { scale: .85 }, { scale: 1, duration: .5, ease: "back.out(2.5)" }); if (speak) { lastWord = speak; LP.say(speak, document.getElementById("speakIco")); } }
sayBtn.onclick = () => { if (lastWord) LP.say(lastWord, document.getElementById("speakIco")); };

function backHtml() {
  const pipCol = TEEN ? "rgba(170,200,255,.8)" : "rgba(255,255,255,.85)";
  return `<div class="mm-face mm-back"><span class="seal"><img src="${MARK}" alt="" draggable="false"></span>` +
    [1, 2, 3, 4].map(i => `<span class="corner c${i}" style="color:${pipCol}">${STAR_PIP}</span>`).join("") + `</div>`;
}
function lenClass(t) { const n = t.length; return n <= 6 ? "" : n <= 9 ? "l2" : n <= 13 ? "l3" : "l4"; }
function frontHtml(c) {
  const pip = `<span class="mm-pip a" style="color:${TEEN ? "#8EA2FF" : "#F97316"}">${STAR_PIP}</span><span class="mm-pip b" style="color:${TEEN ? "#8EA2FF" : "#F97316"}">${STAR_PIP}</span>`;
  if (c.kind === "word") return `<div class="mm-face mm-front word">${pip}<span class="mm-wordtxt ${lenClass(c.w.en)}">${LP.esc(c.w.en)}</span></div>`;
  // picture face (emoji in the fallback bank); a missing picture falls back to the word itself (as in student.html)
  const inner = c.w.em ? `<span class="emo">${LP.esc(c.w.em)}</span>`
    : `<img src="${LP.esc(picSrc(c.w))}" alt="${LP.esc(c.w.en)}" draggable="false" onerror="var s=document.createElement('span');s.className='mm-wordtxt ${lenClass(c.w.en)}';s.textContent=this.alt;this.replaceWith(s)">`;
  return `<div class="mm-face mm-front pic"><div class="plate">${inner}</div></div>`;
}

function resetHud() {
  LP.setStars(0);
  document.querySelectorAll(".lp-prog i b").forEach(b => { if (G) G.set(b, { scaleX: 0 }); else b.style.transform = "scaleX(0)"; });
}

function trayDeck(show) {
  tray.querySelectorAll(".mm-mini").forEach(m => m.remove());
  trayLbl.textContent = "";
  if (!show) return;
  for (let i = 0; i < 4; i++) {
    const m = LP.el("div", "mm-mini", backHtml()); m.firstChild.style.borderRadius = "12px";
    m.style.transform = `translate(${i * -1.5}px,${i * -2.5}px) rotate(${(i - 1.5) * 2.5}deg)`;
    tray.appendChild(m);
  }
}

async function startMemory(source) {
  LP.answer = null;
  const words = pickWords(PAIRS, source);
  const cards = shuffled([
    ...words.map(w => ({ key: w.en, w, kind: "pic" })),
    ...words.map(w => ({ key: w.en, w, kind: "word" })),
  ]);
  mmState = { cards, flipped: [], matched: new Set(), moves: 0, busy: true, source, pairs: words.length };
  movesN.textContent = "0";
  resetHud(); LP.round(0);
  host.set(CH.pose);
  say("Find the pairs!");
  mmGrid.innerHTML = "";
  trayDeck(true);
  const els = cards.map((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mm-card"; b.dataset.key = c.key; b.dataset.kind = c.kind; b.dataset.press = "";
    b.setAttribute("aria-label", "Card " + (i + 1) + ", face down");
    b.innerHTML = `<div class="mm-in">${backHtml()}${frontHtml(c)}</div>`;
    b.onclick = () => flipCard(i);
    mmGrid.appendChild(b);
    return b;
  });
  await LP.banner("Memory Match", words.length + " pairs to find");
  // deal from Lumi's deck: each card flies out spinning and lands face down
  if (ANIM) {
    const from = LP.center(tray);
    host.nod();
    await new Promise(res => {
      const tl = G.timeline({ onComplete: res });
      els.forEach((b, i) => {
        const inn = b.firstChild, to = LP.center(b);
        tl.fromTo(inn, { x: from.x - to.x, y: from.y - to.y, scale: .45, rotation: -160 + Math.random() * 60, opacity: 0 },
          { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: .62, ease: "back.out(1.3)", onStart: () => LP.sfx("deal") }, i * .085);
      });
      tl.to(tray.querySelectorAll(".mm-mini"), { scale: .6, opacity: 0, duration: .3, stagger: .05 }, "-=.4");
      tl.to(els.map(b => b.firstChild), { y: -6, duration: .14, stagger: .03, yoyo: true, repeat: 1, ease: "sine.out" });
    });
  }
  trayDeck(false);
  mmState.busy = false;
  setAnswer();
}
function setAnswer() {
  const left = mmState.cards.find((c, i) => !mmState.matched.has(i));
  LP.answer = left ? left.key : null;   // read by the automated play-through tests
}

function setFlip(i, up) {
  const b = mmGrid.children[i], inn = b.firstChild;
  b.setAttribute("aria-label", up ? (mmState.cards[i].kind === "word" ? "Word: " : "Picture: ") + mmState.cards[i].key : "Card " + (i + 1) + ", face down");
  if (!ANIM) { if (G) G.set(inn, { rotationY: up ? 180 : 0 }); else inn.style.transform = up ? "rotateY(180deg)" : ""; return Promise.resolve(); }
  LP.sfx("flip");
  return new Promise(res => G.timeline({ onComplete: res })
    .to(inn, { z: 60, scale: 1.08, duration: .14, ease: "power2.out" })
    .to(inn, { rotationY: up ? 180 : 0, duration: TEEN ? .42 : .5, ease: TEEN ? "power2.inOut" : "back.out(1.4)" }, 0.04)
    .to(inn, { z: 0, scale: 1, duration: .25, ease: "power2.in" }, "-=.2"));
}

function flipCard(i) {
  if (!mmState || mmState.busy || mmState.matched.has(i) || mmState.flipped.includes(i)) return;
  mmState.flipped.push(i);
  setFlip(i, true);
  const c = mmState.cards[i];
  if (c.kind === "word") LP.say(c.key);
  if (mmState.flipped.length === 2) {
    mmState.busy = true; LP.answer = null;
    mmState.moves++;
    movesN.textContent = mmState.moves;
    if (ANIM) G.fromTo(movesChip, { scale: 1.2 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" });
    const [a, b] = mmState.flipped;
    const match = mmState.cards[a].key === mmState.cards[b].key;
    setTimeout(() => match ? onMatch(a, b) : onMiss(a, b), match ? 450 : 700);
  }
}

async function onMatch(a, b) {
  mmState.matched.add(a); mmState.matched.add(b);
  mmState.flipped = [];
  const got = mmState.matched.size / 2, total = mmState.cards.length / 2;
  const A = mmGrid.children[a], B = mmGrid.children[b], w = mmState.cards[a].w;
  [A, B].forEach(el => { el.classList.add("match"); el.disabled = true; });
  LP.sfx("correct"); LP.streak(true);
  host.cheer(CH.cheer);
  say(w.en + "!", w.en);
  LP.fill(got - 1); LP.round(got < total ? got : -1);
  if (ANIM) {
    // the pair flies together, kisses, bursts, then lands on Lumi's pile
    const ca = LP.center(A), cb = LP.center(B), mx = (ca.x + cb.x) / 2, my = (ca.y + cb.y) / 2;
    A.style.zIndex = B.style.zIndex = 30;
    const ia = A.firstChild, ib = B.firstChild, off = Math.min(46, ca.r.width * .36);
    await new Promise(res => G.timeline({ onComplete: res })
      .to(ia, { x: mx - ca.x - off, y: my - ca.y, rotation: -8, scale: 1.12, duration: .45, ease: "power3.inOut" })
      .to(ib, { x: mx - cb.x + off, y: my - cb.y, rotation: 8, scale: 1.12, duration: .45, ease: "power3.inOut" }, 0)
      .to(ia, { x: "+=" + off * .55, duration: .12, ease: "power2.in" })
      .to(ib, { x: "-=" + off * .55, duration: .12, ease: "power2.in" }, "<")
      .add(() => { LP.burst(mx, my, { n: 34, ringColor: "#22C55E" }); LP.sfx("pop"); })
      .to([ia, ib], { scale: 1.25, duration: .12, ease: "power2.out" })
      .to([ia, ib], { scale: 1.1, duration: .3, ease: "elastic.out(1,.4)" }));
    const star = LP.el("span", ""); star.style.cssText = `position:fixed;left:${mx}px;top:${my}px;width:2px;height:2px`; document.body.appendChild(star);
    LP.addStar(star).then(() => star.remove());
    const t = LP.center(tray);
    await new Promise(res => G.timeline({ onComplete: res })
      .to([ia, ib], { x: (i) => t.x - (i ? cb.x : ca.x), y: (i) => t.y - (i ? cb.y : ca.y), scale: .42, rotation: (i) => i ? 14 : -10, duration: .55, ease: "power2.in", stagger: .06 })
      .to([ia, ib], { opacity: 0, duration: .12 }));
    A.style.zIndex = B.style.zIndex = "";
  } else { LP.addStar(A); }
  [A, B].forEach(el => { el.classList.add("gone"); el.firstChild.style.visibility = "hidden"; });
  addToPile(w, got);
  if (mmState.matched.size === mmState.cards.length) { setTimeout(endMemory, ANIM ? 700 : 0); return; }
  mmState.busy = false; setAnswer();
}
function addToPile(w, got) {
  const n = tray.querySelectorAll(".mm-mini").length;
  const m = LP.el("div", "mm-mini", frontHtml({ kind: w.em ? "pic" : "pic", w }));
  const f = m.firstChild; f.style.transform = "none"; f.style.borderRadius = "12px";
  m.style.transform = `translate(${n * 1.2}px,${n * -2.2}px) rotate(${((n % 3) - 1) * 6}deg)`;
  tray.appendChild(m);
  trayLbl.textContent = got + " / " + mmState.pairs;
  if (ANIM) G.from(m, { y: -30, scale: 1.3, opacity: 0, duration: .45, ease: "bounce.out" });
}

async function onMiss(a, b) {
  const A = mmGrid.children[a], B = mmGrid.children[b];
  [A, B].forEach(el => el.classList.add("miss"));
  LP.sfx("wrong"); LP.streak(false);
  host.oops(CH.oops, CH.pose);
  say("Not a pair. Try again!");
  if (ANIM) await new Promise(res => G.timeline({ onComplete: res })
    .to([A.firstChild, B.firstChild], { x: -8, duration: .06 }).to([A.firstChild, B.firstChild], { x: 8, duration: .08 })
    .to([A.firstChild, B.firstChild], { x: -5, duration: .08 }).to([A.firstChild, B.firstChild], { x: 0, duration: .25, ease: "elastic.out(1,.4)" }));
  [A, B].forEach(el => el.classList.remove("miss"));
  await Promise.all([setFlip(a, false), setFlip(b, false)]);
  mmState.flipped = [];
  mmState.busy = false; setAnswer();
}

function endMemory() {
  LP.answer = null;
  const totalPairs = mmState.cards.length / 2;
  const ratio = Math.min(1, totalPairs / mmState.moves); // 1.0 = perfect
  const st = gameStars(ratio);
  const note = gameResultNote(saveGameResultToLesson(st, Math.round(ratio * 10), 10));
  hubResults({ score: totalPairs, total: totalPairs, stars: st, title: "Great job! 🎉", scoreLabel: "Pairs found",
    actor: { char: TEEN ? "lumi-teen" : "lumi", pose: "celebrate" }, exitHref: backHref, exitLabel: "Back to the Hub",
    onReplay: () => startMemory(mmState.source) },
    [`<span class="hub-line">Finished in ${mmState.moves} moves</span>`, note]);
}

const ready = loadLessonVocabForGames().catch(() => {});
LP.title({ kicker: TEEN ? "English Hub · Mini game" : "English Hub · Play", title: "Memory Match", sub: "Flip two cards. Match each picture with its word!",
  ar: "اقلب البطاقات وطابق كل صورة مع كلمتها", actor: TEEN ? { char: "lumi-teen", pose: "wave", cheer: "high-five" } : { char: "lumi", pose: "wave-book", cheer: "celebrate" }
}).then(() => ready).then(() => startMemory());
</script>
