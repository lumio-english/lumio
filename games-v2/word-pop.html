<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Pop — Lumio English</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="../css/style.css">
<style>
/* ---------- v2 motion kit (shared look; inlined per page so each file stands alone) ---------- */
:root{
  --o:#F97316;--o2:#C2530A;--o3:#FB923C;--sun:#FFC93C;--sun2:#FFE7A3;--sunS:#FFF3D6;
  --ink:#2A2118;--cocoa:#43301F;--mu:#8A7160;--ok:#22C55E;--ok2:#15803D;--okS:#EAFBEF;
  --bad:#F43F5E;--badS:#FDE8EC;--teal:#0D9488;--tealS:#E6FAF7;--sky:#0EA5E9;--pu:#8B5CF6;
  --sh1:0 1px 2px rgba(67,48,31,.06),0 4px 12px rgba(67,48,31,.08);
  --sh2:0 2px 4px rgba(67,48,31,.06),0 14px 34px rgba(67,48,31,.14);
  --sh3:0 6px 14px rgba(67,48,31,.10),0 30px 70px rgba(249,115,22,.24);
  --fd:'Baloo 2','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:var(--fb);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
:focus-visible{outline:3px solid var(--o);outline-offset:3px;border-radius:12px}

/* HUD */
.v2-hud{position:relative;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:1120px;margin:0 auto}
.v2-exit{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;background:#fff;border:0;box-shadow:var(--sh1);
  font-family:var(--fd);font-weight:800;font-size:1rem;color:var(--cocoa);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.v2-exit svg{width:18px;height:18px}
.v2-pill{min-height:44px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:var(--sh1);display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fd);font-weight:800;font-size:1.05rem;color:var(--cocoa);white-space:nowrap;flex:none}
.v2-pill svg{width:24px;height:24px;flex:none}
.v2-prog{position:relative;height:14px;border-radius:999px;background:rgba(67,48,31,.09);overflow:hidden;flex:1;min-width:40px;box-shadow:inset 0 1px 2px rgba(67,48,31,.08)}
.v2-prog i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#FFC93C,#FB923C 55%,#F97316);transform-origin:0 50%;transform:scaleX(0)}
.v2-prog i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}

/* mascot */
.v2-mascot{position:relative;display:inline-block;transform-origin:50% 100%}
.v2-mascot img{display:block;width:100%;height:auto;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(67,48,31,.18))}

/* flying star + effects */
.v2-fly{position:fixed;left:0;top:0;z-index:400;width:36px;height:36px;pointer-events:none;will-change:transform}
.v2-fly svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(194,83,10,.35))}
.v2-ring{position:absolute;inset:-4px;border-radius:inherit;pointer-events:none;border:4px solid var(--ok);opacity:0}
.v2-dot{position:fixed;left:0;top:0;z-index:350;width:10px;height:10px;border-radius:50%;pointer-events:none;will-change:transform,opacity}
.v2-check{position:absolute;width:56px;height:56px;pointer-events:none;z-index:4}
.v2-check svg{width:100%;height:100%}
.v2-bad{animation:v2Bad .45s ease}
@keyframes v2Bad{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-1.5deg)}40%{transform:translateX(8px) rotate(1.5deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* masked letters */
.v2-w{display:inline-block;white-space:nowrap;overflow:hidden;vertical-align:bottom;padding:.06em .02em .1em;margin:-.06em -.02em -.1em}
.v2-ch{display:inline-block;will-change:transform}

/* celebration */
.v2-cel{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:96px 16px 16px;background:rgba(43,33,24,.52)}
.v2-cel.show{display:flex}
.v2-cel .box{position:relative;background:#fff;border-radius:32px;padding:20px 22px 24px;max-width:430px;width:100%;text-align:center;box-shadow:var(--sh3)}
.v2-cel .box::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 60% at 50% 0%,#FFF3D6 0%,rgba(255,243,214,0) 60%);pointer-events:none}
.v2-cel .v2-hero{position:relative;display:block;width:150px;height:150px;object-fit:contain;margin:-96px auto 0;filter:drop-shadow(0 14px 18px rgba(67,48,31,.25));transform-origin:50% 100%}
.v2-cel h2{position:relative;font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,7vw,2.1rem);line-height:1.1;margin:8px 0 2px;color:var(--cocoa);letter-spacing:-.01em}
.v2-cel .sub{position:relative;font-weight:800;font-size:1.15rem;margin:8px 0 4px;color:var(--ink)}
.v2-cel .sub b,.v2-n{font-family:var(--fd);color:var(--o2);font-size:1.25em}
.v2-stars{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px auto 6px;max-width:340px}
.v2-stars span{width:52px;height:52px;display:inline-block}
.v2-stars.many span{width:40px;height:40px}
.v2-stars svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(194,83,10,.25))}
.v2-big{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;font-family:var(--fd);font-weight:800;font-size:3rem;line-height:1;color:var(--o2)}
.v2-big svg{width:62px;height:62px}
.v2-btns{position:relative;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.v2-btn{min-height:52px;padding:0 24px;border-radius:999px;border:0;font-family:var(--fd);font-weight:800;font-size:1.08rem;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.v2-btn.pri{background:linear-gradient(135deg,#FB923C,#F97316 55%,#F59E0B);color:#fff;box-shadow:0 4px 0 #C2530A,0 12px 24px rgba(249,115,22,.32)}
.v2-btn.sec{background:#E6FAF7;color:#0F766E;box-shadow:0 4px 0 #9FE3D9}
.v2-conf{position:fixed;left:50%;top:46%;width:min(118vw,680px);aspect-ratio:1/1;transform:translate(-50%,-50%);z-index:320;pointer-events:none}
.v2-xp{position:relative;margin:14px 0 6px}
.v2-xp .val{font-family:var(--fd);font-weight:800;font-size:2rem;color:var(--o)}
.v2-xp .bar{width:200px;height:12px;border-radius:999px;background:rgba(249,115,22,.15);margin:6px auto 0;overflow:hidden}
.v2-xp .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#F97316,#FFC93C);transform-origin:0 50%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.v2-sp{flex:1}

  /* ---------- Hub mini games: shared page look ---------- */
  body { min-height: 100vh; min-height: 100dvh; position: relative;
    background: radial-gradient(circle at 1px 1px, rgba(67,48,31,.06) 1.2px, transparent 1.6px) 0 0/22px 22px, linear-gradient(170deg, #FFF1DD 0%, #FFF8EC 45%, #F1FBF7 100%); }
  .deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .deco i { position: absolute; border-radius: 50%; opacity: .5; }
  .deco i:nth-child(1) { width: 300px; height: 300px; left: -110px; top: 90px; background: radial-gradient(circle, #FFD7A8, rgba(255,215,168,0) 70%); }
  .deco i:nth-child(2) { width: 360px; height: 360px; right: -140px; bottom: -80px; background: radial-gradient(circle, #C7F0E8, rgba(199,240,232,0) 70%); }
  .deco i:nth-child(3) { width: 200px; height: 200px; right: 22%; top: -70px; background: radial-gradient(circle, #E3DBFF, rgba(227,219,255,0) 70%); }

  .wrapM { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; padding: 0 16px 28px;
    display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 68px); min-height: calc(100dvh - 68px); }
  .wrapM > * { width: 100%; }
  .titleRow { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 0 0 10px; }
  .titleRow .v2-mascot { width: 78px; flex: none; }
  .titleRow h1 { font-family: var(--fd); font-weight: 800; color: var(--cocoa); font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1; margin: 0 0 10px; letter-spacing: -.01em; }
  .panel { position: relative; background: #fff; border-radius: 30px; padding: 18px; box-shadow: var(--sh2); }
  .hudRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #FFF6EA;
    font-family: var(--fd); font-weight: 800; color: var(--cocoa); font-size: 1rem; white-space: nowrap; }
  .chip svg { width: 22px; height: 22px; }
  .target { position: relative; background: linear-gradient(160deg, #FFF8EC, #FFF1DD); border-radius: 24px; padding: 14px; text-align: center; margin-bottom: 16px; font-weight: 800; overflow: hidden; }
  .target .em { font-size: 3.4rem; line-height: 1; min-height: 110px; display: flex; align-items: center; justify-content: center; }
  .target .em .sd-word-pic { width: 112px; height: 112px; object-fit: contain; display: block; filter: drop-shadow(0 8px 10px rgba(67,48,31,.15)); }
  .target .ar { font-size: 1.25rem; color: var(--mu); direction: rtl; margin-top: 4px; font-family: 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
  .v2-note { position: relative; font-weight: 800; font-size: .9rem; color: var(--mu); margin: 8px 0 0; }
  .v2-note.ok { color: #0F766E; }
  .v2-cel .moves { position: relative; font-weight: 800; color: var(--mu); margin: 6px 0 0; }
  .sd-word-pic { display: block; width: 78%; height: 78%; object-fit: contain; margin: auto; }

  /* teens (L3-L6): same light orange/white skin as their dashboard, grown-up type, calmer surfaces */
  body.teen { background: linear-gradient(180deg, #FFFFFF 0%, #FBF7F2 100%); }
  body.teen .deco i { opacity: .28; }
  body.teen .titleRow h1, body.teen .v2-cel h2 { font-family: 'Bricolage Grotesque', var(--fd); letter-spacing: -.02em; }
  body.teen .panel { border-radius: 22px; box-shadow: 0 1px 0 rgba(67,48,31,.06), 0 18px 40px rgba(67,48,31,.08); border: 1px solid #F1E8DC; }
  body.teen .target { background: #FBF7F2; border-radius: 18px; }

  @media (min-width: 760px) {
    .wrapM { padding-top: 6px; }
    .titleRow .v2-mascot { width: 100px; }
    .panel { padding: 24px; }
  }

  .wp-hearts { display: inline-flex; gap: 2px; font-size: 1.15rem; }
  .wp-hearts span { display: inline-block; }
  .wp-bubbles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .wp-cell { position: relative; }
  .wp-bubble {
    position: relative; width: 100%; min-height: 76px; border: 0; border-radius: 999px; padding: 12px 10px;
    background: radial-gradient(circle at 28% 25%, rgba(255,255,255,.65) 0 9%, rgba(255,255,255,0) 30%), linear-gradient(140deg, #38BDF8, #0EA5E9 55%, #0284C7);
    color: #fff; font-family: var(--fd); font-weight: 800; font-size: 1.25rem; line-height: 1.1; text-shadow: 0 2px 0 rgba(3,105,161,.35);
    box-shadow: inset 0 -6px 0 rgba(3,105,161,.25), 0 10px 22px rgba(14,165,233,.3); cursor: pointer; overflow-wrap: anywhere;
  }
  .wp-cell:nth-child(2) .wp-bubble { background: radial-gradient(circle at 28% 25%, rgba(255,255,255,.65) 0 9%, rgba(255,255,255,0) 30%), linear-gradient(140deg, #A78BFA, #8B5CF6 55%, #7C3AED); box-shadow: inset 0 -6px 0 rgba(91,33,182,.25), 0 10px 22px rgba(139,92,246,.3); }
  .wp-cell:nth-child(3) .wp-bubble { background: radial-gradient(circle at 28% 25%, rgba(255,255,255,.65) 0 9%, rgba(255,255,255,0) 30%), linear-gradient(140deg, #FB923C, #F97316 55%, #EA580C); box-shadow: inset 0 -6px 0 rgba(194,65,12,.25), 0 10px 22px rgba(249,115,22,.3); }
  .wp-cell:nth-child(4) .wp-bubble { background: radial-gradient(circle at 28% 25%, rgba(255,255,255,.65) 0 9%, rgba(255,255,255,0) 30%), linear-gradient(140deg, #F472B6, #EC4899 55%, #DB2777); box-shadow: inset 0 -6px 0 rgba(157,23,77,.25), 0 10px 22px rgba(236,72,153,.3); }
  .wp-bubble.correct { background: linear-gradient(140deg, #2DD4BF, #0D9488) !important; box-shadow: 0 0 0 4px #99F6E4, 0 10px 22px rgba(13,148,136,.35) !important; }
  .wp-bubble.wrong { background: linear-gradient(140deg, #FB7185, #E14F4F) !important; box-shadow: 0 0 0 4px #FECDD3 !important; }
  .wp-bubble:disabled { cursor: default; }
  body.teen .wp-bubble { border-radius: 18px; background: #fff !important; color: var(--cocoa); text-shadow: none; border: 2px solid #F1E8DC; box-shadow: 0 3px 0 #EADFCE !important; }
  body.teen .wp-bubble.correct { background: #E6FAF7 !important; border-color: #0D9488; color: #0F766E; }
  body.teen .wp-bubble.wrong { background: #FDE8EC !important; border-color: #F43F5E; color: #BE123C; }
  @media (min-width: 760px) { .wp-bubble { min-height: 90px; font-size: 1.45rem; } .wp-bubbles { gap: 16px; } .target .em .sd-word-pic { width: 140px; height: 140px; } .target .em { min-height: 140px; font-size: 4.2rem; } }
</style>
</head>

  var STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F3EADB" stroke="#E2D3BC" stroke-width="1.3" stroke-linejoin="round" d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z"/></svg>';

    var c = document.createElement("div"); c.className = "v2-check"; c.style.cssText = css || "right:-6px;top:-6px";
    host.appendChild(c);
    var a = V.lot(c, "check", false);
    if (!a) c.innerHTML = CHECK;
    return c;
  };
  // little confetti dots from a point
  V.burst = function (x, y, colors, n) {
    if (!V.anim) return;
    colors = colors || ["#FFC93C", "#F97316", "#22C55E", "#0EA5E9", "#F472B6"];
    for (var i = 0; i < (n || 14); i++) {
      var d = document.createElement("div"); d.className = "v2-dot";
      var sz = 6 + Math.random() * 8; d.style.width = d.style.height = sz + "px";
      d.style.background = colors[i % colors.length]; if (i % 3 === 0) d.style.borderRadius = "2px";
      document.body.appendChild(d);
      var ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 80;
      G.set(d, { x: x - sz / 2, y: y - sz / 2 });
      G.to(d, { x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist + 30, rotation: Math.random() * 360, opacity: 0, scale: .4, duration: .7 + Math.random() * .3, ease: "power2.out", onComplete: (function (dd) { return function () { dd.remove(); }; })(d) });
    }
  };
  V.count = function (el, to, dur, from) {
    if (!el) return;
    if (!V.anim) { el.textContent = to; return; }
    var o = { n: from || 0 };
    G.to(o, { n: to, duration: dur || .8, ease: "power1.out", onUpdate: function () { el.textContent = Math.round(o.n); } });
  };
  V.progress = function (fill, frac) {
    if (!fill) return;
    frac = Math.max(0, Math.min(1, frac));
    if (V.anim) G.to(fill, { scaleX: frac, duration: .7, ease: "power3.out" }); else fill.style.transform = "scaleX(" + frac + ")";
  };
  // split text into masked letters
  V.letters = function (text) {
    return String(text).replace(/ (?=\S*\p{Extended_Pictographic})/gu, "\u00a0").split(" ").map(function (w) {
      return '<span class="v2-w">' + Array.from(w).map(function (c) { return '<span class="v2-ch">' + V.esc(c) + "</span>"; }).join("") + "</span>";
    }).join(" ");
  };
  V.reveal = function (el, delay) {
    if (!el || !V.anim) return null;
    return G.from(V.$$(".v2-ch", el), { yPercent: 115, rotation: function (i) { return V.teen ? 0 : (i % 2 ? 1 : -1) * 14; }, duration: V.teen ? .5 : .55, stagger: .028, delay: delay || 0, ease: V.teen ? "power3.out" : "back.out(2.4)" });
  };
  // a character drops in with squash & stretch
  V.dropIn = function (el, delay) {
    if (!el || !V.anim) return null;
    var tl = G.timeline({ delay: delay || 0 });
    if (V.teen) return tl.fromTo(el, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: "power3.out" });
    tl.fromTo(el, { y: -160, opacity: 0, scaleX: .85, scaleY: 1.18, transformOrigin: "50% 100%" }, { y: 0, opacity: 1, duration: .42, ease: "power2.in" })
      .to(el, { scaleX: 1.2, scaleY: .78, duration: .08, ease: "power1.out" })
      .to(el, { scaleX: 1, scaleY: 1, duration: .8, ease: "elastic.out(1.1,.32)" });
    return tl;
  };
  // idle life: breathe, sway, blink-squash, and a wave now and then
  V.mascot = function (box) {
    var img = box && box.querySelector("img");
    var api = { cheer: function () {}, sad: function () {}, kill: function () {} };
    if (!img || !V.anim) return api;
    var tw = [];
    tw.push(G.to(box, { scale: 1.035, transformOrigin: "50% 100%", duration: 1.7, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    tw.push(G.to(img, { rotation: V.teen ? 1.5 : 3.5, transformOrigin: "50% 100%", duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    var bl = G.timeline({ repeat: -1, repeatDelay: 3.2, delay: 1.4 });
    bl.to(img, { scaleY: .91, scaleX: 1.06, transformOrigin: "50% 100%", duration: .09, ease: "power1.in" }).to(img, { scaleY: 1, scaleX: 1, duration: .45, ease: V.teen ? "power2.out" : "elastic.out(1,.4)" });
    tw.push(bl);
    var wv = G.timeline({ repeat: -1, repeatDelay: 6.5, delay: 4 });
    wv.to(img, { rotation: -8, duration: .18, ease: "power1.out" }).to(img, { rotation: 7, duration: .18, yoyo: true, repeat: 3, ease: "sine.inOut" }).to(img, { rotation: 0, duration: .3 });
    tw.push(wv);
    api.cheer = function () {
      G.timeline().to(box, { y: -26, duration: .22, ease: "power2.out" }).to(box, { y: 0, duration: .5, ease: "bounce.out" });
      G.fromTo(img, { scaleX: 1.12, scaleY: .88 }, { scaleX: 1, scaleY: 1, duration: .6, ease: "elastic.out(1,.4)", transformOrigin: "50% 100%" });
    };
    api.sad = function () { G.fromTo(box, { rotation: 0 }, { keyframes: { rotation: [-5, 5, -3, 0] }, duration: .5, ease: "none" }); };
    api.kill = function () { tw.forEach(function (t) { t.kill(); }); };
    return api;
  };
  // deal a set of cards in
  V.dealIn = function (els, opt) {
    if (!els || !els.length || !V.anim) return null;
    opt = opt || {};
    return G.from(els, { y: opt.y == null ? 40 : opt.y, scale: V.teen ? .92 : .6, opacity: 0,
      rotation: function (i) { return V.teen ? 0 : [-7, 6, -4, 5][i % 4]; },
      duration: V.teen ? .5 : .6, stagger: opt.stagger || .07, delay: opt.delay || 0, ease: V.pop(), clearProps: opt.keep ? "" : "transform,opacity" });
  };

  // end-of-game celebration on a .v2-cel overlay
  // o: { title, sub(html, may contain <b class="v2-n" data-to="N">), rating (1-3) | xp (rating) | tally {n, max} | big (number), confetti:true }
  V.celebrate = function (ov, o) {
    o = o || {};
    var box = V.$(".box", ov), h = V.$("h2", ov);
    if (o.title != null) h.innerHTML = V.letters(o.title);
    if (o.sub != null) { var sb = V.$(".sub", ov); if (sb) sb.innerHTML = o.sub; }
    var st = V.$(".v2-stars", ov) || V.$(".v2-slot", ov);
    var area = V.$(".v2-award", ov);
    if (area) {
      if (o.xp) {
        var pct = Math.round(o.xp / 3 * 100);
        area.innerHTML = '<div class="v2-xp"><div class="val">+<span class="v2-n" data-to="' + (o.xp * 100) + '">' + (o.xp * 100) + '</span> XP</div><div class="bar"><i style="transform:scaleX(' + (pct / 100) + ')"></i></div></div>';
      } else if (o.rating) {
        area.innerHTML = '<div class="v2-stars">' + [0, 1, 2].map(function (i) { return "<span>" + (i < o.rating ? STAR : STAR_O) + "</span>"; }).join("") + "</div>";
      } else if (o.tally) {
        var mx = o.tally.max;
        area.innerHTML = '<div class="v2-stars' + (mx > 5 ? " many" : "") + '">' + Array.from({ length: mx }, function (_, i) { return "<span>" + (i < o.tally.n ? STAR : STAR_O) + "</span>"; }).join("") + "</div>";
      } else if (o.big != null) {
        area.innerHTML = '<div class="v2-big">' + STAR + '<span class="v2-n" data-to="' + o.big + '">' + o.big + "</span></div>";
      } else area.innerHTML = "";
    }
    ov.classList.add("show");
    try { if (window.Lumio && Lumio.sfx) Lumio.sfx("complete"); } catch (e) {}
    if (o.confetti !== false && V.anim) {
      var c = document.createElement("div"); c.className = "v2-conf"; document.body.appendChild(c);
      var a = V.lot(c, "confetti", false);
      if (a) a.addEventListener("complete", function () { c.remove(); }); else c.remove();
      setTimeout(function () { if (c.isConnected) c.remove(); }, 4000);
    }
    var nums = V.$$(".v2-n[data-to]", ov);
    if (!V.anim) { nums.forEach(function (n) { n.textContent = n.getAttribute("data-to"); }); return; }
    nums.forEach(function (n) { n.textContent = "0"; });
    var hero = V.$(".v2-hero", ov);
    var tl = G.timeline();
    tl.fromTo(ov, { opacity: 0 }, { opacity: 1, duration: .25 })
      .from(box, { scale: V.teen ? .94 : .7, y: 40, opacity: 0, duration: V.teen ? .5 : .6, ease: V.teen ? "power3.out" : "back.out(1.8)" }, "<.05");
    if (hero) {
      if (V.teen) tl.from(hero, { y: 30, opacity: 0, duration: .5, ease: "power3.out" }, "-=.35");
      else tl.fromTo(hero, { y: -140, opacity: 0, scaleX: .85, scaleY: 1.2, transformOrigin: "50% 100%" }, { y: 0, opacity: 1, duration: .4, ease: "power2.in" }, "-=.3")
        .to(hero, { scaleX: 1.18, scaleY: .8, duration: .08 }).to(hero, { scaleX: 1, scaleY: 1, duration: .8, ease: "elastic.out(1,.35)" });
    }
    tl.from(V.$$(".v2-ch", h), { yPercent: 115, rotation: function (i) { return V.teen ? 0 : (i % 2 ? 1 : -1) * 16; }, duration: .5, stagger: .03, ease: V.teen ? "power3.out" : "back.out(2.6)" }, .35);
    var stars = V.$$(".v2-stars span", ov);
    if (stars.length) tl.from(stars, { y: -80, x: function (i) { return (stars.length / 2 - i) * 22; }, scale: 0, rotation: -200, duration: .65, stagger: Math.min(.16, 1 / stars.length), ease: "back.out(1.8)" }, .7)
      .fromTo(stars, { scale: 1 }, { scale: 1.22, duration: .14, yoyo: true, repeat: 1, stagger: Math.min(.16, 1 / stars.length), ease: "power2.out", immediateRender: false });
    var big = V.$(".v2-big svg", ov);
    if (big) tl.from(big, { scale: 0, rotation: -240, duration: .8, ease: "back.out(2)" }, .7);
    var bar = V.$(".v2-xp .bar i", ov);
    if (bar) tl.from(bar, { scaleX: 0, duration: 1, ease: "power3.out" }, .75);
    tl.from(V.$$(".sub,.v2-note,.v2-ar,.moves", ov), { y: 12, opacity: 0, duration: .4, stagger: .06 }, .8);
    tl.add(function () { nums.forEach(function (n) { V.count(n, +n.getAttribute("data-to"), Math.min(1.6, .25 + .12 * (+n.getAttribute("data-to") || 1))); }); }, .85);
    tl.from(V.$$(".v2-btns > *", ov), { y: 22, opacity: 0, duration: .5, stagger: .08, ease: "power3.out", clearProps: "transform,opacity" }, 1.1);
  };
  V.hideCel = function (ov) { ov.classList.remove("show"); };
  // soft drifting decor
  V.drift = function (els) {
    if (!V.anim) return;
    els.forEach(function (el, i) {
      G.to(el, { x: (i % 2 ? -1 : 1) * (18 + i * 6), y: (i % 3 - 1) * 10, duration: 5 + i * 1.3, yoyo: true, repeat: -1, ease: "sine.inOut" });
    });
  };
  return V;
})();

</script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script>
/* ---------- Hub mini games: the same word source, faces, stars and saving rule as student.html ---------- */
function sdEsc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
const u = Lumio.user();
const level = Lumio.qs("level") || (u && u.level) || "pre-a";
const TEEN = ["level3", "level4", "level5", "level6"].includes(level);
V2.teen = TEEN;
if (TEEN) document.body.classList.add("teen");
const G = V2.G, anim = V2.anim;

// Starts as this generic fallback list so games are playable right
// away; loadLessonVocabForGames() below swaps it for the real words
// from the lesson (?level=&n=, or the student's latest attempted lesson).
const FALLBACK_WORD_BANK = [
  { en: "Cat", ar: "قطة", em: "🐱" }, { en: "Dog", ar: "كلب", em: "🐶" },
  { en: "Sun", ar: "شمس", em: "☀️" }, { en: "Moon", ar: "قمر", em: "🌙" },
  { en: "Apple", ar: "تفاحة", em: "🍎" }, { en: "Banana", ar: "موزة", em: "🍌" },
  { en: "Red", ar: "أحمر", em: "🔴" }, { en: "Blue", ar: "أزرق", em: "🔵" },
  { en: "One", ar: "واحد", em: "1️⃣" }, { en: "Two", ar: "اثنان", em: "2️⃣" },
  { en: "Star", ar: "نجمة", em: "⭐" }, { en: "Book", ar: "كتاب", em: "📚" },
  { en: "Fish", ar: "سمكة", em: "🐟" }, { en: "Bird", ar: "طائر", em: "🐦" },
  { en: "House", ar: "بيت", em: "🏠" }, { en: "Ball", ar: "كرة", em: "⚽" },
  { en: "Tree", ar: "شجرة", em: "🌳" }, { en: "Car", ar: "سيارة", em: "🚗" },
];
let WORD_BANK = FALLBACK_WORD_BANK;
// Lesson vocab has no emoji: show the word's picture instead (same file rule
// as student.html). If the picture is missing: Memory falls back to the word
// itself; Word Pop / Builder keep only the Arabic (the English would give the answer away).
function sdVocabFile(v) { return String(v.image || v.en).toLowerCase().trim().replace(/'/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function wordFaceHtml(w, wordFallback) {
  if (w.em) return sdEsc(w.em);
  const onErr = wordFallback
    ? "var s=document.createElement('span');s.className='mm-word';s.textContent=this.alt;this.replaceWith(s)"
    : "this.remove()";
  return `<img class="sd-word-pic" src="../assets/vocab/${sdEsc(w.pic || sdVocabFile(w))}.png" alt="${sdEsc(w.en)}" draggable="false" onerror="${onErr}">`;
}
let gamesLessonNum = null;   // which lesson's vocab is currently loaded, if any
let gamesUsingRealVocab = false;

function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pickWords(n, source) { const bank = source || WORD_BANK; return shuffled(bank).slice(0, Math.min(n, bank.length)); }

async function loadLessonVocabForGames() {
  // ?n= picks the lesson; without it, the student's most recently ATTEMPTED
  // lesson in this level (lesson 1 before any attempt) -- same as student.html.
  const prog = u ? ((Lumio.progressFor(u.name) || {})[level] || {}) : {};
  const attemptedNums = Object.keys(prog).map(Number);
  const nq = parseInt(Lumio.qs("n") || "", 10);
  const targetNum = nq > 0 ? nq : (attemptedNums.length ? Math.max(...attemptedNums) : 1);
  let lessonData = (typeof window.LUMIO_LESSONS !== "undefined" && window.LUMIO_LESSONS[level])
    ? window.LUMIO_LESSONS[level][targetNum]
    : null;
  if (!lessonData) {
    try {
      const nn = String(targetNum).padStart(2, "0");
      const res = await fetch(`../lessons/${level}/lesson${nn}.json`);
      if (res.ok) lessonData = await res.json();
    } catch (e) { /* fine — falls back to the generic word bank below */ }
  }
  const vocab = lessonData && Array.isArray(lessonData.vocab) ? lessonData.vocab : [];
  if (vocab.length < 3) return; // too few real words to make a decent game — keep the fallback bank
  WORD_BANK = vocab.map(v => ({ en: v.en, ar: v.ar || "", em: v.emoji || "", pic: sdVocabFile(v) }));
  gamesLessonNum = targetNum;
  gamesUsingRealVocab = true;
}

// Blends a mini-game result into that lesson's saved progress with the same
// "keep the best" rule as student.html -- only for a lesson already attempted.
function saveGameResultToLesson(stars, score, total) {
  if (!gamesUsingRealVocab || !gamesLessonNum || !u) return { counted: false, reason: "no-lesson" };
  let all;
  try { all = JSON.parse(localStorage.getItem("lumio_progress") || "{}"); } catch (e) { all = {}; }
  const existing = ((all[u.name] || {})[level] || {})[gamesLessonNum];
  if (!existing) return { counted: false, reason: "not-attempted", lessonNum: gamesLessonNum };
  if (stars < existing.stars) return { counted: false, reason: "not-better", lessonNum: gamesLessonNum };
  all[u.name] = all[u.name] || {};
  all[u.name][level] = all[u.name][level] || {};
  all[u.name][level][gamesLessonNum] = { stars, score, total, date: Lumio.tzNow().date };
  try { localStorage.setItem("lumio_progress", JSON.stringify(all)); } catch (e) { return { counted: false, reason: "storage-failed" }; }
  return { counted: true, lessonNum: gamesLessonNum };
}
function gameResultNote(blended) {
  if (blended.counted) return `<p class="v2-note ok">🎯 Counted toward Lesson ${blended.lessonNum}'s stars!</p>`;
  if (blended.reason === "not-attempted") return `<p class="v2-note">Finish Lesson ${blended.lessonNum} first, then this game can boost its stars!</p>`;
  if (blended.reason === "not-better") return `<p class="v2-note">Your Lesson ${blended.lessonNum} score is already this good — try beating it!</p>`;
  return "";
}
function gameStars(scoreRatio) {
  // Same thresholds as lesson.js (>= 85% -> 3, >= 60% -> 2, else 1).
  if (scoreRatio >= 0.85) return 3;
  if (scoreRatio >= 0.6) return 2;
  return 1;
}
// stars for kids, XP bar for teen levels (display only -- same 1-3 rating underneath)
function starsAward(st) { return TEEN ? { xp: st } : { rating: st }; }

// shared page bits
document.getElementById("exitBtn").href = "../student.html";
document.querySelectorAll(".js-star").forEach(e => { e.innerHTML = V2.STAR; });
const mascot = V2.mascot(document.getElementById("lumi"));
if (TEEN) { const li = document.querySelector("#lumi img"); if (li) li.src = "../assets/story/characters/lumi-teen-wave.png"; const ch = document.querySelector("#endcard .v2-hero"); if (ch) ch.src = "../assets/story/characters/lumi-teen-celebrate.png"; }
function pageIntro() {
  if (!anim) return;
  const h = document.getElementById("gTitle");
  h.innerHTML = V2.letters(h.textContent);
  G.timeline()
    .from("#hud > *", { y: -30, opacity: 0, duration: .5, stagger: .06, ease: "power3.out", clearProps: "transform,opacity" })
    .add(V2.dropIn(document.querySelector("#lumi img")), .1)
    .add(V2.reveal(h), .35)
    .from(".panel", { y: 40, opacity: 0, scale: .97, duration: .6, ease: "power3.out", clearProps: "transform,opacity" }, .3)
    .from(".hudRow > *", { y: 10, opacity: 0, duration: .4, stagger: .07, clearProps: "transform,opacity" }, .55);
}


// ================= Word Pop (rules from student.html) =================
const wpTarget = document.getElementById("wpTarget");
const wpBubbles = document.getElementById("wpBubbles");
const wpScoreEl = document.getElementById("wpScore");
const wpHeartsEl = document.getElementById("wpHearts");
const progFill = document.getElementById("progFill");
const endcard = document.getElementById("endcard");
let wpState = null;
const WP_ROUNDS = 8;
let bobs = [];

function startWordPop(source) {
  V2.hideCel(endcard);
  wpState = { round: 0, score: 0, lives: 3, total: WP_ROUNDS, source };
  wpScoreEl.textContent = "Score: 0";
  V2.progress(progFill, 0);
  updateHearts();
  nextWpRound(true);
}
function updateHearts(lost) {
  wpHeartsEl.innerHTML = [0, 1, 2].map(i => `<span>${i < wpState.lives ? "❤️" : "🤍"}</span>`).join("");
  if (lost && anim) {
    const h = wpHeartsEl.children[wpState.lives];
    if (h) G.fromTo(h, { scale: 1.6, rotation: -20 }, { scale: 1, rotation: 0, duration: .6, ease: "back.out(2)" });
    V2.shake(wpHeartsEl);
  }
}
function drawRound(words, correct, first) {
  wpTarget.innerHTML = `<div class="em"><span>${wordFaceHtml(correct, false)}</span></div><div class="ar">${sdEsc(correct.ar)}</div>`;
  wpBubbles.innerHTML = "";
  bobs.forEach(t => t.kill()); bobs = [];
  shuffled(words).forEach((w, i) => {
    const cell = document.createElement("div");
    cell.className = "wp-cell";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "wp-bubble tap";
    btn.textContent = w.en;
    btn.onclick = () => handleWpPick(btn, w.en === correct.en);
    cell.appendChild(btn);
    wpBubbles.appendChild(cell);
    // bubbles float gently while you think
    if (anim && !TEEN) bobs.push(G.to(cell, { y: -6, duration: 1.3 + i * .17, yoyo: true, repeat: -1, ease: "sine.inOut", delay: i * .2 }));
  });
  if (anim) {
    G.from(".target .em > *", { scale: .4, rotation: TEEN ? 0 : -12, opacity: 0, duration: .55, delay: first ? .8 : 0, ease: V2.pop() });
    G.from(".target .ar", { y: 12, opacity: 0, duration: .4, delay: first ? .95 : .12 });
    V2.dealIn(wpBubbles.querySelectorAll(".wp-bubble"), { delay: first ? .9 : .1, stagger: .07, y: 26 });
  }
}
function nextWpRound(first) {
  if (wpState.round >= wpState.total || wpState.lives <= 0) { endWordPop(); return; }
  wpState.round++;
  const words = pickWords(4, wpState.source);
  const correct = words[0];
  if (!first && anim) {
    G.to(".wp-bubble", { scale: .6, opacity: 0, duration: .18, stagger: .03, ease: "power2.in" });
    G.to(".target .em > *, .target .ar", { y: -14, opacity: 0, duration: .18, ease: "power2.in", onComplete: () => drawRound(words, correct) });
  } else drawRound(words, correct, first);
}
function handleWpPick(btn, isCorrect) {
  [...wpBubbles.querySelectorAll(".wp-bubble")].forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.classList.add("correct");
    wpState.score++;
    Lumio.beep(true);
    const c = V2.center(btn);
    V2.burst(c.x, c.y, ["#2DD4BF", "#FFC93C", "#fff", "#38BDF8"], 18);
    V2.ring(btn, "#2DD4BF");
    if (anim) G.timeline().to(btn, { scale: 1.12, duration: .12, ease: "power2.out" }).to(btn, { scale: 1, duration: .45, ease: V2.spring() });
    const sc = wpState.score;
    V2.flyStar(btn, document.getElementById("wpScoreChip"), () => { wpScoreEl.textContent = "Score: " + sc; });
    if (!anim) wpScoreEl.textContent = "Score: " + wpState.score;
    mascot.cheer();
  } else {
    btn.classList.add("wrong");
    wpState.lives--;
    Lumio.beep(false);
    V2.shake(btn);
    updateHearts(true);
    mascot.sad();
  }
  V2.progress(progFill, wpState.round / wpState.total);
  setTimeout(nextWpRound, anim && isCorrect ? 900 : 550);
}
function endWordPop() {
  bobs.forEach(t => t.kill()); bobs = [];
  const ratio = wpState.score / wpState.total;
  const st = gameStars(ratio);
  const won = wpState.lives > 0;
  document.getElementById("wpNote").innerHTML = gameResultNote(saveGameResultToLesson(st, wpState.score, wpState.total));
  document.getElementById("wpEndScore").innerHTML = `Score: <b class="v2-n" data-to="${wpState.score}">${wpState.score}</b>/${wpState.total}`;
  endcard.querySelector(".v2-hero").src = "../assets/story/characters/" + (TEEN ? (won ? "lumi-teen-celebrate" : "lumi-teen-thumbs") : (won ? "lumi-celebrate" : "lumi-thumbs")) + ".png";
  V2.celebrate(endcard, Object.assign({ title: won ? "Nice popping! 🎈" : "Out of hearts!", confetti: won }, starsAward(st)));
}
document.getElementById("wpAgain").onclick = () => startWordPop(wpState.source);

pageIntro();
loadLessonVocabForGames().catch(() => {}).then(() => startWordPop());
</script>
