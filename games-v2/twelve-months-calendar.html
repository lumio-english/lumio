<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Twelve Months Calendar — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Twelve Months Calendar: a big wall calendar hangs on a nail. Each right answer slaps a star
     sticker on this month's page, the page tears off along the binding, flips over and falls away,
     the calendar swings, and the whole scene changes to the next month's mood (snow, hearts,
     spring petals, April rain, May sunshine, summer). */
  .lp-scene .bg{filter:blur(2.5px) saturate(1.08)}
  .lp-stage{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .tm-mood{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background-color 1s ease}
  .tm-fx{position:fixed;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
  .tm{width:100%;max-width:1260px;display:grid;grid-template-columns:1fr;gap:12px;justify-items:center;align-content:center;flex:1}

  /* ---- the wall calendar ---- */
  .tm-calcol{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
  .tm-hang{position:relative;width:min(330px,88vw);padding-top:22px;transform-origin:50% 0}
  .tm-nail{position:absolute;left:50%;top:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 35%,#fff,#B8BEC9 45%,#6B7280);box-shadow:0 3px 5px rgba(0,0,0,.4)}
  .tm-hang::before{content:"";position:absolute;left:50%;top:8px;width:46%;height:26px;transform:translateX(-50%);z-index:2;
    border:3px solid #6B4A2E;border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9}
  .tm-cal{position:relative;border-radius:16px;background:#7A5230;padding:10px 0 0;box-shadow:0 30px 50px -24px rgba(30,15,0,.85),0 8px 0 rgba(60,35,15,.35)}
  .tm-bind{position:absolute;left:0;right:0;top:-8px;height:24px;display:flex;justify-content:space-evenly;z-index:6;pointer-events:none}
  .tm-bind i{width:8px;height:24px;border-radius:5px;background:linear-gradient(90deg,#8A8F99,#F4F6FA 45%,#9BA1AB);box-shadow:0 2px 3px rgba(0,0,0,.35)}
  .tm-stack{position:relative;perspective:1100px;margin:0 6px 0}
  .tm-under{position:absolute;left:4px;right:4px;bottom:-5px;height:12px;border-radius:0 0 10px 10px;background:#EFE6D6;box-shadow:0 4px 0 #DCCDB4}
  .tm-page{position:relative;background:transparent;border-radius:10px 10px 12px 12px;transform-style:preserve-3d;
    box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 14px -8px rgba(60,30,5,.45)}
  .tm-page.under{position:absolute;inset:0}
  .tm-page .face{position:relative;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#FFFDF8;border-radius:inherit}
  .tm-page .back{position:absolute;inset:0;transform:rotateX(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;
    background:repeating-linear-gradient(180deg,#F7F1E6 0 22px,#EFE6D6 22px 23px)}
  .tm-perf{height:10px;background:radial-gradient(circle at 50% 0,rgba(120,90,60,.35) 2px,transparent 2.5px) 0 2px/12px 10px repeat-x,var(--mc)}
  .tm-photo{position:relative;aspect-ratio:2.2/1;background-color:var(--mc);background-repeat:no-repeat}
  .tm-photo::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -18px 18px -14px rgba(0,0,0,.25)}
  .tm-head{display:flex;align-items:center;gap:8px;padding:8px 12px 2px;color:var(--mc-ink)}
  .tm-head svg{width:30px;height:30px;flex:none}
  .tm-head b{font-family:var(--lp-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;letter-spacing:-.01em}
  .tm-head .yr{margin-left:auto;font-family:var(--lp-display);font-weight:800;font-size:15px;opacity:.6}
  .tm-sub{padding:0 12px 6px;font-weight:800;font-size:14px;color:#7B6352}
  .tm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 12px}
  .tm-grid .dh{font-family:var(--lp-display);font-weight:800;font-size:11px;text-align:center;color:#fff;background:var(--mc);border-radius:5px;padding:1px 0}
  .tm-grid .dh.we{opacity:.75}
  .tm-grid span{font-family:var(--lp-display);font-weight:800;font-size:12.5px;line-height:1;text-align:center;padding:4px 0 3px;color:#5B4636;border-radius:6px}
  .tm-grid span.we{color:var(--mc-ink)}
  .tm-grid span.one{background:var(--mc);color:#fff}
  .tm-stamp{position:absolute;right:10px;bottom:-34px;width:76px;height:76px;z-index:5;opacity:0;pointer-events:none}
  .tm-stamp svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(60,30,5,.35))}
  .tm-strip{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .tm-tab{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 6px;border-radius:999px;background:rgba(255,255,255,.55);
    font-family:var(--lp-display);font-weight:800;font-size:13px;color:#6B5040;box-shadow:0 4px 10px -6px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tm-tab svg{width:18px;height:18px}
  .tm-tab.now{background:#fff;box-shadow:0 0 0 3px var(--mc),0 6px 12px -6px rgba(0,0,0,.5);color:var(--mc-ink)}
  .tm-tab.done{background:var(--mc);color:#fff}
  .tm-tab.done svg{filter:brightness(0) invert(1)}
  .tm-noor{display:none}
  @media (max-width:899px){
    .tm-hang{width:min(300px,82vw);padding-top:18px}
    .tm-head{padding:5px 10px 0} .tm-head svg{width:24px;height:24px} .tm-head b{font-size:28px} .tm-head .yr{font-size:13px}
    .tm-sub{font-size:12.5px;padding:0 10px 4px}
    .tm-grid{padding:0 8px 8px;gap:1px} .tm-grid span{font-size:11px;padding:2px 0 1px} .tm-grid .dh{font-size:10px}
    .tm-stamp{width:60px;height:60px;bottom:-26px}
    .tm-strip{margin-top:12px;gap:5px;flex-wrap:nowrap} .tm-tab{height:28px;padding:0 6px;font-size:0;gap:0} .tm-tab svg{width:18px;height:18px}
  }

  /* ---- prompt + cards ---- */
  .tm-play{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .tm-ask{display:flex;align-items:flex-end;gap:8px;width:100%;justify-content:center}
  .tm-lumi{flex:none;height:92px;width:80px;display:flex;justify-content:center;align-items:flex-end}
  .tm-lumi .lp-actor{height:100%}
  .tm-ask .lp-bubble{flex:0 1 auto;margin-bottom:10px}
  .tm-ask .lp-bubble .tail{left:-8px;bottom:20px}
  .tm-cards{max-width:600px}
  .tm-cards.c3 .lp-card,.tm-cards.c2 .lp-card{width:100%;max-width:210px;justify-self:center}
  .tm-cards.c2{max-width:440px}
  .tm-cards .lp-card .lbl{font-size:clamp(14px,3.8vw,19px);overflow-wrap:anywhere;hyphens:auto}
  .lp-card .pic img{border-radius:12px}
  .tm-cards .lp-card.long .lbl{font-size:clamp(12.5px,3.3vw,17px);overflow-wrap:normal;word-break:normal}
  @media (max-width:420px){ .tm-cards{gap:10px} .tm-cards .lp-card .pic{margin:7px 7px 0;border-radius:14px} .tm-cards .lp-card .lbl{padding:6px 4px 9px} }

  @media (min-width:900px){
    .tm{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;align-items:center;min-height:calc(100dvh - 170px)}
    .tm-calcol{justify-self:end;width:auto;padding-left:150px}
    .tm-hang{width:430px}
    .tm-grid span{font-size:15px;padding:6px 0 5px}
    .tm-grid .dh{font-size:12.5px}
    .tm-sub{font-size:16px}
    .tm-noor{display:block;position:absolute;left:0;bottom:30px;height:330px;width:170px;z-index:7;pointer-events:none}
    .tm-noor .lp-actor{height:100%}
    .tm-play{justify-self:start;gap:18px}
    .tm-ask{justify-content:flex-start}
    .tm-lumi{height:180px;width:150px}
    .tm-cards{gap:18px}
  }
  @media (min-width:900px) and (max-height:780px){ .tm-hang{width:360px} .tm-grid span{font-size:13px;padding:4px 0 3px} .tm-noor{height:270px} .tm-lumi{height:140px;width:120px} }
  @media (max-height:740px) and (max-width:899px){ .tm-hang{width:min(250px,70vw)} .tm-grid span{padding:1px 0 0;font-size:10.5px} .tm-lumi{height:72px;width:62px} .tm-strip{margin-top:8px} }
</style>
</head>
<body>
<div class="tm-mood" id="mood"></div>
<canvas class="tm-fx" id="fx" aria-hidden="true"></canvas>
<main class="lp-stage" id="stage">
  <div class="tm">
    <section class="tm-calcol" aria-label="Wall calendar">
      <div class="tm-noor" id="noorZone"></div>
      <div class="tm-hang" id="hang">
        <span class="tm-nail"></span>
        <div class="tm-cal" id="cal">
          <div class="tm-bind" id="bind"></div>
          <div class="tm-stack" id="stack"><div class="tm-under"></div></div>
        </div>
      </div>
      <div class="tm-strip" id="calStrip"></div>
    </section>

    <section class="tm-play">
      <div class="tm-ask">
        <div class="tm-lumi" id="lumiZone"></div>
        <button class="lp-bubble" id="promptCard" type="button" aria-label="Hear it again">
          <span class="lp-speak" id="hearBtn" aria-hidden="true"></span>
          <span class="txt" id="promptText">Tap the picture you hear!</span>
          <span class="tail"></span>
        </button>
      </div>
      <div class="lp-cards c3 tm-cards" id="optGrid" aria-live="polite"></div>
    </section>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "level2";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;
const G = window.gsap, RM = LP.RM;

// One calendar page per round -- always the same 6 months in the same
// order regardless of lesson, so the "Twelve Months Club" theme reads
// clearly across every playthrough, whatever vocab is being practiced.
const MONTHS = [
  { name: "January", icon: "❄️", sub: "A brand new year!" },
  { name: "February", icon: "💗", sub: "Sharing kindness" },
  { name: "March", icon: "🌷", sub: "Flowers waking up" },
  { name: "April", icon: "🌧️", sub: "Rainy day puddles" },
  { name: "May", icon: "☀️", sub: "Warm and sunny" },
  { name: "June", icon: "🏖️", sub: "Summer begins!" },
];
// How each month looks: page colour, the month's own picture (assets/vocab/<month>.png, cropped to
// its illustration), the painting behind, the weather in the air and the light.
const LOOK = [
  { c: "#2F6FDB", ink: "#1E4FA8", crop: [75, 128, 460], bg: "assets/story/backgrounds/family-interior.jpg", fx: "snow",   mood: "rgba(80,120,230,.20)" },
  { c: "#E8476F", ink: "#C02853", crop: [78, 135, 460], bg: "assets/lesson-bg-kid/party.jpg",             fx: "hearts", mood: "rgba(255,120,170,.12)" },
  { c: "#4FA83D", ink: "#2F7D22", crop: [72, 128, 460], bg: "assets/lesson-bg-kid/park.jpg",              fx: "petals", mood: "rgba(140,230,120,.06)" },
  { c: "#3D86C6", ink: "#23608F", crop: [85, 105, 450], bg: "assets/story/backgrounds/village.jpg",        fx: "rain",   mood: "rgba(30,50,95,.34)" },
  { c: "#F59E0B", ink: "#B76E00", crop: [110, 165, 400], bg: "assets/story/backgrounds/forest.jpg",        fx: "sun",    mood: "rgba(255,225,130,.10)" },
  { c: "#F2B705", ink: "#A87400", crop: [72, 128, 460], bg: "assets/story/backgrounds/forest-stream.jpg",  fx: "summer", mood: "rgba(255,170,60,.10)" },
];
const ICONS = [
  '<svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="#3B82F6" stroke-width="2.6" stroke-linecap="round"><path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13"/><path d="M12 5l4 3 4-3M12 27l4-3 4 3M4 14l4.5 1-1.5 4.5M28 18l-4.5-1 1.5-4.5" fill="none"/></g></svg>',
  '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28S3 20.5 3 11.5A6.5 6.5 0 0116 8a6.5 6.5 0 0113 3.5C29 20.5 16 28 16 28z" fill="#FF5C8A" stroke="#D63366" stroke-width="2"/><path d="M8.5 10.5a3 3 0 013-2" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>',
  '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 18v11" stroke="#3E9B2F" stroke-width="2.6" stroke-linecap="round"/><path d="M16 25c-4 0-7-3-8-6 4 0 7 2 8 6zM16 23c3 0 6-2 7-5-3 0-6 1-7 5z" fill="#4FA83D"/><path d="M9 6l3.5 4L16 4l3.5 6L23 6v6a7 7 0 01-14 0z" fill="#FF6FA0" stroke="#D63366" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 18a6 6 0 01.6-11.9A8 8 0 0124 9a5 5 0 01-1 9.9z" fill="#B9C6D8" stroke="#7C8BA3" stroke-width="1.8"/><g stroke="#3BA0FF" stroke-width="2.4" stroke-linecap="round"><path d="M10 22l-1.5 4M16 22l-1.5 4M22 22l-1.5 4"/></g></svg>',
  '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5" fill="#FFC93C" stroke="#E08A00" stroke-width="2"/><g stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"><path d="M16 2.5v4M16 25.5v4M2.5 16h4M25.5 16h4M6.5 6.5l2.8 2.8M22.7 22.7l2.8 2.8M6.5 25.5l2.8-2.8M22.7 9.3l2.8-2.8"/></g></svg>',
  '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 15v14" stroke="#8A5A2B" stroke-width="2.4" stroke-linecap="round"/><path d="M3 15a13 10 0 0126 0z" fill="#FF7A3D" stroke="#C2530A" stroke-width="1.8"/><path d="M11.7 15a4.3 10 0 018.6 0" fill="#FFE27A"/><path d="M4 29c4-2 20-2 24 0" stroke="#F2C46A" stroke-width="3" stroke-linecap="round" fill="none"/></svg>',
];
const STAMP = '<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="#fff" stroke="#22C55E" stroke-width="5" stroke-dasharray="6 4"/><path d="M40 14l7.4 15 16.6 2.4-12 11.7 2.8 16.5L40 51.8l-14.8 7.8 2.8-16.5-12-11.7 16.6-2.4z" fill="#FFC93C" stroke="#E08A00" stroke-width="2.6" stroke-linejoin="round"/></svg>';

// Replays carry on through the year: a finished January-June game makes the next game July-December.
const MONTHS_LATER = [
  { name: "July", sub: "Beach days!" },
  { name: "August", sub: "Summer trips" },
  { name: "September", sub: "Back to school!" },
  { name: "October", sub: "Falling leaves" },
  { name: "November", sub: "Cozy and cool" },
  { name: "December", sub: "Holiday fun!" },
];
LOOK.push(
  { c: "#1E9BD7", ink: "#126E9C", crop: [100, 70, 450, 640], bg: "assets/story/backgrounds/forest-stream.jpg", fx: "summer", mood: "rgba(80,190,255,.10)" },
  { c: "#EF4B5F", ink: "#B92B3E", crop: [75, 90, 500, 640], bg: "assets/story/backgrounds/celebration.jpg",    fx: "sun",    mood: "rgba(255,200,120,.10)" },
  { c: "#F2711C", ink: "#B54C07", crop: [70, 130, 460], bg: "assets/story/backgrounds/classroom.jpg",          fx: "sun",    mood: "rgba(255,210,150,.08)" },
  { c: "#E8641B", ink: "#A9440B", crop: [70, 140, 500, 640], bg: "assets/story/backgrounds/forest.jpg",        fx: "leaves", mood: "rgba(230,120,30,.16)" },
  { c: "#D9572B", ink: "#9E3714", crop: [75, 140, 500, 640], bg: "assets/story/backgrounds/village.jpg",       fx: "leaves", mood: "rgba(120,70,40,.20)" },
  { c: "#14A3A3", ink: "#0C7474", crop: [70, 130, 460], bg: "assets/story/backgrounds/family-interior.jpg",    fx: "snow",   mood: "rgba(60,110,200,.16)" });
const LEAF = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26C6 13 14 5 27 5c0 13-8 21-21 21z" fill="#F2711C" stroke="#A9440B" stroke-width="2" stroke-linejoin="round"/><path d="M6 26L19 13" stroke="#A9440B" stroke-width="2" stroke-linecap="round"/></svg>';
const PENCIL = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26l2-7L21 6l5 5-13 13z" fill="#FFC93C" stroke="#B76E00" stroke-width="2" stroke-linejoin="round"/><path d="M6 26l2-7 5 5z" fill="#F7D9B0"/><path d="M19 8l5 5" stroke="#B76E00" stroke-width="2"/></svg>';
ICONS.push(ICONS[5], ICONS[4], PENCIL, LEAF, LEAF, ICONS[0]);
let HALF = 0; try { HALF = localStorage.getItem("lumio_tm_half") === "1" ? 1 : 0; } catch (e) {}
const OFF = HALF * 6, MON = HALF ? MONTHS_LATER : MONTHS, LK = LOOK.slice(OFF, OFF + 6), IC = ICONS.slice(OFF, OFF + 6);

LP.init({ scene: { bg: LK[0].bg, tint: "linear-gradient(180deg,rgba(255,240,220,.06),rgba(40,20,0,.22))" }, hud: { rounds: 6, exitHref: backHref } });
document.getElementById("hearBtn").innerHTML = LP.ICON.speaker;
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];

// ---------- Curated phonics word bank (each entry has a confirmed real vocab image) ----------
// Trimmed from phonics-hub/level2.json's own word lists down to the words that
// have real illustrations -- several phonics-only words (e.g. "jam", "frog")
// and all the sight-word units don't have picture support, so those are left
// out here rather than shown as a broken image.
const PHONICS_UNITS = [
  { words: ["van", "box", "zoo"] },          // Unit 1 (lesson 1): j,v,w,x,y,z
  { words: ["ship", "fish", "chair"] },      // Unit 2 (lesson 3): sh, ch
  null,                                       // Unit 3 (lesson 5): th, ng -- only "this" has an image, skipped
  { words: ["black", "clap", "slide"] },     // Unit 4 (lesson 7): l-blends
  { words: ["crab", "tree"] },               // Unit 5 (lesson 9): r-blends
  { words: ["star", "swim"] },               // Unit 6 (lesson 11): s-blends
  { words: ["rain", "tree", "boat"] },       // Unit 7 (lesson 13): vowel teams
  null,                                       // Unit 8 (lesson 15): sight words -- no picture support, skipped
  { words: ["fish", "star", "tree", "black"] }, // Unit 9 (lesson 17): review
];
// Phonics units land on lesson 1, 3, 5, 7... (unit i unlocks at lesson 2i-1) --
// so a round never draws on a sound group the child hasn't reached yet.
function eligiblePhonicsWords(lessonNum) {
  const words = new Set();
  PHONICS_UNITS.forEach((unit, i) => {
    if (unit && (2 * (i + 1) - 1) <= lessonNum) unit.words.forEach(w => words.add(w));
  });
  return [...words];
}
const phonicsPool = eligiblePhonicsWords(num);

// Sentence rounds speak the target's example sentence. A distractor that is ALSO named in that
// sentence ("It is three o'clock" -> clock, "Those are your shoes so these must be mine" -> these)
// or that shows the same picture (age / years old / birthday are all cakes) would be a second
// right answer, so it is never offered.
const mentions = (sentence, w) => new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|es)?\\b", "i").test(sentence || "");
const SAME_PICTURE = [["big", "elephant"], ["small", "mouse"], ["pet", "dog"], ["age", "years old", "birthday"]];
const samePicture = (a, b) => SAME_PICTURE.some(g => g.includes(a.toLowerCase()) && g.includes(b.toLowerCase()));
const imgKey = v => String(v.image || v.en).toLowerCase().replace(/'/g, "").replace(/ /g, "-");   // the data's own picture (e.g. "fish" -> fish-food in L1 lesson 8)
// two options may not share a picture file or the same Arabic meaning (fine / okay)
const clash = (a, b) => imgKey(a) === imgKey(b) || (a.ar && a.ar === b.ar) || samePicture(a.en, b.en) || mentions(a.en, b.en) || mentions(b.en, a.en);
function pickDistractors(target, n) {
  const others = Lumio.shuffle(vocab.filter(v => v.en !== target.en));
  const say = target.example || target.en;
  const out = [];
  others.forEach(v => { if (out.length < n && !mentions(say, v.en) && ![target, ...out].some(o => clash(o, v))) out.push(v); });
  if (out.length < Math.min(n, 2)) others.forEach(v => { if (out.length < n && !out.includes(v) && !mentions(say, v.en) && imgKey(v) !== imgKey(target)) out.push(v); });
  return out;
}

/* ---------- the calendar ---------- */
const stack = document.getElementById("stack"), hang = document.getElementById("hang"), calStrip = document.getElementById("calStrip");
document.getElementById("bind").innerHTML = "<i></i>".repeat(9);
const now = new Date(), YEAR = now.getFullYear() + (now.getMonth() >= 6 ? 1 : 0);   // the coming January-June
const DAYS = ["S", "M", "T", "W", "T", "F", "S"];
function pageHTML(i) {
  const m = MON[i], L = LK[i], first = new Date(YEAR, OFF + i, 1).getDay(), len = new Date(YEAR, OFF + i + 1, 0).getDate();
  const [x0, y0, cw, S = 600] = L.crop, ch = cw / 2.2;
  const bgSize = (S / cw * 100).toFixed(2), px = (x0 / (S - cw) * 100).toFixed(2), py = (y0 / (S - ch) * 100).toFixed(2);
  let grid = DAYS.map((d, k) => `<span class="dh${k === 0 || k === 6 ? " we" : ""}">${d}</span>`).join("");
  for (let k = 0; k < first; k++) grid += "<span></span>";
  for (let d = 1; d <= len; d++) { const wd = (first + d - 1) % 7; grid += `<span class="${d === 1 ? "one" : (wd === 0 || wd === 6) ? "we" : ""}">${d}</span>`; }
  for (let k = first + len; k < 42; k++) grid += "<span>&nbsp;</span>";   // always 6 weeks, so every page is the same height
  return `<div class="face"><div class="tm-perf"></div>` +
    `<div class="tm-photo" style="background-image:url('${LP.vocabImg(m.name)}');background-size:${bgSize}% auto;background-position:${px}% ${py}%"><div class="tm-stamp">${STAMP}</div></div>` +
    `<div class="tm-head">${IC[i]}<b>${m.name}</b><span class="yr">${YEAR}</span></div><div class="tm-sub">${LP.esc(m.sub)}</div>` +
    `<div class="tm-grid">${grid}</div></div><div class="back"></div>`;
}
const pages = MON.map((m, i) => {
  const p = document.createElement("div"); p.className = "tm-page" + (i ? " under" : ""); p.id = `calPage${i}`;
  p.style.setProperty("--mc", LK[i].c); p.style.setProperty("--mc-ink", LK[i].ink); p.style.zIndex = String(10 - i);
  p.innerHTML = pageHTML(i);
  if (i > 1) p.style.visibility = "hidden";               // only the top page and the one right under it are drawn
  stack.appendChild(p);
  const tab = document.createElement("div"); tab.className = "tm-tab" + (i === 0 ? " now" : ""); tab.id = `dot${i}`;
  tab.style.setProperty("--mc", LK[i].c); tab.style.setProperty("--mc-ink", LK[i].ink);
  tab.innerHTML = IC[i] + m.name.slice(0, 3); tab.setAttribute("aria-label", m.name);
  calStrip.appendChild(tab);
  return p;
});

/* ---------- the month's mood: painting, light and weather ---------- */
const mood = document.getElementById("mood"), cv = document.getElementById("fx"), cx = cv.getContext("2d");
let fxType = null, fxList = [], fxW = 0, fxH = 0, fxRaf = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
function fxSize() { const d = Math.min(2, devicePixelRatio || 1); fxW = cv.clientWidth; fxH = cv.clientHeight; cv.width = fxW * d; cv.height = fxH * d; cx.setTransform(d, 0, 0, d, 0, 0); }
fxSize(); addEventListener("resize", fxSize);
const FXN = { leaves: 22, snow: 70, hearts: 18, petals: 26, rain: 110, sun: 34, summer: 30 };
function mkP(init) {
  const t = fxType, p = { x: rnd(0, fxW), y: init ? rnd(0, fxH) : -20, r: rnd(0, 6.28), vr: rnd(-.03, .03), ph: rnd(0, 6.28) };
  if (t === "snow") Object.assign(p, { s: rnd(1.5, 4.2), vx: rnd(-.3, .3), vy: rnd(.5, 1.3) });
  if (t === "hearts") Object.assign(p, { s: rnd(6, 13), vx: rnd(-.2, .2), vy: -rnd(.4, .9), y: init ? rnd(0, fxH) : fxH + 20, c: ["#FF5C8A", "#FF8FB1", "#FFC2D4"][Math.floor(rnd(0, 3))] });
  if (t === "leaves") Object.assign(p, { s: rnd(5, 9), vx: rnd(-.7, .2), vy: rnd(.6, 1.2), c: ["230,120,40", "245,170,50", "200,70,40"][Math.floor(rnd(0, 3))] });
  if (t === "petals") Object.assign(p, { s: rnd(4, 8), vx: rnd(-.6, .1), vy: rnd(.5, 1.1), c: ["255,170,200", "255,214,228", "255,240,200"][Math.floor(rnd(0, 3))] });
  if (t === "rain") Object.assign(p, { s: rnd(10, 22), vx: -1.6, vy: rnd(9, 14), y: init ? rnd(0, fxH) : rnd(-60, -10) });
  if (t === "sun") Object.assign(p, { s: rnd(1.5, 3.5), vx: rnd(-.15, .15), vy: -rnd(.08, .3), y: init ? rnd(0, fxH) : fxH + 10 });
  if (t === "summer") Object.assign(p, { s: rnd(4, 12), vx: rnd(-.15, .15), vy: -rnd(.3, .8), y: init ? rnd(0, fxH) : fxH + 20 });
  return p;
}
function heart(s) { cx.beginPath(); cx.moveTo(0, s * .35); cx.bezierCurveTo(-s * 1.1, -s * .35, -s * .45, -s * 1.05, 0, -s * .45); cx.bezierCurveTo(s * .45, -s * 1.05, s * 1.1, -s * .35, 0, s * .35); cx.fill(); }
function fxDraw() {
  cx.clearRect(0, 0, fxW, fxH);
  for (const p of fxList) {
    if (!RM) { p.x += p.vx + (fxType === "petals" || fxType === "leaves" || fxType === "snow" ? Math.sin(p.ph) * .4 : 0); p.y += p.vy; p.ph += .02; p.r += p.vr; }
    if (p.y > fxH + 30 || p.y < -40 || p.x < -40 || p.x > fxW + 40) Object.assign(p, mkP(false));
    cx.save(); cx.translate(p.x, p.y);
    if (fxType === "snow") { cx.fillStyle = "rgba(255,255,255,.9)"; cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.28); cx.fill(); }
    else if (fxType === "hearts") { cx.rotate(Math.sin(p.ph) * .3); cx.globalAlpha = .75; cx.fillStyle = p.c; heart(p.s); }
    else if (fxType === "petals" || fxType === "leaves") { cx.rotate(p.r); cx.fillStyle = `rgba(${p.c},.9)`; cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .5, 0, 0, 6.28); cx.fill(); }
    else if (fxType === "rain") { cx.strokeStyle = "rgba(210,230,255,.55)"; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-p.s * .15, p.s); cx.stroke(); }
    else if (fxType === "sun") { const a = .4 + .6 * Math.abs(Math.sin(p.ph * 1.3)); const g = cx.createRadialGradient(0, 0, 0, 0, 0, p.s * 4); g.addColorStop(0, `rgba(255,236,150,${a})`); g.addColorStop(1, "rgba(255,236,150,0)"); cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, p.s * 4, 0, 6.28); cx.fill(); }
    else if (fxType === "summer") { cx.strokeStyle = "rgba(255,255,255,.7)"; cx.lineWidth = 1.4; cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.28); cx.stroke(); cx.fillStyle = "rgba(255,255,255,.55)"; cx.beginPath(); cx.arc(-p.s * .35, -p.s * .35, p.s * .22, 0, 6.28); cx.fill(); }
    cx.restore();
  }
  fxRaf = RM ? 0 : requestAnimationFrame(fxDraw);
}
function setMood(i, first) {
  const L = LK[i];
  if (!first) LP.sceneTo(L.bg);
  mood.style.backgroundColor = L.mood;
  const swap = () => { fxType = L.fx; fxList = []; const n = RM ? Math.round(FXN[L.fx] / 3) : FXN[L.fx]; for (let k = 0; k < n; k++) fxList.push(mkP(true)); cancelAnimationFrame(fxRaf); fxDraw(); };
  if (G && !RM && !first) G.to(cv, { opacity: 0, duration: .4, onComplete: () => { swap(); G.to(cv, { opacity: 1, duration: .8 }); } });
  else swap();
}
document.addEventListener("visibilitychange", () => { cancelAnimationFrame(fxRaf); if (!document.hidden && !RM) fxRaf = requestAnimationFrame(fxDraw); });
setMood(0, true);

/* ---------- the characters ---------- */
const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "pencil", cheer: "celebrate", oops: "surprised", alt: "Lumi" });
const noor = LP.actor(document.getElementById("noorZone"), { char: "noor", pose: "point", cheer: "celebrate", oops: "surprised", alt: "Noor" });

/* sticker, tear, flip, fall, swing */
function stampPage(i) {
  const st = pages[i].querySelector(".tm-stamp");
  if (!G || RM) { st.style.opacity = 1; LP.sfx("pop"); return Promise.resolve(); }
  return new Promise(res => G.timeline({ onComplete: res })
    .fromTo(st, { opacity: 0, scale: 2.6, rotation: -40 }, { opacity: 1, scale: 1, rotation: -12, duration: .32, ease: "power3.in", onComplete: () => {
      LP.sfx("pop"); const c = LP.center(st); LP.burst(c.x, c.y, { n: 14, speed: 5, shape: "star", colors: ["#FFD666", "#FFB300", "#22C55E", "#fff"] }); } })
    .to(st, { scale: 1.08, duration: .08, yoyo: true, repeat: 1 }));
}
function swing(power) {
  if (!G || RM) return;
  G.fromTo(hang, { rotation: power }, { rotation: 0, duration: 1.8, ease: "elastic.out(1,.18)", transformOrigin: "50% 0" });
}
function tearPage(i) {
  const p = pages[i], next = pages[i + 1];
  if (next) { next.style.visibility = "visible"; if (pages[i + 2]) pages[i + 2].style.visibility = "visible"; }
  if (!G || RM) { p.style.display = "none"; if (next) next.classList.remove("under"); return Promise.resolve(); }
  const r = p.getBoundingClientRect();
  // lift it free of the stack so it can fly off over everything
  const fly = p; const keepH = r.height;
  stack.style.minHeight = keepH + "px";
  return new Promise(res => {
    const tl = G.timeline({ onComplete: () => { fly.remove(); if (next) { next.classList.remove("under"); } stack.style.minHeight = ""; res(); } });
    tl.to(fly, { rotation: -3, y: 6, duration: .14, ease: "power2.out", transformOrigin: "100% 0%", onStart: () => LP.sfx("tick") })
      .to(fly, { rotation: 4, y: 10, duration: .12, ease: "power2.inOut", transformOrigin: "0% 0%" })
      .add(() => { LP.sfx("flip"); LP.burst(r.left + r.width / 2, r.top + 6, { n: 18, speed: 5, up: 1, colors: ["#FFFDF8", "#EFE6D6", LK[i].c], ring: false }); swing(-4); })
      .to(fly, { rotationX: 150, y: -40, z: 120, duration: .5, ease: "power2.out", transformOrigin: "50% 0%" })
      .to(fly, { y: innerHeight * .9, x: rnd(-140, 140), rotation: rnd(-40, 40), rotationX: 230, z: 220, opacity: 0, duration: .85, ease: "power2.in", onStart: () => LP.sfx("whoosh") }, "-=.05");
    if (next) G.fromTo(next, { scale: .985, y: 3 }, { scale: 1, y: 0, duration: .5, delay: .35, ease: "back.out(2)" });
  });
}
function showTab(i) {
  calStrip.querySelectorAll(".tm-tab").forEach((t, k) => t.classList.toggle("now", k === i));
  const t = document.getElementById(`dot${i}`); if (t && G && !RM) G.fromTo(t, { scale: .6 }, { scale: 1, duration: .5, ease: "back.out(3)" });
}

if (!vocab.length) {
  document.getElementById("optGrid").innerHTML = "<p class='lp-panel' style='padding:24px;grid-column:1/-1'>No lesson data found.</p>";
} else {
  const ROUNDS = 6;
  let r = 0, score = 0, locked = true;
  const optGrid = document.getElementById("optGrid"), hearBtn = document.getElementById("hearBtn");
  // One shared "already asked" set for the whole game (the old page picked every target at random,
  // so the same word often came up two or three times in one game while others never did).
  let usedThisGame = new Set();
  function pickUnused(pool, keyFn) {
    let avail = pool.filter(w => !usedThisGame.has(keyFn(w)));
    if (!avail.length) { pool.forEach(w => usedThisGame.delete(keyFn(w))); avail = pool.slice(); }   // only this pool starts over
    const pick = Lumio.shuffle(avail)[0];
    usedThisGame.add(keyFn(pick));
    return pick;
  }

  // Round plan: mostly phonics rounds (this level's main focus), with a
  // sentence-pattern round mixed in so vocabulary and the lesson's own
  // grammar pattern get covered too, not only sounds.
  const plan = [];
  for (let i = 0; i < ROUNDS; i++) plan.push((phonicsPool.length >= 2 && i % 3 !== 2) ? "phonics" : "sentence");
  if (phonicsPool.length < 2) plan.forEach((_, i) => plan[i] = "sentence");

  let currentTargetWord = "", currentSpeakText = "";
  const playPrompt = () => LP.say(currentSpeakText, hearBtn);

  async function drawRound() {
    locked = true; LP.answer = null;
    LP.round(r);
    lumi.set("pencil");
    optGrid.innerHTML = "";
    let words, pics = {};
    if (plan[r] === "phonics") {
      const target = pickUnused(phonicsPool, w => w);
      words = Lumio.shuffle([target, ...Lumio.shuffle(phonicsPool.filter(w => w !== target)).slice(0, Math.min(2, phonicsPool.length - 1))]);
      currentTargetWord = currentSpeakText = target;
    } else {
      const target = pickUnused(vocab, w => w.en);
      const opts = Lumio.shuffle([target, ...pickDistractors(target, 2)]);
      words = opts.map(o => o.en); pics = Object.fromEntries(opts.map(o => [o.en, LP.vocabImg(imgKey(o))]));
      currentTargetWord = target.en;
      currentSpeakText = target.example || target.en;
    }
    window.__lastTarget = currentTargetWord; // exposed for automated QA only
    await LP.banner(MON[r].name, "Round " + (r + 1) + " of " + ROUNDS);
    optGrid.className = "lp-cards tm-cards " + (words.length === 2 ? "c2" : "c3");
    // load the pictures first so a card never flashes its letter-tile placeholder
    await Promise.race([Promise.all(words.map(w => new Promise(ok => { const im = new Image(); im.onload = im.onerror = ok; im.src = pics[w] || LP.vocabImg(w); }))), LP.wait(1500)]);
    const cards = words.map(w => { const c = LP.picCard(w, { img: pics[w] || LP.vocabImg(w) }); if (w.length > 9) c.classList.add("long"); c.onclick = () => choose(c); optGrid.appendChild(c); return c; });
    if (G && !RM) G.fromTo("#promptCard", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2)" });
    lumi.nod();
    await LP.deal(cards, document.getElementById("cal"));
    locked = false;
    LP.answer = currentTargetWord;   // read by the automated play-through tests
    playPrompt();
  }

  async function choose(card) {
    if (locked) return;
    const ok = card.dataset.word === currentTargetWord;
    if (!ok) {
      // gentle -- no scoring penalty, no lockout; they simply try another card
      LP.bad(card); lumi.oops("surprised", "pencil"); noor.oops("surprised", "point");
      card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
      return;
    }
    locked = true; score++; LP.answer = null;
    const cards = [...optGrid.children];
    cards.forEach(c => c.disabled = true);
    lumi.cheer("celebrate", false); noor.cheer("celebrate");
    LP.fill(r);
    document.getElementById(`dot${r}`).classList.add("done");
    await LP.good(card);
    LP.clear(cards);
    await stampPage(r);
    await LP.wait(250);
    if (r + 1 < ROUNDS) {
      await tearPage(r);
      setMood(r + 1);
      showTab(r + 1);
      await LP.wait(350);
      r++; drawRound();
    } else {
      swing(5); LP.sfx("win");
      const c = LP.center(document.getElementById("cal")); LP.burst(c.x, c.y, { n: 50, speed: 10 });
      await LP.wait(1300);
      endGame();
    }
  }

  function endGame() {
    LP.round(-1);
    try { localStorage.setItem("lumio_tm_half", HALF ? "0" : "1"); } catch (e) {}
    LP.results({ score, total: ROUNDS, title: "Another page in the book!", scoreLabel: "Pages filled",
      note: `You filled ${score} out of ${ROUNDS} calendar pages!`, actor: { char: "lumi", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  document.getElementById("promptCard").onclick = playPrompt;
  LP.title({ kicker: "Level 2 · Listen and flip", title: "Twelve Months Calendar", sub: "Listen, tap the right picture and tear off the next month!",
    ar: "استمع واختر الصورة الصحيحة لتقلب صفحة التقويم", actor: { char: "lumi", pose: "wave-book", cheer: "celebrate" } }).then(() => { noor.enter("bottom"); drawRound(); });
}
</script>
</body>
</html>
