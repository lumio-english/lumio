<style>
  /* Story Detective: a dark library after hours. A flashlight follows the pointer, the
     case board fills with pinned evidence linked by red yarn, and CASE CLOSED slams down. */
  :root{--sd-type:'Special Elite','Courier New',ui-monospace,monospace;--sd-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;--sd-red:#C81D25;--sd-paper:#F7EEDB}
  .sd-dark{position:fixed;inset:0;z-index:1;pointer-events:none;--x:50vw;--y:35vh;
    background:radial-gradient(circle at var(--x) var(--y),rgba(255,226,160,.16) 0,rgba(255,214,140,.06) 80px,rgba(5,4,12,.22) 190px,rgba(5,4,12,.66) 420px)}
  .sd-beam{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px;border-radius:50%;z-index:2;pointer-events:none;background:rgba(255,236,190,.9);box-shadow:0 0 30px 12px rgba(255,220,150,.35);opacity:.55}
  .sd{position:relative;width:100%;max-width:1240px;display:flex;flex-direction:column;gap:12px;align-items:stretch;justify-content:center;min-height:calc(100dvh - 170px)}

  /* ---------- the case board ---------- */
  .sd-board{position:relative;border-radius:18px;padding:12px 12px 16px;--bx:50%;--by:30%;
    background:
      radial-gradient(circle at 20% 30%,rgba(60,30,10,.35) 0 1px,transparent 2px) 0 0/9px 11px,
      radial-gradient(circle at 70% 60%,rgba(255,220,170,.25) 0 1px,transparent 2px) 0 0/13px 7px,
      linear-gradient(160deg,#A8784A,#8A5D35 55%,#6E4826);
    box-shadow:0 0 0 7px #3B2416,0 0 0 9px #5A3A22,inset 0 0 40px rgba(30,12,0,.6),0 30px 60px -20px rgba(0,0,0,.9)}
  .sd-board::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(circle at var(--bx) var(--by),rgba(255,236,190,.42),rgba(255,236,190,.08) 160px,rgba(0,0,0,.22) 320px);mix-blend-mode:soft-light}
  .sd-head{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;margin:0 2px 8px}
  .sd-head h2{margin:0;font-family:var(--sd-hand);font-weight:700;font-size:clamp(21px,5.4vw,34px);color:#FFF4DC;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);transform:rotate(-1.5deg)}
  .sd-tag{flex:none;font-family:var(--sd-type);font-size:12px;color:#2B1D10;background:var(--sd-paper);padding:4px 8px;border-radius:3px;transform:rotate(2deg);box-shadow:0 4px 8px -3px rgba(0,0,0,.5);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sd-yarn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
  .sd-yarn path{fill:none;stroke:#D7262E;stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
  .sd-slots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;justify-items:center;padding:6px 2px 0}
  .sd-ev{position:relative;width:min(100%,94px);transform:rotate(var(--rot,0deg))}
  .sd-ev:nth-child(1){--rot:-4deg}.sd-ev:nth-child(2){--rot:3deg;margin-top:8px}.sd-ev:nth-child(3){--rot:-2deg}
  .sd-ev:nth-child(4){--rot:2.5deg}.sd-ev:nth-child(5){--rot:-3.5deg;margin-top:6px}.sd-ev:nth-child(6){--rot:4deg}
  .sd-ev .slot{aspect-ratio:4/4.9;border-radius:6px;border:2px dashed rgba(255,240,215,.35);display:grid;place-items:center;color:rgba(255,240,215,.55);font-family:var(--sd-type);font-size:15px}
  .sd-ev .slot svg{width:42%;opacity:.35}
  .sd-ev .slot span{display:block;text-align:center;margin-top:-8px}
  .sd-ev .card{position:absolute;inset:0;background:#FBF8F2;border-radius:3px;padding:6px 6px 0;box-shadow:0 10px 16px -6px rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;opacity:0}
  .sd-ev.filled .card{opacity:1}
  .sd-ev .ph{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:1px;background:radial-gradient(90% 90% at 50% 35%,#FFFFFF,#EDE6D8)}
  .pf img{position:absolute;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
  .sd-ev .ph.note{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;
    background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(70,110,170,.22) 13px 14px),linear-gradient(180deg,#FFFBEF,#F3E9D2)}
  .sd-ev .ph.note::before{content:"";position:absolute;right:-14px;bottom:-14px;width:46px;height:46px;border-radius:50%;border:4px solid rgba(120,70,20,.16)}
  .sd-ev .ph.note .tw{display:block;max-width:100%;font-family:var(--sd-type);color:#1E1A16;font-size:19px;line-height:1.05;overflow-wrap:normal;word-break:keep-all}
  .sd-ev .ph.note .ar{font-family:'Tajawal',sans-serif;font-weight:800;font-size:clamp(10px,2.8vw,14px);color:#8A3B12}
  .sd-ev .ph.note svg{width:38%;color:#8A3B12}
  .sd-ev .cap{font-family:var(--sd-hand);font-weight:700;color:#2B1D10;font-size:clamp(14px,3.8vw,20px);text-align:center;line-height:1;padding:4px 2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sd-ev .pin{position:absolute;left:50%;top:-9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;z-index:4;opacity:0;
    background:radial-gradient(circle at 35% 30%,#FF8A8A,#D7262E 45%,#7A0D12);box-shadow:0 4px 4px rgba(0,0,0,.5)}
  .sd-ev.filled .pin{opacity:1}
  .sd-ev .stamp{position:absolute;right:-16px;bottom:-10px;z-index:5;font-family:var(--sd-type);font-size:11px;color:#15803D;border:2px solid #15803D;border-radius:4px;padding:1px 5px;background:rgba(240,255,240,.85);transform:rotate(-12deg);opacity:0}
  .sd-closed{position:absolute;left:50%;top:52%;z-index:6;transform:translate(-50%,-50%) rotate(-9deg);opacity:0;pointer-events:none;white-space:nowrap;
    font-family:var(--sd-type);font-size:clamp(34px,10vw,64px);letter-spacing:.06em;color:var(--sd-red);padding:6px 22px;border:6px double var(--sd-red);border-radius:12px;
    background:rgba(255,244,232,.88);box-shadow:0 10px 30px rgba(0,0,0,.5);
    -webkit-mask:repeating-radial-gradient(circle at 30% 40%,#000 0 3px,rgba(0,0,0,.72) 4px 5px);mask:repeating-radial-gradient(circle at 30% 40%,#000 0 3px,rgba(0,0,0,.72) 4px 5px)}

  /* ---------- the desk: detective, witness and the case file ---------- */
  .sd-desk{display:flex;align-items:flex-end;gap:8px}
  .sd-cast{position:relative;flex:none;width:124px;height:178px;transition:width .4s,height .4s}
  .sd-cast .det{position:absolute;left:0;bottom:0;height:100%;transition:transform .5s ease}
  .sd-cast .wit{position:absolute;right:-6px;bottom:0;height:88%;opacity:0}
  .sd-cast .lp-actor{height:100%}
  .sd-cast.duo .det{transform:translateX(-22px) scale(.9);transform-origin:50% 100%}
  .sd-file{position:relative;flex:1;min-width:0;cursor:pointer;border-radius:6px 16px 16px 16px;padding:14px 14px 12px;
    background:linear-gradient(180deg,#E9C989,#D9B06A);color:#2B1D10;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 18px 30px -14px rgba(0,0,0,.85)}
  .sd-file::before{content:"";position:absolute;left:0;top:-14px;width:42%;height:16px;border-radius:8px 10px 0 0;background:#E9C989}
  .sd-file .tab{position:absolute;left:12px;top:-12px;font-family:var(--sd-type);font-size:11px;color:#6B4A1E;letter-spacing:.08em}
  .sd-file .kick{display:inline-block;font-family:var(--sd-type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--sd-red);padding:3px 9px;border-radius:3px;transform:rotate(-1.5deg);margin-bottom:6px}
  .sd-file .row{display:flex;align-items:flex-start;gap:10px}
  .sd-file .prompt{flex:1;min-width:0;margin:0;font-family:var(--lp-display);font-weight:800;font-size:clamp(17px,4.4vw,22px);line-height:1.22;overflow-wrap:anywhere}
  .sd-file .prompt .ar{font-family:'Tajawal',sans-serif;font-weight:800;font-size:1.18em;color:#8A1D12;unicode-bidi:isolate}
  .sd-file .prompt .cl{color:#0B5B3A}
  .sd-file .prompt.dlg{font-family:var(--lp-body);font-weight:800;font-size:clamp(14px,3.7vw,17px);line-height:1.35}
  .sd-file .prompt .q{display:block;margin:2px 0 4px;padding-left:10px;border-left:3px solid rgba(139,29,18,.5);font-style:italic}
  .sd-file .prompt .ask{display:block;font-family:var(--lp-display);color:#8A1D12;font-size:1.05em}
  .sd-file .prompt .truth{display:block;margin-top:6px;font-size:.82em;color:#0B5B3A}
  .sd-file .lp-speak{width:48px;height:48px}

  /* ---------- answer cards: index cards and rubber stamps ---------- */
  .sd-opts{display:grid;gap:10px;width:100%;perspective:900px}
  .sd-opts.find{grid-template-columns:repeat(3,1fr)}
  .sd-opts.tf{grid-template-columns:1fr 1fr;max-width:520px;justify-self:center;margin:0 auto}
  .lp .sd-card{position:relative;border:none;cursor:pointer;min-height:64px;padding:16px 10px 12px;border-radius:4px;color:#1E1A16;touch-action:manipulation;
    background:linear-gradient(180deg,transparent 0 13px,rgba(215,38,46,.55) 13px 15px,transparent 15px) ,repeating-linear-gradient(180deg,transparent 0 21px,rgba(70,110,170,.18) 21px 22px),var(--sd-paper);
    box-shadow:0 12px 20px -10px rgba(0,0,0,.85);font-family:var(--sd-type);font-size:clamp(16px,4.3vw,21px);line-height:1.15;overflow-wrap:anywhere;transition:filter .3s,opacity .3s}
  .lp .sd-card:nth-child(1){transform:rotate(-1.2deg)}.lp .sd-card:nth-child(2){transform:rotate(.8deg)}.lp .sd-card:nth-child(3){transform:rotate(-.6deg)}
  .lp .sd-card.line{text-align:left;font-family:var(--lp-body);font-weight:800;font-size:clamp(14px,3.7vw,17px);line-height:1.3;padding:18px 14px 12px}
  .sd-card .ring{position:absolute;inset:-4px;border-radius:8px;border:4px solid var(--lp-good);opacity:0;pointer-events:none;box-shadow:0 0 22px rgba(34,197,94,.6)}
  .sd-card.good .ring{opacity:1}
  .sd-card.bad .ring{opacity:1;border-color:var(--lp-bad);box-shadow:0 0 18px rgba(244,63,94,.5)}
  .sd-card.dim{opacity:.4;filter:grayscale(.7)}
  .sd-card[disabled]{cursor:default}
  .lp .sd-stampbtn{position:relative;border:none;cursor:pointer;min-height:66px;border-radius:10px;background:var(--sd-paper);display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 12px 20px -10px rgba(0,0,0,.85);font-family:var(--sd-type);font-size:clamp(20px,5.4vw,26px);letter-spacing:.08em;touch-action:manipulation}
  .sd-stampbtn .ink{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border:3px solid currentColor;border-radius:8px;transform:rotate(-4deg)}
  .sd-stampbtn .ink svg{width:22px;height:22px}
  .lp .sd-stampbtn.t{color:#15803D}.lp .sd-stampbtn.f{color:var(--sd-red)}
  .sd-stampbtn .ring{position:absolute;inset:-4px;border-radius:14px;border:4px solid #FDE68A;opacity:0;pointer-events:none}
  .sd-stampbtn.good .ring{opacity:1}.sd-stampbtn.bad .ring{opacity:1;border-color:var(--lp-bad)}
  .sd-stampbtn[disabled]{cursor:default}.sd-stampbtn.dim{opacity:.45}

  /* end: the crew bursts in */
  .sd-crew{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sd-crew img{height:clamp(110px,22vh,220px);margin:0 -12px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.6));opacity:0}

  @media (max-width:420px){ .lp .sd-opts.find .sd-card{font-size:15px;padding:16px 6px 10px;min-height:84px} }
  @media (max-width:959px){
    .sd-ev{width:min(100%,82px)} .sd-slots{gap:8px 10px;padding-top:2px}
    .sd.dlg .sd-cast{width:92px;height:128px}
    .sd.dlg .sd-file .prompt.dlg{font-size:14px;line-height:1.3}
    .lp .sd.dlg .sd-card.line{font-size:14px;padding:16px 12px 10px;min-height:56px}
    .sd.dlg .sd-ev{width:min(100%,60px)} .sd.dlg .sd-head h2{font-size:19px} .sd.dlg .sd-slots{gap:4px 10px}
    .sd.dlg .sd-ev .cap{font-size:12px} .sd.dlg .sd-ev .stamp{display:none}
  }
  @media (max-height:760px) and (max-width:959px){ .sd-cast{width:100px;height:128px} .sd-ev{width:min(100%,70px)} }
  @media (min-width:960px){
    .sd{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px 34px;align-items:center;min-height:calc(100dvh - 120px);align-content:center}
    .sd-board{grid-row:1 / span 2;padding:18px 22px 26px}
    .sd-slots{gap:30px 22px;padding-top:12px}
    .sd-ev{width:min(100%,150px)}
    .sd-ev .stamp{font-size:14px}
    .sd-cast{width:200px;height:250px}
    .sd-desk{align-self:end}
    .sd-opts{align-self:start}
    .sd-tag{font-size:14px}
  }
  .sd-card .t{display:block;max-width:100%}
  .lp-stage{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="sd-dark" id="dark" aria-hidden="true"></div>
<main class="lp-stage" id="stage">
  <div class="sd" id="sd">
    <section class="sd-board" id="board" aria-label="Case board">
      <div class="sd-head"><h2>Case file: What Really Happened?</h2><span class="sd-tag" id="caseTag">CASE #1</span></div>
      <div class="sd-slots" id="slots"></div>
      <svg class="sd-yarn" id="yarn" aria-hidden="true"></svg>
      <div class="sd-closed" id="closed" aria-hidden="true">CASE CLOSED</div>
    </section>
    <div class="sd-desk">
      <div class="sd-cast" id="cast"><div class="det" id="detZone"></div><div class="wit" id="witZone"></div></div>
      <div class="sd-file" id="promptCard" role="button" tabindex="0" aria-label="Hear it again">
        <span class="tab">CASE FILE</span>
        <span class="kick" id="kicker">Find the evidence</span>
        <div class="row"><p class="prompt" id="promptText" aria-live="polite"></p><span class="lp-speak" id="hearBtn" aria-hidden="true"></span></div>
      </div>
    </div>
    <div class="sd-opts" id="opts"></div>
  </div>
</main>

function picImg(en) {

  const [x1, y1, x2, y2, W, H] = PICS[k], cw = (x2 - x1) / 1000 * W, ch = (y2 - y1) / 1000 * H, s = 0.88 / Math.max(cw, ch);

/* ---------- flashlight that follows the pointer (drifts on its own when idle) ---------- */
(function flashlight() {
  const dark = $("dark"), board = $("board");
  let x = innerWidth * .5, y = innerHeight * .32, tx = x, ty = y, last = -1e9;
  const put = () => {
    dark.style.setProperty("--x", x.toFixed(1) + "px"); dark.style.setProperty("--y", y.toFixed(1) + "px");
    const r = board.getBoundingClientRect(); board.style.setProperty("--bx", (x - r.left).toFixed(0) + "px"); board.style.setProperty("--by", (y - r.top).toFixed(0) + "px");
  };
  if (RM) { put(); return; }
  const aim = e => { tx = e.clientX; ty = e.clientY; last = performance.now(); };
  addEventListener("pointermove", aim, { passive: true }); addEventListener("pointerdown", aim, { passive: true });
  const loop = (t) => {
    if (t - last > 3200) { tx = innerWidth * (.5 + .32 * Math.sin(t / 2700)); ty = innerHeight * (.36 + .16 * Math.sin(t / 1900 + 1)); }
    x += (tx - x) * .09; y += (ty - y) * .09; put(); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();

 were hoping?", "Even more, honestly. The decorations looked amazing once everyone arrived.", "Nice! Was the music good, or did someone take control of the playlist?", "Both, actually. We played games for hours before we even got to the cake.", "Sounds like a great night. Did you get any interesting gifts?", "A few, but honestly the games and the people mattered way more than the gifts."], ["Tell me about the most unforgettable day you've had this year.", "Honestly, the day I woke up and just knew something good was coming.", "That's a good feeling. What happened after you got ready and left the house?", "We ended up celebrating something completely unexpected with the whole family.", "That sounds special. Is that a day you'll actually remember for years?", "Definitely. Some days you just know you'll never forget, and that was one."], ["What were you doing during the surprise announcement? I saw your face.", "Honestly, I was thinking about something completely unrelated at that exact moment.", "That explains the confused look. What was everyone else doing while you zoned out?", "They were watching closely, but I was laughing at something on my phone instead.", "Classic you. Were you even listening when they said the actual news?", "Barely, but I caught the important part while everyone else was still talking about it."], ["If I interviewed you right now, what's your favorite memory from this year?", "Honestly, probably the challenge I overcame during that group project earlier.", "That's a good answer. What about your biggest personal achievement so far?", "Learning to speak up more, actually. That felt like a real adventure for me.", "That's a great story, honestly. More people should hear that experience.", "Thanks, maybe I'll actually tell it properly one day instead of just summarizing it."], ["How was movie night? Did you actually pick something good this time?", "I chose a comedy, and honestly we laughed way more than I expected.", "Nice. Did anyone fall asleep halfway through, like always happens?", "Of course, my brother did, while he was still texting someone the whole time.", "Classic. Would you actually recommend it, or was it just okay?", "I'd recommend it, honestly. We even shared the ending with a friend who missed it."], ["You look stressed. What happened, did you lose something important?", "My backpack, actually. I searched everywhere and started getting really worried.", "That's terrifying. Did you eventually find it, or is it still missing?", "Found it, thankfully, under a bench where I'd forgotten I sat down.", "I bet you felt so relieved. That could've ruined your entire week.", "Completely. I'm being way more careful with my stuff from now on, honestly."], ["If you told your own story from this whole level, how would it start?", "Honestly, I'd say I went from nervous to excited because I finally understood past tense.", "That's a great start. What's the most unforgettable part of your story?", "Probably realizing I could actually tell a whole story without stopping to translate.", "That's something to be proud of, genuinely. Your story really did improve a lot.", "Thanks. I can't wait to see how the next chapter of this story goes."]];
const dialoguePool = ALL_DIALOGUES.slice(0, num);

const ICO_QUOTE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16a2 2 0 012 2v9a2 2 0 01-2 2h-9l-5 4v-4H4a2 2 0 01-2-2V7a2 2 0 012-2z" opacity=".9"/><path d="M8 9.5h8M8 13h5" stroke="#FFF7E6" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICO_PRINT = '<svg viewBox="0 0 40 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 4c-9 0-15 7-15 17M20 10c-6 0-10 5-10 12 0 8 3 14 6 19M20 16c-3 0-5 3-5 7 0 7 3 13 7 18M20 22c0 7 2 13 6 18M35 21c0-9-6-17-15-17M30 22c0-7-4-12-10-12M25 24c0-5-2-8-5-8M30 30c0 5 1 9 3 12"/></svg>';
const ICO_X = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';

if (!vocab.length) {
  $("promptText").textContent = "No lesson data found.";
} else {
  const ROUNDS = 6;
  // Round plan: find-evidence and verify-clue rounds (original mechanics)
  // plus a witness-testimony round using this lesson's real dialogue --
  // covers dialogues/conversations alongside vocabulary judgment.
  const PLAN = ["find", "verify", "dialogue", "find", "verify", "dialogue"];
  const order = Lumio.shuffle([...vocab]).slice(0, ROUNDS);
  let r = 0, score = 0, locked = true, dlgCount = 0;
  const opts = $("opts"), kicker = $("kicker"), promptText = $("promptText"), hearBtn = $("hearBtn"), slotsEl = $("slots"), yarn = $("yarn"), board = $("board");

  // the six empty evidence slots on the board
  for (let i = 0; i < ROUNDS; i++) {
    const ev = document.createElement("div"); ev.className = "sd-ev"; ev.id = `ev${i}`;
    ev.innerHTML = `<div class="slot">${ICO_PRINT}<span>#${i + 1}</span></div><div class="card"></div><span class="pin"></span><span class="stamp">CONFIRMED</span>`;
    slotsEl.appendChild(ev);
  }

  let currentSpeak = "", speakIsLine = false;
  const playPrompt = () => { if (!currentSpeak) return; speakIsLine ? sayLine(currentSpeak, hearBtn) : LP.say(currentSpeak, hearBtn); };
  // shrink an answer card's text until the longest word fits (never clip "counterargument")
  function fitBtn(b) { const t = b.querySelector(".t"); if (!t) return; t.style.fontSize = ""; let f = parseFloat(getComputedStyle(t).fontSize); while (t.scrollWidth > t.clientWidth + 1 && f > 11) { f -= 1; t.style.fontSize = f + "px"; } }
  addEventListener("resize", () => [...opts.querySelectorAll("button")].forEach(fitBtn));

  /* red yarn between the pinned clues */
  const pinPt = i => { const p = document.querySelector(`#ev${i} .pin`).getBoundingClientRect(), b = board.getBoundingClientRect(); return { x: p.left + p.width / 2 - b.left, y: p.top + p.height / 2 - b.top }; };
  function yarnPath(i) { const a = pinPt(i - 1), b = pinPt(i), d = Math.hypot(b.x - a.x, b.y - a.y); return `M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${((a.x + b.x) / 2).toFixed(1)} ${(Math.max(a.y, b.y) + 16 + d * .14).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`; }
  let filledN = 0;
  function redrawYarn() { yarn.innerHTML = ""; for (let i = 1; i < filledN; i++) { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", yarnPath(i)); yarn.appendChild(p); } }
  addEventListener("resize", () => { clearTimeout(redrawYarn._t); redrawYarn._t = setTimeout(redrawYarn, 120); });
  function drawYarnTo(i) {
    if (i < 1) return;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", yarnPath(i)); yarn.appendChild(p);
    if (!G || RM) return;
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    G.to(p, { strokeDashoffset: 0, duration: .6, ease: "power2.inOut", onComplete: () => { p.style.strokeDasharray = ""; p.style.strokeDashoffset = ""; } });
  }

  // pin a piece of evidence into slot idx, flying it in from the card that was chosen
  async function pinEvidence(idx, item, fromEl, confirmed) {
    const ev = $(`ev${idx}`), card = ev.querySelector(".card");
    if (item.dialogue) card.innerHTML = `<div class="ph note">${ICO_QUOTE}<span class="tw">clue found</span></div><div class="cap">testimony</div>`;
    else {
      const img = picImg(item.image || item.en);
      card.innerHTML = img ? `<div class="ph pf">${img}</div><div class="cap">${LP.esc(item.en)}</div>`
        : `<div class="ph note"><span class="tw">${LP.esc(item.en)}</span><span class="ar" dir="rtl" lang="ar">${LP.esc(item.ar)}</span></div><div class="cap">exhibit ${"ABCDEF"[idx]}</div>`;
    }
    ev.classList.add("filled"); fitCard(card);
    filledN = Math.max(filledN, idx + 1);
    const pin = ev.querySelector(".pin"), stamp = ev.querySelector(".stamp");
    if (!G || RM) { if (confirmed) stamp.style.opacity = 1; drawYarnTo(idx); return; }
    if (fromEl) {
      const a = LP.center(fromEl), b = LP.center(ev);
      LP.sfx("whoosh");
      await Promise.race([LP.wait(3500), new Promise(res => G.fromTo(card, { x: a.x - b.x, y: a.y - b.y, scale: .55, rotation: -28, opacity: .3 }, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: .7, ease: "power3.inOut", onComplete: res }))]);
    } else G.fromTo(card, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: "back.out(2)" });
    LP.sfx("tap");
    G.fromTo(pin, { y: -36, scale: 1.8, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .32, ease: "back.out(3)" });
    G.fromTo(board, { y: 0 }, { y: 3, duration: .06, yoyo: true, repeat: 1 });
    drawYarnTo(idx);
    if (confirmed) { LP.sfx("pop"); G.fromTo(stamp, { scale: 2.6, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: -12, duration: .35, ease: "power3.in", delay: .25 }); }
  }

  // shrink typed words / captions until they fit the polaroid (never break a word mid-letter)
  function fitCard(card) {
    card.querySelectorAll(".tw,.cap").forEach(el => {
      el.style.fontSize = ""; let f = parseFloat(getComputedStyle(el).fontSize);
      const wide = () => el.scrollWidth > el.clientWidth + 1;
      while (wide() && f > 8) { f -= 1; el.style.fontSize = f + "px"; }
    });
  }
  addEventListener("resize", () => document.querySelectorAll(".sd-ev.filled .card").forEach(fitCard));
  // phones: make sure all the answer cards are in view
  function reveal() {
    const last = opts.lastElementChild; if (!last) return;
    const b = last.getBoundingClientRect().bottom, lim = innerHeight - 74;
    if (b > lim) window.scrollBy({ top: b - lim, behavior: RM ? "auto" : "smooth" });
  }
  function setKicker(t) { kicker.textContent = t; if (G && !RM) G.fromTo(kicker, { scale: 1.6, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -1.5, duration: .35, ease: "power3.in" }); }
  function typeIn(el, html) {
    // reveal the overheard lines like a typewriter (instant for reduced motion)
    el.innerHTML = html;
    if (!G || RM) return Promise.resolve();
    const qs = [...el.querySelectorAll(".q")], full = qs.map(q => q.textContent);
    qs.forEach(q => q.textContent = "");
    return new Promise(res => {
      let qi = 0, ci = 0;
      const tick = () => {
        if (qi >= qs.length) return res();
        ci += 3; qs[qi].textContent = full[qi].slice(0, ci);
        if (ci % 9 === 0) LP.sfx("tick");
        if (ci >= full[qi].length) { qs[qi].textContent = full[qi]; qi++; ci = 0; }
        setTimeout(tick, 18);
      };
      tick();
    });
  }

  function makeCard(key, text, cls) {
    const b = document.createElement("button"); b.type = "button"; b.className = "sd-card " + (cls || ""); b.dataset.key = key;
    b.innerHTML = `<span class="t">${LP.esc(text)}</span><span class="ring"></span>`;
    return b;
  }

  async function drawRound() {
    locked = true; LP.answer = null;
    LP.round(r);
    const target = order[r % order.length];
    const type = dialoguePool.length ? PLAN[r] : (r % 2 === 1 ? "verify" : "find");
    opts.innerHTML = ""; opts.className = "sd-opts";
    if (scrollY > 0) window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
    const label = type === "dialogue" ? "Witness testimony" : type === "verify" ? "Verify the clue" : "Find the evidence";
    await LP.banner("Clue " + (r + 1), label);
    setKicker(label);
    let cards = [], answer;
    $("sd").classList.toggle("dlg", type === "dialogue");
    document.querySelectorAll(".sd-ev.filled .card").forEach(fitCard); redrawYarn();
    if (type === "dialogue") {
      witness(true); det.set("think");
      ({ cards, answer } = await drawDialogueRound());
    } else if (type === "verify") {
      witness(false); det.set("think");
      opts.classList.add("tf");
      let showCorrect = Math.random() < 0.5;
      const others = Lumio.shuffle(vocab.filter(distinctFrom(target)));
      if (!others.length) showCorrect = true;
      const claim = showCorrect ? target.en : others[0].en;
      promptText.className = "prompt";
      promptText.innerHTML = `A witness says:<br>"<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>" means "<b class="cl">${LP.esc(claim)}</b>"`;
      currentSpeak = ""; speakIsLine = false;   // never say the answer before it is given
      const t = document.createElement("button"), f = document.createElement("button");
      t.type = f.type = "button"; t.className = "sd-stampbtn t"; f.className = "sd-stampbtn f"; t.dataset.key = "true"; f.dataset.key = "false";
      t.innerHTML = `<span class="ink">${LP.ICON.check}TRUE</span><span class="ring"></span>`; f.innerHTML = `<span class="ink">${ICO_X}FALSE</span><span class="ring"></span>`;
      [t, f].forEach(b => { b.onclick = () => verify(b, showCorrect, target); opts.appendChild(b); });
      cards = [t, f]; answer = String(showCorrect);
    } else {
      witness(false); det.set("look-right");
      opts.classList.add("find");
      promptText.className = "prompt";
      promptText.innerHTML = `What does "<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>" mean?`;
      currentSpeak = ""; speakIsLine = false;
      const distractorPool = Lumio.shuffle(vocab.filter(distinctFrom(target)));
      const numOptions = Math.min(3, vocab.length);
      const list = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);
      cards = list.map(o => { const c = makeCard(o.en, o.en); c.onclick = () => chooseFind(c, target); opts.appendChild(c); return c; });
      answer = target.en;
    }
    if (G && !RM) G.fromTo($("promptCard"), { y: 30, opacity: 0, rotation: -2 }, { y: 0, opacity: 1, rotation: 0, duration: .45, ease: "back.out(1.8)" });
    det.nod();
    hearBtn.style.visibility = currentSpeak ? "" : "hidden";
    cards.forEach(fitBtn);
    await LP.deal(cards, $("promptCard"));
    reveal();
    locked = false;
    LP.answer = answer;   // read by the automated play-through tests
    playPrompt();
  }

  // Witness-testimony round: two lines of this lesson's real conversation
  // are "overheard", and the detective (student) must identify what was
  // really said next -- correct line vs. distractors from other
  // already-taught lessons' dialogues. The second testimony round moves
  // further into the same conversation instead of repeating the first.
  async function drawDialogueRound() {
    const myDialogue = dialoguePool[num - 1] || dialoguePool[dialoguePool.length - 1];
    const myIdx = dialoguePool.indexOf(myDialogue);
    const k = dlgCount++ % 2, a = k ? 2 : 0, ci = a + 2;
    const correct = myDialogue[ci];
    opts.classList.add("dlg");
    promptText.className = "prompt dlg";
    currentSpeak = myDialogue[a + 1]; speakIsLine = true;
    let distractorPool = [];
    dialoguePool.forEach((dlg, i) => {
      if (i === myIdx) return;
      [dlg[1], dlg[2], dlg[3]].forEach(line => { if (line !== correct) distractorPool.push(line); });
    });
    // Lesson 1 has no earlier conversation to borrow from: use lines of this same
    // conversation that cannot follow (never the line right after the answer).
    if (distractorPool.length < 2) distractorPool = distractorPool.concat(myDialogue.filter((l, i) => i !== a && i !== a + 1 && i !== ci && i !== ci + 1));
    const list = Lumio.shuffle([correct, ...Lumio.shuffle(distractorPool).slice(0, 2)]);
    const cards = list.map(o => { const c = makeCard(o, o, "line"); c.onclick = () => chooseDialogue(c, correct); opts.appendChild(c); return c; });
    cards.forEach(c => c.style.opacity = 0);
    await typeIn(promptText, `Overheard:<span class="q">"${LP.esc(myDialogue[a])}"</span><span class="q">"${LP.esc(myDialogue[a + 1])}"</span><span class="ask">What came next?</span>`);
    return { cards, answer: correct };
  }

  const next = async (ms) => { await LP.wait(ms); r++; r < ROUNDS ? drawRound() : endGame(); };

  async function solved(card, item, confirmed) {
    locked = true; score++; LP.answer = null;
    [...opts.children].forEach(c => c.disabled = true);
    det.cheer("celebrate", false); if (witOn) wit.cheer("thumbs", false);
    LP.fill(r);
    if (item.en) { currentSpeak = item.en; speakIsLine = false; hearBtn.style.visibility = ""; setTimeout(() => LP.say(item.en, hearBtn), 250); }   // the answer is heard once it has been found
    const star = LP.good(card);
    await LP.wait(380);
    LP.clear(opts.children, card);
    await pinEvidence(r, item, card, confirmed);
    if (G && !RM) G.to(card, { opacity: 0, duration: .25 });
    await Promise.race([star, LP.wait(1600)]);   // never hang a round on an animation
    next(500);
  }

  function chooseDialogue(card, correct) {
    if (locked) return;
    if (card.dataset.key === correct) { solved(card, { dialogue: true }, false); return; }
    LP.bad(card); det.oops("surprised", "think"); wit.oops("shrug", "explain");
    card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
  }

  function chooseFind(card, target) {
    if (locked) return;
    if (card.dataset.key === target.en) { solved(card, target, false); return; }
    LP.bad(card); det.oops("surprised", "look-right");
    card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
  }

  async function verify(btn, showCorrect, target) {
    if (locked) return;
    const ok = (btn.dataset.key === "true") === showCorrect;
    locked = true;
    LP.answer = null;
    [...opts.children].forEach(b => b.disabled = true);
    if (ok) { solved(btn, target, true); return; }
    // wrong: the clue is still pinned (unconfirmed) and the file shows what it really means
    LP.bad(btn); det.oops("surprised", "think"); currentSpeak = target.en; speakIsLine = false; hearBtn.style.visibility = ""; setTimeout(() => LP.say(target.en, hearBtn), 400);
    [...opts.children].forEach(b => { if (b !== btn) b.classList.add("dim"); });
    promptText.insertAdjacentHTML("beforeend", `<span class="truth">"<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>" = ${LP.esc(target.en)}</span>`);
    LP.fill(r);
    await LP.wait(700);
    await pinEvidence(r, target, null, false);
    next(1000);
  }

  async function endGame() {
    LP.round(-1); LP.answer = null; witness(false);
    det.cheer("celebrate", false);
    const st = $("closed");
    if (G && !RM) {
      await LP.wait(300);
      LP.sfx("whoosh");
      await Promise.race([LP.wait(3500), new Promise(res => G.fromTo(st, { scale: 3.2, opacity: 0, rotation: -24 }, { scale: 1, opacity: 1, rotation: -9, duration: .32, ease: "power4.in", onComplete: res }))]);
      LP.sfx("boom");
      G.fromTo(board, { x: -8, y: 4 }, { x: 0, y: 0, duration: .5, ease: "elastic.out(1,.3)" });
      const c = LP.center(st); LP.burst(c.x, c.y, { n: 40, colors: ["#C81D25", "#FFD666", "#F7EEDB"], ringColor: "#C81D25" });
    } else st.style.opacity = 1;
    // the whole crew bursts in to celebrate
    const crew = document.createElement("div"); crew.className = "sd-crew"; crew.setAttribute("aria-hidden", "true");
    [["lumi", "celebrate"], ["omar", "point"], ["sara", "happy"], ["noor", "celebrate"], ["ziad", "happy"], ["hamad", "point"]]
      .forEach(([c, p]) => { const im = new Image(); im.alt = ""; im.src = LP.char(c + "-teen", p); crew.appendChild(im); });
    document.body.appendChild(crew);
    if (G && !RM) G.fromTo(crew.children, { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: "back.out(1.6)", stagger: .07 });
    else [...crew.children].forEach(i => i.style.opacity = 1);
    await LP.wait(1500);
    LP.results({ score, total: ROUNDS, title: score >= 5 ? "Case closed!" : "Mystery solved!", scoreLabel: "Clues confirmed",
      note: `You solved the case with ${score} out of ${ROUNDS} clues confirmed!`, actor: { char: "sara-teen", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  $("promptCard").onclick = playPrompt;
  $("promptCard").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playPrompt(); } };
  LP.title({ kicker: `Level 5 · Case #${num}`, title: "Story Detective", sub: "Find the evidence, check every clue and crack the case.", ar: "ابحث عن الأدلة وتحقّق منها وحُلّ القضية",
    actor: { char: "sara-teen", pose: "point", cheer: "celebrate" }, button: "Open the case" }).then(drawRound);
}
</script>
