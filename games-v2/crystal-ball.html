<style>
  /* Crystal Ball: a teen room at night. A glowing ball swirls with nebula light, a word
     appears inside, and every right answer rises out of the ball as a vision that floats
     up into the row of visions at the top. */
  .cb{position:relative;width:100%;max-width:1220px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .cb-shelf{display:flex;gap:10px;justify-content:center;padding:6px 12px;border-radius:999px;background:rgba(14,10,40,.45);border:1px solid rgba(190,170,255,.18);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .cb-slot{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed rgba(200,185,255,.35);color:rgba(220,210,255,.4)}
  .cb-slot svg{width:18px;height:18px}
  .cb-slot.on{border:none;background:radial-gradient(circle at 38% 32%,#fff 0,#EDE6FF 35%,#B9A2FF 75%,#7C5CFF);box-shadow:0 0 14px 3px rgba(170,140,255,.75);color:#5B21B6}
  .cb-slot.on.miss{background:radial-gradient(circle at 38% 32%,#6b6290,#2a2450);box-shadow:none;color:rgba(255,255,255,.5)}
  .cb-slot .pv{position:absolute;inset:4px;border-radius:50%;overflow:hidden}
  .pf img{position:absolute;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}

  .cb-scene{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:520px}
  .cb-seer{position:absolute;left:0;bottom:0;height:224px;width:116px;display:flex;justify-content:center;align-items:flex-end;z-index:2}
  .cb-seer .lp-actor{height:100%}
  .cb-ballwrap{position:relative;width:min(62vw,250px);margin-left:56px;transition:width .5s ease}
  .cb-ball{position:relative;width:100%;aspect-ratio:1/1}
  .cb-glow{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.55),rgba(124,58,237,.18) 45%,transparent 68%);transition:opacity .5s,transform .5s;pointer-events:none}
  .cb-ballwrap.power2 .cb-glow{transform:scale(1.15);background:radial-gradient(circle,rgba(196,181,253,.7),rgba(124,58,237,.25) 45%,transparent 70%)}
  .cb-ballwrap.power3 .cb-glow{transform:scale(1.3);background:radial-gradient(circle,rgba(233,213,255,.85),rgba(147,97,255,.35) 45%,transparent 72%)}
  .cb-ball canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
  .cb-text{position:absolute;left:14%;right:14%;top:18%;bottom:18%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none;
    font-family:var(--lp-display);font-weight:800;color:#fff;font-size:24px;line-height:1.15;overflow-wrap:normal;word-break:keep-all;
    text-shadow:0 0 12px rgba(200,170,255,.95),0 0 28px rgba(140,90,255,.8),0 2px 4px rgba(20,0,50,.8)}
  .cb-text .ar{font-family:'Tajawal',sans-serif;font-weight:800;unicode-bidi:isolate}
  .cb-stand{display:block;width:72%;margin:-10% auto 0;position:relative;z-index:-1}
  .cb-panel{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .cb-kick{display:flex;align-items:center;gap:12px;justify-content:center}
  .cb-kick b{font-family:var(--lp-display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#D8CCFF;text-shadow:0 0 14px rgba(160,120,255,.8)}
  .cb-kick .lp-speak{width:48px;height:48px}
  .cb-truth{min-height:0;font-weight:800;color:#C4F5DC;text-align:center;font-size:16px}
  .cb-truth .ar{font-family:'Tajawal',sans-serif;unicode-bidi:isolate}
  .cb-vision{display:none;width:100%;padding:12px 16px;border-radius:20px;background:linear-gradient(160deg,rgba(60,30,120,.55),rgba(20,10,50,.6));border:1px solid rgba(190,160,255,.3);
    box-shadow:0 0 30px -6px rgba(140,90,255,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#F5EFFF;font-weight:800;line-height:1.4;font-size:clamp(14px,3.8vw,17px)}
  .cb-vision .q{display:block;margin:2px 0 6px}
  .cb-vision .ask{display:block;opacity:.75;font-family:var(--lp-display)}
  .cb-opts{display:grid;gap:10px;width:100%;perspective:900px}
  .cb-opts.read{grid-template-columns:repeat(3,1fr)}
  .cb-opts.judge{grid-template-columns:1fr 1fr;max-width:460px}
  .lp .cb-card{position:relative;border:none;cursor:pointer;min-height:64px;padding:12px 8px;border-radius:18px;color:#F5EFFF;touch-action:manipulation;
    background:linear-gradient(160deg,rgba(64,36,130,.92),rgba(27,15,61,.94));box-shadow:0 0 0 1.5px rgba(196,170,255,.45),0 0 22px -6px rgba(140,90,255,.8),0 16px 26px -14px rgba(0,0,0,.9);
    font-family:var(--lp-display);font-weight:800;font-size:clamp(16px,4.3vw,21px);line-height:1.15;overflow-wrap:normal;word-break:keep-all;transition:opacity .3s,filter .3s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .lp .cb-card::before{content:"";position:absolute;left:10px;right:10px;top:6px;height:40%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent);pointer-events:none}
  .lp .cb-card.line{text-align:left;font-family:var(--lp-body);font-size:clamp(14px,3.7vw,17px);line-height:1.3;padding:12px 16px;min-height:56px}
  .lp .cb-card.yes{background:linear-gradient(135deg,#34D399,#059669);box-shadow:0 0 0 1.5px rgba(255,255,255,.3),0 16px 26px -12px rgba(5,150,105,.8);display:flex;align-items:center;justify-content:center;gap:8px}
  .lp .cb-card.no{background:linear-gradient(135deg,#F87171,#DC2626);box-shadow:0 0 0 1.5px rgba(255,255,255,.3),0 16px 26px -12px rgba(220,38,38,.8);display:flex;align-items:center;justify-content:center;gap:8px}
  .lp .cb-card svg{width:22px;height:22px}
  .cb-card .ring{position:absolute;inset:-4px;border-radius:22px;border:4px solid var(--lp-good);opacity:0;pointer-events:none;box-shadow:0 0 24px rgba(52,211,153,.8)}
  .cb-card.good .ring{opacity:1}
  .cb-card.bad .ring{opacity:1;border-color:var(--lp-bad);box-shadow:0 0 20px rgba(244,63,94,.6)}
  .cb-card.chosen .ring{opacity:1;border-color:#FDE68A;box-shadow:0 0 24px rgba(253,230,138,.8)}
  .cb-card.dim{opacity:.35;filter:grayscale(.6)}
  .cb-card[disabled]{cursor:default}

  /* a vision rising out of the ball */
  .cb-orb{position:fixed;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;z-index:200;pointer-events:none;display:grid;place-items:center;
    background:radial-gradient(circle at 40% 32%,#fff 0,#F3EEFF 45%,#C9B6FF 78%,rgba(124,92,255,.9));box-shadow:0 0 30px 10px rgba(170,140,255,.7),0 0 80px 20px rgba(124,92,255,.35)}
  .cb-orb .pv{position:absolute;inset:10px;border-radius:50%;overflow:hidden}
  .cb-orb .w{font-family:var(--lp-display);font-weight:800;color:#4C1D95;text-align:center;line-height:1.05;padding:0 12px;font-size:18px;word-break:keep-all}
  .cb-orb svg{width:46%;color:#6D28D9}
  .cb-power{background:linear-gradient(135deg,#A78BFA,#7C3AED)!important;color:#fff!important;display:none}
  .cb-power svg{width:18px;height:18px}

  .cb.vision .cb-ballwrap{width:min(36vw,150px)}
  .cb.vision .cb-seer{height:150px;width:84px}
  .cb.vision .cb-vision{display:block}

  @media (max-height:740px) and (max-width:959px){ .cb-ballwrap{width:min(46vw,170px)} .cb-seer{height:160px} .cb.vision .cb-ballwrap{width:120px} }
  @media (min-width:960px){
    .cb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:16px 40px;align-items:center;min-height:calc(100dvh - 120px);align-content:center}
    .cb-scene{grid-column:1;grid-row:1 / span 2;max-width:600px;justify-self:center}
    .cb-shelf{grid-column:2;grid-row:1;justify-self:center}
    .cb-panel{grid-column:2;grid-row:2;align-self:start}
    .cb-ballwrap,.cb.vision .cb-ballwrap{width:min(32vw,380px);margin-left:120px}
    .cb-seer,.cb.vision .cb-seer{height:min(52vh,380px);width:200px}
    .cb-slot{width:56px;height:56px}
    .cb-text{font-size:34px}
  }
  .lp-stage{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
</style>

const ALL_DIALOGUES = [["So what's your actual plan for after this year? Have you decided anything?", "Honestly, I'm thinking about applying to a program abroad, if I'm brave enough.", "That's huge. Would you actually move, or just visit for a while first?", "Move eventually, I think, but I'd start by joining a summer program first.", "That sounds smart. Testing it out before committing to something that big.", "Exactly. No point diving in completely before I even know if I'll like it."], ["What do you predict will happen with technology in the next ten years?", "Honestly, I believe it'll probably change faster than we can even imagine.", "Definitely. Maybe we'll have things we can't even picture right now.", "That's kind of exciting, but also a little terrifying if I'm being honest.", "Same. The future is unpredictable, but I think that's what makes it interesting.", "Agreed. I'd rather not know everything -- surprises make life more interesting."], ["What are your actual plans this weekend? You seem busier than usual.", "I'm traveling Friday, then attending my cousin's graduation on Saturday.", "Wow, packed schedule. When are you even leaving to make that work?", "Early morning, honestly. I'm also hosting a small get-together Sunday night.", "That's a lot happening. Are you starting anything new after this weekend?", "Actually yes, I'm meeting with a mentor about a project I'm starting soon."], ["You'll never guess what happened while I was walking home yesterday.", "Tell me! Did something interrupt your walk, or did you just get soaked?", "Both, actually. It started raining right as I noticed I forgot my umbrella.", "Classic timing. What were you doing meanwhile, just running for shelter?", "Pretty much, until I arrived at a café and just waited it out completely soaked.", "That's rough, but honestly it sounds like a pretty funny story now."], ["Do you actually have to do chores at home, or is that optional for you?", "Required, unfortunately. My parents say it's mething huge.", "That's kind of you. I actually think you'll succeed at inventing something useful.", "Wow, big predictions from both of us. Let's remember this conversation someday.", "Definitely. We'll look back and see how close we actually got it right."], ["Is your curfew still early, or are your parents letting you be more independent?", "A little more independent now, honestly, since I've earned more of their trust.", "That's nice. Are you allowed to go out without asking permission every time?", "Mostly, as long as I still do my chores and let them know where I am.", "That sounds fair, actually. Trust seems to go both ways in your house.", "It does. I think that's why I don't mind the rules as much as I used to."], ["Do you usually speak confidently in front of people, or does it make you nervous?", "Honestly, nervously at first, but I try to speak clearly no matter how I feel.", "That's smart. Do you think it's better to speak politely or just be blunt?", "Politely, but still honestly. You can be kind and truthful at the same time.", "That's a good balance, actually. I struggle with saying things too bluntly sometimes.", "Practice helps. The more confidently you speak, the more naturally kindness comes through."], ["Between these two options, which one do you think is actually worth it?", "Honestly, the more expensive one seems more reliable, so probably worth it.", "That's reasonable. Is convenience important to you too, or just quality?", "Both, but the most useful option usually wins for me in the end.", "Fair point. I guess it depends on what you'll actually use it for daily.", "Exactly. No point picking something convenient if it's not useful long-term."], ["Were you actually studying earlier, or was that just background noise on a call?", "Honestly, I was studying while chatting a little, which probably wasn't smart.", "That explains it. I find it impossible to focus if I'm doing two things.", "Same, but I still try. Yesterday I was scrolling while my mom was cooking nearby.", "That sounds distracting either way. Did you actually get anything done though?", "Barely, honestly. I think tomorrow I'll actually just focus on one thing at a time."], ["Do you have an actual goal for next year, or are you not thinking that far?", "I do, honestly. My resolution is to challenge myself more instead of staying comfortable.", "That's a solid goal. What specifically do you hope to improve about yourself?", "Probably my confidence, if I'm being completely honest about it.", "I don't expect it to be easy, but I believe you can actually do it.", "Thanks, honestly. That kind of support makes the goal feel a lot more real."], ["Can you actually convince me your point of view is right, with real evidence?", "I can try. I think I have a fair point, even if you don't fully agree.", "I'll agree partly, honestly, but I still think you're missing something important.", "That's fine, I'm not trying to argue you into total agreement anyway.", "Good, because I respect a debate way more than someone forcing their opinion.", "Same here. That's honestly what makes this conversation actually worth having."], ["Do you feel ready for tomorrow, or do you still need more time to prepare?", "Honestly, I've practiced enough. I just need to organize my notes and rest.", "That's smart. Rest matters just as much as reviewing everything one more time.", "Exactly, over-preparing without resting just makes tomorrow harder, not easier.", "I completely agree. I'm going to review quickly, then actually get real sleep.", "Good plan. We'll both walk in tomorrow actually ready instead of exhausted."], ["Did everything go smoothly today, or did something go wrong again?", "Actually, pretty smoothly. I finally did the whole process correctly and efficiently.", "That's great! Did you do it safely too, or did you rush through it?", "Safely, properly, all of it, honestly. I even kept my notes neatly organized.", "Look at you, doing everything right for once. What changed?", "Practice, mostly. Doing something correctly the first time saves so much stress later."], ["Is your family's lifestyle similar to your grandparents', or completely different?", "Honestly, pretty different, but we still keep the most traditional customs alive.", "That's nice. What's the most colorful tradition your family actually celebrates?", "Probably our biggest holiday, it's genuinely the most colorful event of the year.", "That sounds amazing. I think traditions like that keep a culture alive, honestly.", "Completely agree. Even small customs matter more than people usually realize."], ["Were you excited for the field trip, or were you dreading the long bus ride?", "Excited, honestly, but something unexpected happened that made it even more memorable.", "What happened? Please tell me nobody got left behind or anything like that.", "Close, actually, but the teacher handled it so calmly it barely felt like a crisis.", "That's impressive. What's the actual lesson learned from that whole experience?", "Probably that staying calm handles unexpected problems way better than panicking does."], ["Looking ahead, what's the most exciting goal in your actual future plan?", "Honestly, I predict I'll achieve something I couldn't even imagine at the start of this level.", "That's a bold prediction. Do you have to work quickly toward it, or is there time?", "There's time, but I don't want to waste it either, if I'm being honest.", "Smart. This whole level has genuinely been memorable, watching everyone grow like this.", "Agreed. I can't wait to see how much closer we all get to these goals next year."]];
const dialoguePool = ALL_DIALOGUES.slice(0, num);

if (!vocab.length) {
  $("kicker").textContent = "No lesson data found.";
} else {
  const ROUNDS = 6;
  // Round plan: read-the-ball and judge-the-prediction rounds (original
  // mechanics) plus a "vision of a conversation" round using this lesson's
  // real dialogue -- covers dialogues/conversations alongside vocabulary.
  const PLAN = ["read", "judge", "vision", "read", "judge", "vision"];
  const order = Lumio.shuffle([...vocab]).slice(0, ROUNDS);
  let r = 0, score = 0, power = 0, locked = true, visionCount = 0;
  const opts = $("opts"), dialogueContext = $("dialogueContext"), kicker = $("kicker"), ballText = $("ballText"), ballWrap = $("ballWrap"), hearBtn = $("hearBtn"), truth = $("truth");
  const shelf = $("shelf");
  for (let i = 0; i < ROUNDS; i++) { const s = document.createElement("span"); s.className = "cb-slot"; s.id = `slot${i}`; s.innerHTML = SPARK; shelf.appendChild(s); }

  function updatePower(hit) {
    power = hit ? power + 1 : 0;
    if (power >= 3) {
      powerChip.style.display = "inline-flex";
      $("power").textContent = power;
      if (G && !RM) G.fromTo(powerChip, { scale: 1.3 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" });
    } else {
      powerChip.style.display = "none";
    }
    ballWrap.classList.remove("power2", "power3");
    if (power >= 5) ballWrap.classList.add("power3");
    else if (power >= 3) ballWrap.classList.add("power2");
    ball.power(power >= 5 ? 3 : power >= 3 ? 2 : 0);
  }

  let currentSpeak = "", speakIsLine = false;
  const playPrompt = () => speakIsLine ? sayLine(currentSpeak, hearBtn) : LP.say(currentSpeak, hearBtn);

  // fit the text inside the ball (shrink, never break a word)
  function fitBall() {
    ballText.style.fontSize = "";
    let f = parseFloat(getComputedStyle(ballText).fontSize);
    const over = () => ballText.scrollHeight > ballText.clientHeight + 1 || ballText.scrollWidth > ballText.clientWidth + 1;
    while (over() && f > 11) { f -= 1; ballText.style.fontSize = f + "px"; }
  }
  addEventListener("resize", fitBall);
  function showInBall(html) {
    ballText.innerHTML = html; ballText.style.display = "flex"; fitBall();
    if (G && !RM) G.fromTo(ballText, { opacity: 0, scale: .4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .8, ease: "power2.out" });
    ball.flash("200,170,255", 3); LP.sfx("rise");
  }
  function makeCard(key, html, cls) {
    const b = document.createElement("button"); b.type = "button"; b.className = "cb-card " + (cls || ""); b.dataset.key = key;
    b.innerHTML = html + '<span class="ring"></span>';
    return b;
  }

  async function drawRound() {
    locked = true; LP.answer = null;
    LP.round(r);
    const target = order[r % order.length];
    const type = dialoguePool.length ? PLAN[r] : (r % 2 === 1 ? "judge" : "read");
    opts.innerHTML = ""; opts.className = "cb-opts"; truth.innerHTML = "";
    if (scrollY > 0) window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
    const label = type === "vision" ? "A vision unfolds..." : type === "judge" ? "Judge the prediction" : "Read the crystal ball";
    $("cb").classList.toggle("vision", type === "vision");
    if (G && !RM) G.to(ballText, { opacity: 0, scale: .6, duration: .25 });
    await LP.banner("Vision " + (r + 1), label);
    kicker.textContent = label;
    let cards, answer;
    if (type === "vision") {
      seer.set("think");
      ({ cards, answer } = await drawVisionRound());
    } else if (type === "judge") {
      seer.set("think");
      dialogueContext.innerHTML = "";
      opts.classList.add("judge");
      let showCorrect = Math.random() < 0.5;
      const others = Lumio.shuffle(vocab.filter(distinctFrom(target)));
      if (!others.length) showCorrect = true;
      const claim = showCorrect ? target.en : others[0].en;
      showInBall(`<span>"<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>" = "${LP.esc(claim)}" ?</span>`);
      currentSpeak = target.en; speakIsLine = false;
      const y = makeCard("true", LP.ICON.check + "<span>Correct</span>", "yes");
      const n = makeCard("false", '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg><span>Wrong</span>', "no");
      cards = [y, n]; cards.forEach(b => { b.onclick = () => verify(b, showCorrect, target); opts.appendChild(b); });
      answer = String(showCorrect);
    } else {
      seer.set("look-right");
      opts.classList.add("read");
      showInBall(`<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>`);
      currentSpeak = target.en; speakIsLine = false;
      const distractorPool = Lumio.shuffle(vocab.filter(distinctFrom(target)));
      const numOptions = Math.min(3, vocab.length);
      const list = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);
      cards = list.map(o => { const c = makeCard(o.en, `<span>${LP.esc(o.en)}</span>`); c.onclick = () => choose(c, target); opts.appendChild(c); return c; });
      answer = target.en;
    }
    seer.nod();
    await LP.deal(cards, ballWrap);
    const last = opts.lastElementChild;
    if (last) { const b = last.getBoundingClientRect().bottom, lim = innerHeight - 74; if (b > lim) window.scrollBy({ top: b - lim, behavior: RM ? "auto" : "smooth" }); }
    locked = false;
    LP.answer = answer;   // read by the automated play-through tests
    playPrompt();
  }

  // Vision round: the crystal ball "shows" two lines of this lesson's real
  // conversation, and the student must see what happens next -- the real
  // next line vs. distractors from other already-taught lessons' dialogues.
  // The second vision moves further into the same conversation instead of
  // repeating the first one word for word.
  async function drawVisionRound() {
    ballText.style.display = "none";
    const myDialogue = dialoguePool[num - 1] || dialoguePool[dialoguePool.length - 1];
    const myIdx = dialoguePool.indexOf(myDialogue);
    const k = visionCount++ % 2, a = k ? 2 : 0, ci = a + 2;
    const correct = myDialogue[ci];
    currentSpeak = myDialogue[a + 1]; speakIsLine = true;
    let distractorPool = [];
    dialoguePool.forEach((dlg, i) => {
      if (i === myIdx) return;
      [dlg[1], dlg[2], dlg[3]].forEach(line => { if (line !== correct) distractorPool.push(line); });
    });
    // Lesson 1 has no earlier conversation to borrow from: use lines of this same
    // conversation that cannot follow (never the line right after the answer).
    if (distractorPool.length < 2) distractorPool = distractorPool.concat(myDialogue.filter((l, i) => i !== a && i !== a + 1 && i !== ci && i !== ci + 1));
    const list = Lumio.shuffle([correct, ...Lumio.shuffle(distractorPool).slice(0, 2)]);
    opts.classList.add("dlg");
    const cards = list.map(o => { const c = makeCard(o, `<span>${LP.esc(o)}</span>`, "line"); c.onclick = () => chooseVision(c, correct); opts.appendChild(c); return c; });
    cards.forEach(c => c.style.opacity = 0);
    dialogueContext.innerHTML = `<span class="q">"${LP.esc(myDialogue[a])}"</span><span class="q">"${LP.esc(myDialogue[a + 1])}"</span><span class="ask">What happens next?</span>`;
    ball.flash("220,190,255", 4); LP.sfx("rise");
    if (G && !RM) {
      // the lines drift up out of the ball like smoke and come into focus
      const b = LP.center(ballWrap);
      const parts = [...dialogueContext.children];
      G.set(dialogueContext, { opacity: 1 });
      await new Promise(res => G.timeline({ onComplete: res }).fromTo(parts, { opacity: 0, y: (i, el) => b.y - LP.center(el).y, scale: .4, filter: "blur(12px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: .9, ease: "power2.out", stagger: .35 }));
    }
    return { cards, answer: correct };
  }

  // a vision rises out of the ball and floats up into its place on the shelf
  async function riseVision(idx, item, ok) {
    const slot = $(`slot${idx}`);
    const content = item.dialogue ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16a2 2 0 012 2v9a2 2 0 01-2 2h-9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>'
      : (picImg(item.en) ? `<div class="pv pf">${picImg(item.en)}</div>` : `<span class="w">${LP.esc(item.en)}</span>`);
    const fill = () => {
      slot.classList.add("on"); if (!ok) slot.classList.add("miss");
      slot.innerHTML = ok && !item.dialogue && picImg(item.en) ? `<div class="pv pf">${picImg(item.en)}</div>` : SPARK;
      slot.title = item.dialogue ? "vision" : item.en;
      if (G && !RM) G.fromTo(slot, { scale: 1.6 }, { scale: 1, duration: .6, ease: "elastic.out(1,.4)" });
    };
    if (!ok || !G || RM) { fill(); return; }
    const orb = document.createElement("div"); orb.className = "cb-orb"; orb.innerHTML = content; document.body.appendChild(orb);
    const w = orb.querySelector(".w"); if (w) { let f = 18; while ((w.scrollWidth > 100 || w.scrollHeight > 90) && f > 10) { f--; w.style.fontSize = f + "px"; } }
    const a = LP.center(ballWrap.querySelector(".cb-ball")), s = LP.center(slot);
    const upY = Math.max(130, a.y - 140);
    ball.flash("255,240,255", 5); LP.sfx("rise");
    await new Promise(res => G.timeline({ onComplete: res })
      .fromTo(orb, { x: a.x, y: a.y, scale: .15, opacity: 0 }, { x: a.x + 10, y: upY, scale: 1, opacity: 1, duration: .8, ease: "power2.out" })
      .to(orb, { x: a.x - 8, duration: .35, ease: "sine.inOut" })
      .to(orb, { x: s.x, y: s.y, scale: (slot.offsetWidth / 118), duration: .6, ease: "power3.in" }));
    orb.remove(); LP.sfx("coin"); fill();
    LP.burst(s.x, s.y, { n: 14, shape: "star", colors: ["#E9D5FF", "#C4B5FD", "#FFE27A"], ringColor: "#C4B5FD", speed: 4 });
  }

  const next = async (ms) => { await LP.wait(ms); r++; r < ROUNDS ? drawRound() : endGame(); };

  async function solved(card, item) {
    locked = true; score++; LP.answer = null;
    updatePower(true);
    [...opts.children].forEach(c => c.disabled = true);
    seer.cheer("celebrate", false);
    LP.fill(r);
    const star = LP.good(card);
    await LP.wait(300);
    LP.clear(opts.children, card);
    if (G && !RM) G.to(ballText, { opacity: 0, scale: 1.4, filter: "blur(8px)", duration: .4 });
    await riseVision(r, item, true);
    await star;
    next(400);
  }
  function miss(card, back) {
    LP.bad(card); updatePower(false);
    seer.oops("surprised", back);
    ball.cloud(true); ball.flash("255,80,110", 1); setTimeout(() => ball.cloud(false), 700);
  }

  function chooseVision(card, correct) {
    if (locked) return;
    if (card.dataset.key === correct) { solved(card, { dialogue: true }); return; }
    miss(card, "think");
    card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
  }

  function choose(card, target) {
    if (locked) return;
    if (card.dataset.key === target.en) { solved(card, target); return; }
    miss(card, "look-right");
    card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
  }

  async function verify(btn, showCorrect, target) {
    if (locked) return;
    const ok = (btn.dataset.key === "true") === showCorrect;
    locked = true;
    LP.answer = null;
    [...opts.children].forEach(b => b.disabled = true);
    if (ok) { btn.classList.add("chosen"); solved(btn, target); return; }
    miss(btn, "think");
    [...opts.children].forEach(b => { if (b !== btn) b.classList.add("dim"); });
    truth.innerHTML = `"<span class="ar" dir="rtl" lang="ar">${LP.esc(target.ar)}</span>" = ${LP.esc(target.en)}`;
    LP.fill(r);
    await riseVision(r, target, false);
    next(1300);
  }

  function endGame() {
    LP.round(-1); LP.answer = null;
    seer.cheer("celebrate", false);
    ball.flash("255,240,255", 6);
    LP.results({ score, total: ROUNDS, title: "The future looks bright!", scoreLabel: "Visions read",
      note: `You read ${score} out of ${ROUNDS} visions correctly!`, actor: { char: "noor-teen", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  ballWrap.addEventListener("click", playPrompt);
  LP.title({ kicker: `Level 6 · Lesson ${num}`, title: "Crystal Ball", sub: "Read the visions in the crystal ball and see what happens next.", ar: "اقرأ الرؤى في الكرة البلورية واكتشف ما سيحدث بعد ذلك",
    actor: { char: "noor-teen", pose: "look-right", cheer: "celebrate" }, button: "Look into the ball" }).then(drawRound);
}
</script>
</body>
</html>
