<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crew Chat — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Crew Chat: a glass group-chat phone floats over the hangout spot at sunset. The crew really
     types (dots + "Sara is typing…"), bubbles pop in, shared photos land as crisp framed pictures,
     your reply flies from the keyboard into the thread and the crew reacts with emoji. */
  :root{--cc-me1:#7C5CFF;--cc-me2:#3BA0FF;--cc-them:rgba(255,255,255,.1);--cc-line:rgba(255,255,255,.12)}
  .cc-stage{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .cc{width:100%;max-width:1240px;display:grid;grid-template-columns:1fr;justify-items:center;flex:1;min-height:0}
  .cc-side{display:none}

  /* ---------- the phone ---------- */
  .cc-phone{position:relative;width:100%;max-width:460px;height:calc(100dvh - var(--lp-hud-h) - 12px - 76px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    min-height:520px;display:flex;flex-direction:column;border-radius:30px;overflow:hidden;
    background:linear-gradient(180deg,rgba(16,20,44,.80),rgba(9,12,28,.86));border:1px solid rgba(255,255,255,.16);
    box-shadow:0 0 0 6px rgba(8,10,24,.55),0 0 0 7px rgba(255,255,255,.08),0 40px 80px -30px rgba(0,0,0,.9),0 0 60px -10px rgba(124,92,255,.35);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3)}
  .cc-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--cc-line);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
  .cc-live{position:relative;flex:none;width:50px;height:50px}
  .cc-live .cc-av{width:50px;height:50px}
  .cc-live::after{content:"";position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22C55E;border:2px solid #10142c}
  .cc-head .info{min-width:0;flex:1;display:flex;flex-direction:column}
  .cc-head .info b{font-family:var(--lp-display);font-weight:800;font-size:19px;line-height:1.1;color:#fff}
  .cc-head .info span{font-size:13.5px;font-weight:700;color:#A9B4DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc-head .info span.typing{color:#5EEAD4}
  .cc-stack{display:flex;flex:none}
  .cc-stack .cc-av{width:30px;height:30px;margin-left:-9px;box-shadow:0 0 0 2px #141a38}
  .cc-stack .cc-av:first-child{margin-left:0}
  .cc-stack .more{width:30px;height:30px;margin-left:-9px;border-radius:50%;display:grid;place-items:center;background:#2b335e;color:#cfd6ff;font-size:11px;font-weight:800;box-shadow:0 0 0 2px #141a38}

  /* avatar = a real teen character's head, cropped from the art */
  .cc-av{position:relative;display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--c,#334)}
  .cc-av img{position:absolute;max-width:none;width:auto;display:block;pointer-events:none;user-select:none}

  /* ---------- thread ---------- */
  .cc-thread{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:auto;
    background:radial-gradient(120% 60% at 0% 0%,rgba(124,92,255,.10),transparent 60%),radial-gradient(120% 60% at 100% 100%,rgba(59,160,255,.08),transparent 60%);
    -webkit-mask:linear-gradient(180deg,transparent 0,#000 18px);mask:linear-gradient(180deg,transparent 0,#000 18px)}
  .cc-thread::-webkit-scrollbar{width:0}
  .cc-day{align-self:center;font-size:12px;font-weight:800;letter-spacing:.06em;color:#A9B4DA;background:rgba(255,255,255,.07);padding:4px 12px;border-radius:999px;margin:2px 0 4px}
  .cc-row{display:flex;gap:8px;align-items:flex-end;max-width:86%}
  .cc-row.them{align-self:flex-start}
  .cc-row.me{align-self:flex-end;flex-direction:row-reverse}
  .cc-row.pic{max-width:94%}
  .cc-row > .cc-av{width:32px;height:32px;margin-bottom:2px}
  .cc-col{min-width:0;display:flex;flex-direction:column}
  .cc-name{font-size:12.5px;font-weight:800;margin:0 0 3px 12px;color:var(--nc,#8ff)}
  .cc-bub{position:relative;padding:9px 14px 8px;border-radius:20px;font-weight:700;font-size:16.5px;line-height:1.38;color:#F4F6FF;overflow-wrap:anywhere;transform-origin:0% 100%}
  .them .cc-bub{background:var(--cc-them);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:6px}
  .me .cc-bub{background:linear-gradient(135deg,var(--cc-me1),var(--cc-me2));border-bottom-right-radius:6px;transform-origin:100% 100%;box-shadow:0 12px 26px -14px rgba(90,110,255,.9)}
  .cc-bub b{color:#FFD666}
  .cc-bub b.hl{background:rgba(255,214,102,.18);padding:0 4px;border-radius:6px}
  .cc-bub .ar{font-family:'Tajawal',var(--lp-body);font-weight:700;font-size:1.08em;unicode-bidi:isolate}
  .cc-meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);margin-top:2px;line-height:1}
  .cc-meta .ticks{font-size:12px;letter-spacing:-3px;color:rgba(255,255,255,.6);transition:color .3s}
  .cc-meta .ticks.read{color:#7DF9E3}
  .cc-reacts{position:absolute;left:-8px;bottom:-14px;display:flex;gap:2px;padding:2px 6px;border-radius:999px;background:#1d2450;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 14px -6px rgba(0,0,0,.8);font-size:14px;line-height:20px}
  .cc-reacts:empty{display:none}
  .cc-reacts span{display:inline-block}
  .cc-row.me.reacted{margin-bottom:12px}

  /* shared photo: bright, full picture, never stretched, never dimmed */
  .cc-photo{position:relative;width:min(250px,62vw);max-width:100%;aspect-ratio:4/3;margin:2px 0 8px;border-radius:14px;overflow:hidden;
    background:radial-gradient(90% 90% at 50% 40%,#FFFFFF,#EAF0FF);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 10px 24px -14px rgba(0,0,0,.8)}
  .cc-photo img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;display:block;filter:none;opacity:1}
  .cc-photo.loading::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(124,92,255,.18) 50%,transparent 70%) 0 0/200% 100%;animation:ccShim 1.1s linear infinite}
  @keyframes ccShim{to{background-position:-200% 0}}

  .cc-typing{display:flex;gap:8px;align-items:flex-end;align-self:flex-start}
  .cc-typing > .cc-av{width:32px;height:32px}
  .cc-dots{display:flex;gap:5px;padding:13px 16px;border-radius:20px;border-bottom-left-radius:6px;background:var(--cc-them);border:1px solid rgba(255,255,255,.1)}
  .cc-dots i{width:8px;height:8px;border-radius:50%;background:#C9D2F5;display:block}

  /* ---------- dock (keyboard area) ---------- */
  .cc-dock{flex:none;padding:10px 12px 14px;border-top:1px solid var(--cc-line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.07))}
  .cc-hint{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;margin-bottom:8px;font-family:var(--lp-display);font-weight:800;font-size:14px;letter-spacing:.04em;color:#C9D2F5;text-align:center}
  .cc-hint.bad{color:#FDA4AF}
  .cc-replies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .cc-replies.stack{flex-direction:column;align-items:stretch}
  .lp .cc-chip{position:relative;min-height:48px;padding:10px 18px;border-radius:999px;border:1px solid rgba(150,170,255,.35);cursor:pointer;
    background:rgba(255,255,255,.08);color:#fff;font-family:var(--lp-display);font-weight:800;font-size:17px;line-height:1.2;touch-action:manipulation;
    box-shadow:0 10px 20px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12)}
  .lp .cc-replies.stack .cc-chip{border-radius:18px;text-align:start;font-family:var(--lp-body);font-size:16px;padding:11px 16px}
  .lp .cc-chip.ar{font-family:'Tajawal',var(--lp-body);font-weight:700;font-size:19px}
  .lp .cc-replies.stack .cc-chip.ar{text-align:right}
  @media (hover:hover){.cc-chip:hover{background:rgba(124,92,255,.28);border-color:rgba(170,180,255,.7)}}
  .cc-chip.bad{background:rgba(244,63,94,.35);border-color:#FB7185}
  .cc-chip.out{opacity:.35;pointer-events:none;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
  .cc-chip.good{background:linear-gradient(135deg,var(--cc-me1),var(--cc-me2));border-color:transparent}
  .cc-chip[disabled]{cursor:default}

  .cc-type[hidden]{display:none}
  .cc-compose{display:flex;align-items:center;gap:8px;margin:0 auto 10px;max-width:420px}
  .cc-box{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(150,170,255,.3);
    font-family:var(--lp-display);font-weight:800;font-size:21px;letter-spacing:.12em;color:#fff;overflow:hidden;white-space:nowrap}
  .cc-box .ph{color:rgba(255,255,255,.4);letter-spacing:0;font-size:16px;font-weight:700}
  .cc-box .caret{display:inline-block;width:2px;height:24px;margin-left:2px;background:#7DF9E3;animation:ccCaret 1s steps(1) infinite;vertical-align:middle}
  @keyframes ccCaret{50%{opacity:0}}
  .cc-box.bad{border-color:#FB7185;background:rgba(244,63,94,.18)}
  .lp .cc-clear{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(150,170,255,.35);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;place-items:center}
  .cc-clear svg{width:22px;height:22px}
  .cc-keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:430px;margin:0 auto}
  .lp .cc-key{width:46px;height:50px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(180deg,#F4F6FF,#D6DCF5);color:#1b2150;
    font-family:var(--lp-display);font-weight:800;font-size:22px;box-shadow:0 4px 0 #8f9acb,0 10px 16px -10px rgba(0,0,0,.8);touch-action:manipulation}
  .cc-key.used{visibility:hidden}

  /* ---------- laptop: the crew stands around the phone ---------- */
  @media (min-width:900px){
    .cc{grid-template-columns:1fr minmax(420px,470px) 1fr;column-gap:24px;align-items:end}
    .cc-side{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;align-self:stretch;position:relative;padding-bottom:6px}
    .cc-actor{position:relative;height:min(58vh,500px);width:100%;display:flex;justify-content:center;align-items:flex-end}
    .cc-actor .lp-actor{height:100%;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
    .cc-tag{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--lp-glass);border:1px solid var(--lp-glass-line);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:var(--lp-display);font-weight:800;font-size:16px;color:#fff;white-space:nowrap}
    .cc-tag .cc-av{width:30px;height:30px}
    .cc-tag small{font-family:var(--lp-body);font-weight:700;font-size:13px;color:#A9B4DA}
    .cc-phone{height:min(calc(100dvh - var(--lp-hud-h) - 44px),860px);max-width:470px}
    .cc-stage{padding-bottom:20px}
    .cc-bub{font-size:17px}
  }
  @media (max-height:700px) and (max-width:899px){ .cc-phone{min-height:0} .cc-head{padding:8px 12px} .cc-live,.cc-live .cc-av{width:42px;height:42px} }
</style>
</head>
<body>
<main class="lp-stage cc-stage" id="stage">
  <div class="cc">
    <div class="cc-side" aria-hidden="true">
      <div class="cc-actor" id="senderZone"></div>
      <div class="cc-tag" id="senderTag"></div>
    </div>
    <section class="cc-phone" aria-label="The Crew group chat">
      <header class="cc-head">
        <div class="cc-live" id="liveAv"></div>
        <div class="info"><b>The Crew</b><span id="onlineStatus">6 online</span></div>
        <div class="cc-stack" id="crewAvatars" aria-hidden="true"></div>
      </header>
      <div class="cc-thread" id="thread" role="log" aria-live="polite"></div>
      <footer class="cc-dock">
        <div class="cc-hint" id="hintRow"></div>
        <div class="cc-replies" id="quickReplies"></div>
        <div class="cc-type" id="typeZone" hidden>
          <div class="cc-compose">
            <div class="cc-box" id="typedBox" aria-live="polite"></div>
            <button class="cc-clear" id="resetType" type="button" aria-label="Clear"></button>
          </div>
          <div class="cc-keys" id="letterRow"></div>
        </div>
      </footer>
    </section>
    <div class="cc-side" aria-hidden="true">
      <div class="cc-actor" id="meZone"></div>
      <div class="cc-tag" id="meTag"></div>
    </div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "level3";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;

LP.init({ theme: "teen", scene: { bg: "assets/story/backgrounds/hangout-spot.jpg", particles: "neon", tint: "linear-gradient(180deg,rgba(40,20,80,.25),rgba(5,6,20,.45))" }, hud: { rounds: 6, exitHref: backHref } });
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const G = window.gsap, RM = LP.RM, esc = LP.esc;
const $ = id => document.getElementById(id);

// The crew. Avatars are cropped from each teen's real "happy" art: cx/cy = head centre, hs = head size (fractions of the image).
const CREW = [
  { id: "ziad", name: "Ziad", col: "#3B82F6", nc: "#93C5FD", ar: 270 / 700, cx: .50, cy: .115, hs: .27 },
  { id: "sara", name: "Sara", col: "#F97316", nc: "#FDBA74", ar: 240 / 630, cx: .55, cy: .17, hs: .29 },
  { id: "omar", name: "Omar", col: "#14B8A6", nc: "#5EEAD4", ar: 198 / 509, cx: .53, cy: .12, hs: .26 },
  { id: "noor", name: "Noor", col: "#10B981", nc: "#6EE7B7", ar: 232 / 530, cx: .51, cy: .15, hs: .28 },
  { id: "hamad", name: "Hamad", col: "#64748B", nc: "#CBD5E1", ar: 199 / 497, cx: .48, cy: .12, hs: .28 },
  { id: "lumi", name: "Lumi", col: "#FACC15", nc: "#FDE68A", ar: 270 / 388, cx: .45, cy: .30, hs: .56 },
];
function avatarEl(c) {
  const d = document.createElement("span"); d.className = "cc-av"; d.style.setProperty("--c", c.col);
  const img = new Image(); img.alt = ""; img.draggable = false; img.src = LP.char(c.id + "-teen", "happy");
  img.style.height = (100 / c.hs) + "%"; img.style.top = (50 - c.cy * 100 / c.hs) + "%"; img.style.left = (50 - c.cx * c.ar * 100 / c.hs) + "%";
  d.appendChild(img); return d;
}

// Crew reacts with a short varied line whenever the student is on a streak
// -- this is the "alive group chat" texture, not just correct/incorrect.
const HYPE_LINES = [
  "yesss that's it 🔥", "you're on fire today 😤", "okay certified genius over here 🧠",
  "the crew is proud 🙌", "ratio... in a good way 😂", "not you actually knowing this 💀",
];
const MISS_LINES = ["lol it's ok, try again", "close one 👀", "nah not quite, one more try"];
const REACTS = ["🔥", "😂", "❤️", "👏", "💯", "🙌"];

// Photos: the shared vocab picture for a word. "watches" (the verb: "She watches videos online.")
// used to show two wristwatches; the matching picture of someone watching a video is watches-tv.
// The lesson data names the right picture in v.image when it differs from the word.
const PHOTO_FIX = { watches: "watches-tv" };
const photoSrc = v => LP.vocabImg(v.image || PHOTO_FIX[v.en.toLowerCase()] || v.en);

// Two options must never both be right: skip distractors whose Arabic is the same word as the target's
// (e.g. boring/dull = "ممل", riddle/puzzle = "أحجية", assignment/homework = "واجب").
const normAr = s => String(s || "").replace(/\(.*?\)/g, "").replace(/[ً-ْ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
function clash(a, b) {
  if (a.en.toLowerCase() === b.en.toLowerCase() || (a.image || a.en) === (b.image || b.en)) return true;
  const x = normAr(a.ar), y = normAr(b.ar); if (!x || !y) return false;
  return x === y || (" " + x + " ").includes(" " + y + " ") || (" " + y + " ").includes(" " + x + " ");
}
function pickOptions(target, n, filter) {
  const out = [target];
  for (const v of Lumio.shuffle(vocab.filter(v => v.en !== target.en && (!filter || filter(v))))) {
    if (out.length >= n) break;
    if (!out.some(o => clash(o, v))) out.push(v);
  }
  return Lumio.shuffle(out);
}

// highlight the word inside its example sentence (also "plays" in "She plays...", "studying" etc.)
function markWord(sentence, word) {
  const stem = word.toLowerCase().replace(/(ing|es|s)$/, "");
  const re = new RegExp("\\b(" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "|" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\w*)\\b", "i");
  const m = sentence.match(re);
  if (!m) return esc(sentence);
  return esc(sentence.slice(0, m.index)) + `<b class="hl">${esc(m[0])}</b>` + esc(sentence.slice(m.index + m[0].length));
}
const thread = $("thread"), quickReplies = $("quickReplies"), typeZone = $("typeZone"), hintRow = $("hintRow"), statusEl = $("onlineStatus");
$("resetType").innerHTML = LP.ICON.again;
const now = () => { const d = new Date(); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
const scrollDown = (smooth) => { thread.scrollTo({ top: thread.scrollHeight, behavior: smooth && !RM ? "smooth" : "auto" }); };
// keep the newest message in view when the keyboard area grows/shrinks or a photo finishes loading
if (window.ResizeObserver) new ResizeObserver(() => scrollDown(false)).observe(thread);

// ---------- actors (laptop): whoever is texting stands on the left, Lumi is with you on the right ----------
const wide = () => matchMedia("(min-width:900px)").matches;
const actors = {};
function senderActor(c) {
  if (!actors[c.id]) {
    actors[c.id] = LP.actor($("senderZone"), { char: c.id + "-teen", pose: "phone", cheer: "laugh", oops: "shrug", alt: c.name });
    actors[c.id].el.style.display = "none";
    ["explain", "laugh", "shrug", "celebrate"].forEach(p => { const i = new Image(); i.src = LP.char(c.id + "-teen", p); });
  }
  return actors[c.id];
}
let curSender = null;
function showSender(c) {
  const a = senderActor(c);
  if (curSender && curSender !== a) curSender.el.style.display = "none";
  const fresh = curSender !== a;
  curSender = a; a.el.style.display = "";
  $("senderTag").innerHTML = ""; $("senderTag").append(avatarEl(c), Object.assign(document.createElement("span"), { innerHTML: `${esc(c.name)} <small>is typing…</small>` }));
  a.set("phone");
  if (fresh && wide()) a.enter("bottom");
}
const me = LP.actor($("meZone"), { char: "lumi-teen", pose: "phone", cheer: "celebrate", oops: "nervous", alt: "Lumi" });
$("meTag").append(avatarEl(CREW[5]), Object.assign(document.createElement("span"), { innerHTML: "Lumi <small>is with you</small>" }));

// header: live avatar of whoever is typing + the crew stack
function setLive(c) { const l = $("liveAv"); l.innerHTML = ""; l.appendChild(avatarEl(c)); if (G && !RM) G.fromTo(l, { scale: .6 }, { scale: 1, duration: .5, ease: "back.out(2.5)" }); }
CREW.slice(0, 4).forEach(c => $("crewAvatars").appendChild(avatarEl(c)));
$("crewAvatars").insertAdjacentHTML("beforeend", '<span class="more">+2</span>');
setLive(CREW[5]);
const idleStatus = () => { statusEl.className = ""; statusEl.textContent = "Ziad, Sara, Omar, Noor, Hamad, Lumi"; };
idleStatus();
thread.insertAdjacentHTML("beforeend", `<div class="cc-day">TODAY</div>`);

// ---------- messages ----------
function pop(el, origin) {
  if (!G || RM) return;
  G.fromTo(el, { scale: .35, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: .55, ease: "back.out(2.2)", transformOrigin: origin || "0% 100%", clearProps: "transform" });
}
function addThem(who, html, imgSrc) {
  const row = document.createElement("div"); row.className = "cc-row them" + (imgSrc ? " pic" : "");
  const col = document.createElement("div"); col.className = "cc-col";
  col.innerHTML = `<div class="cc-name" style="--nc:${who.nc}">${esc(who.name)}</div>`;
  const bub = document.createElement("div"); bub.className = "cc-bub";
  if (imgSrc) {
    const ph = document.createElement("div"); ph.className = "cc-photo loading";
    const img = new Image(); img.alt = "Photo from " + who.name; img.decoding = "async";
    img.onload = () => { ph.classList.remove("loading"); scrollDown(true); if (G && !RM) G.fromTo(img, { scale: .85 }, { scale: 1, duration: .5, ease: "back.out(2)" }); };
    img.onerror = () => ph.remove();
    img.src = imgSrc; ph.appendChild(img); bub.appendChild(ph);
  }
  bub.insertAdjacentHTML("beforeend", `<div>${html}</div><div class="cc-meta">${now()}</div>`);
  col.appendChild(bub); row.append(avatarEl(who), col);
  thread.appendChild(row); scrollDown(true);
  LP.sfx("pop"); pop(row);
  return row;
}
function addMe(text, isAr) {
  const row = document.createElement("div"); row.className = "cc-row me";
  row.innerHTML = `<div class="cc-col"><div class="cc-bub"><div${isAr ? ' class="ar" dir="rtl" lang="ar"' : ""}>${esc(text)}</div><div class="cc-meta">${now()} <span class="ticks">✓✓</span></div><div class="cc-reacts"></div></div></div>`;
  thread.appendChild(row);
  return row;
}
function typing(who, ms) {
  const row = document.createElement("div"); row.className = "cc-typing";
  row.appendChild(avatarEl(who));
  row.insertAdjacentHTML("beforeend", '<div class="cc-dots" aria-label="typing"><i></i><i></i><i></i></div>');
  thread.appendChild(row); scrollDown(true);
  statusEl.className = "typing"; statusEl.textContent = who.name + " is typing…";
  setLive(who); showSender(who);
  let tl = null;
  if (G && !RM) { pop(row); tl = G.to(row.querySelectorAll("i"), { y: -6, opacity: 1, duration: .32, ease: "sine.inOut", yoyo: true, repeat: -1, stagger: .14 }); }
  return LP.wait(ms || 900 + Math.random() * 500).then(() => { if (tl) tl.kill(); row.remove(); idleStatus(); });
}
async function say(who, html, imgSrc, pose) {
  await typing(who);
  addThem(who, html, imgSrc);
  const st = $("senderTag").querySelector("small"); if (st) st.textContent = "in the chat";
  if (curSender) { curSender.set(pose || "explain"); curSender.nod(); }
}

// ---------- game ----------
if (!vocab.length) {
  $("thread").insertAdjacentHTML("beforeend", "<p style='color:#A9B4DA;padding:20px;text-align:center'>No lesson data found.</p>");
  LP.title({ kicker: "Crew Chat", title: "Crew Chat", sub: "No lesson data found.", actor: { char: "lumi-teen", pose: "shrug" } });
} else {
  const ROUNDS = 6;
  // Round plan mixes the level's real focus (image description, general
  // comprehension, grammar exposure through real example sentences)
  // alongside the original vocabulary-translation rounds, rather than
  // translation being the only thing this game practices.
  const PLAN = ["tap", "caption", "type", "meaning", "tap", "caption"];
  const LABEL = { tap: "Quick reply", caption: "Photo drop", type: "Type it back", meaning: "What does it mean?" };
  let r = 0, score = 0, streak = 0, locked = true, missSaid = false;
  // a fresh word each round while the lesson has enough words
  let deck = [];
  const nextTarget = (needExample) => {
    if (!deck.length) deck = Lumio.shuffle([...vocab]);
    let i = needExample ? deck.findIndex(v => v.example) : 0; if (i < 0) i = 0;
    return deck.splice(i, 1)[0];
  };
  // Lumi sits with you (right side on laptops), so the questions come from the other five
  const pickCrew = (not) => { const pool = CREW.filter(c => c !== not && c.id !== "lumi"); return pool[Math.floor(Math.random() * pool.length)]; };
  let asker = null;

  async function drawRound() {
    locked = true; missSaid = false; LP.answer = null;
    LP.round(r);
    const roundType = PLAN[r % PLAN.length];
    const target = nextTarget(roundType === "caption" || roundType === "meaning");
    asker = pickCrew(asker);
    quickReplies.innerHTML = ""; typeZone.hidden = true; hintRow.className = "cc-hint"; hintRow.textContent = "";
    me.set("phone");
    await LP.banner(LABEL[roundType], "Round " + (r + 1) + " of " + ROUNDS);
    if (roundType === "tap" || roundType === "type") {
      await say(asker, `How do you say <b>"<bdi class="ar" dir="rtl" lang="ar">${esc(target.ar)}</bdi>"</b> in English? 🤔`);
      roundType === "tap" ? drawTapRound(target) : drawTypeRound(target);
    } else if (roundType === "caption") {
      await say(asker, `look what I found 📸 what's happening here?`, photoSrc(target), "point");
      drawCaptionRound(target);
    } else {
      // the options are single-word meanings, so ask about the word (highlighted in its sentence)
      await say(asker, `"${markWord(target.example || target.en, target.en)}" ... what does <b>${esc(target.en)}</b> mean? 🧐`, null, "think");
      drawMeaningRound(target);
    }
  }

  function dealChips(opts, labelOf, targetKey, opt) {
    opt = opt || {};
    quickReplies.className = "cc-replies" + (opt.stack ? " stack" : "");
    quickReplies.innerHTML = "";
    const chips = opts.map(o => {
      const b = document.createElement("button"); b.type = "button"; b.className = "cc-chip" + (opt.ar ? " ar" : "");
      b.dataset.key = o.en; b.dataset.press = ""; b.textContent = labelOf(o);
      if (opt.ar) { b.dir = "rtl"; b.lang = "ar"; }
      b.onclick = () => chooseTap(b, targetKey, labelOf(o), !!opt.ar);
      quickReplies.appendChild(b); return b;
    });
    if (G && !RM) G.fromTo(chips, { y: 40, opacity: 0, scale: .8 }, { y: 0, opacity: 1, scale: 1, duration: .5, ease: "back.out(1.8)", stagger: .07, onStart: () => LP.sfx("deal") });
    locked = false; LP.answer = targetKey;   // read by the automated play-through tests
  }

  function drawTapRound(target) {
    typeZone.hidden = true; quickReplies.hidden = false;
    hintRow.textContent = "Tap the right reply!";
    dealChips(pickOptions(target, Math.min(3, vocab.length)), o => o.en, target.en);
  }
  // Image-description round: crew "shares a photo" (a real vocab image) and
  // asks what's happening -- child picks the sentence that actually
  // describes it, from this lesson's own real example sentences.
  function drawCaptionRound(target) {
    typeZone.hidden = true; quickReplies.hidden = false;
    hintRow.textContent = "Pick the caption that fits!";
    dealChips(pickOptions(target, 3, v => v.example), o => o.example || o.en, target.en, { stack: true });
  }
  // Comprehension round: crew sends a full English sentence and asks what it
  // means -- child picks the matching Arabic translation, practicing
  // sentence-level understanding rather than single-word recall.
  function drawMeaningRound(target) {
    typeZone.hidden = true; quickReplies.hidden = false;
    hintRow.textContent = "Pick what it means!";
    dealChips(pickOptions(target, Math.min(3, vocab.length)), o => o.ar, target.en, { ar: true });
  }

  async function chooseTap(chip, targetKey, replyText, isAr) {
    if (locked || chip.disabled) return;
    const ok = chip.dataset.key === targetKey;
    if (!ok) {
      // gentle -- the chip just dims out, the others remain tappable
      chip.classList.add("bad"); LP.bad(chip); streak = 0;
      me.oops("nervous", "phone"); if (curSender) curSender.oops("shrug", "explain");
      setTimeout(() => { chip.classList.remove("bad"); chip.classList.add("out"); chip.disabled = true; }, 450);
      missReply();
      return;
    }
    locked = true; LP.answer = null;
    [...quickReplies.children].forEach(c => c.disabled = true);
    chip.classList.add("good");
    onCorrect(await sendReply(replyText, isAr, chip));
  }

  async function missReply() {
    if (missSaid || RM) return; missSaid = true;
    // never blocks the student: they can keep tapping while the crew answers
    await LP.wait(250);
    if (locked || LP.answer == null) return;
    addThem(asker, MISS_LINES[Math.floor(Math.random() * MISS_LINES.length)]);
  }

  // the reply flies from the keyboard up into the thread
  async function sendReply(text, isAr, fromEl) {
    const row = addMe(text, isAr);
    const bub = row.querySelector(".cc-bub");
    scrollDown(false);
    LP.sfx("whoosh");
    if (G && !RM && fromEl) {
      bub.style.opacity = 0;
      const a = fromEl.getBoundingClientRect(), b = bub.getBoundingClientRect();
      const ghost = fromEl.cloneNode(true); ghost.removeAttribute("id");
      Object.assign(ghost.style, { position: "fixed", left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px", margin: 0, zIndex: 200, pointerEvents: "none" });
      document.body.appendChild(ghost);
      fromEl.style.visibility = "hidden";
      await new Promise(res => G.to(ghost, { x: b.left - a.left + (b.width - a.width) / 2, y: b.top - a.top + (b.height - a.height) / 2, scale: Math.min(1.1, b.width / a.width), duration: .5, ease: "power3.inOut", onComplete: res }));
      ghost.remove(); bub.style.opacity = 1; pop(bub, "100% 100%");
    }
    LP.sfx("pop");
    setTimeout(() => { const t = row.querySelector(".ticks"); if (t) t.classList.add("read"); }, RM ? 0 : 600);
    return bub;
  }

  function drawTypeRound(target) {
    quickReplies.hidden = true; typeZone.hidden = false;
    hintRow.textContent = "Type it back, letter by letter!";
    let built = "";
    const targetLetters = target.en.replace(/[^a-z]/gi, "").toLowerCase();
    const letters = Lumio.shuffle(targetLetters.split(""));
    const box = $("typedBox"), letterRow = $("letterRow");
    letterRow.innerHTML = letters.map((l, i) => `<button class="cc-key" type="button" data-press data-i="${i}" aria-label="${l.toUpperCase()}">${l.toUpperCase()}</button>`).join("");
    const redraw = () => { box.innerHTML = built ? esc(built.toUpperCase()) + '<span class="caret"></span>' : '<span class="caret"></span><span class="ph">Type a message…</span>'; };
    const reset = () => { built = ""; letterRow.querySelectorAll(".cc-key").forEach(t => t.classList.remove("used")); box.classList.remove("bad"); redraw(); };
    const keys = letterRow.querySelectorAll(".cc-key");
    keys.forEach(tile => {
      tile.onclick = async () => {
        if (locked || tile.classList.contains("used")) return;
        built += tile.textContent.toLowerCase();
        tile.classList.add("used"); LP.sfx("tap");
        redraw();
        if (built.length === targetLetters.length) {
          if (built === targetLetters) {
            locked = true; LP.answer = null;
            const bub = await sendReply(target.en, false, box);
            box.style.visibility = ""; reset();
            onCorrect(bub);
          } else {
            LP.bad(null); streak = 0; box.classList.add("bad");
            hintRow.className = "cc-hint bad"; hintRow.textContent = "Almost! Try again";
            me.oops("nervous", "phone");
            if (G && !RM) G.fromTo(box, { x: -10 }, { x: 0, duration: .5, ease: "elastic.out(1,.3)" });
            setTimeout(() => { reset(); hintRow.className = "cc-hint"; hintRow.textContent = "Type it back, letter by letter!"; }, 700);
          }
        }
      };
    });
    $("resetType").onclick = () => { if (!locked) { reset(); LP.sfx("tap"); } };
    redraw();
    if (G && !RM) G.fromTo(keys, { y: 30, opacity: 0, rotation: () => (Math.random() - .5) * 30 }, { y: 0, opacity: 1, rotation: 0, duration: .45, ease: "back.out(2)", stagger: .04 });
    locked = false; LP.answer = target.en;   // read by the automated play-through tests
  }

  async function onCorrect(bub) {
    LP.answer = null;
    score++; streak++;
    LP.fill(r);
    const c = LP.center(bub);
    LP.sfx("correct"); LP.burst(c.x, c.y, { n: 26, ringColor: "#7DF9E3", colors: ["#7C5CFF", "#3BA0FF", "#7DF9E3", "#FFD666", "#FF5C8A"] });
    LP.streak(true);
    me.cheer("celebrate", "phone"); if (curSender) curSender.cheer("laugh", "phone");
    const star = LP.addStar(bub);
    // crew reacts on your message
    const box = bub.querySelector(".cc-reacts"), n = 1 + Math.floor(Math.random() * 3);
    bub.closest(".cc-row").classList.add("reacted");
    for (const e of Lumio.shuffle([...REACTS]).slice(0, n)) {
      await LP.wait(220);
      const s = document.createElement("span"); s.textContent = e; box.appendChild(s); LP.sfx("tick");
      if (G && !RM) G.fromTo(s, { scale: 0, y: 8 }, { scale: 1, y: 0, duration: .45, ease: "back.out(3)" });
    }
    scrollDown(true);
    await star;
    if (streak >= 3) {
      const who = pickCrew(asker);
      await say(who, HYPE_LINES[Math.floor(Math.random() * HYPE_LINES.length)], null, "laugh");
      await LP.wait(900);
    } else await LP.wait(700);
    advance();
  }

  function advance() { r++; r < ROUNDS ? drawRound() : endGame(); }

  function endGame() {
    LP.round(-1); LP.answer = null;
    statusEl.className = ""; statusEl.textContent = "The crew is hyped! 🎉";
    LP.results({ score, total: ROUNDS, scoreLabel: "Replies right",
      note: `The crew is hyped! 🎉 You replied correctly ${score} out of ${ROUNDS} times!`, actor: { char: "lumi-teen", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  LP.title({ kicker: "Level 3 · Group chat", title: "Crew Chat", sub: "The crew is texting you. Reply in English!", ar: "الشلة تراسلك. رد عليهم بالإنجليزية!",
    button: "Open chat", actor: { char: "lumi-teen", pose: "phone", cheer: "laugh" } }).then(drawRound);
}
</script>
