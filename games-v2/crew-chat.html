<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Chat — Lumio English</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* ===== v2 motion kit (shared look: springy, star flights, Lottie) ===== */
  html, body { overflow-x: hidden; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  .flyStar { position: fixed; left: 0; top: 0; z-index: 300; width: 34px; height: 34px; pointer-events: none; will-change: transform; }
  .flyStar svg, .starCt svg.st { width: 100%; height: 100%; display: block; }
  .spark { position: fixed; left: 0; top: 0; z-index: 290; width: 14px; height: 14px; pointer-events: none; will-change: transform, opacity; }
  .spark svg { width: 100%; height: 100%; display: block; }
  .starCt { position: relative; display: inline-flex; align-items: center; gap: 6px; isolation: isolate; }
  .starCt svg.st { width: 20px; height: 20px; flex: none; }
  .starCt .pop { position: absolute; width: 64px; height: 64px; left: -14px; top: 50%; margin-top: -32px; pointer-events: none; z-index: -1; }
  .v2-bar { flex: 1; min-width: 60px; height: 12px; border-radius: 99px; background: rgba(255,255,255,.75); box-shadow: inset 0 1px 3px rgba(67,48,31,.12); overflow: hidden; }
  .v2-bar i { display: block; height: 100%; border-radius: 99px; transform-origin: 0 50%; transform: scaleX(0); transition: transform .7s cubic-bezier(.34,1.56,.64,1); }
  .v2-conf { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
  .v2-conf svg { width: 100% !important; height: 100% !important; }
  .mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .08em; margin-bottom: -.08em; }
  .mask > span { display: inline-block; will-change: transform; }
  .v2-intro { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; overflow: hidden; }
  .v2-intro .mWrap { position: relative; height: min(34vh, 250px); aspect-ratio: 7 / 8; margin-bottom: 6px; }
  .v2-intro .mWrap .halo { position: absolute; inset: -6% -8% 22%; pointer-events: none; opacity: .5; }
  .v2-intro .mWrap img { position: relative; height: 100%; width: auto; margin: 0 auto; display: block; filter: drop-shadow(0 16px 22px rgba(67,48,31,.22)); }
  .v2-intro .shadow { width: 46%; height: 14px; margin: -8px auto 12px; border-radius: 50%; background: rgba(67,48,31,.14); filter: blur(2px); }
  .v2-intro h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 8.4vw, 3.4rem); line-height: 1.05; margin: 0 0 10px; color: var(--cocoa); }
  .v2-intro p.sub { font-weight: 800; font-size: clamp(1rem, 4vw, 1.2rem); color: var(--cocoa-soft); max-width: 420px; margin: 0 auto 26px; }
  .v2-play { min-height: 60px; min-width: 190px; padding: 0 36px; border: none; border-radius: 999px; cursor: pointer;
    font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 0 rgba(0,0,0,.12), 0 18px 34px -10px rgba(249,115,22,.6); }
  .v2-play svg { width: 22px; height: 22px; }
  .v2-play .ring { position: absolute; }
  .v2-stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .v2-stars span { width: 38px; height: 38px; display: block; }
  .v2-stars span svg { width: 100%; height: 100%; display: block; }
  .v2-stars span.off { opacity: .2; filter: grayscale(1); }
  .ckBadge { position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border-radius: 999px; background: #fff;
    box-shadow: 0 4px 10px rgba(22,163,74,.35); display: flex; align-items: center; justify-content: center; pointer-events: none;
    opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1); color: var(--green); font-weight: 800; font-size: 1.2rem; }
  .ckBadge .lt { position: absolute; inset: -2px; }
  .correct .ckBadge { opacity: 1; transform: scale(1); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  :root {
    --chat-bg: #0B141A; --chat-panel: #111B21; --bubble-them: #202C33; --bubble-me: #005C4B;
    --accent: #25D366;
  }
  body { min-height: 100vh; background: #0B141A; font-family: var(--font-body); color: #E9EDEF; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(600px 400px at 15% 20%, rgba(37,211,102,.08), transparent 70%), radial-gradient(500px 400px at 85% 80%, rgba(0,92,75,.25), transparent 70%); }

  #hud { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 0 max(14px, calc(50% - 240px)); height: 64px; background: var(--chat-panel); }
  #hud .pill { background: #1F2C34; color: #E9EDEF; border-radius: 999px; padding: 7px 14px; font-family: var(--font-display); font-weight: 800; font-size: .9rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; }
  #hud .pill.streak { background: linear-gradient(135deg,#F97316,#EF4444); position: relative; padding-left: 8px; }
  #hud .pill.streak .fl { width: 22px; height: 22px; display: inline-block; }
  #hud .pill.streak .flT { display: none; }
  html:not(.v2a) #hud .pill.streak .flT { display: inline; }
  #hud a.exit { color: #E9EDEF; text-decoration: none; font-weight: 800; background: #1F2C34; border-radius: 999px; padding: 0 16px; min-height: 44px; display: inline-flex; align-items: center; }
  #hud .starCt .pop { opacity: .9; }
  .v2-bar { background: #1F2C34; box-shadow: none; height: 6px; }
  .v2-bar i { background: linear-gradient(90deg, #128C6E, var(--accent)); box-shadow: 0 0 12px rgba(37,211,102,.6); }
  @media (max-width: 420px) { #hud { gap: 6px; padding: 0 10px; } #hud .pill { padding: 7px 10px; } }

  #phone { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 64px); height: calc(100dvh - 64px); background: var(--chat-bg); }
  @media (min-width: 560px) { #phone { box-shadow: 0 0 0 1px #1F2C34, 0 30px 80px -20px rgba(0,0,0,.6); } }
  #chatHeader { background: var(--chat-panel); padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1F2C34; }
  #chatHeader .avatars { display: flex; }
  #chatHeader .avatars img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--chat-panel); margin-left: -10px; background: #F97316; }
  #chatHeader .avatars img:first-child { margin-left: 0; }
  #chatHeader .info b { color: #E9EDEF; font-family: var(--font-display); display: block; font-size: 1rem; }
  #chatHeader .info span { color: #8696A0; font-size: .78rem; display: inline-flex; align-items: center; gap: 6px; }
  #chatHeader .info span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(37,211,102,.6); animation: live 1.8s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(37,211,102,.6); } 100% { box-shadow: 0 0 0 8px rgba(37,211,102,0); } }

  #thread { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 14px 6px; display: flex; flex-direction: column; gap: 4px;
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.02) 0, transparent 40%); }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 84%; }
  html:not(.v2a) .msg-row { animation: msgIn .28s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.them { align-self: flex-start; }
  .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row img.av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; margin-bottom: 4px; }
  .bubble { border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: .98rem; line-height: 1.35; position: relative; }
  .them .bubble { background: var(--bubble-them); color: #E9EDEF; border-top-left-radius: 3px; }
  .me .bubble { background: var(--bubble-me); color: #E9EDEF; border-top-right-radius: 3px; }
  .msg-name { font-size: .72rem; font-weight: 800; color: #79E4C6; margin-bottom: 2px; }
  .bubble.correct-flash { box-shadow: 0 0 0 2px rgba(37,211,102,.55), 0 0 24px 2px rgba(37,211,102,.35); transition: box-shadow 1.2s ease; }
  html:not(.v2a) .bubble.correct-flash { animation: flashGreen .5s ease; }
  @keyframes flashGreen { 0%,100% { background: var(--bubble-me); } 50% { background: #128C6E; } }
  .bubble .ticks { display: inline-block; margin-left: 6px; color: #53BDEB; font-size: .78rem; vertical-align: bottom; }

  .typing-row { align-self: flex-start; display: flex; gap: 8px; align-items: flex-end; }
  .typing-row img.av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; }
  .typing-dots { background: var(--bubble-them); border-radius: 12px; border-top-left-radius: 3px; padding: 10px 14px; display: flex; gap: 4px; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: #8696A0; animation: dotPulse 1s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .15s; } .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dotPulse { 0%,60%,100% { opacity: .3; transform: scale(.8); } 30% { opacity: 1; transform: scale(1.1); } }

  #inputZone { background: var(--chat-panel); padding: 10px 12px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #1F2C34; }
  #hintRow { text-align: center; color: #8696A0; font-size: .8rem; font-weight: 700; margin-bottom: 8px; min-height: 1.1em; }

  #quickReplies { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .reply-chip {
    background: #1F2C34; color: #E9EDEF; border: 2px solid #2A3942; border-radius: 999px; min-height: 44px;
    padding: 10px 18px; font-family: var(--font-display); font-weight: 800; font-size: .95rem; max-width: 100%;
    cursor: pointer; transition: background .2s ease, border-color .2s ease, opacity .3s ease;
  }
  .reply-chip:hover { border-color: #3B5260; }
  html:not(.v2a) .reply-chip { transition: transform .12s ease, background .2s ease; }
  html:not(.v2a) .reply-chip:active { transform: scale(.94); }
  .reply-chip.wrong { background: #7A2E2E; border-color: #A33; pointer-events: none; opacity: .5; }
  .reply-chip.locked { pointer-events: none; opacity: .4; }
  .reply-chip.picked { opacity: 1; border-color: var(--accent); background: #0B3B31; }

  #typeZone { text-align: center; }
  #typedBox { background: #1F2C34; border-radius: 10px; padding: 10px 14px; min-height: 1.4em; margin-bottom: 10px;
    font-family: var(--font-display); font-weight: 800; letter-spacing: 3px; color: #E9EDEF; font-size: 1.1rem; }
  #letterRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .letter-tile {
    background: var(--accent); color: #08201A; border: none; border-radius: 10px; width: 44px; height: 44px;
    font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 #128C6E;
    transition: opacity .2s ease;
  }
  html:not(.v2a) .letter-tile { transition: transform .12s ease, opacity .2s ease; }
  html:not(.v2a) .letter-tile:active { transform: scale(.9); }
  .letter-tile.used { opacity: 0; pointer-events: none; }
  #typeControls { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
  #typeControls button { background: #2A3942; color: #E9EDEF; border: none; border-radius: 999px; padding: 0 18px; min-height: 44px; font-weight: 800; cursor: pointer; }

  #intro { background: radial-gradient(circle at 50% 28%, #12443A 0%, #0B141A 62%); color: #E9EDEF; }
  #intro h1 { color: #fff; }
  #intro p.sub { color: #8696A0; }
  #intro .shadow { background: rgba(0,0,0,.45); }
  #intro .mWrap { aspect-ratio: 3 / 5; }
  #intro .mWrap img { filter: drop-shadow(0 16px 26px rgba(0,0,0,.5)); }
  #intro .introExtra { display: flex; justify-content: center; margin: -10px 0 24px; }
  #intro .introExtra img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid #0B141A; margin-left: -10px; background: #1F2C34; }
  #intro .introExtra img:first-child { margin-left: 0; }
  #intro .v2-play { background: var(--accent); color: #08201A; box-shadow: 0 8px 0 #128C6E, 0 18px 40px -10px rgba(37,211,102,.55); }

  #endcard {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.65); padding: 16px;
  }
  #endcard .box { background: #111B21; border-radius: 28px; padding: 30px 22px; text-align: center; box-shadow: 0 0 0 1px #1F2C34, 0 40px 80px -20px rgba(0,0,0,.7), 0 0 60px -10px rgba(37,211,102,.25); max-width: 460px; width: 100%; }
  #endcard .box h1 { color: #E9EDEF; font-family: var(--font-display); font-size: clamp(1.5rem, 6vw, 2rem); }
  #endcard .box p { color: #8696A0; font-weight: 700; }
  #endcard .crew { display: flex; justify-content: center; margin: 10px 0; }
  #endcard .crew img { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; object-position: top; margin: 0 -8px; border: 3px solid #111B21; background: #1F2C34; }
  @media (max-width: 420px) { #endcard .crew img { width: 56px; height: 56px; } }
  #endcard .v2-stars span.off { opacity: .15; }
  #endcard .row .btn { min-height: 48px; }
  .toast { z-index: 400; }
</style>
</head>
<body>

<div id="intro" class="v2-intro" role="dialog" aria-label="Crew Chat">
  <div class="mWrap"><img src="../assets/story/characters/lumi-teen-phone.png" alt="Lumi"></div>
  <div class="shadow"></div>
  <h1>Crew Chat</h1>
  <p class="sub">Reply to the crew's group chat — tap or type it back!</p>
  <div class="introExtra" id="introCrew"></div>
  <button class="v2-play" type="button" id="playBtn"></button>
</div>

<div id="hud">
  <a class="exit" href="../present.html" id="exitBtn">Exit</a>
  <span class="pill starCt" id="starCt"><span class="pop"></span><span id="starIcon"></span><span id="score">0</span></span>
  <span class="pill streak" id="streakPill" style="display:none"><span class="fl" id="flame"></span><span class="flT">🔥</span> <span id="streak">0</span></span>
  <span class="pill" id="roundPill">1/6</span>
  <div class="v2-bar" aria-hidden="true"><i id="bar"></i></div>
</div>

<div id="phone">
  <div id="chatHeader">
    <div class="avatars" id="crewAvatars"></div>
    <div class="info"><b>The Crew</b><span id="onlineStatus">online</span></div>
  </div>
  <div id="thread"></div>
  <div id="inputZone">
    <div id="hintRow"></div>
    <div id="quickReplies"></div>
    <div id="typeZone" style="display:none">
      <div id="typedBox"></div>
      <div id="letterRow"></div>
      <div id="typeControls"><button id="resetType">↺ Clear</button></div>
    </div>
  </div>
</div>

<div id="endcard">
  <div class="box">
    <div class="crew">
      <img src="../assets/story/characters/lumi-teen-celebrate.png" alt="Lumi">
      <img src="../assets/story/characters/omar-teen-celebrate.png" alt="Omar">
      <img src="../assets/story/characters/sara-teen-celebrate.png" alt="Sara">
      <img src="../assets/story/characters/noor-teen-celebrate.png" alt="Noor">
      <img src="../assets/story/characters/ziad-teen-celebrate.png" alt="Ziad">
      <img src="../assets/story/characters/hamad-teen-celebrate.png" alt="Hamad">
    </div>
    <h1>The crew is hyped! 🎉</h1>
    <div class="v2-stars" id="endStars"></div>
    <p id="finalScore"></p>
    <div class="row" style="justify-content:center;gap:10px;margin-top:6px">
      <button class="btn btn-primary" onclick="location.reload()">↺ Chat again</button>
      <a class="btn btn-teal" id="backBtn" href="../present.html">Back</a>
    </div>
  </div>
</div>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script>
// ===== v2 motion kit: GSAP + Lottie, everything degrades to instant/static with reduced motion =====
const V2 = (() => {
  const G = window.gsap, LOT = window.lottie;
  const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const on = !!G && !RM;
  if (on) document.documentElement.classList.add("v2a");
  const STAR = '<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#FFC53D" stroke="#E89B0C" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 001.5.86l11.6-7.2a1 1 0 000-1.72L8.5 3.94A1 1 0 007 4.8z" fill="currentColor"/></svg>';
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  function lot(el, name, loop, slice) {
    if (!LOT || !el || RM) return null;
    try {
      return LOT.loadAnimation({ container: el, renderer: "svg", loop: !!loop, autoplay: true, path: `../assets/lottie/${name}.json`,
        rendererSettings: slice ? { preserveAspectRatio: "xMidYMid slice" } : {} });
    } catch (e) { return null; }
  }
  function once(el, name, slice) {
    if (!el) return null;
    el.innerHTML = "";
    const a = lot(el, name, false, slice);
    if (a) a.addEventListener("complete", () => { el.innerHTML = ""; });
    return a;
  }

  // springy press: scale down on pointerdown, elastic back on release (click logic untouched)
  function press(root, sel) {
    if (!on || !root) return;
    root.addEventListener("pointerdown", e => {
      const t = e.target.closest(sel);
      if (!t || t.disabled || getComputedStyle(t).pointerEvents === "none") return;
      G.to(t, { scale: .9, duration: .12, ease: "power2.out", overwrite: "auto" });
      const up = () => {
        window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
        G.to(t, { scale: 1, duration: .6, ease: "elastic.out(1.2,.4)", overwrite: "auto" });
      };
      window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    });
  }

  function bump(el) { if (el && on) G.fromTo(el, { scale: 1.35 }, { scale: 1, duration: .7, ease: "elastic.out(1.2,.4)", overwrite: "auto" }); }

  // a star flies on a curved path from the answer into the star counter
  function flyStar(fromEl, toEl, done) {
    if (!fromEl || !toEl || !on) { if (done) done(); return; }
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const ax = a.left + a.width / 2 - 17, ay = a.top + a.height / 2 - 17, bx = b.left + 4, by = b.top + b.height / 2 - 17;
    const cx = (ax + bx) / 2 + (ax < bx ? -60 : 60), cy = Math.min(ay, by) - 140;
    const s = document.createElement("div"); s.className = "flyStar"; s.innerHTML = STAR; document.body.appendChild(s);
    const o = { t: 0 };
    G.set(s, { x: ax, y: ay, scale: .4 });
    G.to(o, { t: 1, duration: .85, ease: "power1.inOut", onUpdate: () => {
      const t = o.t, u = 1 - t;
      G.set(s, { x: u * u * ax + 2 * u * t * cx + t * t * bx, y: u * u * ay + 2 * u * t * cy + t * t * by, rotation: t * 300, scale: .4 + Math.sin(t * Math.PI) * 1.1 + t * .2 });
    }, onComplete: () => { s.remove(); if (done) done(); } });
  }

  // little star sparks bursting out of an element (correct answers, pieces landing)
  function burst(el, n, colors) {
    if (!el || !on) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = colors || ["#FFC53D", "#F97316", "#23B5A3", "#FF6B6B", "#7EC8F2"];
    for (let i = 0; i < (n || 10); i++) {
      const s = document.createElement("div"); s.className = "spark";
      s.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="${cols[i % cols.length]}"/></svg>`;
      document.body.appendChild(s);
      const ang = (Math.PI * 2 * i) / (n || 10) + Math.random() * .5, dist = 60 + Math.random() * Math.max(50, r.width * .5);
      G.set(s, { x: cx - 7, y: cy - 7, scale: .2, rotation: Math.random() * 90 });
      G.to(s, { x: cx - 7 + Math.cos(ang) * dist, y: cy - 7 + Math.sin(ang) * dist, scale: .7 + Math.random() * .8, rotation: "+=180", duration: .7, ease: "power3.out" });
      G.to(s, { opacity: 0, duration: .35, delay: .45, onComplete: () => s.remove() });
    }
  }

  function pop(el) {
    if (!el || !on) return;
    G.timeline().to(el, { scale: 1.12, duration: .16, ease: "power2.out", overwrite: "auto" }).to(el, { scale: 1, duration: .7, ease: "elastic.out(1.1,.35)" });
  }
  function shake(el) {
    if (!el || !on) return;
    G.fromTo(el, { x: 0 }, { keyframes: { x: [-9, 9, -6, 5, -2, 0] }, duration: .45, ease: "none", clearProps: "x" });
  }
  // round/stage content entering: springy, slightly rotated, staggered
  function enterCards(els, opts) {
    if (!on || !els.length) return;
    const o = opts || {};
    G.from(els, { scale: .55, opacity: 0, y: o.y || 0, rotation: i => [-6, 5, 4, -5][i % 4], duration: .6, stagger: o.stagger || .08, delay: o.delay || .05, ease: "back.out(2)", clearProps: "transform,opacity" });
  }
  // old content leaving before a new round: returns via callback
  function leave(els, cb) {
    if (!on || !els.length) { cb(); return; }
    G.to(els, { scale: .7, opacity: 0, y: 14, duration: .26, stagger: .04, ease: "back.in(1.6)", onComplete: cb });
  }
  function enter(els, opts) {
    if (!on || !els.length) return;
    const o = opts || {};
    G.from(els, { y: o.y == null ? 22 : o.y, opacity: 0, scale: o.scale || .97, duration: .6, stagger: o.stagger || .07, delay: o.delay || 0, ease: "power3.out", clearProps: "transform,opacity" });
  }
  // wrap each word of an element in a mask, then slide the words up into view
  function maskText(el, text, delay) {
    if (!el) return;
    if (text != null) el.textContent = text;
    if (!on) return;
    const words = el.textContent.split(/(\s+)/);
    el.innerHTML = words.map(w => /^\s+$/.test(w) ? w : `<span class="mask"><span>${w.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</span></span>`).join("");
    G.from($$(".mask > span", el), { yPercent: 115, rotation: 4, duration: .6, stagger: .06, delay: delay || 0, ease: "back.out(1.6)" });
  }

  // mascot idle: breathing, a gentle sway, a blink-like squash and a little wave now and then
  function idle(box, img) {
    const anims = [];
    if (!on || !box || !img) return anims;
    anims.push(G.to(box, { scale: 1.035, transformOrigin: "50% 100%", duration: 1.7, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    anims.push(G.to(img, { rotation: 3, transformOrigin: "50% 100%", duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    const bl = G.timeline({ repeat: -1, repeatDelay: 3.2, delay: 1.6 });
    bl.to(img, { scaleY: .9, scaleX: 1.07, transformOrigin: "50% 100%", duration: .09, ease: "power1.in" })
      .to(img, { scaleY: 1, scaleX: 1, duration: .45, ease: "elastic.out(1,.4)" });
    anims.push(bl);
    const wv = G.timeline({ repeat: -1, repeatDelay: 6.5, delay: 4 });
    wv.to(box, { rotation: -6, transformOrigin: "50% 90%", duration: .16, ease: "sine.out" })
      .to(box, { rotation: 6, duration: .2, yoyo: true, repeat: 3, ease: "sine.inOut" })
      .to(box, { rotation: 0, duration: .5, ease: "elastic.out(1,.4)" });
    anims.push(wv);
    return anims;
  }
  // happy hop with squash-and-stretch
  function hop(el) {
    if (!el || !on) return;
    G.timeline().to(el, { y: -26, scaleY: 1.08, scaleX: .94, transformOrigin: "50% 100%", duration: .22, ease: "power2.out", overwrite: "auto" })
      .to(el, { y: 0, scaleY: 1, scaleX: 1, duration: .22, ease: "power2.in" })
      .to(el, { scaleY: .86, scaleX: 1.12, duration: .08 })
      .to(el, { scaleY: 1, scaleX: 1, duration: .6, ease: "elastic.out(1.1,.35)" });
  }
  function wobble(el) {
    if (!el || !on) return;
    G.fromTo(el, { rotation: 0 }, { keyframes: { rotation: [-7, 7, -4, 3, 0] }, transformOrigin: "50% 100%", duration: .55, ease: "none" });
  }

  function countUp(el, to, dur, delay, onTick) {
    if (!el) return;
    if (!on) { el.textContent = to; if (onTick) for (let i = 1; i <= to; i++) onTick(i); return; }
    const o = { v: 0 }; let last = 0; el.textContent = "0";
    G.to(o, { v: to, duration: dur || 1.2, delay: delay || 0, ease: "power2.out", onUpdate: () => {
      const v = Math.round(o.v); el.textContent = v;
      while (last < v) { last++; if (onTick) onTick(last); }
    } });
  }
  function setBar(el, frac) { if (el) el.style.transform = `scaleX(${Math.max(0, Math.min(1, frac))})`; }

  // star counter: fly a star in from an element, then bump + Lottie star pop and update the number
  function addStar(fromEl, ctEl, numEl, value) {
    const after = () => {
      if (numEl) numEl.textContent = value;
      bump(ctEl);
      if (window.Lumio && Lumio.sfx) Lumio.sfx("star");
      const p = ctEl && ctEl.querySelector(".pop"); if (p) once(p, "star-pop");
    };
    flyStar(fromEl, ctEl, after);
  }

  // intro / start screen: mascot drops in and squashes, title words rise, button springs; mascot idles
  function intro(root, onStart) {
    const box = root.querySelector(".mWrap"), img = box && box.querySelector("img"), title = root.querySelector("h1");
    const btn = root.querySelector(".v2-play"), halo = root.querySelector(".halo");
    let anims = [];
    if (halo) { const a = lot(halo, "star-pop", true); if (a) anims.push(a); }
    maskText(title, null, .55);
    if (on) {
      const tl = G.timeline({ delay: .1 });
      tl.fromTo(img, { y: -220, opacity: 0, scaleX: .84, scaleY: 1.2, transformOrigin: "50% 100%" }, { y: 0, opacity: 1, duration: .45, ease: "power2.in" })
        .to(img, { scaleX: 1.22, scaleY: .76, duration: .08, ease: "power1.out" })
        .to(img, { scaleX: 1, scaleY: 1, duration: .8, ease: "elastic.out(1.1,.32)" })
        .from(root.querySelector(".shadow"), { scaleX: .2, opacity: 0, duration: .4 }, "-=1.1")
        .from(root.querySelectorAll("p.sub, .introExtra"), { y: 16, opacity: 0, duration: .5, stagger: .08, ease: "power3.out" }, "-=.45")
        .from(btn, { scale: 0, rotation: -8, duration: .7, ease: "back.out(2.2)", clearProps: "transform" }, "-=.3")
        .add(() => {
          anims = anims.concat(idle(box, img));
          anims.push(G.to(btn, { scale: 1.06, duration: .8, yoyo: true, repeat: -1, ease: "sine.inOut" }));
        });
      anims.push(tl);
    }
    btn.addEventListener("click", () => {
      anims.forEach(a => { try { a.kill ? a.kill() : a.destroy(); } catch (e) {} });
      if (!on) { root.remove(); onStart(); return; }
      G.timeline().to(btn, { scale: .9, duration: .1 }).to(root, { opacity: 0, scale: 1.06, duration: .38, ease: "power2.in", onComplete: () => { root.remove(); onStart(); } });
    }, { once: true });
  }

  // end-of-game: dim fades in, box springs up, Lottie confetti, crew pops in, stars light up as the count rises
  function celebrate(endcard, box, crewImgs, starsEl, countEl, score) {
    endcard.style.display = "flex";
    const conf = document.createElement("div"); conf.className = "v2-conf"; document.body.appendChild(conf);
    once(conf, "confetti", true);
    setTimeout(() => conf.remove(), 2600);
    const stars = starsEl ? $$("span", starsEl) : [];
    const light = i => { const s = stars[i - 1]; if (!s) return; s.classList.remove("off"); if (on) { G.fromTo(s, { scale: .3, rotation: -40 }, { scale: 1, rotation: 0, duration: .6, ease: "back.out(3)" }); burst(s, 6); } };
    if (!on) { countUp(countEl, score, 0, 0, light); return; }
    G.fromTo(endcard, { opacity: 0 }, { opacity: 1, duration: .3 });
    const tl = G.timeline();
    tl.from(box, { y: 80, scale: .7, opacity: 0, duration: .7, ease: "back.out(1.7)", clearProps: "transform,opacity" })
      .from(crewImgs, { y: 60, opacity: 0, scale: .5, rotation: i => (i % 2 ? 12 : -12), duration: .6, stagger: .08, ease: "back.out(2.4)", clearProps: "transform,opacity" }, "-=.35")
      .from(box.querySelectorAll("h1, .v2-stars, p, .row"), { y: 18, opacity: 0, duration: .45, stagger: .08, ease: "power3.out", clearProps: "transform,opacity" }, "-=.4")
      .add(() => countUp(countEl, score, Math.max(.6, score * .28), 0, light), "-=.2")
      .add(() => crewImgs.forEach((im, i) => G.to(im, { y: -6, duration: .9 + i * .07, yoyo: true, repeat: -1, ease: "sine.inOut", delay: i * .1 })), "+=.4");
  }

  return { G, RM, on, STAR, PLAY, lot, once, press, bump, flyStar, burst, pop, shake, enterCards, leave, enter, maskText, idle, hop, wobble, countUp, setBar, addStar, intro, celebrate, $$ };
})();

</script>
<script>
const level = Lumio.qs("level") || "level3";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") ["exitBtn", "backBtn"].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener("click", e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); }); });
document.getElementById("exitBtn").href = backHref;
document.getElementById("backBtn").href = backHref;

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const slug = w => w.toLowerCase().replace(/'/g, "").replace(/ /g, "-");

document.getElementById("starIcon").outerHTML = V2.STAR;
document.getElementById("playBtn").innerHTML = V2.PLAY + "<span>Play</span>";

const CREW = [
  { id: "ziad", name: "Ziad" }, { id: "sara", name: "Sara" }, { id: "omar", name: "Omar" },
  { id: "noor", name: "Noor" }, { id: "hamad", name: "Hamad" }, { id: "lumi", name: "Lumi" },
];
const avatar = c => `../assets/story/characters/${c.id}-teen-wave.png`;
document.getElementById("introCrew").innerHTML = CREW.map(c => `<img src="${avatar(c)}" alt="${c.name}">`).join("");

// Crew reacts with a short varied line whenever the student is on a streak
// -- this is the "alive group chat" texture, not just correct/incorrect.
const HYPE_LINES = [
  "yesss that's it 🔥", "you're on fire today 😤", "okay certified genius over here 🧠",
  "the crew is proud 🙌", "ratio... in a good way 😂", "not you actually knowing this 💀",
];
const MISS_LINES = ["lol it's ok, try again", "close one 👀", "nah not quite, one more try"];

if (!vocab.length) {
  document.getElementById("thread").innerHTML = "<p style='color:#8696A0;padding:20px'>No lesson data found.</p>";
  document.getElementById("intro").remove();
} else {
  document.getElementById("crewAvatars").innerHTML = CREW.slice(0, 4).map(c => `<img src="${avatar(c)}" alt="${c.name}">`).join("");

  const ROUNDS = 6;
  // Round plan mixes image description, comprehension and grammar exposure
  // through real example sentences alongside vocabulary-translation rounds.
  const PLAN = ["tap", "caption", "type", "meaning", "tap", "caption"];
  let r = 0, score = 0, streak = 0, locked = false;
  const thread = document.getElementById("thread");
  const quickReplies = document.getElementById("quickReplies");
  const typeZone = document.getElementById("typeZone");
  const hintRow = document.getElementById("hintRow");
  const starCt = document.getElementById("starCt");
  const bar = document.getElementById("bar");
  let flameAnim = null;

  document.getElementById("endStars").innerHTML = Array.from({ length: ROUNDS }, () => `<span class="off">${V2.STAR}</span>`).join("");
  window.__round = null; // exposed for automated QA only

  function scrollDown() {
    try { thread.scrollTo({ top: thread.scrollHeight, behavior: V2.on ? "smooth" : "auto" }); } catch (e) { thread.scrollTop = thread.scrollHeight; }
  }

  function addMsg(who, text, cls, imgSrc) {
    const row = document.createElement("div");
    row.className = `msg-row ${cls}`;
    const photoHtml = imgSrc ? `<img src="${imgSrc}" style="width:100%;border-radius:12px;margin-bottom:6px;display:block;background:#fff" onerror="this.remove()">` : "";
    if (cls === "them") {
      row.innerHTML = `<img class="av" src="${avatar(who)}" alt="${who.name}">
        <div><div class="msg-name">${who.name}</div><div class="bubble">${photoHtml}${text}</div></div>`;
    } else {
      row.innerHTML = `<div class="bubble" id="lastMeBubble">${photoHtml}${text}<span class="ticks">✓✓</span></div>`;
    }
    thread.appendChild(row);
    if (V2.on) {
      // them: slides in from the left with a soft spring; me: pops out of the input from the right
      V2.G.from(row, { x: cls === "them" ? -26 : 26, y: 10, scale: .9, opacity: 0, transformOrigin: cls === "them" ? "0% 100%" : "100% 100%", duration: .5, ease: "back.out(1.7)", clearProps: "transform,opacity" });
      const ph = row.querySelector(".bubble img");
      if (ph) V2.G.from(ph, { scale: .85, opacity: 0, duration: .6, delay: .15, ease: "power3.out", clearProps: "transform,opacity" });
    }
    scrollDown();
    if (imgSrc) { const ph = row.querySelector(".bubble img"); if (ph) ph.addEventListener("load", scrollDown); }
    return row;
  }

  function showTyping(who, cb) {
    const row = document.createElement("div");
    row.className = "typing-row";
    row.innerHTML = `<img class="av" src="${avatar(who)}" alt=""><div class="typing-dots"><span></span><span></span><span></span></div>`;
    thread.appendChild(row);
    if (V2.on) V2.G.from(row, { scale: .6, opacity: 0, transformOrigin: "0% 100%", duration: .35, ease: "back.out(2)" });
    scrollDown();
    setTimeout(() => {
      const done = () => { row.remove(); cb(); };
      if (V2.on) V2.G.to(row, { scale: .8, opacity: 0, duration: .15, onComplete: done }); else done();
    }, 700 + Math.random() * 400);
  }

  function pickCrew() { return CREW[Math.floor(Math.random() * CREW.length)]; }

  function drawRound() {
    locked = false;
    document.getElementById("roundPill").textContent = `${r + 1}/${ROUNDS}`;
    const target = Lumio.shuffle(vocab)[0];
    const who = pickCrew();
    const roundType = PLAN[r % PLAN.length];
    window.__round = { idx: r, kind: roundType, answer: roundType === "type" ? target.en.replace(/[^a-z]/gi, "").toLowerCase() : target.en, ready: false };
    if (V2.on) V2.G.to([quickReplies, typeZone], { opacity: .35, duration: .2 });

    if (roundType === "tap") {
      showTyping(who, () => {
        addMsg(who, `How do you say <b>"${target.ar}"</b> in English? 🤔`, "them");
        drawTapRound(target);
      });
    } else if (roundType === "type") {
      showTyping(who, () => {
        addMsg(who, `How do you say <b>"${target.ar}"</b> in English? 🤔`, "them");
        drawTypeRound(target);
      });
    } else if (roundType === "caption") {
      showTyping(who, () => {
        addMsg(who, `look what I found 📸 what's happening here?`, "them", `../assets/vocab/${slug(target.en)}.png`);
        drawCaptionRound(target);
      });
    } else if (roundType === "meaning") {
      showTyping(who, () => {
        addMsg(who, `"${target.example || target.en}" ... what does that mean? 🧐`, "them");
        drawMeaningRound(target);
      });
    }
  }

  // shared: the input area comes back to life and the options cascade in
  function revealInput(sel) {
    if (window.__round) window.__round.ready = true;
    if (!V2.on) return;
    V2.G.to([quickReplies, typeZone], { opacity: 1, duration: .2 });
    V2.maskText(hintRow, null, 0);
    V2.G.from(V2.$$(sel), { y: 18, opacity: 0, scale: .85, duration: .45, stagger: .06, delay: .05, ease: "back.out(2)", clearProps: "transform,opacity" });
  }

  function drawTapRound(target) {
    typeZone.style.display = "none";
    quickReplies.style.display = "flex";
    hintRow.textContent = "Tap the right reply!";
    const distractorPool = Lumio.shuffle(vocab.filter(v => v.en !== target.en));
    const numOptions = Math.min(3, vocab.length);
    const opts = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);
    quickReplies.innerHTML = opts.map(o => `<button class="reply-chip" data-key="${o.en}">${o.en}</button>`).join("");
    document.querySelectorAll(".reply-chip").forEach(chip => { chip.onclick = () => chooseTap(chip, target.en, chip.textContent); });
    revealInput(".reply-chip");
  }

  // Image-description round: crew "shares a photo" (a real vocab image) and
  // asks what's happening -- pick the sentence that actually describes it.
  function drawCaptionRound(target) {
    typeZone.style.display = "none";
    quickReplies.style.display = "flex";
    hintRow.textContent = "Pick the caption that fits!";
    const distractorPool = Lumio.shuffle(vocab.filter(v => v.en !== target.en && v.example));
    const numOptions = Math.min(3, distractorPool.length + 1);
    const opts = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);
    quickReplies.innerHTML = opts.map(o => `<button class="reply-chip" data-key="${o.en}">${o.example || o.en}</button>`).join("");
    document.querySelectorAll(".reply-chip").forEach(chip => { chip.onclick = () => chooseTap(chip, target.en, chip.textContent); });
    revealInput(".reply-chip");
  }

  // Comprehension round: crew sends a full English sentence and asks what it
  // means -- pick the matching Arabic translation.
  function drawMeaningRound(target) {
    typeZone.style.display = "none";
    quickReplies.style.display = "flex";
    hintRow.textContent = "Pick what it means!";
    const distractorPool = Lumio.shuffle(vocab.filter(v => v.en !== target.en));
    const numOptions = Math.min(3, vocab.length);
    const opts = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);
    quickReplies.innerHTML = opts.map(o => `<button class="reply-chip" data-key="${o.en}">${o.ar}</button>`).join("");
    document.querySelectorAll(".reply-chip").forEach(chip => { chip.onclick = () => chooseTap(chip, target.en, chip.textContent); });
    revealInput(".reply-chip");
  }

  function chooseTap(chip, targetKey, replyText) {
    if (locked) return;
    const ok = chip.dataset.key === targetKey;
    if (ok) {
      locked = true;
      document.querySelectorAll(".reply-chip").forEach(c => c.classList.add("locked"));
      chip.classList.add("picked");
      Lumio.beep(true);
      if (V2.on) V2.G.to(chip, { y: -14, scale: 1.05, opacity: 0, duration: .3, ease: "power2.in" });
      const bubble = addMsg(null, replyText, "me");
      bubble.querySelector(".bubble").classList.add("correct-flash");
      onCorrect(bubble.querySelector(".bubble"));
    } else {
      Lumio.beep(false);
      chip.classList.add("wrong");
      V2.shake(chip);
      // gentle -- the chip just dims out, the others remain tappable
    }
  }

  function drawTypeRound(target) {
    quickReplies.style.display = "none";
    typeZone.style.display = "block";
    hintRow.textContent = "Type it back, letter by letter!";
    let built = "";
    const letters = Lumio.shuffle(target.en.replace(/[^a-z]/gi, "").toLowerCase().split(""));
    const typedBox = document.getElementById("typedBox");
    typedBox.textContent = "";
    const letterRow = document.getElementById("letterRow");
    letterRow.innerHTML = letters.map((l, i) => `<button class="letter-tile" data-i="${i}">${l.toUpperCase()}</button>`).join("");
    const targetLetters = target.en.replace(/[^a-z]/gi, "").toLowerCase();

    function redraw() {
      typedBox.textContent = built.toUpperCase() || "…";
    }
    function resetTiles() {
      built = "";
      letterRow.querySelectorAll(".letter-tile").forEach(t => t.classList.remove("used"));
      if (V2.on) V2.G.fromTo(letterRow.querySelectorAll(".letter-tile"), { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, stagger: .03, ease: "back.out(2.4)", clearProps: "transform,opacity" });
      redraw();
    }
    letterRow.querySelectorAll(".letter-tile").forEach(tile => {
      tile.onclick = () => {
        if (locked || tile.classList.contains("used")) return;
        built += tile.textContent.toLowerCase();
        tile.classList.add("used");
        redraw();
        if (V2.on) V2.G.fromTo(typedBox, { scale: 1.04 }, { scale: 1, duration: .35, ease: "back.out(3)" });
        if (built.length === targetLetters.length) {
          if (built === targetLetters) {
            locked = true;
            Lumio.beep(true);
            if (V2.on) V2.G.fromTo(typedBox, { boxShadow: "0 0 0 2px rgba(37,211,102,.8)" }, { boxShadow: "0 0 0 0 rgba(37,211,102,0)", duration: .9 });
            const bubble = addMsg(null, target.en, "me");
            bubble.querySelector(".bubble").classList.add("correct-flash");
            onCorrect(bubble.querySelector(".bubble"));
          } else {
            Lumio.beep(false);
            V2.shake(typedBox);
            Lumio.toast("Almost! Try again");
            setTimeout(resetTiles, 700);
          }
        }
      };
    });
    document.getElementById("resetType").onclick = resetTiles;
    redraw();
    revealInput(".letter-tile");
  }

  function onCorrect(fromEl) {
    score++; streak++;
    V2.addStar(fromEl, starCt, document.getElementById("score"), score);
    V2.setBar(bar, (r + 1) / ROUNDS);
    if (streak >= 3) {
      const pill = document.getElementById("streakPill");
      const first = pill.style.display === "none";
      pill.style.display = "inline-flex";
      document.getElementById("streak").textContent = streak;
      if (first) {
        flameAnim = V2.lot(document.getElementById("flame"), "flame", true);
        if (V2.on) V2.G.from(pill, { scale: 0, rotation: -20, duration: .6, ease: "back.out(2.6)", clearProps: "transform" });
      } else V2.bump(pill);
    }
    const after = () => {
      if (streak >= 3) {
        const who = pickCrew();
        showTyping(who, () => {
          addMsg(who, HYPE_LINES[Math.floor(Math.random() * HYPE_LINES.length)], "them");
          setTimeout(advance, 900);
        });
      } else {
        setTimeout(advance, 700);
      }
    };
    setTimeout(after, 500);
  }

  function advance() { r++; r < ROUNDS ? drawRound() : endGame(); }

  function endGame() {
    window.__ended = true;
    Lumio.confetti(100);
    const pct = Math.round((score / ROUNDS) * 100);
    Lumio.speak(pct >= 80 ? "Amazing!" : "Great job!"); // only these two have recordings
    document.getElementById("finalScore").innerHTML = `You replied correctly <span id="endCount">0</span> out of ${ROUNDS} times!`;
    const endcard = document.getElementById("endcard");
    V2.celebrate(endcard, endcard.querySelector(".box"), V2.$$(".crew img", endcard), document.getElementById("endStars"), document.getElementById("endCount"), score);
  }

  V2.press(quickReplies, ".reply-chip");
  V2.press(document.getElementById("letterRow"), ".letter-tile");
  V2.press(document.getElementById("typeControls"), "button");
  V2.press(document.getElementById("endcard"), ".btn");

  V2.intro(document.getElementById("intro"), () => {
    if (V2.on) {
      V2.G.from("#hud > *", { y: -14, opacity: 0, duration: .5, stagger: .05, ease: "power3.out", clearProps: "transform,opacity" });
      V2.G.from("#phone", { y: 40, opacity: 0, duration: .6, ease: "power3.out", clearProps: "transform,opacity" });
      V2.G.from("#crewAvatars img", { x: -16, opacity: 0, scale: .6, duration: .45, stagger: .07, delay: .25, ease: "back.out(2.2)", clearProps: "transform,opacity" });
    }
    drawRound();
  });
  if (V2.on) V2.G.from("#introCrew img", { y: 20, opacity: 0, scale: .5, duration: .5, stagger: .07, delay: 1.1, ease: "back.out(2.4)", clearProps: "transform,opacity" });
}
</script>
</body>
</html>
