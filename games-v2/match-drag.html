<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Match It — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Match It: Lumi's playroom. Picture frames hang on the board, the words sit on a toy shelf.
     The child picks a word up (real drag, mouse or finger), it follows the finger with a little
     swing, gets pulled in by the nearest frame like a magnet, and snaps into the frame's name slot.
     Tap a word, then tap a picture, works too (and is what the keyboard uses). */
  .md{width:100%;max-width:1180px;display:grid;grid-template-columns:1fr;gap:10px;justify-items:center;align-content:start}
  .md-top{display:flex;align-items:flex-end;gap:6px;width:100%;max-width:620px}
  .md-lumi{position:relative;flex:none;height:clamp(104px,14vh,160px);width:clamp(86px,12vh,130px);display:flex;justify-content:center;align-items:flex-end}
  .md-lumi .lp-actor{height:100%}
  .md-ask{flex:1;min-width:0;padding-bottom:18px}
  .md-ask .lp-bubble{max-width:100%;cursor:default;padding:12px 20px 12px 22px}
  .md-ask .lp-bubble .tail{left:-8px;bottom:22px}
  .md-ask .lp-bubble .txt{font-size:clamp(17px,4.4vw,23px)}
  .md-board{width:100%;max-width:600px;display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
  .md-board.c2{grid-template-columns:repeat(2,1fr);max-width:420px}
  /* picture frames */
  .md-slot{padding-bottom:42px}
  .md-slot .pic{margin:9px 9px 0}
  .md-slot .dock{position:absolute;left:9px;right:9px;bottom:8px;height:30px;border-radius:999px;border:3px dashed #E7C9A0;
    display:grid;place-items:center;font-family:var(--lp-display);font-weight:800;font-size:clamp(13px,3.6vw,17px);color:#B98E5E;line-height:1;
    background:rgba(255,248,236,.9);transition:border-color .2s,background .2s;white-space:nowrap;overflow:hidden;padding:0 4px}
  .md-slot.near .dock{border-color:var(--lp-accent);background:#FFF0D6}
  .md-slot.near{box-shadow:0 7px 0 #FFC27A,0 0 0 5px rgba(249,115,22,.35),0 22px 30px -18px rgba(60,30,5,.7)}
  .md-slot.filled .dock{border:none;background:linear-gradient(180deg,#34D399,#16A34A);color:#fff;box-shadow:0 3px 0 #15803D}
  .md-slot.filled{cursor:default}
  .md-slot.armed:not(.filled) .dock{animation:mdBlink 1s ease-in-out infinite}
  @keyframes mdBlink{50%{border-color:var(--lp-accent);background:#FFE2B8}}
  /* the toy shelf with the word chips */
  .md-shelf{position:relative;width:100%;max-width:600px;padding:10px 10px 22px;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,250,240,.86),rgba(255,240,215,.86));border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--lp-shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .md-shelf::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:12px;border-radius:6px;
    background:linear-gradient(180deg,#C98A4B,#9A5F2C);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 8px -3px rgba(60,30,5,.6)}
  .md-tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 9px}
  .md-chip{position:relative;border:none;cursor:grab;min-height:48px;padding:0 18px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:var(--lp-display);font-weight:800;font-size:clamp(18px,4.6vw,22px);color:#43301F;white-space:nowrap;
    background:linear-gradient(180deg,#fff,#FFF4E2);box-shadow:0 5px 0 #E8C99C,0 12px 18px -10px rgba(60,30,5,.6)}
  .md-chip::before{content:"";position:absolute;left:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--c,#F97316);box-shadow:0 0 0 3px rgba(255,255,255,.8)}
  .md-chip{padding-left:30px}
  .md-chip.sel{background:linear-gradient(180deg,#FFD666,#FFB020);box-shadow:0 5px 0 #D98A00,0 0 0 4px rgba(255,214,102,.55),0 14px 22px -10px rgba(200,120,0,.8)}
  .md-chip.gone{visibility:hidden}
  .md-chip.out{display:none}
  .md-fly{position:fixed;left:0;top:0;z-index:200;margin:0;pointer-events:none;cursor:grabbing;
    box-shadow:0 5px 0 #D98A00,0 26px 30px -12px rgba(60,30,5,.55);background:linear-gradient(180deg,#FFE58A,#FFB020)}
  .md-hint{font-weight:800;font-size:13px;color:#8A6A4A;text-align:center;margin:0 0 8px}
  .md-hint+.md-tray{min-height:48px}
  #stage{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .md-hint .ar{font-family:'Tajawal',var(--lp-body);margin-inline-start:6px}
  @media (min-width:900px){
    .md{grid-template-columns:300px auto;justify-content:center;column-gap:36px;row-gap:14px;align-items:start;min-height:calc(100dvh - 110px);align-content:center}
    .md-top{display:contents}
    .md-lumi{grid-row:1 / span 3;align-self:center;height:min(58vh,460px);width:300px}
    .md-ask{grid-column:2;padding:0;justify-self:start;max-width:720px;width:100%}
    .md-board{grid-column:2;width:min(780px,calc((100dvh - 330px) * 1.3));max-width:none;gap:18px;justify-self:start}
    .md-board.c2{width:min(540px,calc((100dvh - 330px) * .85))}
    .md-shelf{grid-column:2;width:min(780px,calc((100dvh - 330px) * 1.3));max-width:none;justify-self:start}
    #stage{padding-bottom:24px}
    .md-chip{min-height:56px;font-size:24px;padding:0 24px 0 34px}
  }
  @media (max-height:700px) and (max-width:899px){ .md-lumi{height:96px;width:80px} .md-slot .pic{margin:6px 6px 0} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="md" id="md">
    <div class="md-top">
      <div class="md-lumi" id="lumiZone"></div>
      <div class="md-ask">
        <div class="lp-bubble" id="promptCard"><span class="txt" id="promptText">Drag the word to its picture!</span><span class="tail"></span></div>
      </div>
    </div>
    <div class="md-board" id="pics" aria-label="Pictures"></div>
    <div class="md-shelf">
      <p class="md-hint">Drag a word, or tap it and then its picture</p>
      <div class="md-tray" id="words" aria-label="Words"></div>
    </div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "pre-a";
const num = parseInt(Lumio.qs("n") || "1", 10);
// Exit/Back go to the lesson the game was launched from (or the map / the trial deck).
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;
const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = (lesson ? Lumio.shuffle([...lesson.vocab]) : []).slice(0, 6);

LP.init({ scene: { bg: "assets/lesson-bg-kid/playroom.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(255,236,200,.12),rgba(60,30,0,.22))" },
  hud: { rounds: Math.max(1, vocab.length), exitHref: backHref } });
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

// Words whose pictures show the same thing (e.g. "hello" and "hi" are both a wave, "hands" is a clapping
// picture like "clap", "puppy" and "dog" are both puppies). If both are on the board, either word may go on
// either of those pictures, so a child is never marked wrong for a picture that really does show their word.
const SAME_PIC = [["hello", "hi"], ["hands", "clap"], ["dog", "puppy", "pet"], ["cat", "kitten"], ["big", "elephant"], ["small", "mouse"],
  ["happy", "great"], ["boy", "sad"], ["fine", "okay"], ["draw", "picture"], ["cousin", "brother"], ["clock", "hour", "minute", "o'clock"]];
const same = (a, b) => a === b || SAME_PIC.some(g => g.includes(a.toLowerCase()) && g.includes(b.toLowerCase()));

const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "point", cheer: "celebrate", oops: "surprised", alt: "Lumi" });
const picsEl = document.getElementById("pics"), wordsEl = document.getElementById("words"), promptText = document.getElementById("promptText");
const CHIPC = ["#F97316", "#0D9488", "#3B82F6", "#E11D48", "#8B5CF6", "#F59E0B"];

if (!vocab.length) {
  picsEl.innerHTML = "<p class='lp-panel' style='padding:24px;grid-column:1/-1'>No lesson data found.</p>";
} else {
  const total = vocab.length;
  let matched = 0, score = 0, busy = false, selected = null;
  const missed = new Set();
  picsEl.className = "md-board" + (total <= 4 ? " c2" : "");

  const slots = Lumio.shuffle(vocab.map(v => v.en)).map(w => {
    const s = LP.picCard(w, { label: false, aria: "Picture" });
    s.classList.add("md-slot"); s.dataset.answer = w;
    s.insertAdjacentHTML("beforeend", '<span class="dock" aria-hidden="true">?</span>');
    s.onclick = () => { if (selected && !s.classList.contains("filled")) place(selected, s, null); else if (!selected && !s.classList.contains("filled")) nudgeChips(); };
    picsEl.appendChild(s); return s;
  });
  const chips = Lumio.shuffle(vocab.map(v => v.en)).map((w, i) => {
    const c = document.createElement("button"); c.type = "button"; c.className = "md-chip"; c.dataset.word = w; c.textContent = w;
    c.style.setProperty("--c", CHIPC[i % CHIPC.length]); c.setAttribute("aria-label", "Word: " + w);
    wordsEl.appendChild(c); wireChip(c); return c;
  });
  const setAnswer = () => { const c = chips.find(c => !c.dataset.placed); LP.answer = c ? c.dataset.word : null; };

  function nudgeChips() {
    const left = chips.filter(c => !c.dataset.placed);
    if (window.gsap && !LP.RM) gsap.fromTo(left, { y: 0 }, { y: -10, duration: .18, yoyo: true, repeat: 1, stagger: .04, ease: "power2.out" });
  }
  function select(c) {
    if (selected === c) { unselect(); return; }
    unselect(); selected = c; c.classList.add("sel"); slots.forEach(s => s.classList.add("armed"));
    LP.say(c.dataset.word); LP.sfx("tap");
    if (window.gsap && !LP.RM) gsap.fromTo(c, { rotation: -6 }, { rotation: 0, duration: .6, ease: "elastic.out(1.2,.3)" });
    promptText.innerHTML = `Now tap the picture of <q>${LP.esc(c.dataset.word)}</q>!`;
  }
  function unselect() { if (selected) selected.classList.remove("sel"); selected = null; slots.forEach(s => s.classList.remove("armed")); promptText.textContent = "Drag the word to its picture!"; }

  // ---------- the drag: a flying copy of the chip follows the finger with lag and swing, pulled by magnets ----------
  function makeFlyer(c) {
    const r = c.getBoundingClientRect(), f = c.cloneNode(true);
    f.classList.remove("sel"); f.classList.add("md-fly"); f.removeAttribute("aria-label"); f.setAttribute("aria-hidden", "true");
    f.style.width = r.width + "px"; f.style.height = r.height + "px"; document.body.appendChild(f);
    c.classList.add("gone");
    const st = { x: r.left, y: r.top, w: r.width, h: r.height, el: f, rot: 0, sc: 1 };
    const put = () => { f.style.transform = `translate(${st.x}px,${st.y}px) rotate(${st.rot}deg) scale(${st.sc})`; };
    st.put = put; put(); return st;
  }
  const slotCenters = () => slots.filter(s => !s.classList.contains("filled")).map(s => {
    const r = s.getBoundingClientRect(), d = s.querySelector(".dock").getBoundingClientRect();
    return { s, x: r.left + r.width / 2, y: r.top + r.height / 2, dx: d.left + d.width / 2, dy: d.top + d.height / 2, R: Math.max(r.width, r.height) * .78 };
  });
  function nearest(px, py) {
    let best = null;
    for (const c of slotCenters()) { const d = Math.hypot(px - c.x, py - c.y); if (d < c.R && (!best || d < best.d)) best = Object.assign({ d }, c); }
    return best;
  }

  function wireChip(c) {
    let start = null, drag = null, raf = 0, ptr = { x: 0, y: 0 }, grab = { x: 0, y: 0 }, hot = null, lastX = 0;
    c.addEventListener("pointerdown", e => {
      if (busy || c.dataset.placed || (e.pointerType === "mouse" && e.button !== 0)) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId }; c._dragged = false;
      try { c.setPointerCapture(e.pointerId); } catch (x) {}
    });
    c.addEventListener("pointermove", e => {
      if (!start || e.pointerId !== start.id) return;
      ptr = { x: e.clientX, y: e.clientY };
      if (!drag && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
        unselect(); c._dragged = true;
        drag = makeFlyer(c); grab = { x: start.x - drag.x, y: start.y - drag.y }; lastX = drag.x;
        LP.say(c.dataset.word); LP.sfx("flip");
        if (window.gsap && !LP.RM) gsap.to(drag, { sc: 1.12, duration: .25, ease: "back.out(3)", onUpdate: drag.put });
        const loop = () => {
          // magnet: inside a frame's field the chip is pulled toward that frame's name slot
          const n = nearest(ptr.x, ptr.y);
          if (n !== hot && (!n || !hot || n.s !== hot.s)) {
            slots.forEach(s => s.classList.remove("near"));
            if (n) { n.s.classList.add("near"); LP.sfx("tick"); if (window.gsap && !LP.RM) gsap.fromTo(n.s, { scale: 1 }, { scale: 1.05, duration: .25, ease: "back.out(3)" }); }
            if (hot && (!n || hot.s !== n.s) && window.gsap) gsap.to(hot.s, { scale: 1, duration: .3 });
          }
          hot = n;
          let tx = ptr.x - grab.x, ty = ptr.y - grab.y;
          if (n) { const k = Math.pow(1 - n.d / n.R, .7) * .75; tx += (n.dx - drag.w / 2 - tx) * k; ty += (n.dy - drag.h / 2 - ty) * k; }
          const ease = LP.RM ? 1 : .32;
          drag.x += (tx - drag.x) * ease; drag.y += (ty - drag.y) * ease;
          const vx = drag.x - lastX; lastX = drag.x;
          drag.rot += (Math.max(-18, Math.min(18, vx * 1.4)) - drag.rot) * .2;
          drag.put(); raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      }
    });
    const end = e => {
      if (!start || e.pointerId !== start.id) return;
      start = null; cancelAnimationFrame(raf);
      if (!drag) return;
      const d = drag; drag = null;
      const n = e.type === "pointercancel" ? null : (hot || nearest(e.clientX, e.clientY));
      slots.forEach(s => { s.classList.remove("near"); if (window.gsap) gsap.to(s, { scale: 1, duration: .3 }); });
      hot = null;
      if (n) place(c, n.s, d); else flyHome(c, d);
    };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
    c.addEventListener("click", () => { if (c._dragged) { c._dragged = false; return; } if (!busy && !c.dataset.placed) select(c); });
  }

  function flyHome(c, d) {
    const r = c.getBoundingClientRect();
    if (!window.gsap || LP.RM) { d.el.remove(); c.classList.remove("gone"); return Promise.resolve(); }
    LP.sfx("whoosh");
    return new Promise(res => gsap.to(d, { x: r.left, y: r.top, rot: 0, sc: 1, duration: .55, ease: "back.out(1.6)", onUpdate: d.put,
      onComplete: () => { d.el.remove(); c.classList.remove("gone"); gsap.fromTo(c, { scale: 1.15 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" }); res(); } }));
  }

  async function place(c, slot, d) {
    if (busy) return;
    busy = true; unselect(); LP.answer = null;
    if (!d) { // tap-tap: the chip flies over to the picture first
      d = makeFlyer(c);
      const dk = slot.querySelector(".dock").getBoundingClientRect();
      if (window.gsap && !LP.RM) {
        LP.sfx("whoosh");
        const mid = { t: 0 }, x0 = d.x, y0 = d.y, x1 = dk.left + dk.width / 2 - d.w / 2, y1 = dk.top + dk.height / 2 - d.h / 2, cy = Math.min(y0, y1) - 90;
        await new Promise(res => gsap.to(mid, { t: 1, duration: .55, ease: "power2.inOut", onUpdate() {
          const t = mid.t; d.x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * ((x0 + x1) / 2) + t * t * x1; d.y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
          d.rot = Math.sin(t * Math.PI) * 14 * (x1 > x0 ? 1 : -1); d.sc = 1 + Math.sin(t * Math.PI) * .15; d.put(); }, onComplete: res }));
      }
    }
    const word = c.dataset.word, ans = slot.dataset.answer;
    if (same(word, ans)) {
      if (word !== ans) { const other = slots.find(s => s.dataset.answer === word && !s.classList.contains("filled")); if (other) other.dataset.answer = ans; slot.dataset.answer = word; }
      // snap: the chip shrinks into the frame's name slot with a springy click
      const dk = slot.querySelector(".dock"), r = dk.getBoundingClientRect();
      if (window.gsap && !LP.RM) {
        await new Promise(res => gsap.timeline({ onComplete: res })
          .to(d, { x: r.left + r.width / 2 - d.w / 2, y: r.top + r.height / 2 - d.h / 2, rot: 0, sc: 1.18, duration: .16, ease: "power3.in", onUpdate: d.put })
          .to(d, { sc: Math.min(1, r.height / d.h) * .95, duration: .14, ease: "power2.out", onUpdate: d.put }));
      }
      d.el.remove(); c.dataset.placed = "1"; c.classList.add("out");
      slot.classList.add("filled"); slot.setAttribute("aria-label", "Picture: " + word);
      dk.textContent = word;
      if (window.gsap && !LP.RM) gsap.fromTo(dk, { scale: 1.4 }, { scale: 1, duration: .6, ease: "elastic.out(1,.4)" });
      if (!missed.has(word)) score++;
      LP.fill(matched); matched++;
      lumi.cheer("celebrate", "point");
      LP.say(word);
      await LP.good(slot);
      if (matched === total) { busy = true; LP.answer = null; await LP.wait(500); return endGame(); }
      LP.round(matched);
      busy = false; setAnswer();
    } else {
      missed.add(word);
      LP.bad(slot); lumi.oops("surprised", "point");
      await flyHome(c, d);
      busy = false; setAnswer();
    }
  }

  function endGame() {
    LP.round(-1);
    LP.results({ score, total, title: "All matched!", scoreLabel: "First-try matches", note: "Great job matching every word!",
      actor: { char: "lumi", pose: "celebrate" }, exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Back to lesson" });
  }

  LP.title({ kicker: "Drag and match", title: "Match It", sub: "Drag each word to its picture!", ar: "اسحب كل كلمة إلى صورتها",
    actor: { char: "lumi", pose: "point", cheer: "celebrate" } }).then(async () => {
    await LP.banner("Match It!", total + " words");
    LP.round(0);
    await LP.deal(slots, document.getElementById("lumiZone"));
    if (window.gsap && !LP.RM) await new Promise(r => gsap.fromTo(chips, { y: 40, opacity: 0, scale: .6 }, { y: 0, opacity: 1, scale: 1, duration: .5, ease: "back.out(2)", stagger: .06, onStart: () => LP.sfx("deal"), onComplete: r, clearProps: "transform,opacity" }));
    lumi.nod(); setAnswer();
  });
}
</script>
</body>
</html>
