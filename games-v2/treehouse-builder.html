<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Treehouse Builder — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Treehouse Builder: the backyard painting is the world. A framed close-up of the big tree is the
     building site: every right answer delivers a piece that drops onto the tree, lands with a thump,
     a dust puff and a bounce. Omar and Noor cheer below; on the last piece the dust clears on the
     real, finished Treehouse Club (the painting moves planning -> building -> finished). */
  .lp-scene .bg{filter:blur(3px) saturate(1.08)}
  .lp-stage{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .th{width:100%;max-width:1240px;display:grid;grid-template-columns:1fr;gap:10px;justify-items:center;align-content:center;flex:1}

  /* ---- the building site (a framed close-up of the painting) ---- */
  .th-site{position:relative;width:100%;max-width:560px;aspect-ratio:6/5;border-radius:28px;overflow:hidden;
    box-shadow:0 0 0 6px #FFF7E8,0 0 0 9px rgba(150,95,40,.55),0 28px 50px -22px rgba(40,20,0,.75);background:#9ccf6a;isolation:isolate}
  .th-paint{position:absolute;inset:0;background-repeat:no-repeat;background-size:201.4% auto;background-position:100% 48.1%}
  .th-paint.a{background-image:url("../assets/story/backgrounds/treehouse-planning.jpg")}
  .th-paint.b{background-image:url("../assets/story/backgrounds/treehouse-finished.jpg");opacity:0}
  .th-site::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(120% 90% at 50% 30%,transparent 60%,rgba(30,15,0,.28));box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .th-build{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .th-build .piece{visibility:hidden}
  .th-kid{position:absolute;bottom:1.5%;height:40%;z-index:3;pointer-events:none}
  .th-kid .lp-actor{height:100%}
  .th-kid.omar{left:2%} .th-kid.noor{right:2%} .th-kid.sara{left:50%;transform:translateX(-50%);height:38%;visibility:hidden}
  .th-dust{position:absolute;inset:0;z-index:4;pointer-events:none}
  .th-puff{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,rgba(255,246,226,.95),rgba(214,186,140,.75) 55%,rgba(190,160,115,0) 72%)}
  .th-sign{position:absolute;left:50%;top:10px;z-index:5;transform:translateX(-50%);max-width:92%;
    padding:7px 16px 8px;border-radius:12px;background:linear-gradient(180deg,#D9A262,#B9773C);color:#FFF8EA;
    font-family:var(--lp-display);font-weight:800;font-size:clamp(14px,3.9vw,18px);line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 0 rgba(90,45,10,.5);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3),0 10px 18px -8px rgba(50,25,0,.7)}
  .th-sign::before,.th-sign::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#7A4A22;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .th-sign::before{left:6px} .th-sign::after{right:6px}

  /* ---- prompt + cards ---- */
  .th-play{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .th-ask{display:flex;align-items:flex-end;gap:8px;width:100%;justify-content:center}
  .th-lumi{flex:none;height:96px;width:84px;display:flex;justify-content:center;align-items:flex-end}
  .th-lumi .lp-actor{height:100%}
  .th-ask .lp-bubble{flex:0 1 auto;margin-bottom:10px}
  .th-ask .lp-bubble .tail{left:-8px;bottom:20px}
  .th-cards{max-width:600px}
  .th-cards.c3 .lp-card,.th-cards.c2 .lp-card{width:100%;max-width:210px;justify-self:center}
  .th-cards.c2{max-width:440px}
  .th-cards .lp-card .lbl{font-size:clamp(15px,4vw,20px);overflow-wrap:anywhere}
  .lp-card .pic img{border-radius:12px}
  /* a couple of drawings sit small inside a big empty canvas: show them at the same size as the rest */
  .lp-card[data-word="ant"] .pic img{transform:scale(1.35)}
  .lp-card[data-word="hamster"] .pic img{transform:scale(1.22) translateY(-6%)}
  @media (max-width:420px){ .th-cards{gap:10px} .th-cards .lp-card .pic{margin:7px 7px 0;border-radius:14px} .th-cards .lp-card .lbl{padding:6px 4px 9px} }

  /* laptop: build site on the left, Lumi + cards on the right */
  @media (min-width:900px){
    .th{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:44px;align-items:center;min-height:calc(100dvh - 160px)}
    .th-site{max-width:640px;justify-self:end}
    .th-play{justify-self:start;max-width:600px;gap:18px}
    .th-ask{justify-content:flex-start}
    .th-lumi{height:190px;width:160px}
    .th-cards{gap:18px}
  }
  @media (min-width:900px) and (max-height:760px){ .th-site{max-width:540px} .th-lumi{height:150px;width:130px} }
  @media (max-height:700px) and (max-width:899px){ .th-site{max-width:380px} .th-lumi{height:76px;width:66px} }
</style>
</head>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "level1";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;

LP.init({ scene: { bg: "assets/story/backgrounds/treehouse-planning.jpg", particles: "leaves", pos: "62% 40%", tint: "linear-gradient(180deg,rgba(255,240,200,.10),rgba(40,25,0,.22))" }, hud: { rounds: 6, exitHref: backHref } });
document.getElementById("hearBtn").innerHTML = LP.ICON.speaker;
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const G = window.gsap, RM = LP.RM;

// One build step per correct round (6 rounds -> platform, walls, roof, window, ladder, flag).
// (The old page re-used the window step for round 5, so one right answer built nothing.)
const PIECES = ["pc-platform", "pc-walls", "pc-roof", "pc-window", "pc-ladder", "pc-flag"];
const BUILD_LABELS = [
  "Building the Treehouse Club!", "The platform is up!", "Walls are in place!",
  "The roof is on!", "A window for waving!", "The ladder's ready — come on up!", "The Treehouse Club is open!",
];

// ---------- Curated phonics word bank (each entry has a confirmed real vocab image) ----------
// Trimmed from phonics-hub/level1.json's own word lists down to the words that
// have real illustrations -- a few sight words and some phonics-only words
// (e.g. "top", "ink") don't have picture support, so those are left out here
// rather than shown as a broken image.
const PHONICS_UNITS = [
  { words: ["sun", "ant"] },              // Unit 1 (lesson 1): s,a,t,p
  { words: ["map", "dad"] },              // Unit 2 (lesson 3): i,n,m,d
  { words: ["cat", "kite"] },             // Unit 3 (lesson 5): g,o,c,k
  { words: ["duck", "egg", "run"] },      // Unit 4 (lesson 7): ck,e,u,r
  { words: ["hat", "bed", "leg"] },       // Unit 5 (lesson 9): h,b,f,l
  { words: ["cat", "dog", "sun"] },       // Unit 6 (lesson 11): CVC blending
  null,                                    // Unit 7 (lesson 13): sight words -- no picture support, skipped
  { words: ["cat", "dog", "sun", "hat", "run", "leg"] }, // Unit 8 (lesson 15): review
];
// Phonics units land on lesson 1, 3, 5, 7... (unit i unlocks at lesson 2i-1) --
// so a round never draws on a sound group the child hasn't reached yet.
function eligiblePhonicsWords(lessonNum) {
  const words = new Set();
  PHONICS_UNITS.forEach((unit, i) => {
    if (unit && (2 * (i + 1) - 1) <= lessonNum) unit.words.forEach(w => words.add(w));
  });
  return [...words];
}
const phonicsPool = eligiblePhonicsWords(num);

// Sentence rounds speak the target's example sentence. A distractor that is ALSO named in that
// sentence ("The ball is in the box" -> in / ball / box) or that shows the same picture (big = an
// elephant, small = a mouse, pet = a dog) would be a second right answer, so it is never offered.
const mentions = (sentence, w) => new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|es)?\\b", "i").test(sentence || "");
const SAME_PICTURE = [["big", "elephant"], ["small", "mouse"], ["pet", "dog"], ["age", "years old", "birthday"]];
const samePicture = (a, b) => SAME_PICTURE.some(g => g.includes(a.toLowerCase()) && g.includes(b.toLowerCase()));
function pickDistractors(target, n) {
  const others = Lumio.shuffle(vocab.filter(v => v.en !== target.en));
  const say = target.example || target.en;
  const safe = others.filter(v => !mentions(say, v.en) && !mentions(v.en, target.en) && !mentions(target.en, v.en) && !samePicture(v.en, target.en));
  const out = safe.slice(0, n);
  if (out.length < Math.min(n, 2)) others.forEach(v => { if (out.length < n && !out.includes(v) && !mentions(say, v.en)) out.push(v); });
  return out;
}

const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "megaphone", cheer: "celebrate", oops: "surprised", alt: "Lumi" });
const omar = LP.actor(document.getElementById("kidOmar"), { char: "omar", pose: "happy", cheer: "celebrate", oops: "surprised", alt: "Omar" });
const noor = LP.actor(document.getElementById("kidNoor"), { char: "noor", pose: "happy", cheer: "celebrate", oops: "surprised", alt: "Noor" });
let sara = null;

const site = document.getElementById("site"), dustL = document.getElementById("dust"), buildLabel = document.getElementById("buildLabel");
const VB = 600;                                                      // svg viewBox width
const vbPx = () => site.clientWidth / VB;

/* ---------- build FX: dust puffs, wood chips, thump ---------- */
function dust(cx, cy, spread, n) {
  if (RM || !G) return;
  const k = vbPx();
  for (let i = 0; i < (n || 12); i++) {
    const p = document.createElement("span"); p.className = "th-puff"; dustL.appendChild(p);
    const x = (cx + (Math.random() - .5) * spread) * k, y = cy * k;
    const dir = (x / k - cx) >= 0 ? 1 : -1;
    G.fromTo(p, { x, y, scale: .25 + Math.random() * .3, opacity: .95 },
      { x: x + dir * (25 + Math.random() * 70) * k * 1.4, y: y - (8 + Math.random() * 40) * k * 1.4, scale: 1.1 + Math.random() * 1.1, opacity: 0,
        duration: .8 + Math.random() * .6, ease: "power2.out", onComplete: () => p.remove() });
  }
  const r = site.getBoundingClientRect();
  LP.burst(r.left + cx * k, r.top + cy * k, { n: 14, speed: 6, up: 4, colors: ["#C98A4B", "#8A5A2B", "#E7B577", "#FFE7B0"], ring: false, scale: .8 });
}
function shake(power) {
  if (RM || !G) return;
  G.fromTo(site, { y: 0 }, { y: power || 5, duration: .05, yoyo: true, repeat: 5, ease: "none", onComplete: () => G.set(site, { y: 0 }) });
}
function thump() { LP.sfx("boom"); setTimeout(() => LP.sfx("tick"), 120); setTimeout(() => LP.sfx("tick"), 260); }

/* each piece arrives in its own way, but every one lands with dust and a bounce */
function landPiece(i) {
  const g = document.getElementById(PIECES[i]); if (!g) return Promise.resolve();
  g.style.visibility = "visible";
  if (RM || !G) { g.style.opacity = 1; return Promise.resolve(); }
  return new Promise(res => {
    const tl = G.timeline({ onComplete: res });
    const drop = (el, landY, spread) => tl
      .fromTo(el, { y: -560, rotation: (Math.random() - .5) * 8, opacity: 1 }, { y: 0, rotation: 0, duration: .62, ease: "power3.in", transformOrigin: "50% 100%" })
      .add(() => { thump(); shake(6); dust(303, landY, spread, 16); })
      .fromTo(el, { scaleY: .78, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: .9, ease: "elastic.out(1,.32)", transformOrigin: "50% 100%" });
    if (i === 0) drop(g, 254, 260);
    else if (i === 1) drop(g, 228, 220);
    else if (i === 2) drop(g, 132, 250);
    else if (i === 3) {
      const win = document.getElementById("pc-win"), bun = document.getElementById("pc-bunting");
      tl.fromTo(win, { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: .55, ease: "back.out(2.6)", transformOrigin: "50% 50%",
          onStart: () => LP.sfx("pop"), onComplete: () => { dust(250, 205, 70, 8); LP.sfx("tick"); } })
        .fromTo(bun, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: .5, ease: "power2.out", transformOrigin: "0% 50%", onStart: () => LP.sfx("whoosh") }, "-=.1")
        .fromTo(bun, { rotation: 4 }, { rotation: 0, duration: 1, ease: "elastic.out(1,.3)", transformOrigin: "50% 0%" });
    } else if (i === 4) {
      tl.fromTo(g, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: .55, ease: "bounce.out", transformOrigin: "50% 0%", onStart: () => LP.sfx("whoosh") })
        .add(() => { thump(); dust(262, 386, 90, 12); shake(3); }, "-=.18")
        .fromTo(g, { rotation: 3 }, { rotation: 0, duration: .9, ease: "elastic.out(1,.3)", transformOrigin: "50% 0%" });
    } else {
      tl.fromTo(g, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: .6, ease: "back.out(2)", transformOrigin: "50% 100%", onStart: () => LP.sfx("rise") })
        .add(() => { const r = site.getBoundingClientRect(), k = vbPx(); LP.burst(r.left + 330 * k, r.top + 20 * k, { n: 22, shape: "star", colors: ["#FFD666", "#FFB300", "#fff"] }); LP.sfx("star"); });
      G.to("#pc-flagcloth", { skewY: 8, scaleX: .9, duration: .5, yoyo: true, repeat: -1, ease: "sine.inOut", transformOrigin: "0% 50%", delay: .6 });
    }
  });
}
function setLabel(t) {
  if (RM || !G) { buildLabel.textContent = t; return; }
  G.timeline().to(buildLabel, { rotationX: 90, duration: .18, ease: "power2.in", onComplete: () => { buildLabel.textContent = t; } })
    .to(buildLabel, { rotationX: 0, duration: .5, ease: "back.out(2.5)" });
}
/* the dust clears on the real, finished treehouse */
async function grandOpening() {
  const pieces = document.querySelectorAll("#build .piece");
  LP.sceneTo("assets/story/backgrounds/treehouse-finished.jpg", "62% 40%");
  if (RM || !G) { document.getElementById("paintDone").style.opacity = 1; pieces.forEach(p => p.style.visibility = "hidden"); }
  else {
    dust(303, 140, 300, 26); dust(303, 300, 260, 16); LP.sfx("boom");
    await LP.wait(250);
    G.to("#paintDone", { opacity: 1, duration: 1.1, ease: "power2.inOut" });
    G.to(pieces, { opacity: 0, duration: .9, ease: "power2.in" });
    const r = site.getBoundingClientRect(); LP.burst(r.left + r.width / 2, r.top + r.height * .3, { n: 40, speed: 9 });
  }
  const sz = document.getElementById("kidSara"); sz.style.visibility = "visible";
  sara = LP.actor(sz, { char: "sara", pose: "wave", cheer: "celebrate", alt: "Sara" });
  if (!RM) await sara.enter("bottom");
  [omar, noor, sara, lumi].forEach((a, i) => setTimeout(() => a.cheer(null, false), i * 140));
  LP.sfx("win");
  await LP.wait(1800);
}

if (!vocab.length) {
  document.getElementById("optGrid").innerHTML = "<p class='lp-panel' style='padding:24px;grid-column:1/-1'>No lesson data found.</p>";
} else {
  const ROUNDS = 6;
  let r = 0, score = 0, locked = true;
  // Target-word queue: every vocab word once, shuffled, before any word
  // repeats. Single shared "already asked" set for the whole game, so a
  // word that is in both the phonics pool and the vocab list ("ant") can't repeat.
  let usedThisGame = new Set();
  function pickUnused(pool, keyFn) {
    let avail = pool.filter(w => !usedThisGame.has(keyFn(w)));
    if (!avail.length) { usedThisGame.clear(); avail = pool.slice(); }
    const pick = Lumio.shuffle(avail)[0];
    usedThisGame.add(keyFn(pick));
    return pick;
  }
  function nextTarget() { return pickUnused(vocab, w => w.en); }
  function nextPhonicsTarget() { return pickUnused(phonicsPool, w => w); }
  const optGrid = document.getElementById("optGrid");
  const hearBtn = document.getElementById("hearBtn");

  // Round plan: mostly phonics rounds (this level's main focus), with a
  // sentence-pattern round mixed in so vocabulary and the lesson's own
  // grammar pattern get covered too. Phonics rounds are capped at the
  // pool size (max 4); excess slots fall back to sentence rounds.
  const plan = [];
  let phonicsRoundsLeft = Math.min(phonicsPool.length, 4);
  for (let i = 0; i < ROUNDS; i++) {
    const wantsPhonics = phonicsPool.length >= 2 && i % 3 !== 2;
    if (wantsPhonics && phonicsRoundsLeft > 0) { plan.push("phonics"); phonicsRoundsLeft--; }
    else plan.push("sentence");
  }
  if (phonicsPool.length < 2) plan.forEach((_, i) => plan[i] = "sentence");

  let currentTargetWord = "", currentSpeakText = "";
  const playPrompt = () => LP.say(currentSpeakText, hearBtn);

  async function drawRound() {
    locked = true; LP.answer = null;
    LP.round(r);
    lumi.set("megaphone");
    optGrid.innerHTML = "";
    let words;
    if (plan[r] === "phonics") {
      const target = nextPhonicsTarget();
      const distractorPool = Lumio.shuffle(phonicsPool.filter(w => w !== target));
      words = Lumio.shuffle([target, ...distractorPool.slice(0, Math.min(2, distractorPool.length))]);
      currentTargetWord = currentSpeakText = target;
    } else {
      const target = nextTarget();
      const opts = Lumio.shuffle([target, ...pickDistractors(target, 2)]);
      currentTargetWord = target.en;
      currentSpeakText = target.example || target.en;
      words = opts.map(o => o.en);
    }
    window.__lastTarget = currentTargetWord; // exposed for automated QA only
    await LP.banner(r === ROUNDS - 1 ? "Last piece!" : "Listen!", "Round " + (r + 1) + " of " + ROUNDS);
    optGrid.className = "lp-cards th-cards " + (words.length === 2 ? "c2" : "c3");
    const cards = words.map(w => { const c = LP.picCard(w); c.onclick = () => choose(c); optGrid.appendChild(c); return c; });
    if (G && !RM) G.fromTo("#promptCard", { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2)" });
    lumi.nod();
    await LP.deal(cards, site);
    locked = false;
    LP.answer = currentTargetWord;   // read by the automated play-through tests
    playPrompt();
  }

  async function choose(card) {
    if (locked) return;
    const ok = card.dataset.word === currentTargetWord;
    if (!ok) {
      // gentle -- no scoring penalty, no lockout; they simply try another card
      LP.bad(card); lumi.oops("surprised", "megaphone"); (r % 2 ? noor : omar).oops("surprised", "happy");
      card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
      return;
    }
    locked = true; score++;
    const cards = [...optGrid.children];
    cards.forEach(c => c.disabled = true);
    lumi.cheer("celebrate", false);
    LP.fill(r);
    await LP.good(card);
    LP.clear(cards, card);
    // the right card flies up to the tree and becomes the next piece
    if (G && !RM) {
      const a = LP.center(card), sr = site.getBoundingClientRect();
      await new Promise(res => G.to(card, { x: sr.left + sr.width / 2 - a.x, y: sr.top + sr.height * .12 - a.y, scale: .12, rotation: 180, opacity: .3, duration: .5, ease: "power2.in", onComplete: res }));
      card.style.visibility = "hidden";
    }
    await landPiece(r);
    setLabel(BUILD_LABELS[Math.min(r + 1, BUILD_LABELS.length - 1)]);
    (r % 2 ? noor : omar).cheer("celebrate");
    setTimeout(() => (r % 2 ? omar : noor).cheer("celebrate"), 160);
    if (r === 2) LP.sceneTo("assets/story/backgrounds/treehouse-building.jpg", "62% 40%");   // the yard catches up with the build
    await LP.wait(500);
    r++;
    if (r < ROUNDS) drawRound(); else { await grandOpening(); endGame(); }
  }

  function endGame() {
    LP.round(-1);
    LP.answer = null;
    LP.results({ score, total: ROUNDS, title: "The Treehouse Club is open!", scoreLabel: "Pieces built",
      note: `You built the treehouse with ${score} out of ${ROUNDS} correct answers!`, actor: { char: "lumi", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  document.getElementById("promptCard").onclick = playPrompt;
  LP.title({ kicker: "Level 1 · Listen and build", title: "Treehouse Builder", sub: "Listen, tap the right picture and build the Treehouse Club!",
    ar: "استمع واختر الصورة الصحيحة لنبني بيت الشجرة", actor: { char: "lumi", pose: "point", cheer: "celebrate" } }).then(() => {
      omar.enter("bottom"); setTimeout(() => noor.enter("bottom"), 150);
      drawRound();
    });
}
</script>
