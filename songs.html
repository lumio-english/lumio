<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lumio Songs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Songs library: every song of the student's level with sing-along
     lyrics. Kids levels use the cream brand look, teen levels (3-6)
     the cocoa-night look, like the rest of the student area. */
  :root{
    --bg: var(--lumio-page-bg); --card: var(--lumio-surface); --ink: var(--lumio-ink);
    --muted: var(--lumio-muted); --line: var(--lumio-border); --accent: var(--lumio-orange);
    --soft: var(--lumio-orange-soft); --lyric-dim: #B9A999;
  }
  body.teen{
    --bg: var(--lumio-night-grad); --card: var(--lumio-night-card); --ink: var(--lumio-night-ink);
    --muted: var(--lumio-night-muted); --line: rgba(255,243,214,.12); --soft: rgba(249,115,22,.16);
    --lyric-dim: #8C7A66;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--lumio-font-body)}
  .top{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:1100px;margin:0 auto}
  .top img{height:46px}
  .top .back{margin-left:auto;text-decoration:none;font-weight:800;color:var(--accent);background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px}
  h1{font-family:var(--lumio-font-display);font-size:1.9rem;margin:0}
  .sub{color:var(--muted);font-weight:700;margin:2px 0 0}
  .wrap{max-width:1100px;margin:0 auto;padding:6px 20px 40px;display:grid;grid-template-columns:320px 1fr;gap:20px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:10px}
  .song{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--lumio-r-md);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--lumio-sh-sm)}
  .song:hover{border-color:var(--accent)}
  .song.on{border-color:var(--accent);background:var(--soft)}
  .song .n{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--lumio-grad-brand)}
  .song .k{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .song .t{font-weight:800;font-size:1rem}
  .player{background:var(--card);border:1px solid var(--line);border-radius:var(--lumio-r-lg);box-shadow:var(--lumio-sh-md);padding:20px 22px;display:flex;flex-direction:column;min-height:560px}
  .ph{display:flex;align-items:center;gap:14px}
  .play{flex:0 0 64px;height:64px;border-radius:50%;border:0;background:var(--lumio-grad-brand);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:var(--lumio-sh-lg)}
  .ph h2{font-family:var(--lumio-font-display);margin:0;font-size:1.5rem;line-height:1.15}
  .ph .k{font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .bar{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-weight:800;font-size:.85rem;color:var(--muted)}
  .bar input{flex:1;accent-color:var(--accent)}
  .lyrics{flex:1;overflow:auto;max-height:62vh;padding:6px 4px 30px;scroll-behavior:smooth}
  .sec{margin:14px 0;padding:10px 14px;border-radius:14px;transition:background .25s}
  .sec .lb{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sec p{margin:4px 0;font-size:1.25rem;font-weight:800;line-height:1.4;color:var(--lyric-dim)}
  .timed .sec.now{background:var(--soft)}
  .timed .sec.now p{color:var(--ink)}
  .untimed .sec p{color:var(--ink)}
  .echo{opacity:.7;font-style:italic}
</style>
</head>
<body>
  <div class="top">
    <img src="assets/logo/lumio-logo.png" alt="Lumio English">
    <div>
      <h1>Lumio Songs</h1>
      <p class="sub" id="levelName"></p>
    </div>
    <a class="back" id="back" href="student.html">← Back</a>
  </div>
  <div class="wrap">
    <div class="list" id="list"></div>
    <div class="player">
      <div class="ph">
        <button class="play" id="play" aria-label="Play">▶</button>
        <div><div class="k" id="kind"></div><h2 id="title"></h2></div>
      </div>
      <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1"><span id="dur">0:00</span></div>
      <div class="lyrics" id="lyrics"></div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
<script src="js/songs-data.js"></script>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  let level = qs.get("level");
  if (!level) { try { level = (JSON.parse(localStorage.getItem("lumio_user")||"{}").level) || "pre-a"; } catch(e){ level = "pre-a"; } }
  const DB = window.LUMIO_SONGS;
  if (!DB.LEVELS[level]) level = "pre-a";
  const teen = DB.groupOf(level) === "teen";
  if (teen) document.body.classList.add("teen");
  if (qs.get("from") === "teacher") document.getElementById("back").href = "teacher.html";
  document.getElementById("levelName").textContent = DB.LEVELS[level].name + " · sing along with every song";

  const KIND = { hello:"Hello song", theme:"Theme song", learning:"Learning song", review:"Review song", goodbye:"Goodbye song" };
  const songs = DB.songsFor(level);
  const audio = document.getElementById("audio");
  const list = document.getElementById("list"), lyr = document.getElementById("lyrics");
  const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
  let cur = null, secEls = [];

  list.innerHTML = songs.map((s,i)=>`<button class="song" data-i="${i}"><span class="n">${i+1}</span><span><span class="k">${KIND[s.kind]}</span><br><span class="t">${s.title}</span></span></button>`).join("");
  list.querySelectorAll(".song").forEach(b => b.onclick = () => { load(+b.dataset.i); audio.play(); });

  function esc(t){ return t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function line(t){ return esc(t).replace(/\(([^)]*)\)/g,'<span class="echo">($1)</span>'); }

  function load(i){
    cur = songs[i];
    list.querySelectorAll(".song").forEach((b,j)=>b.classList.toggle("on", j===i));
    document.getElementById("kind").textContent = KIND[cur.kind];
    document.getElementById("title").textContent = cur.title;
    const timed = cur.sections.every(s => typeof s.t === "number");
    lyr.className = "lyrics " + (timed ? "timed" : "untimed");
    lyr.innerHTML = cur.sections.map(s => `<div class="sec"><div class="lb">${esc(s.label)}</div>${s.lines.map(l=>`<p>${line(l)}</p>`).join("")}</div>`).join("");
    secEls = [...lyr.querySelectorAll(".sec")];
    audio.src = cur.file; lyr.scrollTop = 0; lastSec = -1;
  }
  var lastSec = -1;
  audio.ontimeupdate = () => {
    document.getElementById("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) document.getElementById("seek").value = audio.currentTime / audio.duration * 100;
    if (!cur || !lyr.classList.contains("timed")) return;
    let k = 0; cur.sections.forEach((s,j) => { if (audio.currentTime + 0.3 >= s.t) k = j; });
    if (k !== lastSec) {
      secEls.forEach((e,j)=>e.classList.toggle("now", j===k)); lastSec = k;
      lyr.scrollTop = secEls[k].offsetTop - lyr.offsetTop - 20;
    }
  };
  audio.onloadedmetadata = () => document.getElementById("dur").textContent = fmt(audio.duration);
  audio.onplay = () => document.getElementById("play").textContent = "❚❚";
  audio.onpause = audio.onended = () => document.getElementById("play").textContent = "▶";
  document.getElementById("play").onclick = () => audio.paused ? audio.play() : audio.pause();
  document.getElementById("seek").oninput = e => { if (audio.duration) audio.currentTime = e.target.value/100*audio.duration; };
  // ?song= is 1-based like the list numbers; the default used to be read as
  // index 1 and opened the Theme song instead of Hello (class order).
  const startSong = parseInt(qs.get("song") || "1", 10);
  load(Math.max(0, Math.min((isNaN(startSong) ? 1 : startSong) - 1, songs.length - 1)));
})();
</script>
</body>
</html>
