<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homework — Lumio English</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun:#FFC93C; --orange:#FF8A3D; --orange-deep:#F9720C; --coral:#FF6B6B;
    --teal:#2DD4BF; --teal-deep:#0D9488; --cream:#FFF8EC; --cocoa:#5C4433; --cocoa-soft:#8A7160;
    --radius:22px;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#FFF3D6 0%,var(--cream) 40%); font-family:'Nunito',sans-serif; color:var(--cocoa); padding-bottom:60px; }
  /* Teen theme (level3-6) -- self-contained block, this page doesn't
     load css/style.css so there's no cross-file leak risk here like
     student.html had. .hw-top is already dark (#2B2118) regardless of
     theme, and every actual homework activity (word rows, quiz,
     drawing canvas, recording) lives inside white .hw-card elements
     whose --cocoa/--cocoa-soft text stays correct unchanged -- only
     .hw-header sits directly on the page background and needs an
     explicit override. -- update: .hw-header was replaced by .hw-hero,
     a gradient card with its own white text that works unchanged on
     both themes, so this override moved to .hw-top and .hw-step-label
     instead, which still sit directly on the page background. */
  body.theme-teen { background: linear-gradient(160deg, #2B1B52 0%, #1C1038 100%); }
  body.theme-teen .hw-top { background:rgba(255,255,255,.06); backdrop-filter:blur(6px); border-bottom-color:rgba(255,255,255,.1); }
  body.theme-teen .hw-top .brand { color:#EDE9FB; }
  body.theme-teen .hw-top a { color:#EDE9FB; }
  body.theme-teen .hw-step-label { color:#A79BD1; }
  .hw-top {
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
    border-bottom:3px solid rgba(255,255,255,.9); display:flex; align-items:center; gap:12px; padding:12px 22px;
  }
  .hw-logo { width:34px; height:34px; border-radius:10px; }
  .hw-top .brand { font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.1rem; color:var(--cocoa); display:flex; align-items:center; gap:8px }
  .hw-top .brand span { color:var(--orange-deep); }
  .hw-top-spacer { flex:1; }
  .hw-top a { color:var(--cocoa-soft); text-decoration:none; background:#fff; padding:8px 16px; border-radius:999px; font-weight:800; font-size:.85rem; box-shadow:0 3px 10px rgba(67,48,31,.08) }
  .hw-wrap { max-width:760px; margin:0 auto; padding:26px 18px; }
  .hw-hero {
    background:linear-gradient(135deg,var(--orange),var(--orange-deep)); border-radius:var(--radius); padding:26px 28px;
    color:#fff; text-align:center; margin-bottom:22px; position:relative; overflow:hidden;
    box-shadow:0 14px 30px -12px rgba(249,114,12,.5);
  }
  .hw-hero::after {
    content:""; position:absolute; right:-30px; bottom:-30px; width:150px; height:150px; border-radius:50%;
    background:rgba(255,255,255,.14);
  }
  .hw-hero-eyebrow { font-weight:800; font-size:.8rem; text-transform:uppercase; letter-spacing:.5px; opacity:.9; position:relative; z-index:1; margin:0; }
  .hw-hero-title { font-family:'Baloo 2',sans-serif; font-size:1.7rem; margin:6px 0 4px; position:relative; z-index:1; }
  .hw-hero-sub { font-weight:700; opacity:.95; font-size:.95rem; margin:0; position:relative; z-index:1; }
  .hw-steps { display:flex; justify-content:center; align-items:flex-start; margin-bottom:26px; }
  .hw-step { display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; flex:1; max-width:130px; }
  .hw-step-dot {
    width:44px; height:44px; border-radius:50%; background:#fff; box-shadow:0 4px 10px rgba(67,48,31,.1);
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:var(--cocoa-soft);
    border:3px solid #fff; z-index:1; transition:transform .15s ease;
  }
  .hw-step.active .hw-step-dot { background:linear-gradient(135deg,var(--orange),var(--orange-deep)); color:#fff; transform:scale(1.1); box-shadow:0 6px 14px rgba(249,114,12,.4); }
  .hw-step.done .hw-step-dot { background:linear-gradient(135deg,#4ADE80,#16A34A); color:#fff; }
  .hw-step-label { font-weight:800; font-size:.78rem; color:var(--cocoa-soft); text-align:center; }
  .hw-step.active .hw-step-label { color:var(--orange-deep); }
  .hw-step.done .hw-step-label { color:#16A34A; }
  .hw-step-line { position:absolute; top:22px; left:calc(-50% + 22px); width:calc(100% - 44px); height:3px; background:#F0E4D4; z-index:0; }
  .hw-step.done .hw-step-line, .hw-step.active .hw-step-line { background:linear-gradient(90deg,#4ADE80,var(--orange)); }
  .hw-step:first-child .hw-step-line { display:none; }
  .hw-card { background:#fff; border-radius:var(--radius); box-shadow:0 14px 30px rgba(67,48,31,.12); padding:26px 24px; margin-bottom:20px; }
  .hw-card h2 { font-family:'Baloo 2',sans-serif; font-size:1.25rem; margin:0 0 4px; display:flex; align-items:center; gap:10px }
  .hw-card .hw-sub { color:var(--cocoa-soft); font-weight:700; font-size:.88rem; margin-bottom:18px }
  .hw-word-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1.5px solid #F5EEE1; flex-wrap:wrap }
  .hw-word-row:last-child { border-bottom:none }
  .hw-word-img { width:64px; height:64px; border-radius:12px; background:var(--cream); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center }
  .hw-word-img img { width:100%; height:100%; object-fit:contain }
  .hw-word-ar { font-weight:800; color:var(--teal-deep); min-width:70px }
  .hw-input { flex:1; min-width:120px; border:2px solid #F0E9DD; border-radius:12px; padding:10px 14px; font-size:1rem; font-family:inherit; color:var(--cocoa) }
  .hw-input.correct { border-color:#4ADE80; background:#F0FDF4 }
  .hw-input.wrong { border-color:var(--coral); background:#FFF1F1 }
  .hw-check-btn {
    border:2px solid var(--teal-deep); background:#fff; color:var(--teal-deep); font-weight:800; padding:9px 16px;
    border-radius:999px; cursor:pointer; font-size:.85rem; box-shadow:0 4px 10px rgba(67,48,31,.08);
    transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease;
  }
  .hw-check-btn:hover { transform:translateY(-2px); box-shadow:0 8px 16px rgba(13,148,136,.25); }
  .hw-check-btn:active { transform:translateY(0) scale(.96); }
  .hw-check-btn:focus-visible { outline:3px solid rgba(13,148,136,.35); outline-offset:2px; }
  .hw-check-btn.correct { background:#4ADE80; color:#fff; border-color:#4ADE80; }
  .hw-listen-btn {
    border:none; background:none; cursor:pointer; font-size:1.3rem;
    transition:transform .15s cubic-bezier(.22,1,.36,1);
  }
  .hw-listen-btn:hover { transform:scale(1.15); }
  .hw-listen-btn:active { transform:scale(.92); }
  .hw-listen-btn:focus-visible { outline:3px solid rgba(255,138,61,.4); outline-offset:2px; border-radius:8px; }
  .hw-rec-btn {
    border:2px solid var(--coral); background:#fff; color:var(--coral); font-weight:800; font-size:.8rem;
    padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; box-shadow:0 4px 10px rgba(67,48,31,.08);
    transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease;
  }
  .hw-rec-btn:hover { transform:translateY(-2px); box-shadow:0 8px 16px rgba(255,107,107,.25); }
  .hw-rec-btn:active { transform:translateY(0) scale(.96); }
  .hw-rec-btn:focus-visible { outline:3px solid rgba(255,107,107,.35); outline-offset:2px; }
  .hw-rec-btn.recording { background:var(--coral); color:#fff; animation:hwPulse 1s ease-in-out infinite }
  .hw-rec-btn.done { border-color:#4ADE80; color:#16A34A }
  @keyframes hwPulse { 0%,100% { opacity:1 } 50% { opacity:.6 } }
  .hw-canvas-wrap { text-align:center }
  canvas { border-radius:16px; border:3px dashed #F0E9DD; touch-action:none; background:#fff; max-width:100%; }
  .hw-color-row { display:flex; justify-content:center; gap:8px; margin:14px 0 }
  .hw-swatch {
    width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #F0E9DD; cursor:pointer;
    transition:transform .15s cubic-bezier(.22,1,.36,1);
  }
  .hw-swatch:hover { transform:scale(1.15); }
  .hw-swatch:active { transform:scale(.9); }
  .hw-swatch:focus-visible { outline:3px solid rgba(255,138,61,.4); outline-offset:2px; }
  .hw-swatch.active { box-shadow:0 0 0 3px var(--orange) }
  .hw-btn {
    border:none; background:linear-gradient(135deg,var(--orange),var(--orange-deep)); color:#fff; font-weight:800;
    padding:11px 22px; border-radius:999px; cursor:pointer; font-size:.9rem; font-family:inherit;
    box-shadow:0 6px 14px rgba(249,114,12,.3); transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s ease;
  }
  .hw-btn:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(249,114,12,.4); }
  .hw-btn:active { transform:translateY(0) scale(.96); }
  .hw-btn:focus-visible { outline:3px solid rgba(255,138,61,.4); outline-offset:2px; }
  .hw-btn.ghost { background:var(--cream); color:var(--cocoa); box-shadow:0 4px 10px rgba(67,48,31,.08); }
  .hw-btn.ghost:hover { box-shadow:0 8px 16px rgba(67,48,31,.15); }
  .hw-say-row { display:flex; align-items:center; gap:12px; padding:10px 0 }
  .hw-say-row label { display:flex; align-items:center; gap:10px; font-weight:700; flex:1; cursor:pointer }
  .hw-say-row input[type=checkbox] { width:22px; height:22px; accent-color:var(--teal-deep) }
  .hw-quiz-q { margin-bottom:22px }
  .hw-quiz-q .q-prompt { font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:10px }
  .hw-quiz-opts { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .hw-quiz-opt {
    border:2px solid #F0E9DD; background:#fff; border-radius:12px; padding:12px; font-weight:700; cursor:pointer;
    font-family:inherit; font-size:.95rem; transition:transform .15s cubic-bezier(.22,1,.36,1),border-color .15s ease,box-shadow .15s ease;
  }
  .hw-quiz-opt:hover { border-color:var(--orange); transform:translateY(-2px); box-shadow:0 6px 14px rgba(67,48,31,.1); }
  .hw-quiz-opt:active { transform:translateY(0) scale(.98); }
  .hw-quiz-opt:focus-visible { outline:3px solid rgba(255,138,61,.4); outline-offset:2px; }
  .hw-quiz-opt.selected-correct { border-color:#4ADE80; background:#F0FDF4 }
  .hw-quiz-opt.selected-wrong { border-color:var(--coral); background:#FFF1F1 }
  .hw-footer-nav { display:flex; justify-content:space-between; margin-top:6px }
  .hw-done-screen { text-align:center; padding:40px 20px }
  .hw-done-screen .stars { font-size:2.4rem; letter-spacing:8px; margin:14px 0 }
  .hw-parent-box { background:var(--cream); border-radius:16px; padding:16px 18px; margin-top:6px; }
  .hw-parent-box b { color:var(--orange-deep) }
  .hw-preview-banner {
    background:linear-gradient(135deg,#7C3AED,#6D28D9); color:#fff; text-align:center;
    font-weight:800; font-size:.85rem; padding:10px 16px;
  }
</style>
</head>
<body>
<div class="hw-top">
  <img class="hw-logo" src="assets/logo/lumio-logo.png" alt="Lumio English logo" onerror="this.style.display='none'">
  <div class="brand">Lumio <span>English</span></div>
  <div class="hw-top-spacer"></div>
  <a href="student.html">✕ Exit</a>
</div>
<div class="hw-preview-banner" id="hwPreviewBanner" style="display:none">
  🧪 Teacher preview — this is a test run. Nothing you do here is saved to any student's real homework record.
</div>
<div class="hw-wrap" id="hwWrap">
  <div class="hw-hero">
    <p class="hw-hero-eyebrow" id="hwLevelLabel">Loading…</p>
    <h1 class="hw-hero-title" id="hwTitle"></h1>
    <p class="hw-hero-sub">Let's practice what you learned in class! 🌟</p>
  </div>
  <div class="hw-steps" id="hwSteps"></div>
  <div id="hwSections"></div>
</div>

<script src="js/app.js"></script>
<script src="js/lumio-schedule.js"></script>
<script src="js/lessons-data.js"></script>
<script>
const qs = k => new URLSearchParams(location.search).get(k);
const level = qs("level") || "pre-a";
// Same teen theme as lesson.html/student.html for level3-6.
if (["level3", "level4", "level5", "level6"].includes(level)) {
  document.body.classList.add("theme-teen");
}
const num = parseInt(qs("n") || "1", 10);
const nn = String(num).padStart(2, "0");

// Teacher preview: same pattern as story.html's preview mode. A teacher
// testing homework from the Materials tab (or any ?preview=1 link) must
// never have their test run saved as if it were a real student's
// progress -- especially if a real student happens to still be logged
// in on the same device/browser. previewMode forces a distinct,
// obviously-fake identity and skips the save entirely (see
// submitHomework() below), so testing here can never touch real data.
function isTeacherSession() {
  try { return sessionStorage.getItem("lumio_teacher") === "1"; } catch (e) { return false; }
}
const previewMode = qs("preview") === "1" && isTeacherSession();
if (previewMode) document.getElementById("hwPreviewBanner").style.display = "block";

const user = (typeof Lumio !== "undefined" && Lumio.user) ? Lumio.user() : null;
const studentName = previewMode ? "Teacher Preview" : (user ? user.name : "Guest");

let lesson = null;
let STEPS = []; // built in init(): each {key, label, render}
let currentStep = 0;
const results = { spelling: {}, drawingDataUrl: null, saidWords: {}, recorded: {}, phonicsRecorded: {}, skill: {}, quiz: {}, conversationDone: {} };
let skillType = null; // "phonics" | "grammar" | null
let skillData = null; // the matched unit/topic object

function esc(s) { return (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }

const STEP_ICONS = { spelling: "✏️", draw: "🎨", sayit: "🎤", conversation: "💬", skill: "🧩", quiz: "❓" };
function renderSteps() {
  document.getElementById("hwSteps").innerHTML = STEPS.map((s, i) => {
    const cls = i < currentStep ? "done" : (i === currentStep ? "active" : "");
    const icon = i < currentStep ? "✓" : (STEP_ICONS[s.key] || (i + 1));
    return `<div class="hw-step ${cls}">
      <div class="hw-step-line"></div>
      <div class="hw-step-dot">${icon}</div>
      <div class="hw-step-label">${esc(s.label)}</div>
    </div>`;
  }).join("");
}
function goToStep(i) {
  currentStep = i;
  renderSteps();
  STEPS[i].render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function navButtons(backLabel, nextLabel) {
  const i = currentStep;
  return `<div class="hw-footer-nav">
    ${i > 0 ? `<button class="hw-btn ghost" onclick="goToStep(${i - 1})">${backLabel}</button>` : "<span></span>"}
    ${i < STEPS.length - 1 ? `<button class="hw-btn" onclick="goToStep(${i + 1})">${nextLabel}</button>` : ""}
  </div>`;
}

function renderSpelling() {
  const rows = lesson.vocab.map((w, i) => `
    <div class="hw-word-row">
      <div class="hw-word-img"><img src="assets/vocab/${slugify(w.en)}.png" onerror="this.style.display='none'"></div>
      <div class="hw-word-ar">${w.ar}</div>
      <input class="hw-input" id="sp-${i}" placeholder="Type the word…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="hw-check-btn" id="spBtn-${i}" onclick="checkSpelling(${i})">Check</button>
    </div>`).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>✏️ Spelling Practice</h2>
      <div class="hw-sub">Look at the picture and the Arabic word, then type the English word.</div>
      ${rows}
      ${navButtons("← Back", `Next: ${STEPS[currentStep + 1] ? STEPS[currentStep + 1].label : ""} →`)}
    </div>`;
}
// Matches the exact slug convention used everywhere else in the app
// (lib/*.py, hub-present.html): strip apostrophes rather than treating
// them as word separators, so "o'clock" -> "oclock" and "don't have to"
// -> "dont-have-to", matching the actual files in assets/vocab/. This
// used to diverge (a generic [^a-z0-9]+ collapse), which silently
// produced dead paths like "o-clock.png" for any vocab word containing
// an apostrophe.
function slugify(t) { return String(t).toLowerCase().trim().replace(/'/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function checkSpelling(i) {
  const input = document.getElementById(`sp-${i}`);
  const btn = document.getElementById(`spBtn-${i}`);
  const correct = input.value.trim().toLowerCase() === lesson.vocab[i].en.toLowerCase();
  input.classList.remove("correct", "wrong");
  input.classList.add(correct ? "correct" : "wrong");
  btn.classList.toggle("correct", correct);
  btn.textContent = correct ? "✓ Correct!" : "Try again";
  results.spelling[i] = correct;
  if (typeof Lumio !== "undefined" && Lumio.beep) Lumio.beep(correct);
}

function renderDraw() {
  const word = lesson.vocab[0].en;
  const i = currentStep;
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card hw-canvas-wrap">
      <h2 style="justify-content:center">🎨 Draw It</h2>
      <div class="hw-sub">Draw a picture of "${esc(word)}"!</div>
      <canvas id="hwCanvas" width="320" height="320"></canvas>
      <div class="hw-color-row" id="hwColors"></div>
      <div style="margin-top:10px"><button class="hw-btn ghost" onclick="clearCanvas()">Clear</button></div>
      <div class="hw-footer-nav">
        <button class="hw-btn ghost" onclick="goToStep(${i - 1})">← Back</button>
        <button class="hw-btn" onclick="finishDrawing(); goToStep(${i + 1})">Next: ${STEPS[i + 1] ? STEPS[i + 1].label : ""} →</button>
      </div>
    </div>`;
  setupCanvas();
}
let ctx, drawing = false, curColor = "#43301F";
function setupCanvas() {
  const canvas = document.getElementById("hwCanvas");
  ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const colors = ["#43301F", "#F97316", "#0D9488", "#F59E0B", "#F43F5E", "#2563EB"];
  document.getElementById("hwColors").innerHTML = colors.map(c =>
    `<div class="hw-swatch ${c === curColor ? "active" : ""}" style="background:${c}" onclick="setColor('${c}', this)"></div>`).join("");
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  };
  const start = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = curColor; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
  const end = () => { drawing = false; };
  canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start); canvas.addEventListener("touchmove", move); canvas.addEventListener("touchend", end);
}
function setColor(c, el) { curColor = c; document.querySelectorAll(".hw-swatch").forEach(s => s.classList.remove("active")); el.classList.add("active"); }
function clearCanvas() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 320, 320); }
function finishDrawing() {
  try { results.drawingDataUrl = document.getElementById("hwCanvas").toDataURL("image/png"); } catch (e) {}
}

/* ---------- Say It, now with recording ---------- */
let mediaRecorder = null, audioChunks = [], activeRecIdx = null, activeStream = null;
function renderSayIt() {
  const micSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const rows = lesson.vocab.map((w, i) => `
    <div class="hw-say-row" id="sayRow-${i}">
      <label><input type="checkbox" onchange="results.saidWords[${i}] = this.checked" ${results.saidWords[i] ? "checked" : ""}> ${esc(w.en)} <span style="color:var(--teal-deep);font-weight:800">${w.ar}</span></label>
      <button class="hw-listen-btn" title="Hear it" onclick="typeof Lumio !== 'undefined' && Lumio.speak && Lumio.speak('${esc(w.en).replace(/'/g, "\\'")}')">🔊</button>
      ${micSupported ? `<button class="hw-rec-btn ${results.recorded[i] ? "done" : ""}" id="recBtn-${i}" onclick="toggleRecording(${i})">
        ${results.recorded[i] ? "✓ Recorded — tap to redo" : "🎙️ Record"}</button>` : ""}
    </div>`).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>🗣️ Say It</h2>
      <div class="hw-sub">Listen to each word, say it out loud${micSupported ? ", and record yourself" : ""}. Check it off when you're done!</div>
      ${rows}
      ${!micSupported ? `<div class="hw-parent-box" style="margin-top:14px">Recording isn't supported on this browser/device — that's okay, just practice out loud with your family.</div>` : ""}
      <div class="hw-parent-box">❤ <b>FOR PARENTS</b> — please listen to your child say each word above, then check the box together.</div>
      ${navButtons("← Back", `Next: ${STEPS[currentStep + 1] ? STEPS[currentStep + 1].label : ""} →`)}
    </div>`;
}
async function toggleRecording(i) {
  return toggleRecordingGeneric(i, i, lesson.vocab[i].en, results.recorded, `recBtn-${i}`, renderSayIt);
}
async function togglePhonicsRecording(i, wordEn) {
  return toggleRecordingGeneric(i, 100 + i, wordEn, results.phonicsRecorded, `phRecBtn-${i}`, renderSkillFocus);
}
async function toggleRecordingGeneric(uiIndex, storageIndex, wordEn, resultMap, btnId, rerender) {
  const btn = document.getElementById(btnId);
  if (activeRecIdx === storageIndex && mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }
  if (activeRecIdx !== null) return; // one recording at a time
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    activeStream = stream;
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      try {
        if (typeof Lumio !== "undefined" && Lumio.saveRecording) {
          await Lumio.saveRecording(studentName, level, num, storageIndex, wordEn, blob);
          resultMap[uiIndex] = true;
        }
      } catch (e) { console.error("save recording failed", e); }
      activeStream.getTracks().forEach(t => t.stop());
      activeStream = null; activeRecIdx = null; mediaRecorder = null;
      rerender();
    };
    mediaRecorder.start();
    activeRecIdx = storageIndex;
    btn.textContent = "⏹ Stop recording";
    btn.classList.add("recording");
  } catch (e) {
    alert("Microphone access is needed to record. Please allow microphone access in your browser and try again.");
  }
}

/* ---------- Lesson-customized Skill Focus: Phonics OR Grammar ---------- */
function computePhonicsLessonMap(units) {
  const map = {};
  units.forEach((u, i) => { map[2 * i + 1] = u; });
  return map;
}
function computeGrammarLessonMap(topics, numLessons) {
  const map = {};
  const n = topics.length;
  topics.forEach((t, i) => {
    const lessonNum = n > 1 ? Math.round(1 + i * (numLessons - 1) / (n - 1)) : 1;
    map[lessonNum] = t;
  });
  return map;
}
async function detectSkillFocus() {
  try {
    if (["level1", "level2"].includes(level)) {
      const res = await fetch(`phonics-hub/${level}.json`);
      if (res.ok) {
        const data = await res.json();
        const map = computePhonicsLessonMap(data.units || []);
        if (map[num]) { skillType = "phonics"; skillData = map[num]; return; }
      }
    } else {
      const res = await fetch(`grammar-hub/${level}.json`);
      if (res.ok) {
        const data = await res.json();
        const map = computeGrammarLessonMap(data.topics || [], 20);
        if (map[num]) { skillType = "grammar"; skillData = map[num]; return; }
      }
    }
  } catch (e) { /* no skill focus for this lesson -- fine, it's optional */ }
}
function renderSkillFocus() {
  if (skillType === "phonics") return renderPhonicsPractice();
  if (skillType === "grammar") return renderGrammarPractice();
}
function renderConversation() {
  const words = lesson.vocab.slice(0, 4);
  const prompts = words.map((w, i) => {
    const templates = [
      `Can you use "${w.en}" in your own sentence?`,
      `Tell me about "${w.en}" — what do you know about it?`,
      `Where or when have you seen or used "${w.en}"?`,
    ];
    return templates[i % templates.length].replace("${w.en}", w.en);
  });
  const rows = words.map((w, i) => `
    <div class="hw-word-row">
      <div class="hw-word-img"><img src="assets/vocab/${slugify(w.en)}.png" onerror="this.style.display='none'"></div>
      <div style="flex:1">
        <div style="font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--cocoa);margin-bottom:2px">${esc(w.en)} <span style="color:var(--teal-deep)">${w.ar}</span></div>
        <div style="font-size:.88rem;color:var(--cocoa-soft);font-weight:700">${esc(prompts[i])}</div>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--cocoa-soft)">
        <input type="checkbox" onchange="results.conversationDone[${i}] = this.checked" ${results.conversationDone[i] ? "checked" : ""}> Talked about it
      </label>
    </div>`).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>💬 Talk About It</h2>
      <div class="hw-sub">Talk through each question with your teacher, a classmate, or your family. Check it off when you're done.</div>
      ${rows}
      <div class="hw-parent-box">❤ <b>FOR PARENTS</b> — ask your child these questions and listen to their answers in English.</div>
      ${navButtons("← Back", `Next: ${STEPS[currentStep + 1] ? STEPS[currentStep + 1].label : ""} →`)}
    </div>`;
}

function renderPhonicsPractice() {
  const words = (skillData.words || []).slice(0, 6);
  const micSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const rows = words.map((w, i) => `
    <div class="hw-word-row">
      <div class="hw-word-ar" style="min-width:100px">${w.ar}</div>
      <div style="flex:1;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;color:var(--cocoa)">${esc(w.en)}</div>
      <button class="hw-listen-btn" title="Hear it" onclick="typeof Lumio !== 'undefined' && Lumio.speak && Lumio.speak('${esc(w.en).replace(/'/g, "\\'")}')">🔊</button>
      ${micSupported ? `<button class="hw-rec-btn ${results.phonicsRecorded[i] ? "done" : ""}" id="phRecBtn-${i}" onclick="togglePhonicsRecording(${i}, '${esc(w.en).replace(/'/g, "\\'")}')">
        ${results.phonicsRecorded[i] ? "✓ Recorded — tap to redo" : "🎙️ Record"}</button>` : ""}
    </div>`).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>🔤 Phonics Focus &mdash; ${esc(skillData.unit)}</h2>
      <div class="hw-sub">${skillData.tip ? skillData.tip : "Listen to each sound word, then record yourself saying it."}</div>
      ${rows}
      ${!micSupported ? `<div class="hw-parent-box" style="margin-top:14px">Recording isn't supported on this browser/device — practice saying these sounds out loud with your family instead.</div>` : ""}
      ${navButtons("← Back", `Next: ${STEPS[currentStep + 1] ? STEPS[currentStep + 1].label : ""} →`)}
    </div>`;
}

function renderGrammarPractice() {
  const examples = (skillData.examples || []).slice(0, 4);
  const blanked = examples.map(ex => {
    const words = ex.en.trim().split(" ");
    const firstWord = words[0].replace(/[.,!?]/g, "");
    const rest = words.slice(1).join(" ");
    return { firstWord, rest, ar: ex.ar, full: ex.en };
  });
  const rows = blanked.map((b, i) => `
    <div class="hw-word-row" style="flex-wrap:wrap">
      <input class="hw-input" id="gr-${i}" style="max-width:140px" placeholder="?" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div style="flex:1;min-width:160px;font-weight:700">${esc(b.rest)}</div>
      <button class="hw-check-btn" id="grBtn-${i}" onclick="checkGrammar(${i}, '${esc(b.firstWord).replace(/'/g, "\\'")}')">Check</button>
      <div style="width:100%;direction:rtl;text-align:right;color:var(--cocoa-soft);font-size:.85rem;font-weight:700">${b.ar}</div>
    </div>`).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>📝 Grammar Focus &mdash; ${esc(skillData.title)}</h2>
      <div class="hw-sub">${esc(skillData.explanation || "")} Fill in the missing first word of each sentence.</div>
      ${rows}
      ${navButtons("← Back", `Next: ${STEPS[currentStep + 1] ? STEPS[currentStep + 1].label : ""} →`)}
    </div>`;
}
const PRONOUN_EQUIVALENCE_GROUPS = [
  ["i", "you", "we", "they"],
  ["he", "she", "it"],
  ["this", "that"],
  ["these", "those"],
];
function isEquivalentAnswer(given, correct) {
  const g = given.trim().toLowerCase();
  const c = correct.trim().toLowerCase();
  if (g === c) return true;
  return PRONOUN_EQUIVALENCE_GROUPS.some(group => group.includes(g) && group.includes(c));
}
function checkGrammar(i, correctWord) {
  const input = document.getElementById(`gr-${i}`);
  const btn = document.getElementById(`grBtn-${i}`);
  const correct = isEquivalentAnswer(input.value, correctWord);
  input.classList.remove("correct", "wrong");
  input.classList.add(correct ? "correct" : "wrong");
  btn.classList.toggle("correct", correct);
  btn.textContent = correct ? "✓ Correct!" : "Try again";
  results.skill[i] = correct;
  if (typeof Lumio !== "undefined" && Lumio.beep) Lumio.beep(correct);
}

function renderQuiz() {
  const qWords = lesson.vocab.slice(0, Math.min(4, lesson.vocab.length));
  const html = qWords.map((target, qi) => {
    const distractors = lesson.vocab.filter(w => w.en !== target.en).sort(() => Math.random() - 0.5).slice(0, 3);
    const opts = [...distractors, target].sort(() => Math.random() - 0.5);
    const optsHtml = opts.map(o => `<button class="hw-quiz-opt" onclick="answerQuiz(${qi}, '${esc(o.en).replace(/'/g, "\\'")}', '${esc(target.en).replace(/'/g, "\\'")}', this)">${esc(o.en)}</button>`).join("");
    return `
      <div class="hw-quiz-q">
        <div class="q-prompt"><div class="hw-word-img"><img src="assets/vocab/${slugify(target.en)}.png" onerror="this.style.display='none'"></div> What is this?</div>
        <div class="hw-quiz-opts">${optsHtml}</div>
      </div>`;
  }).join("");
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card">
      <h2>🧠 Quick Quiz</h2>
      <div class="hw-sub">Tap the correct word for each picture.</div>
      ${html}
      <div class="hw-footer-nav">
        <button class="hw-btn ghost" onclick="goToStep(${currentStep - 1})">← Back</button>
        <button class="hw-btn" onclick="submitHomework()">✓ Submit Homework</button>
      </div>
    </div>`;
}
function answerQuiz(qi, chosen, correct, btn) {
  const correctAnswer = chosen === correct;
  results.quiz[qi] = correctAnswer;
  btn.parentElement.querySelectorAll(".hw-quiz-opt").forEach(b => b.style.pointerEvents = "none");
  btn.classList.add(correctAnswer ? "selected-correct" : "selected-wrong");
  if (typeof Lumio !== "undefined" && Lumio.beep) Lumio.beep(correctAnswer);
}

function submitHomework() {
  const spellingCorrect = Object.values(results.spelling).filter(Boolean).length;
  const quizCorrect = Object.values(results.quiz).filter(Boolean).length;
  const isPhonics = skillType === "phonics";
  const skillCorrect = isPhonics
    ? Object.values(results.phonicsRecorded).filter(Boolean).length
    : Object.values(results.skill).filter(Boolean).length;
  const skillTotal = skillType
    ? (isPhonics ? (skillData.words || []).slice(0, 6).length : (skillData.examples || []).slice(0, 4).length)
    : 0;
  const said = Object.values(results.saidWords).filter(Boolean).length;
  const recorded = Object.values(results.recorded).filter(Boolean).length;
  const totalPossible = lesson.vocab.length + qWordsCountSafe() + skillTotal;
  const totalCorrect = spellingCorrect + quizCorrect + skillCorrect;
  const pct = totalPossible ? Math.round((totalCorrect / totalPossible) * 100) : 0;
  const stars = pct >= 90 ? 3 : pct >= 60 ? 2 : 1;

  if (previewMode) {
    // Teacher testing this lesson's homework -- never write real progress.
    if (typeof Lumio !== "undefined" && Lumio.confetti) Lumio.confetti(70);
    currentStep = STEPS.length;
    renderSteps();
    const skillLine = skillType ? ` · ${isPhonics ? "Phonics recorded" : "Grammar"}: ${skillCorrect}/${skillTotal}` : "";
    document.getElementById("hwSections").innerHTML = `
      <div class="hw-card hw-done-screen">
        <div style="font-size:3rem">🧪</div>
        <h2 style="justify-content:center">Preview complete</h2>
        <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <div class="hw-sub">Spelling: ${spellingCorrect}/${lesson.vocab.length} · Quiz: ${quizCorrect}/${qWordsCountSafe()}${skillLine} · Said out loud: ${said}/${lesson.vocab.length}${recorded ? ` · Recorded: ${recorded}` : ""}</div>
        <div class="hw-sub" style="color:#7C3AED;font-weight:800;margin-top:10px">This was a preview only — nothing was saved to any student's record.</div>
        <a class="hw-btn" style="display:inline-block;margin-top:16px;text-decoration:none" href="teacher.html">Back to teacher dashboard</a>
      </div>`;
    return;
  }
  const record = {
    stars, score: totalCorrect, total: totalPossible, said, saidTotal: lesson.vocab.length,
    recorded, recordedTotal: lesson.vocab.length,
    hasDrawing: !!results.drawingDataUrl, drawingDataUrl: results.drawingDataUrl,
    skillType, skillCorrect, skillTotal,
    // Kept separate from the combined score/total above specifically so a
    // report can honestly attribute Reading vs Writing performance instead
    // of only ever seeing one merged number -- spelling (typing the English
    // word) is a writing-adjacent task, the multiple-choice quiz is reading
    // comprehension of a written prompt. Added for the LSRW performance
    // report; nothing existing reads these two fields yet, so this is a
    // pure addition, not a change to what's already there.
    spellingCorrect, spellingTotal: lesson.vocab.length,
    quizCorrect, quizTotal: qWordsCountSafe(),
    date: new Date().toISOString().slice(0, 10),
  };
  if (typeof Lumio !== "undefined" && Lumio.saveHomework) {
    Lumio.saveHomework(studentName, level, num, record);
  }
  if (typeof Lumio !== "undefined" && Lumio.confetti) Lumio.confetti(70);

  currentStep = STEPS.length;
  renderSteps();
  const skillLine = skillType ? ` · ${isPhonics ? "Phonics recorded" : "Grammar"}: ${skillCorrect}/${skillTotal}` : "";
  document.getElementById("hwSections").innerHTML = `
    <div class="hw-card hw-done-screen">
      <div style="font-size:3rem">🎉</div>
      <h2 style="justify-content:center">Homework complete!</h2>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <div class="hw-sub">Spelling: ${spellingCorrect}/${lesson.vocab.length} · Quiz: ${quizCorrect}/${qWordsCountSafe()}${skillLine} · Said out loud: ${said}/${lesson.vocab.length}${recorded ? ` · Recorded: ${recorded}` : ""}</div>
      <a class="hw-btn" style="display:inline-block;margin-top:16px;text-decoration:none" href="student.html">Back to my map</a>
    </div>`;
}
function qWordsCountSafe() { return Math.min(4, lesson.vocab.length); }

async function init() {
  // Homework is the third step in the prep -> live class -> homework
  // cycle -- gate it here for real, not just visually on the dashboard's
  // map, so a student can't just navigate straight to this URL and finish
  // homework before their class has actually happened. A student with no
  // schedule data at all (LumioSchedule not loaded, or genuinely no
  // classes booked yet) is let through rather than blocked, since that's
  // a data-availability gap, not evidence the class hasn't happened.
  // Teacher preview NEVER hits this gate, full stop -- everything in the
  // teacher panel is there for testing, and locking/gating logic exists
  // only for real students, never for a teacher checking their own
  // content works. Checked first, before even looking at `user`, so this
  // holds even if a real student happens to still be logged in on the
  // same device a teacher is testing from.
  if (!previewMode && user && window.LumioSchedule && LumioSchedule.attendedLessonNumbers) {
    const attended = LumioSchedule.attendedLessonNumbers(user.name, level);
    if (!attended.has(num)) {
      document.getElementById("hwSections").innerHTML = `
        <div class="hw-card" style="text-align:center">
          <div style="font-size:2.4rem;margin-bottom:6px">🕐</div>
          <h2 style="justify-content:center">Not quite yet!</h2>
          <p style="color:var(--cocoa-soft);font-weight:700;margin:0 0 4px">
            Homework for this lesson unlocks after your live class with your teacher.
          </p>
          <p style="color:var(--cocoa-soft);font-weight:700;margin:0">
            Check <a href="student.html#scheduleCard" style="color:var(--orange-deep)">My Schedule</a> to see when your next class is.
          </p>
        </div>`;
      document.getElementById("hwLevelLabel").textContent = "";
      document.getElementById("hwSteps").style.display = "none";
      return;
    }
  }

  let lessonData = (typeof window.LUMIO_LESSONS !== "undefined" && window.LUMIO_LESSONS[level]) ? window.LUMIO_LESSONS[level][num] : null;
  if (!lessonData) {
    try {
      const res = await fetch(`lessons/${level}/lesson${nn}.json`);
      if (res.ok) lessonData = await res.json();
    } catch (e) {}
  }
  if (!lessonData) {
    document.getElementById("hwSections").innerHTML = `<div class="hw-card" style="text-align:center;color:var(--cocoa-soft)">This lesson's homework isn't ready yet — go back and pick another one.</div>`;
    document.getElementById("hwLevelLabel").textContent = "";
    return;
  }
  lesson = lessonData;
  await detectSkillFocus();

  const showDraw = ["pre-a", "level1"].includes(level);
  STEPS = [
    { key: "spelling", label: "Spelling", render: renderSpelling },
  ];
  if (showDraw) {
    STEPS.push({ key: "draw", label: "Draw", render: renderDraw });
  }
  STEPS.push({ key: "sayit", label: "Say It", render: renderSayIt });
  if (!showDraw) {
    STEPS.push({ key: "conversation", label: "Talk", render: renderConversation });
  }
  if (skillType) {
    STEPS.push({ key: "skill", label: skillType === "phonics" ? "Phonics" : "Grammar", render: renderSkillFocus });
  }
  STEPS.push({ key: "quiz", label: "Quiz", render: renderQuiz });

  const meta = (typeof Lumio !== "undefined" && Lumio.LEVELS ? Lumio.LEVELS.find(l => l.id === level) : null) || { name: level };
  document.getElementById("hwLevelLabel").textContent = `${meta.name} · Lesson ${num}`;
  document.getElementById("hwTitle").textContent = `${lesson.title} — Homework`;
  renderSteps();
  goToStep(0);
}

document.addEventListener("DOMContentLoaded", init);
</script>
