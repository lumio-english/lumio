<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Lumio English</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/favicon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{opacity:0;animation:pageFadeIn .45s ease forwards}
  @keyframes pageFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .btn{transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.12)}
  .btn:active{transform:translateY(0) scale(.96);box-shadow:0 3px 8px rgba(0,0,0,.1)}
  .btn:focus-visible{outline:3px solid rgba(255,138,61,.45);outline-offset:2px}

  .lg-pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .lg-pin-dot{width:16px;height:16px;border-radius:50%;background:#ECE4D6;border:2px solid #DCD2BE;transition:transform .15s ease,background .15s ease}
  .lg-pin-dot.filled{background:var(--orange,#FF8A3D);border-color:var(--orange,#FF8A3D);transform:scale(1.15)}
  .lg-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto}
  .lg-pad button{
    padding:12px 0;border-radius:12px;border:1px solid var(--line,#eee);background:#fff;font-weight:800;
    font-size:1.05rem;cursor:pointer;font-family:inherit;transition:transform .12s ease,background .12s ease,box-shadow .12s ease;
  }
  .lg-pad button:hover{box-shadow:0 4px 10px rgba(0,0,0,.08);transform:translateY(-1px)}
  .lg-pad button:active{background:#FFF1E0;transform:translateY(0) scale(.94)}
  .lg-pin-error{color:var(--coral,#FF6B6B);font-weight:800;font-size:.85rem;text-align:center;height:18px;margin-top:6px}
  .lg-pin-error.shake{animation:lgshake .3s}
  @keyframes lgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .lg-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--cream,#FBF6EC);border-radius:14px;padding:5px}
  .lg-tab{
    flex:1;border:none;background:none;padding:11px 8px;border-radius:10px;font-weight:800;font-size:.92rem;
    color:var(--cocoa-soft,#8A7160);cursor:pointer;font-family:inherit;transition:background .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .lg-tab.active{background:#fff;color:var(--cocoa,#43301F);box-shadow:0 3px 8px rgba(0,0,0,.08)}
  .lg-id-input{
    width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:2px solid var(--line,#eee);
    font-family:inherit;font-weight:700;font-size:1rem;margin:14px 0;text-align:center;transition:border-color .15s ease;
  }
  .lg-id-input:focus{outline:none;border-color:var(--orange,#FF8A3D)}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html"><img class="logo-mini" src="assets/logo/lumio-logo.png" alt="Lumio English logo" onerror="this.style.display='none'"></a>
  <div class="brand">Lumio <span>English</span></div>
</header>

<main class="wrap" style="max-width:560px">

  <div class="card" id="paneStudent">
    <div class="lg-tabs">
      <button class="lg-tab active" id="tabCurrentLearner" type="button">Current Learner</button>
      <button class="lg-tab" id="tabNewStudent" type="button">New Student</button>
    </div>

    <!-- Current Learner: an existing account (paid & enrolled, or a
         "New Learner" who already registered during the placement test)
         logs in with their Student ID or phone number, plus their PIN. -->
    <div id="paneCurrentLearner">
      <h2 class="center" style="margin-top:0">Welcome back!</h2>
      <p class="center" style="font-weight:700;color:var(--cocoa-soft,#8A7160);margin-top:-6px">Enter your Student ID or phone number to log in.</p>
      <input type="text" inputmode="numeric" class="lg-id-input" id="loginIdentifier" placeholder="Student ID or phone number" autocomplete="off">
      <div class="lg-pin-dots" id="pinDots"></div>
      <div class="lg-pad" id="pinPad"></div>
      <div class="lg-pin-error" id="pinError"></div>
    </div>

    <!-- New Student: hasn't registered yet. Registration itself happens
         inside the placement test (phone number -> create PIN -> see your
         Student ID), not on this page -- a genuinely new student needs a
         level before anything else here makes sense. -->
    <div id="paneNewStudent" style="display:none">
      <h2 class="center" style="margin-top:0">New here? Let's find your level!</h2>
      <p class="center" style="font-weight:700;color:var(--cocoa-soft,#8A7160)">
        Take our free placement test — you'll register your phone number and create your PIN
        as part of it, and get a Student ID to log in with from then on.
      </p>
      <a class="btn btn-teal" href="lumio-pro-test.html" style="width:100%;display:block;text-align:center;box-sizing:border-box;margin-top:10px">🎯 Take our free placement test</a>
    </div>
  </div>

  <!--
    Hidden compatibility placeholders below. js/auth.js (unmodified) expects
    #tabStudent, #tabTeacher, #paneTeacher, #sname, #slevel, #goStudent,
    #tpin, and #goTeacher to exist. There is deliberately no visible
    "start without a profile" option any more — a student can only reach
    student.html by entering their Student ID or phone number plus the
    correct PIN, which is what fills these hidden fields and clicks
    #goStudent programmatically. Teachers use a completely separate page
    (teacher-portal.html), not linked from anywhere on the public site.
  -->
  <div style="display:none" aria-hidden="true">
    <button id="tabStudent"></button>
    <button id="tabTeacher"></button>
    <input type="text" id="sname">
    <select id="slevel"></select>
    <button id="goStudent"></button>
    <div id="paneTeacher">
      <input type="password" id="tpin">
      <button id="goTeacher"></button>
    </div>
  </div>

</main>

<script src="js/app.js"></script>
<script src="js/lumio-profiles.js"></script>
<script>
(function () {
  // ================= Current Learner / New Student tabs =================
  // Real login/session logic still lives in js/auth.js and reacts to the
  // existing #sname / #slevel / #goStudent elements — this fills those in
  // and clicks the existing button once an ID-or-phone + PIN combination
  // checks out, the same hand-off pattern the old roster picker used.
  try {
    const tabCurrent = document.getElementById("tabCurrentLearner");
    const tabNew = document.getElementById("tabNewStudent");
    const paneCurrent = document.getElementById("paneCurrentLearner");
    const paneNew = document.getElementById("paneNewStudent");
    const idInput = document.getElementById("loginIdentifier");
    const pinDots = document.getElementById("pinDots");
    const pinPad = document.getElementById("pinPad");
    const pinError = document.getElementById("pinError");

    let pinBuffer = "";

    function showTab(which) {
      const isCurrent = which === "current";
      tabCurrent.classList.toggle("active", isCurrent);
      tabNew.classList.toggle("active", !isCurrent);
      paneCurrent.style.display = isCurrent ? "block" : "none";
      paneNew.style.display = isCurrent ? "none" : "block";
      if (isCurrent) idInput.focus();
    }
    tabCurrent.onclick = () => showTab("current");
    tabNew.onclick = () => showTab("new");

    function renderDots() {
      pinDots.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const d = document.createElement("div");
        d.className = "lg-pin-dot" + (i < pinBuffer.length ? " filled" : "");
        pinDots.appendChild(d);
      }
    }
    function renderPad() {
      pinPad.innerHTML = "";
      const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
      keys.forEach(k => {
        const btn = document.createElement("button");
        if (k === "") { btn.style.visibility = "hidden"; pinPad.appendChild(btn); return; }
        btn.textContent = k;
        btn.type = "button";
        btn.onclick = () => {
          if (k === "⌫") { pinBuffer = pinBuffer.slice(0, -1); }
          else if (pinBuffer.length < 4) { pinBuffer += k; }
          renderDots();
          pinError.textContent = "";
          if (pinBuffer.length === 4) tryLogin();
        };
        pinPad.appendChild(btn);
      });
    }

    async function tryLogin() {
      const identifier = idInput.value.trim();
      if (!identifier) {
        pinError.textContent = "Enter your Student ID or phone number first.";
        pinBuffer = ""; renderDots();
        return;
      }
      const ok = window.LumioProfiles && await LumioProfiles.verifyStudentLogin(identifier, pinBuffer);
      if (!ok) {
        pinError.textContent = "That ID/phone and PIN don't match — try again.";
        pinError.classList.remove("shake"); void pinError.offsetWidth; pinError.classList.add("shake");
        pinBuffer = "";
        renderDots();
        return;
      }
      const nameField = document.getElementById("sname");
      const levelField = document.getElementById("slevel");
      const goBtn = document.getElementById("goStudent");
      if (nameField) nameField.value = ok.name;
      // A "New Learner" who registered mid-test but hasn't finished it yet
      // has no level assigned (see js/lumio-profiles.js). Rather than block
      // login entirely, fall back to Pre-A so they can still get into the
      // dashboard; their real level fills in automatically the moment they
      // complete the placement test.
      const effectiveLevel = ok.level || "pre-a";
      if (levelField && [...levelField.options].some(o => o.value === effectiveLevel)) {
        levelField.value = effectiveLevel;
      }
      if (goBtn) goBtn.click();
    }

    idInput.addEventListener("keydown", e => { if (e.key === "Enter") pinPad.querySelector("button") && idInput.blur(); });
    renderPad();
    renderDots();
    showTab("current");

    // A student may well have registered on a different device (e.g. a
    // parent's phone, during the placement test) than the one they're
    // logging in on now (a classroom tablet). verifyStudentLogin only
    // sees this device's local roster, so without a sync a genuinely
    // real account could fail to log in simply because this device
    // hasn't heard about it yet. No roster to re-render any more, but
    // still worth keeping fresh in the background before someone tries.
    // Never blocks or shows an error on failure -- a student on a flaky
    // connection should still be able to log in with whatever's cached.
    if (window.LumioProfiles) {
      LumioProfiles.syncNow().catch(() => {});
    }
  } catch (e) {
    console.error("Lumio login error:", e);
  }
})();
</script>
<script src="js/auth.js"></script>
</body>
</html>
