<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word Builder — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Word Builder: Omar builds words at the treehouse. Letter blocks fly (tap or drag) into the slots on
     the plank and snap in like magnets; the finished word celebrates with its picture. */
  .wb{width:100%;max-width:1220px;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px;justify-items:center;min-height:calc(100dvh - 110px)}
  .wb-work{align-self:center;padding-bottom:40px}
  .wb-side{width:100%;max-width:440px;display:flex;align-items:flex-end;justify-content:center;gap:12px}
  .wb-host{position:relative;flex:none;height:180px;width:110px;display:flex;justify-content:center;align-items:flex-end}
  .wb-host .lp-actor{height:100%}
  .wb-card{position:relative;flex:none;display:flex;flex-direction:column;align-items:center}
  .wb-frame{position:relative;width:min(44vw,180px);height:min(44vw,180px);border-radius:24px;background:#fff;padding:8px;transform:rotate(-2deg);
    box-shadow:0 6px 0 #E6CBA4,0 20px 30px -14px rgba(60,30,5,.7)}
  .wb-frame::before{content:"";position:absolute;left:50%;top:-10px;width:56px;height:20px;margin-left:-28px;background:rgba(255,214,102,.85);border-radius:4px;transform:rotate(3deg);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .wb-frame .in{width:100%;height:100%;border-radius:17px;background:radial-gradient(90% 80% at 50% 35%,#FFFDF7,#FFEFD6);display:grid;place-items:center;overflow:hidden}
  .wb-frame img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(60,30,5,.2))}
  .wb-frame .emo{font-size:76px;line-height:1}
  .wb-frame .noimg{font-family:'Tajawal',var(--lp-body);font-weight:800;font-size:28px;color:#43301F;text-align:center;padding:0 10px;line-height:1.25}
  .wb-ar{margin-top:-12px;position:relative;z-index:2;max-width:220px;padding:6px 16px 7px;border-radius:999px;background:linear-gradient(180deg,#2DD4BF,#0D9488);color:#fff;
    font-family:'Tajawal',var(--lp-body);font-weight:800;font-size:19px;line-height:1.2;text-align:center;box-shadow:0 5px 0 #0A6F66,0 12px 20px -10px rgba(0,60,50,.6)}
  .wb-ar:empty{display:none}
  html[data-lp="teen"] .wb-frame{background:rgba(24,30,60,.9);box-shadow:0 0 0 1px rgba(150,160,255,.35),0 22px 40px -16px rgba(0,0,0,.9);transform:none}
  html[data-lp="teen"] .wb-frame::before{display:none}
  html[data-lp="teen"] .wb-frame .in{background:radial-gradient(90% 80% at 50% 35%,#F7F8FF,#DCE2F7)}
  html[data-lp="teen"] .wb-ar{background:rgba(20,24,52,.9);box-shadow:0 0 0 1px rgba(110,231,210,.5),0 0 20px -4px rgba(45,212,191,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

  .wb-work{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
  /* the plank with letter slots */
  .wb-plank{position:relative;width:100%;padding:14px 12px 16px;border-radius:22px;
    background:linear-gradient(180deg,#C98A4B,#A86A33);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.18),0 18px 30px -16px rgba(60,30,5,.8)}
  .wb-plank::before,.wb-plank::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8D7C0,#7A5A3A)}
  .wb-plank::before{left:9px}.wb-plank::after{right:9px}
  html[data-lp="teen"] .wb-plank{background:linear-gradient(180deg,rgba(28,34,70,.86),rgba(16,20,44,.9));box-shadow:0 0 0 1px rgba(140,160,255,.3),0 22px 40px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  html[data-lp="teen"] .wb-plank::before,html[data-lp="teen"] .wb-plank::after{display:none}
  .wb-slots{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 22px}
  .wb-group{display:flex;gap:var(--sg,7px);flex-wrap:nowrap}
  .wb-slot.fixed{background:none;box-shadow:none;width:auto;min-width:calc(var(--sw,52px) * .4);color:rgba(255,255,255,.9)}
  html[data-lp="teen"] .wb-slot.fixed{background:none;box-shadow:none}
  .wb-tiles.many{gap:8px}
  .lp .wb-tiles.many .wb-tile{width:54px;height:58px;font-size:29px}
  .wb-slot{position:relative;flex:none;width:var(--sw,52px);height:calc(var(--sw,52px) * 1.18);border-radius:12px;display:grid;place-items:center;
    background:rgba(70,35,10,.35);box-shadow:inset 0 4px 8px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.18);
    font-family:var(--lp-display);font-weight:800;font-size:calc(var(--sw,52px) * .62);color:#fff}
  html[data-lp="teen"] .wb-slot{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(160,170,255,.3)}
  .wb-slot.next{box-shadow:inset 0 4px 8px rgba(0,0,0,.35),0 0 0 3px #FFD666,0 0 18px rgba(255,214,102,.8)}
  html[data-lp="teen"] .wb-slot.next{box-shadow:inset 0 0 0 2px #5EEAD4,0 0 20px rgba(94,234,212,.6)}
  .wb-slot.next::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:2px solid rgba(255,214,102,.8);animation:wbMag 1.2s ease-out infinite}
  html[data-lp="teen"] .wb-slot.next::after{border-color:rgba(94,234,212,.7)}
  @keyframes wbMag{0%{transform:scale(1.15);opacity:0}60%{opacity:.9}100%{transform:scale(.96);opacity:0}}
  .wb-slot .blk{position:absolute;inset:0}

  /* letter blocks */
  .wb-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:440px;min-height:64px}
  .wb-tile,.wb-blk{position:relative;width:66px;height:72px;border:0;border-radius:16px;display:grid;place-items:center;padding:0;
    font-family:var(--lp-display);font-weight:800;font-size:34px;color:#fff;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.22);
    background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 var(--c3),0 14px 18px -8px rgba(0,0,0,.45)}
  .wb-tile{cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
  .wb-tile::before,.wb-blk::before{content:"";position:absolute;left:8px;top:6px;width:12px;height:6px;border-radius:6px;background:rgba(255,255,255,.55)}
  .wb-tile[disabled]{visibility:hidden}
  .wb-tile.bad{background:linear-gradient(180deg,#FB7185,#E11D48);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 #9F1239,0 0 22px rgba(244,63,94,.7)}
  .wb-tile.drag{cursor:grabbing;z-index:50}
  .wb-blk{width:100%;height:100%;font-size:inherit;border-radius:11px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--c3)}
  html[data-lp="teen"] .wb-tile,html[data-lp="teen"] .wb-blk{background:linear-gradient(180deg,rgba(60,66,120,.95),rgba(30,34,72,.95));color:#fff;
    text-shadow:0 0 12px var(--c1);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1.5px var(--c1),0 5px 0 rgba(10,12,30,.9),0 14px 22px -10px rgba(0,0,0,.8)}
  html[data-lp="teen"] .wb-tile::before,html[data-lp="teen"] .wb-blk::before{display:none}
  html[data-lp="teen"] .wb-tile.bad{box-shadow:0 0 0 2px #F43F5E,0 0 24px rgba(244,63,94,.7)}
  .wb-tile:focus-visible{outline:3px solid var(--lp-accent-2);outline-offset:3px}
  .lp .wb-tile{font-family:var(--lp-display);font-weight:800;font-size:36px;line-height:1}
  .wb-fly{position:fixed;left:0;top:0;z-index:200;pointer-events:none;margin:0}
  .wb-tools{display:flex;gap:10px}
  .wb-tools .lp-btn{min-height:48px;font-size:17px;padding:0 20px}
  .wb-mis svg{color:#F43F5E}

  /* finished word: the picture celebrates */
  .wb-cel{position:fixed;inset:0;z-index:130;display:grid;place-items:center;pointer-events:none}
  .wb-cel .rays{position:absolute;width:700px;height:700px;left:50%;top:44%;margin:-350px 0 0 -350px;opacity:.5;
    background:repeating-conic-gradient(from 0deg,rgba(255,220,120,.6) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 60%);mask:radial-gradient(circle,#000 8%,transparent 60%)}
  html[data-lp="teen"] .wb-cel .rays{background:repeating-conic-gradient(from 0deg,rgba(94,234,212,.4) 0 9deg,transparent 9deg 24deg)}
  .wb-cel .box{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-6vh}
  .wb-cel .pic{width:min(62vw,250px);height:min(62vw,250px);border-radius:32px;background:#fff;padding:12px;box-shadow:0 0 0 6px rgba(255,214,102,.9),0 30px 60px -20px rgba(0,0,0,.7)}
  .wb-cel .pic .in{width:100%;height:100%;border-radius:22px;background:radial-gradient(90% 80% at 50% 35%,#FFFDF7,#FFEFD6);display:grid;place-items:center;overflow:hidden}
  .wb-cel .pic img{width:88%;height:88%;object-fit:contain}
  .wb-cel .pic .emo{font-size:120px}
  .wb-cel .pic .noimg{font-family:'Tajawal',var(--lp-body);font-weight:800;font-size:40px;color:#43301F;text-align:center}
  html[data-lp="teen"] .wb-cel .pic{background:rgba(24,30,60,.95);box-shadow:0 0 0 3px #5EEAD4,0 0 40px rgba(94,234,212,.6),0 30px 60px -20px rgba(0,0,0,.9)}
  html[data-lp="teen"] .wb-cel .pic .in{background:radial-gradient(90% 80% at 50% 35%,#F7F8FF,#DCE2F7)}
  .wb-cel .word{font-family:var(--lp-display);font-weight:800;font-size:clamp(40px,11vw,68px);line-height:1;color:#fff;letter-spacing:.02em;
    text-shadow:0 4px 0 rgba(150,60,0,.6),0 16px 40px rgba(0,0,0,.45);white-space:nowrap}
  html[data-lp="teen"] .wb-cel .word{text-shadow:0 0 30px rgba(94,234,212,.7),0 10px 30px rgba(0,0,0,.7)}
  .wb-cel .word span{display:inline-block}

  @media (min-width:900px){
    .wb-work{padding:0}
    .wb{grid-template-rows:auto;grid-template-columns:330px minmax(0,1fr);column-gap:40px;align-items:center;min-height:calc(100dvh - 120px);align-content:center}
    .wb-side{flex-direction:column;align-items:center;max-width:330px;gap:16px}
    .wb-card{order:1}
    .wb-host{order:2;height:min(40vh,330px);width:200px}
    .wb-frame{width:220px;height:220px}
    .wb-frame .emo{font-size:110px}
    .wb-ar{font-size:23px}
    .wb-work{max-width:760px;gap:26px}
    .wb-plank{padding:22px 20px 24px}
    .wb-tiles{max-width:640px;gap:14px}
    .wb-tile{width:80px;height:86px;border-radius:20px}
    .lp .wb-tile{font-size:46px}
  }
  @media (max-width:899px) and (max-height:720px){ .wb-host{height:118px;width:76px} .wb-frame{width:120px;height:120px} .wb-tile{width:56px;height:60px} .lp .wb-tile{font-size:30px} .wb-work{gap:10px;padding-bottom:10px} .wb-host{height:130px;width:80px} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="wb">
    <div class="wb-side">
      <div class="wb-host" id="host"></div>
      <div class="wb-card" id="card">
        <div class="wb-frame"><div class="in" id="pic"></div></div>
        <div class="wb-ar" id="arTxt" dir="rtl" lang="ar"></div>
      </div>
    </div>
    <div class="wb-work">
      <div class="wb-plank"><div class="wb-slots" id="wbSlots" aria-label="Word slots"></div></div>
      <div class="wb-tiles" id="wbLetters" aria-label="Letters"></div>
      <div class="wb-tools"><button class="lp-btn alt" id="wbClear" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Clear</span></button></div>
    </div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
/* ================= Hub mini games: same word source, faces and saving rule as student.html ================= */
const u = Lumio.user();
const level = Lumio.qs("level") || (u && u.level) || "pre-a";
const TEEN = ["level3", "level4", "level5", "level6"].includes(level);
const backHref = "../student.html#secHub";
// Starts as this generic fallback list; loadLessonVocabForGames() swaps it for the real lesson words.
const FALLBACK_WORD_BANK = [
  { en: "Cat", ar: "قطة", em: "🐱" }, { en: "Dog", ar: "كلب", em: "🐶" },
  { en: "Sun", ar: "شمس", em: "☀️" }, { en: "Moon", ar: "قمر", em: "🌙" },
  { en: "Apple", ar: "تفاحة", em: "🍎" }, { en: "Banana", ar: "موزة", em: "🍌" },
  { en: "Red", ar: "أحمر", em: "🔴" }, { en: "Blue", ar: "أزرق", em: "🔵" },
  { en: "One", ar: "واحد", em: "1️⃣" }, { en: "Two", ar: "اثنان", em: "2️⃣" },
  { en: "Star", ar: "نجمة", em: "⭐" }, { en: "Book", ar: "كتاب", em: "📚" },
  { en: "Fish", ar: "سمكة", em: "🐟" }, { en: "Bird", ar: "طائر", em: "🐦" },
  { en: "House", ar: "بيت", em: "🏠" }, { en: "Ball", ar: "كرة", em: "⚽" },
  { en: "Tree", ar: "شجرة", em: "🌳" }, { en: "Car", ar: "سيارة", em: "🚗" },
];
let WORD_BANK = FALLBACK_WORD_BANK;
// Photo fix: these lesson words have no picture under their own name, but the same picture exists
// under its base form (visited -> visit.png ...). Without this they fell back to plain text.
const PIC_ALIAS = { visited: "visit", baked: "bake", rested: "rest", bought: "buy", met: "meet", forgot: "forget",
  balloons: "balloon", invitation: "invite", slowly: "slow", cheaper: "cheap", affordable: "cheap", healthier: "healthy-food",
  rehearsal: "rehearse", efficient: "efficiently", "double-check": "check" };
function sdVocabFile(v) {
  if (!v.image) { const k = String(v.en).toLowerCase().trim(); if (PIC_ALIAS[k]) return PIC_ALIAS[k]; }
  return String(v.image || v.en).toLowerCase().trim().replace(/'/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
const picSrc = w => `../assets/vocab/${w.pic || sdVocabFile(w)}.png`;
// Lesson words that have no picture file in assets/vocab (checked against the folder): treated exactly like
// a failed picture (the student.html fallback) but without asking the server for a file that isn't there.
const NO_PIC = new Set("accurately ago anniversary apologized as-soon-as at-last attend backup-plan board-game boarding-pass body-language booking brunch by-the-time cause certain chaperone conclusion counterargument credits cuisine daydreaming delay deliver discover distraction dropped durable earlier effort eye-contact forecast gently giggling guest-list headcount heritage hospitality instructions internship itinerary label landmark lost-and-found mandatory milestone motivation noisy panic peaceful photo-album playlist plot-twist privacy productive progress queue recently result revision road-trip scene scholarship shelter statistic step-by-step suddenly technology the-best therefore thrilled thunder timeline timer tone turning-point unlikely whispering".split(" "));
const hasPic = w => !w.em && !NO_PIC.has(w.pic || sdVocabFile(w));
// Content fix: some lessons give two words the same Arabic (fine/okay, boring/dull, line/queue ...) or the same
// picture. Picking both into one game made two right answers (Word Pop) or look-alike non-pairs (Memory).
const picKey = w => w.em ? "em:" + w.em : hasPic(w) ? "pic:" + (w.pic || sdVocabFile(w)) : "";
const normAr = t => String(t).replace(/[\u064B-\u0652\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim();
function distinctWords(list, n) {
  const out = [], seen = new Set();
  for (const w of list) {
    const keys = ["en:" + w.en.toLowerCase().trim(), picKey(w), w.ar ? "ar:" + normAr(w.ar) : ""].filter(Boolean);
    if (keys.some(k => seen.has(k))) continue;
    keys.forEach(k => seen.add(k)); out.push(w);
    if (out.length >= n) break;
  }
  return out;
}
let gamesLessonNum = null, gamesUsingRealVocab = false;
function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pickWords(n, source) { const bank = source || WORD_BANK; return shuffled(bank).slice(0, Math.min(n, bank.length)); }
async function loadLessonVocabForGames() {
  // ?n= picks the lesson; without it, the student's most recently ATTEMPTED lesson in this level (lesson 1 before any).
  const prog = u ? ((Lumio.progressFor(u.name) || {})[level] || {}) : {};
  const attemptedNums = Object.keys(prog).map(Number);
  const nq = parseInt(Lumio.qs("n") || "", 10);
  const targetNum = nq > 0 ? nq : (attemptedNums.length ? Math.max(...attemptedNums) : 1);
  let lessonData = (window.LUMIO_LESSONS && window.LUMIO_LESSONS[level]) ? window.LUMIO_LESSONS[level][targetNum] : null;
  if (!lessonData) {
    try { const res = await fetch(`../lessons/${level}/lesson${String(targetNum).padStart(2, "0")}.json`); if (res.ok) lessonData = await res.json(); } catch (e) {}
  }
  const vocab = lessonData && Array.isArray(lessonData.vocab) ? lessonData.vocab : [];
  if (vocab.length < 3) return; // too few real words: keep the fallback bank
  WORD_BANK = vocab.map(v => ({ en: v.en, ar: v.ar || "", em: v.emoji || "", pic: sdVocabFile(v) }));
  gamesLessonNum = targetNum; gamesUsingRealVocab = true;
}
// The game's own best score per lesson, kept apart from the lesson's prep
// result (lumio_progress): it used to overwrite the prep score/percent the
// map and the teacher show as PREP, and never reached the teacher anyway.
// Local to this device, like the game itself.
function saveGameResultToLesson(stars, score, total) {
  if (!gamesUsingRealVocab || !gamesLessonNum || !u) return { counted: false, reason: "no-lesson" };
  const KEY = "lumio_game_best";
  let all; try { all = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { all = {}; }
  const game = location.pathname.split("/").pop().replace(/\.html$/, "");
  all[u.name] = all[u.name] || {}; all[u.name][level] = all[u.name][level] || {};
  const lv = all[u.name][level], prevBest = lv[gamesLessonNum] && lv[gamesLessonNum][game];
  if (prevBest && stars <= prevBest.stars) return { counted: false, reason: "not-better", lessonNum: gamesLessonNum };
  lv[gamesLessonNum] = Object.assign({}, lv[gamesLessonNum], { [game]: { stars, score, total, date: Lumio.tzNow().date } });
  try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { return { counted: false, reason: "storage-failed" }; }
  return { counted: true, first: !prevBest, lessonNum: gamesLessonNum };
}
function gameResultNote(b) {
  if (b.counted && !b.first) return `<span class="hub-note ok">🎯 New best score for Lesson ${b.lessonNum}'s words!</span>`;
  if (b.reason === "not-better") return `<span class="hub-note">You've done this well before on Lesson ${b.lessonNum}'s words — try beating it!</span>`;
  return "";
}
function gameStars(r) { if (r >= 0.85) return 3; if (r >= 0.6) return 2; return 1; } // same as lesson.js
// Results card: kit card + the hub's own lines (teens see XP, like student.html)
function hubResults(o, lines, quiet) {
  const keepRain = LP.rain, keepLottie = window.lottie;
  if (quiet) { LP.rain = () => {}; window.lottie = null; }
  LP.results(o);
  if (quiet) setTimeout(() => { LP.rain = keepRain; window.lottie = keepLottie; }, 1500);
  const note = document.querySelector(".lp-results .note");
  if (note) note.innerHTML = lines.filter(Boolean).join("") + (TEEN ? `<span class="hub-xp"><b>+${o.stars * 100} XP</b><i><s style="transform:scaleX(${o.stars / 3})"></s></i></span>` : "");
}
const hubCss = document.createElement("style");
hubCss.textContent = `.lp-results .note{display:flex;flex-direction:column;align-items:center;gap:6px}
.hub-line{font-family:var(--lp-display);font-weight:800;font-size:18px}
.hub-note{font-size:14px;opacity:.85;max-width:30em}.hub-note.ok{color:#0D9488;opacity:1}
html[data-lp="teen"] .hub-note.ok{color:#5EEAD4}
.hub-xp{display:flex;align-items:center;gap:10px;margin-top:4px}.hub-xp b{font-family:var(--lp-display);font-size:20px;color:#A78BFA}
.hub-xp i{display:block;width:140px;height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hub-xp s{display:block;height:100%;background:linear-gradient(90deg,#7C5CFF,#3BA0FF);transform-origin:0 50%;text-decoration:none}`;
document.head.appendChild(hubCss);


/* ================= Word Builder (rules from student.html) ================= */
const WB_ROUNDS = 8;
let wbUsedRealVocabThisRound = false;
let wbState = null, currentBuild = null;
LP.init({
  theme: TEEN ? "teen" : "kid",
  scene: TEEN
    ? { bg: "assets/story/backgrounds/teen-room.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(20,14,40,.3),rgba(6,8,22,.55))" }
    : { bg: "assets/story/backgrounds/treehouse-building.jpg", particles: "leaves", tint: "linear-gradient(180deg,rgba(255,240,200,.05),rgba(40,30,0,.2))" },
  hud: false
});
const G = window.gsap, ANIM = !!G && !LP.RM;
const CH = TEEN ? { char: "omar-teen", pose: "think", cheer: "celebrate", oops: "surprised" } : { char: "omar", pose: "pencil", cheer: "celebrate", oops: "surprised" };
[CH.pose, CH.cheer, CH.oops, "thumbs"].forEach(p => { const i = new Image(); i.src = LP.char(CH.char, p); });
const wbSlots = document.getElementById("wbSlots"), wbLetters = document.getElementById("wbLetters"), picEl = document.getElementById("pic"), arTxt = document.getElementById("arTxt");
const KID_COLS = [["#FF8A3D", "#F25C05", "#B8430A"], ["#3BA0FF", "#1D6FE0", "#1550A8"], ["#2DD4BF", "#0D9488", "#0A6F66"], ["#FF5C8A", "#E11D63", "#A3124A"], ["#A06BFF", "#7C3AED", "#5B21B6"], ["#FFC93C", "#F59E0B", "#B45309"], ["#4ADE80", "#16A34A", "#166534"]];
const TEEN_COLS = [["#5EEAD4"], ["#A78BFA"], ["#60A5FA"], ["#F0ABFC"], ["#FCD34D"]].map(c => [c[0], c[0], c[0]]);
const colOf = i => (TEEN ? TEEN_COLS : KID_COLS)[i % (TEEN ? TEEN_COLS : KID_COLS).length];
const blkStyle = c => `--c1:${c[0]};--c2:${c[1]};--c3:${c[2]}`;
let host, misN;

// only letters become blocks; spaces, "-" and "'" (T-shirt, o'clock) are fixed, pre-filled characters
const isTile = ch => /[A-Z0-9]/.test(ch);
const tilesOf = w => w.en.toUpperCase().split("").filter(isTile);
function poolOf(source) {
  // Letter-scrambling only makes sense for single words (real lesson vocab includes phrases), as in student.html
  const baseBank = source || WORD_BANK;
  let pool = baseBank.filter(w => !w.en.includes(" ") && w.en.length <= 10);
  let real = !source && gamesUsingRealVocab && pool.length >= 3;
  // Content fix: a lesson made almost only of phrases (Level 2 L14/L15, Level 6 L7) used to fall back to the
  // generic Cat/Dog bank. It now builds its own phrases, with the spaces shown as fixed gaps.
  if (pool.length < 3) {
    const ph = baseBank.filter(w => tilesOf(w).length <= 15 && w.en.split(" ").every(p => p.length <= 11));
    if (ph.length >= 3) { pool = ph; real = !source && gamesUsingRealVocab; }
  }
  if (pool.length < 3) pool = FALLBACK_WORD_BANK;
  return { pool, real };
}
function resetHud() { LP.setStars(0); document.querySelectorAll(".lp-prog i b").forEach(b => { if (G) G.set(b, { scaleX: 0 }); else b.style.transform = "scaleX(0)"; }); }

function startBuilder(source) {
  const { pool, real } = poolOf(source);
  wbUsedRealVocabThisRound = real;
  const words = shuffled(pool).slice(0, Math.min(WB_ROUNDS, pool.length));
  wbState = { words, round: 0, mistakes: 0, totalLetters: words.reduce((s, w) => s + tilesOf(w).length, 0), source };
  resetHud(); misN.textContent = "0";
  nextBuilderRound(true);
}
async function nextBuilderRound(first) {
  LP.answer = null; currentBuild = null;
  if (wbState.round >= wbState.words.length) { endBuilder(); return; }
  const w = wbState.words[wbState.round];
  wbState.round++;
  LP.round(wbState.round - 1);
  host.set(CH.pose);
  if (ANIM && !first) await new Promise(r => G.to([...wbSlots.querySelectorAll(".wb-slot"), ...wbLetters.children, document.getElementById("card")], { y: -16, opacity: 0, scale: .8, duration: .25, stagger: .015, ease: "power2.in", onComplete: r }));
  if (G) G.set(document.getElementById("card"), { clearProps: "all" });
  picEl.innerHTML = w.em ? `<span class="emo">${LP.esc(w.em)}</span>`
    : hasPic(w) ? `<img src="${LP.esc(picSrc(w))}" alt="" draggable="false" onerror="this.remove()">`
    : `<span class="noimg" dir="rtl" lang="ar">${LP.esc(w.ar)}</span>`;
  arTxt.textContent = (w.em || hasPic(w)) ? w.ar : "";
  const letters = tilesOf(w);
  currentBuild = { w, word: letters, placed: [], letterEls: [], slots: [], busy: true };
  // slots sized to fit the plank; each word of a phrase is its own group (groups wrap onto new lines)
  wbSlots.innerHTML = "";
  const parts = w.en.toUpperCase().split(" "), longest = Math.max(...parts.map(p => p.length));
  const plankW = wbSlots.parentElement.clientWidth - 40, maxW = innerWidth >= 900 ? 66 : 52;
  const sw = Math.max(26, Math.min(maxW, Math.floor((plankW - (longest - 1) * 7) / longest)));
  wbSlots.style.setProperty("--sw", sw + "px"); wbSlots.style.setProperty("--sg", (sw < 36 ? 4 : 7) + "px");
  parts.forEach(part => {
    const g = LP.el("div", "wb-group");
    part.split("").forEach(ch => {
      if (isTile(ch)) { const s = LP.el("div", "wb-slot"); g.appendChild(s); currentBuild.slots.push(s); }
      else g.appendChild(LP.el("div", "wb-slot fixed", LP.esc(ch)));
    });
    wbSlots.appendChild(g);
  });
  wbLetters.classList.toggle("many", letters.length > 10);
  wbLetters.innerHTML = "";
  shuffled(letters.map((_, i) => i)).forEach((idx, k) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "wb-tile"; btn.dataset.letter = letters[idx];
    btn.style.cssText = blkStyle(colOf(k));
    btn.textContent = letters[idx];
    btn.setAttribute("aria-label", "Letter " + letters[idx]);
    btn.onclick = () => { if (btn._dragged) { btn._dragged = false; return; } tryPlace(btn, idx); };
    dragify(btn, idx);
    wbLetters.appendChild(btn);
    currentBuild.letterEls.push(btn);
  });
  markNext();
  await LP.banner("Word " + wbState.round + " of " + wbState.words.length, "Build the word!", 700);
  if (ANIM) {
    const tl = G.timeline();
    tl.fromTo("#card", { scale: .3, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .6, ease: "back.out(2)", clearProps: "transform" })
      .fromTo(wbSlots.querySelectorAll(".wb-slot"), { scaleY: 0, opacity: 0, transformOrigin: "50% 100%" }, { scaleY: 1, opacity: 1, duration: .3, stagger: .035, ease: "back.out(2)", clearProps: "transform" }, .15)
      .fromTo(wbLetters.children, { y: 140, opacity: 0, rotation: () => (Math.random() - .5) * 60 }, { y: 0, opacity: 1, rotation: 0, duration: .7, stagger: .05, ease: TEEN ? "power3.out" : "elastic.out(1,.6)", clearProps: "transform", onStart: () => LP.sfx("deal") }, .25);
    await new Promise(r => tl.eventCallback("onComplete", r));
  } else [document.getElementById("card"), ...wbSlots.querySelectorAll(".wb-slot"), ...wbLetters.children].forEach(e => e.style.opacity = 1);
  host.nod();
  currentBuild.busy = false;
  LP.answer = letters.join("");   // read by the automated play-through tests
}
function markNext() { (currentBuild ? currentBuild.slots : []).forEach((s, i) => s.classList.toggle("next", !!currentBuild && i === currentBuild.placed.length)); }

/* drag a block: it follows the finger and is pulled in by the next slot like a magnet */
function dragify(btn, idx) {
  let sx, sy, on = false, pid = null;
  btn.addEventListener("pointerdown", e => {
    if (btn.disabled || !currentBuild || currentBuild.busy) return;
    sx = e.clientX; sy = e.clientY; on = false; pid = e.pointerId;
    try { btn.setPointerCapture(pid); } catch (x) {}
  });
  btn.addEventListener("pointermove", e => {
    if (pid !== e.pointerId || btn.disabled) return;
    let dx = e.clientX - sx, dy = e.clientY - sy;
    if (!on && Math.hypot(dx, dy) < 9) return;
    if (!on) { on = true; btn.classList.add("drag"); if (G) G.killTweensOf(btn); }
    const slot = currentBuild.slots[currentBuild.placed.length];
    if (slot) { // magnet
      const r = btn.getBoundingClientRect(), s = LP.center(slot);
      const cx = r.left + r.width / 2 - (G ? G.getProperty(btn, "x") : 0) + dx, cy = r.top + r.height / 2 - (G ? G.getProperty(btn, "y") : 0) + dy;
      const d = Math.hypot(s.x - cx, s.y - cy);
      if (d < 90) { const k = (1 - d / 90) * .55; dx += (s.x - cx) * k; dy += (s.y - cy) * k; }
    }
    if (G) G.set(btn, { x: dx, y: dy, scale: 1.1, rotation: dx * .03 }); else btn.style.transform = `translate(${dx}px,${dy}px)`;
  });
  const end = e => {
    if (pid !== e.pointerId) return; pid = null;
    if (!on) return;
    btn._dragged = true; btn.classList.remove("drag"); on = false;
    const slot = currentBuild && currentBuild.slots[currentBuild.placed.length];
    const near = slot && Math.hypot(LP.center(slot).x - LP.center(btn).x, LP.center(slot).y - LP.center(btn).y) < 80;
    if (near) tryPlace(btn, idx, true);
    else if (G) G.to(btn, { x: 0, y: 0, scale: 1, rotation: 0, duration: .5, ease: "elastic.out(1,.5)" }); else btn.style.transform = "";
    setTimeout(() => { btn._dragged = false; }, 50);
  };
  btn.addEventListener("pointerup", end); btn.addEventListener("pointercancel", end);
}

function flyToSlot(btn, slot, ch, style) {
  // a copy of the block flies along an arc, overshoots, and snaps into the slot
  const blk = LP.el("div", "wb-blk", LP.esc(ch)); blk.setAttribute("style", style);
  if (!ANIM) { slot.appendChild(blk); return Promise.resolve(); }
  const a = btn.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const f = LP.el("div", "wb-tile wb-fly", LP.esc(ch)); f.setAttribute("style", style + `;width:${a.width}px;height:${a.height}px;font-size:${getComputedStyle(btn).fontSize}`);
  f.style.position = "fixed"; document.body.appendChild(f);
  const sc = b.width / a.width, tx = b.left + b.width / 2 - a.width / 2, ty = b.top + b.height / 2 - a.height / 2;
  const o = { t: 0 }, cx = (a.left + tx) / 2, cy = Math.min(a.top, ty) - 70;
  G.set(f, { x: a.left, y: a.top });
  return new Promise(res => G.timeline({ onComplete: res })
    .to(o, { t: 1, duration: .38, ease: "power2.in", onUpdate() {
      const t = o.t, u = 1 - t;
      G.set(f, { x: u * u * a.left + 2 * u * t * cx + t * t * tx, y: u * u * a.top + 2 * u * t * cy + t * t * ty, scale: 1 + (sc - 1) * t, rotation: Math.sin(t * Math.PI) * 18 });
    } })
    .add(() => { f.remove(); slot.appendChild(blk); LP.sfx("tick"); LP.sfx("pop"); })
    .fromTo(blk, { scaleX: 1.25, scaleY: .75, y: -6 }, { scaleX: 1, scaleY: 1, y: 0, duration: .45, ease: "elastic.out(1.2,.35)" })
    .fromTo(slot, { scale: 1.12 }, { scale: 1, duration: .4, ease: "elastic.out(1,.4)" }, "<"));
}

async function tryPlace(btn, idx, fromDrag) {
  if (btn.disabled || !currentBuild || currentBuild.busy) return;
  const letters = currentBuild.word;
  const nextPos = currentBuild.placed.length;
  if (letters[idx] === currentBuild.word[nextPos]) {
    currentBuild.placed.push(idx);
    const slot = currentBuild.slots[nextPos];
    const style = btn.getAttribute("style").split(";").filter(p => /^\s*--c/.test(p)).join(";");
    const p = flyToSlot(btn, slot, letters[idx], style);
    btn.disabled = true; if (G) G.set(btn, { clearProps: "transform" });
    markNext();
    if (currentBuild.placed.length === letters.length) { currentBuild.busy = true; LP.answer = null; await p; finishWord(); }
  } else {
    wbState.mistakes++;
    misN.textContent = wbState.mistakes;
    if (ANIM) G.fromTo(misN.parentElement, { scale: 1.3 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" });
    LP.sfx("wrong"); LP.streak(false);
    host.oops(CH.oops, CH.pose);
    btn.classList.add("bad"); setTimeout(() => btn.classList.remove("bad"), 600);
    if (ANIM) {
      if (fromDrag) G.to(btn, { x: 0, y: 0, scale: 1, rotation: 0, duration: .45, ease: "back.out(2)" });
      G.timeline({ delay: fromDrag ? .45 : 0 }).to(btn, { x: -9, rotation: -6, duration: .06 }).to(btn, { x: 9, rotation: 6, duration: .08 }).to(btn, { x: -5, rotation: -3, duration: .08 }).to(btn, { x: 0, rotation: 0, duration: .3, ease: "elastic.out(1,.4)" });
    } else btn.style.transform = "";
  }
}
document.getElementById("wbClear").onclick = () => {
  if (!currentBuild || currentBuild.busy) return;
  const back = currentBuild.placed.slice();
  currentBuild.placed = [];
  const blks = [...wbSlots.querySelectorAll(".wb-blk")];
  if (ANIM && blks.length) G.to(blks, { y: 40, opacity: 0, scale: .5, duration: .25, stagger: .03, ease: "power2.in", onComplete: () => blks.forEach(b => b.remove()) });
  else blks.forEach(b => b.remove());
  currentBuild.letterEls.forEach(b => b.disabled = false);
  if (ANIM && back.length) G.fromTo(currentBuild.letterEls.filter(b => b.disabled === false), { y: -24, scale: .7 }, { y: 0, scale: 1, duration: .5, stagger: .03, ease: "back.out(2)", clearProps: "transform" });
  LP.sfx("whoosh");
  markNext();
};

async function finishWord() {
  const w = currentBuild.w, slots = [...wbSlots.querySelectorAll(".wb-slot")];
  LP.sfx("correct"); LP.streak(true);
  host.cheer(CH.cheer, CH.pose);
  LP.fill(wbState.round - 1);
  if (ANIM) await new Promise(r => G.timeline({ onComplete: r })
    .to(slots, { y: -16, scale: 1.15, rotation: i => TEEN ? 0 : (i % 2 ? -8 : 8), duration: .16, stagger: .05, ease: "power2.out" })
    .to(slots, { y: 0, scale: 1, rotation: 0, duration: .45, stagger: .05, ease: "bounce.out" }, "-=.08"));
  // the picture celebrates in the middle of the scene
  const cel = LP.el("div", "wb-cel");
  const inner = w.em ? `<span class="emo">${LP.esc(w.em)}</span>` : hasPic(w) ? `<img src="${LP.esc(picSrc(w))}" alt="" onerror="this.remove()">` : `<span class="noimg" dir="rtl" lang="ar">${LP.esc(w.ar)}</span>`;
  cel.innerHTML = `<div class="rays"></div><div class="box"><div class="pic"><div class="in">${inner}</div></div><div class="word">${[...w.en].map(c => `<span>${c === " " ? "&nbsp;" : LP.esc(c)}</span>`).join("")}</div></div>`;
  document.body.appendChild(cel);
  LP.say(w.en);
  const picBox = cel.querySelector(".pic");
  if (ANIM) {
    const from = LP.center(document.getElementById("card")), to = LP.center(picBox);
    G.to(cel.querySelector(".rays"), { rotation: 90, duration: 3, ease: "none" });
    await new Promise(r => G.timeline({ onComplete: r })
      .from(cel.querySelector(".rays"), { opacity: 0, scale: .3, duration: .5 })
      .from(picBox, { x: from.x - to.x, y: from.y - to.y, scale: .5, rotation: -20, duration: .55, ease: "back.out(1.6)" }, 0)
      .add(() => { const c = LP.center(picBox); LP.burst(c.x, c.y, { n: 40, speed: 10 }); }, .45)
      .from(cel.querySelectorAll(".word span"), { y: 60, opacity: 0, rotation: () => (Math.random() - .5) * 50, duration: .5, stagger: .04, ease: "back.out(2.5)" }, .4));
    await LP.addStar(picBox);
    await LP.wait(450);
    await new Promise(r => G.to(cel, { opacity: 0, scale: .9, duration: .3, ease: "power2.in", onComplete: r }));
  } else { await LP.addStar(picBox); await LP.wait(700); }
  cel.remove();
  nextBuilderRound();
}
function endBuilder() {
  LP.answer = null; LP.round(-1);
  const efficiency = wbState.totalLetters / (wbState.totalLetters + wbState.mistakes);
  const st = gameStars(efficiency);
  const note = gameResultNote(wbUsedRealVocabThisRound ? saveGameResultToLesson(st, Math.round(efficiency * 10), 10) : { counted: false, reason: "no-lesson" });
  hubResults({ score: wbState.words.length, total: wbState.words.length, stars: st, title: "Great spelling! ✏️", scoreLabel: "Words built",
    actor: { char: CH.char, pose: "celebrate" }, exitHref: backHref, exitLabel: "Back to the Hub", onReplay: () => startBuilder(wbState.source) },
    [`<span class="hub-line">${wbState.mistakes} mistake${wbState.mistakes === 1 ? "" : "s"} total</span>`, note], st < 2);
}

const ready = loadLessonVocabForGames().catch(() => {});
ready.then(() => {
  // the HUD knows how many words this lesson gives (up to 8 single words)
  const pool = poolOf().pool;
  const misChip = LP.el("div", "lp-chip wb-mis", '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span class="n">0</span>');
  misChip.setAttribute("aria-label", "Mistakes");
  LP.hud({ rounds: Math.min(WB_ROUNDS, pool.length), exitHref: backHref, extra: misChip });
  misN = misChip.querySelector(".n");
  host = LP.actor(document.getElementById("host"), Object.assign({ alt: "Omar" }, CH));
  return LP.title({ kicker: TEEN ? "English Hub · Mini game" : "English Hub · Play", title: "Word Builder", sub: "Look at the picture. Tap or drag the letters to build the word!",
    ar: "انظر إلى الصورة، ثم رتّب الحروف لتكوّن الكلمة", actor: TEEN ? { char: "omar-teen", pose: "wave", cheer: "celebrate" } : { char: "omar", pose: "wave", cheer: "jump" } });
}).then(() => startBuilder());
</script>
