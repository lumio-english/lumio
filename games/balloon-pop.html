<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balloon Pop — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Balloon Pop: a garden party. Glossy balloons drift up from the grass on their strings, swaying,
     nudging each other and leaning into the breeze. Listen, then pop the balloon with that word
     before the 45-second clock runs out. Lumi cheers from the corner. */
  body.lp{overflow:hidden;height:100dvh}
  .bp-sky{position:fixed;inset:0;z-index:20;overflow:hidden;touch-action:manipulation}
  .bp-lumi{position:fixed;left:-6px;bottom:-4px;z-index:15;height:clamp(140px,22vh,280px);pointer-events:none}
  .bp-lumi .lp-actor{height:100%}
  .bp-ask{position:fixed;left:0;right:0;top:calc(var(--lp-hud-h) + 8px + env(safe-area-inset-top,0px));z-index:40;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
  .bp-ask .lp-bubble{pointer-events:auto;padding:10px 20px 10px 10px}
  .bp-ask .lp-bubble .tail{display:none}
  .bp-ask .txt{font-size:clamp(17px,4.4vw,22px)}
  .bp-ask .txt b{display:inline-block;color:var(--lp-accent);font-size:1.3em;line-height:1}
  /* timer chip in the HUD */
  .bp-timer{position:relative;padding:0 14px 0 6px;gap:6px}
  .bp-timer svg{width:34px;height:34px;transform:rotate(-90deg)}
  .bp-timer circle{fill:none;stroke-width:5}
  .bp-timer .bg{stroke:rgba(120,90,60,.18)}
  .bp-timer .fg{stroke:#22C55E;stroke-linecap:round;transition:stroke .3s}
  .bp-timer.low .fg{stroke:#F43F5E}
  .bp-timer.low{color:#E11D48}
  .bp-timer .s{min-width:2.1em;text-align:right;font-variant-numeric:tabular-nums}
  /* a balloon: glossy body, knot, string (svg), word */
  .bl{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw) * 1.2 + 90px);will-change:transform;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .bl .body{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw) * 1.2);border-radius:50% 50% 48% 48% / 56% 56% 44% 44%;
    background:
      radial-gradient(28% 22% at 30% 24%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
      radial-gradient(70% 70% at 70% 80%,rgba(0,0,0,.28),rgba(0,0,0,0) 70%),
      radial-gradient(120% 120% at 35% 30%,var(--c2),var(--c) 55%,var(--c3));
    box-shadow:inset -6px -10px 18px rgba(0,0,0,.18),inset 6px 6px 14px rgba(255,255,255,.25),0 16px 26px -14px rgba(0,0,0,.45);
    display:grid;place-items:center;text-align:center;padding:14% 10% 18%}
  .bl .body::after{content:"";position:absolute;left:18%;top:12%;width:16%;height:9%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg);filter:blur(.5px)}
  .bl .knot{position:absolute;left:50%;top:calc(var(--bw) * 1.2 - 3px);width:16px;height:12px;margin-left:-8px;background:var(--c3);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:3px}
  .bl svg{position:absolute;left:50%;top:calc(var(--bw) * 1.2 + 8px);width:60px;height:84px;margin-left:-30px;overflow:visible;pointer-events:none}
  .bl path{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .bl .w{position:relative;z-index:1;display:block;width:86%;margin:0 auto;min-width:0;overflow:hidden;font-family:var(--lp-display);font-weight:800;color:#fff;line-height:1.02;overflow-wrap:normal;word-break:normal;hyphens:none;
    text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 10px rgba(0,0,0,.25);font-size:var(--fs,22px)}
  .bl.popped{pointer-events:none}
  .bl.dk .w{color:#3A2A1A;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .bp-tag{position:fixed;left:0;top:0;z-index:260;pointer-events:none;font-family:var(--lp-display);font-weight:800;font-size:30px;color:#fff;white-space:nowrap;
    text-shadow:0 3px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35)}
  .bp-tag.good{color:#FFE27A}
  .bp-tag.bad{color:#fff;font-size:24px}
  body.lp-intro .bp-ask,body.lp-intro .bp-lumi,body.lp-done .bp-ask,body.lp-done .bp-sky{opacity:0;pointer-events:none}
  .bp-ask,.bp-lumi,.bp-sky{transition:opacity .4s}
  /* the kit's streak chip sits under the prompt instead of on top of it */
  .lp-streak{top:calc(var(--lp-hud-h) + 92px + env(safe-area-inset-top,0px))}
  :root{--bw:104px}
  @media (min-width:700px){:root{--bw:132px}}
  @media (min-width:1100px){:root{--bw:156px} .bp-lumi{height:clamp(200px,32vh,320px)}}
</style>
</head>
<body>
<div class="bp-lumi" id="lumiZone"></div>
<div class="bp-sky" id="sky" aria-label="Balloons"></div>
<div class="bp-ask">
  <button class="lp-bubble" id="promptCard" type="button" aria-label="Hear it again">
    <span class="lp-speak" id="hearBtn" aria-hidden="true"></span>
    <span class="txt">Listen and pop: <b id="promptWord">...</b></span>
  </button>
</div>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "pre-a";
const num = parseInt(Lumio.qs("n") || "1", 10);
// Exit/Back go to the lesson the game was launched from (or the map / the trial deck).
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;
const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const GAME_TIME = 45, SEGS = 9;

// timer chip in the HUD: a ring that drains, seconds counting down
const timerEl = document.createElement("div");
timerEl.className = "lp-chip bp-timer"; timerEl.setAttribute("aria-label", "Time left");
timerEl.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg><span class="s" aria-live="off">45</span>';
LP.init({ scene: { bg: "assets/story/backgrounds/celebration.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(120,200,255,.28),rgba(255,255,255,0) 45%,rgba(40,20,0,.12))" },
  hud: { rounds: SEGS, exitHref: backHref, extra: timerEl } });
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };
document.getElementById("hearBtn").innerHTML = LP.ICON.speaker;
const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "point", cheer: "celebrate", oops: "surprised", alt: "Lumi" });
const G = window.gsap, MOVE = G && !LP.RM;

const COLORS = ["#F97316", "#0D9488", "#F43F5E", "#8B5CF6", "#F59E0B", "#22C55E", "#3B82F6", "#EC4899"];
const WORD_COLORS = { red: "#EF4444", blue: "#3B82F6", yellow: "#EAB308", green: "#22C55E", orange: "#F97316", purple: "#8B5CF6",
  pink: "#EC4899", brown: "#8B5A2B", black: "#27272A", white: "#E5E7EB", gray: "#9CA3AF", grey: "#9CA3AF" };
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)))); return `rgb(${f(r)},${f(g)},${f(b)})`; };

const sky = document.getElementById("sky"), promptWord = document.getElementById("promptWord"), hearBtn = document.getElementById("hearBtn");
let score = 0, timeLeft = GAME_TIME, currentTarget = null, spawnTimer = null, tickTimer = null, running = false;
const balloons = [], filled = new Set();

// Targets come from a shuffled bag: every word of the lesson is asked once before any word comes back,
// and the same word is never asked twice in a row.
let bag = [];
function pickTarget() {
  if (!bag.length) { bag = Lumio.shuffle([...vocab]); if (currentTarget && bag.length > 1 && bag[bag.length - 1].en === currentTarget.en) bag.unshift(bag.pop()); }
  currentTarget = bag.pop();
  promptWord.textContent = currentTarget.en;
  if (MOVE) G.fromTo(promptWord, { scale: .4, rotation: -10 }, { scale: 1, rotation: 0, duration: .6, ease: "elastic.out(1,.4)" });
  LP.answer = running ? currentTarget.en : null;
  setTimeout(() => LP.say(currentTarget.en, hearBtn), 200);
}

function spawnBalloon() {
  if (!running) return;
  // Correctness is checked against the word asked *now* (see pop), so this only asks whether one is up there.
  const hasTarget = balloons.some(b => !b.dead && b.word === currentTarget.en && b.y > 60);
  const isTarget = Math.random() < 0.35 || !hasTarget;
  const word = isTarget ? currentTarget : vocab[Math.floor(Math.random() * vocab.length)];
  // colour words ride on a balloon of that colour (a "red" balloon that is green would teach the wrong word)
  const color = WORD_COLORS[word.en.toLowerCase()] || COLORS[Math.floor(Math.random() * COLORS.length)];
  const el = document.createElement("div"); el.className = "bl"; el.dataset.word = word.en;
  el.style.setProperty("--c", color); el.style.setProperty("--c2", shade(color, .45)); el.style.setProperty("--c3", shade(color, -.3));
  const len = word.en.length;
  el.innerHTML = `<div class="body"><span class="w">${LP.esc(word.en)}</span></div><div class="knot"></div><svg viewBox="0 0 60 84"><path d="M30 0 C30 30 30 50 30 84"/></svg>`;
  el.setAttribute("role", "button"); el.setAttribute("aria-label", "Balloon: " + word.en);
  if (/^(white|yellow)$/i.test(word.en)) el.classList.add("dk");
  el.style.transform = "translate(-999px,-999px)";
  sky.appendChild(el);
  // fit the word inside the balloon: never break a word in the middle, shrink instead
  const wEl = el.querySelector(".w"), bwPx = el.offsetWidth, maxH = bwPx * .62;
  let fs = Math.round(bwPx * .22);
  do { el.style.setProperty("--fs", fs + "px"); fs--; } while (fs > 11 && (wEl.scrollWidth > wEl.clientWidth + 1 || wEl.offsetHeight > maxH));
  const bw = el.offsetWidth, H = innerHeight, W = innerWidth;
  const duration = 6 + Math.random() * 3;               // same rise time as the original: 6 to 9 seconds
  const b = { el, word: word.en, color, w: bw, h: bw * 1.2, x: 8 + Math.random() * Math.max(10, W - bw - 16), y: H + 20,
    vy: -(H * 1.15 + 120) / duration, vx: 0, ph: Math.random() * 6.28, sw: 18 + Math.random() * 22, fr: .5 + Math.random() * .5, rot: 0, t: 0, dead: false,
    path: el.querySelector("path") };
  b.x0 = b.x;
  el.addEventListener("pointerdown", e => { e.preventDefault(); pop(b); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pop(b); });
  balloons.push(b);
}

// ---------- floaty physics: rise, sway, a breeze, soft nudges between balloons, strings that lag behind ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, last ? (ts - last) / 1000 : .016); last = ts;
  const wind = MOVE ? Math.sin(ts / 2600) * 10 : 0;
  for (const b of balloons) {
    if (b.dead) continue;
    b.t += dt; b.y += b.vy * dt;
    let push = 0;
    for (const o of balloons) { if (o === b || o.dead) continue; const dx = b.x - o.x, dy = b.y - o.y; if (Math.abs(dx) < b.w * .85 && Math.abs(dy) < b.h * .8) push += (dx >= 0 ? 1 : -1) * 90 * (1 - Math.abs(dx) / (b.w * .85)); }
    b.x0 += (push + wind * .4) * dt; b.x0 = Math.max(4, Math.min(innerWidth - b.w - 4, b.x0));
    const sway = MOVE ? Math.sin(b.t * b.fr * 2 + b.ph) * b.sw : 0;
    const nx = b.x0 + sway; b.vx = (nx - b.x) / dt; b.x = nx;
    const rot = MOVE ? Math.max(-12, Math.min(12, b.vx * .25)) : 0; b.rot += (rot - b.rot) * .1;
    b.el.style.transform = `translate(${b.x}px,${b.y}px) rotate(${b.rot}deg)`;
    if (MOVE) { const lag = -b.vx * .35, wob = Math.sin(b.t * 3 + b.ph) * 6; b.path.setAttribute("d", `M30 0 C${30 + lag * .4} 28 ${30 + lag + wob} 52 ${30 + lag * .8 - wob * .5} 84`); }
    if (b.y < -b.h - 100) { b.dead = true; b.el.remove(); }
  }
  for (let i = balloons.length - 1; i >= 0; i--) if (balloons[i].dead && !balloons[i].el.isConnected) balloons.splice(i, 1);
  requestAnimationFrame(frame);
}

function tag(x, y, text, cls) {
  const t = document.createElement("div"); t.className = "bp-tag " + cls; t.textContent = text; document.body.appendChild(t);
  const w = t.offsetWidth;
  if (!MOVE) { t.style.transform = `translate(${x - w / 2}px,${y - 20}px)`; setTimeout(() => t.remove(), 600); return; }
  G.fromTo(t, { x: x - w / 2, y: y - 10, scale: .4, opacity: 0 }, { y: y - 70, scale: 1, opacity: 1, duration: .45, ease: "back.out(2.5)",
    onComplete: () => G.to(t, { opacity: 0, y: "-=20", duration: .35, delay: .2, onComplete: () => t.remove() }) });
}

function pop(b, quiet) {
  if (b.dead || b.el.classList.contains("popped")) return;
  b.el.classList.add("popped");
  const body = b.el.querySelector(".body"), r = body.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  // pop! the skin snaps into rubber shreds, the string drops away
  LP.sfx("pop");
  LP.burst(cx, cy, { n: quiet ? 14 : 22, colors: [b.color, shade(b.color, .45), "#fff"], shape: "rect", speed: 9, up: 1, ring: true, ringColor: "#fff", r0: r.width * .3, ringSpeed: 4 });
  const finish = () => { b.dead = true; b.el.remove(); };
  if (MOVE) {
    G.timeline({ onComplete: finish })
      .to(body, { scale: 1.18, duration: .06, ease: "power1.out" })
      .to([body, b.el.querySelector(".knot")], { scale: 0, opacity: 0, duration: .08 })
      .to(b.el.querySelector("svg"), { y: 120, rotation: 25, opacity: 0, duration: .6, ease: "power2.in" }, .05);
    b.vy = 0;
  } else finish();
  if (quiet || !running) return;
  const ok = b.word === currentTarget.en;   // checked against the word asked right now
  if (ok) {
    score++;
    LP.sfx("correct"); LP.streak(true); tag(cx, cy, "+1 " + b.word, "good");
    lumi.cheer("celebrate", "point");
    const star = document.createElement("div"); star.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:1px;height:1px`; document.body.appendChild(star);
    LP.addStar(star).then(() => star.remove());
    LP.answer = null;
    setTimeout(() => { if (running) pickTarget(); }, 250);
  } else {
    LP.sfx("wrong"); LP.streak(false); tag(cx, cy, b.word, "bad");
    lumi.oops("surprised", "point");
  }
}

function tick() {
  timeLeft--;
  paintTimer();
  const seg = Math.floor((GAME_TIME - timeLeft) / (GAME_TIME / SEGS)) - 1;
  for (let i = 0; i <= seg; i++) if (!filled.has(i)) { filled.add(i); LP.fill(i); }
  LP.round(Math.min(SEGS - 1, seg + 1));
  if (timeLeft <= 10 && timeLeft > 0) { LP.sfx("tick"); if (MOVE) G.fromTo(timerEl, { scale: 1.2 }, { scale: 1, duration: .4, ease: "elastic.out(1,.4)" }); }
  if (timeLeft <= 0) endGame();
}
function paintTimer() {
  timerEl.querySelector(".s").textContent = Math.max(0, timeLeft);
  timerEl.querySelector(".fg").setAttribute("stroke-dashoffset", String(100.5 * (1 - Math.max(0, timeLeft) / GAME_TIME)));
  timerEl.classList.toggle("low", timeLeft <= 10);
}

async function endGame() {
  running = false; LP.answer = null;
  clearInterval(spawnTimer); clearInterval(tickTimer);
  LP.round(-1);
  // every balloon still in the sky pops in a quick ripple
  const left = balloons.filter(b => !b.dead);
  left.forEach((b, i) => setTimeout(() => pop(b, true), MOVE ? i * 70 : 0));
  await LP.banner("Time's up!", score + (score === 1 ? " balloon" : " balloons"));
  LP.results({ score, total: Math.max(1, score), stars: score >= 8 ? 3 : score >= 5 ? 2 : score > 0 ? 1 : 0, title: "Time's up!",
    scoreLabel: "Balloons popped", note: `You popped ${score} correct balloons!`, actor: { char: "lumi", pose: "celebrate" },
    exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Back to lesson" });
  // a timed game has no "out of": show just the count
  const sc = document.querySelector(".lp-results .score");
  if (sc && sc.lastChild && sc.lastChild.nodeType === 3) sc.lastChild.textContent = "";
}

if (!vocab.length) {
  sky.innerHTML = "<p class='lp-panel' style='padding:24px;margin:120px 20px'>No lesson data found.</p>";
} else {
  document.getElementById("promptCard").onclick = () => currentTarget && LP.say(currentTarget.en, hearBtn);
  paintTimer();
  requestAnimationFrame(frame);
  LP.title({ kicker: "Listen and pop", title: "Balloon Pop", sub: "Pop the balloon with the word you hear. Be quick: 45 seconds!", ar: "فرقع البالون الذي يحمل الكلمة التي تسمعها",
    actor: { char: "lumi", pose: "celebrate", cheer: "celebrate" } }).then(async () => {
    await LP.banner("Ready?", "45 seconds");
    await LP.banner("Pop!", "");
    running = true; LP.round(0);
    pickTarget();
    spawnBalloon();
    spawnTimer = setInterval(spawnBalloon, 900);
    tickTimer = setInterval(tick, 1000);
  });
}
</script>
</body>
</html>
