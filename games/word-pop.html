<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word Pop — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">

<style>
  /* Word Pop: Noor holds up a picture in a big bubble; word bubbles rise into the sky, drift and bump
     into each other (a small physics sim). Pop the bubble with the right English word. */
  .wp{width:100%;max-width:1240px;display:grid;grid-template-columns:1fr;gap:6px;justify-items:center;align-content:start}
  .wp-side{width:100%;max-width:440px;display:flex;align-items:flex-end;justify-content:center;gap:10px}
  .wp-host{position:relative;flex:none;height:150px;width:104px;display:flex;justify-content:center;align-items:flex-end}
  .wp-host .lp-actor{height:100%}
  .wp-target{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:0}
  .wp-orb{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#fff 0 58%,#EAF7FF 75%,#CDEBFF 100%);
    box-shadow:0 0 0 5px rgba(255,255,255,.85),0 0 0 9px rgba(120,200,255,.35),0 20px 36px -14px rgba(20,60,120,.6)}
  .wp-orb::after{content:"";position:absolute;left:16%;top:9%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-28deg);filter:blur(1px)}
  .wp-orb img{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(20,40,80,.22))}
  .wp-orb .emo{font-size:72px;line-height:1}
  .wp-orb .noimg{font-family:'Tajawal',var(--lp-body);font-weight:800;font-size:30px;color:#1E3A5F;text-align:center;padding:0 14px;line-height:1.25}
  .wp-ar{margin-top:-14px;position:relative;z-index:2;max-width:220px;padding:6px 16px 7px;border-radius:999px;background:linear-gradient(180deg,#FFD666,#FFB020);color:#43301F;
    font-family:'Tajawal',var(--lp-body);font-weight:800;font-size:20px;line-height:1.2;text-align:center;box-shadow:0 5px 0 #E08A00,0 12px 20px -10px rgba(120,60,0,.6)}
  .wp-ar:empty{display:none}
  html[data-lp="teen"] .wp-orb{background:radial-gradient(circle at 50% 45%,#F6F8FF 0 58%,#DCE3FF 76%,#B9C6FF 100%);box-shadow:0 0 0 3px rgba(190,200,255,.8),0 0 30px rgba(120,140,255,.7),0 20px 40px -14px rgba(0,0,0,.8)}
  html[data-lp="teen"] .wp-ar{background:rgba(20,24,52,.85);color:#fff;box-shadow:0 0 0 1px rgba(150,160,255,.4),0 12px 24px -10px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .wp-hint{display:none;font-family:var(--lp-display);font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);margin-top:8px;text-align:center}

  .wp-field{position:relative;width:100%;max-width:640px;height:max(330px,calc(100dvh - 330px));border-radius:30px;overflow:hidden;touch-action:manipulation}
  .wp-field::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.35)}
  html[data-lp="teen"] .wp-field::before{background:linear-gradient(180deg,rgba(120,140,255,.08),rgba(0,0,0,.12));border-color:rgba(160,170,255,.2)}

  /* a soap bubble */
  .wp-bub{position:absolute;left:0;top:0;border:0;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;will-change:transform;
    background:
      radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,0) 6%),
      radial-gradient(circle at 70% 78%,rgba(255,255,255,.55) 0 3%,rgba(255,255,255,0) 4%),
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.42) 0 52%,rgba(160,225,255,.45) 66%,rgba(255,170,235,.5) 79%,rgba(255,240,170,.55) 89%,rgba(255,255,255,.9) 100%);
    box-shadow:inset 0 -8px 18px rgba(80,160,255,.25),inset 0 8px 14px rgba(255,255,255,.5),0 14px 26px -12px rgba(20,60,120,.45);
    -webkit-backdrop-filter:blur(3px) saturate(1.3);backdrop-filter:blur(3px) saturate(1.3);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .wp-bub .t{display:block;width:80%;min-width:0;max-width:80%;hyphens:none;font-family:var(--lp-display);font-weight:800;color:#12355B;line-height:1.02;text-align:center;overflow-wrap:normal;word-break:normal;
    text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 12px rgba(255,255,255,.9);pointer-events:none}
  html[data-lp="teen"] .wp-bub{background:
      radial-gradient(circle at 30% 24%,rgba(255,255,255,.85) 0 5%,rgba(255,255,255,0) 6%),
      radial-gradient(circle at 50% 50%,rgba(30,30,80,.42) 0 55%,rgba(110,120,255,.45) 70%,rgba(255,110,220,.5) 84%,rgba(140,240,255,.85) 100%);
    box-shadow:inset 0 -10px 20px rgba(120,140,255,.3),0 0 26px -4px rgba(130,150,255,.6),0 16px 30px -12px rgba(0,0,0,.7)}
  html[data-lp="teen"] .wp-bub .t{color:#fff;text-shadow:0 0 14px rgba(140,160,255,.9),0 2px 4px rgba(0,0,0,.6)}
  .wp-bub.bad,html[data-lp] .wp-bub.bad{box-shadow:inset 0 0 0 4px rgba(244,63,94,.85),0 0 24px rgba(244,63,94,.6)}
  .wp-bub.show,html[data-lp] .wp-bub.show{box-shadow:inset 0 0 0 4px rgba(34,197,94,.9),0 0 30px rgba(34,197,94,.8)}
  .wp-bub:focus-visible{outline:3px solid var(--lp-accent-2);outline-offset:4px}

  .wp-hearts{gap:2px;padding:0 10px}
  .wp-hearts svg{width:24px;height:24px;display:block}
  .wp-hearts span{display:block}
  .wp-hearts .off path{fill:rgba(140,140,160,.35);stroke:rgba(140,140,160,.5)}

  @media (min-width:900px){
    .wp{grid-template-columns:340px minmax(0,1fr);column-gap:36px;align-items:center;min-height:calc(100dvh - 120px);align-content:center}
    .wp-side{flex-direction:column;align-items:center;max-width:340px;gap:4px}
    .wp-target{order:1}
    .wp-hint{display:block;order:2;margin:6px 0 4px;font-size:20px}
    .wp-host{order:3;height:min(36vh,300px);width:230px}
    .wp-orb{width:230px;height:230px}
    .wp-orb .emo{font-size:110px}
    .wp-orb .noimg{font-size:40px}
    .wp-ar{font-size:24px;max-width:300px}
    .wp-field{max-width:none;height:calc(100dvh - 130px)}
  }
  @media (max-width:899px) and (max-height:720px){ .wp-host{height:118px;width:84px} .wp-orb{width:120px;height:120px} .wp-field{height:max(300px,calc(100dvh - 290px))} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="wp">
    <div class="wp-side">
      <div class="wp-host" id="host"></div>
      <div class="wp-target" id="target" aria-live="polite">
        <div class="wp-orb" id="orb"></div>
        <div class="wp-ar" id="arTxt" dir="rtl" lang="ar"></div>
      </div>
      <div class="wp-hint" id="hint">Pop the right word!</div>
    </div>
    <div class="wp-field" id="field" aria-label="Word bubbles"></div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
/* ================= Hub mini games: same word source, faces and saving rule as student.html ================= */
const u = Lumio.user();
const level = Lumio.qs("level") || (u && u.level) || "pre-a";
const TEEN = ["level3", "level4", "level5", "level6"].includes(level);
const backHref = "../student.html#secHub";
// Starts as this generic fallback list; loadLessonVocabForGames() swaps it for the real lesson words.
const FALLBACK_WORD_BANK = [
  { en: "Cat", ar: "قطة", em: "🐱" }, { en: "Dog", ar: "كلب", em: "🐶" },
  { en: "Sun", ar: "شمس", em: "☀️" }, { en: "Moon", ar: "قمر", em: "🌙" },
  { en: "Apple", ar: "تفاحة", em: "🍎" }, { en: "Banana", ar: "موزة", em: "🍌" },
  { en: "Red", ar: "أحمر", em: "🔴" }, { en: "Blue", ar: "أزرق", em: "🔵" },
  { en: "One", ar: "واحد", em: "1️⃣" }, { en: "Two", ar: "اثنان", em: "2️⃣" },
  { en: "Star", ar: "نجمة", em: "⭐" }, { en: "Book", ar: "كتاب", em: "📚" },
  { en: "Fish", ar: "سمكة", em: "🐟" }, { en: "Bird", ar: "طائر", em: "🐦" },
  { en: "House", ar: "بيت", em: "🏠" }, { en: "Ball", ar: "كرة", em: "⚽" },
  { en: "Tree", ar: "شجرة", em: "🌳" }, { en: "Car", ar: "سيارة", em: "🚗" },
];
let WORD_BANK = FALLBACK_WORD_BANK;
// Photo fix: these lesson words have no picture under their own name, but the same picture exists
// under its base form (visited -> visit.png ...). Without this they fell back to plain text.
const PIC_ALIAS = { visited: "visit", baked: "bake", rested: "rest", bought: "buy", met: "meet", forgot: "forget",
  balloons: "balloon", invitation: "invite", slowly: "slow", cheaper: "cheap", affordable: "cheap", healthier: "healthy-food",
  rehearsal: "rehearse", efficient: "efficiently", "double-check": "check" };
function sdVocabFile(v) {
  if (!v.image) { const k = String(v.en).toLowerCase().trim(); if (PIC_ALIAS[k]) return PIC_ALIAS[k]; }
  return String(v.image || v.en).toLowerCase().trim().replace(/'/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
const picSrc = w => `../assets/vocab/${w.pic || sdVocabFile(w)}.png`;
// Lesson words that have no picture file in assets/vocab (checked against the folder): treated exactly like
// a failed picture (the student.html fallback) but without asking the server for a file that isn't there.
const NO_PIC = new Set("accurately ago anniversary apologized as-soon-as at-last attend backup-plan board-game boarding-pass body-language booking brunch by-the-time cause certain chaperone conclusion counterargument credits cuisine daydreaming delay deliver discover distraction dropped durable earlier effort eye-contact forecast gently giggling guest-list headcount heritage hospitality instructions internship itinerary label landmark lost-and-found mandatory milestone motivation noisy panic peaceful photo-album playlist plot-twist privacy productive progress queue recently result revision road-trip scene scholarship shelter statistic step-by-step suddenly technology the-best therefore thrilled thunder timeline timer tone turning-point unlikely whispering".split(" "));
const hasPic = w => !w.em && !NO_PIC.has(w.pic || sdVocabFile(w));
// Content fix: some lessons give two words the same Arabic (fine/okay, boring/dull, line/queue ...) or the same
// picture. Picking both into one game made two right answers (Word Pop) or look-alike non-pairs (Memory).
const picKey = w => w.em ? "em:" + w.em : hasPic(w) ? "pic:" + (w.pic || sdVocabFile(w)) : "";
const normAr = t => String(t).replace(/[\u064B-\u0652\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim();
function distinctWords(list, n) {
  const out = [], seen = new Set();
  for (const w of list) {
    const keys = ["en:" + w.en.toLowerCase().trim(), picKey(w), w.ar ? "ar:" + normAr(w.ar) : ""].filter(Boolean);
    if (keys.some(k => seen.has(k))) continue;
    keys.forEach(k => seen.add(k)); out.push(w);
    if (out.length >= n) break;
  }
  return out;
}
let gamesLessonNum = null, gamesUsingRealVocab = false;
function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pickWords(n, source) { const bank = source || WORD_BANK; return shuffled(bank).slice(0, Math.min(n, bank.length)); }
async function loadLessonVocabForGames() {
  // ?n= picks the lesson; without it, the student's most recently ATTEMPTED lesson in this level (lesson 1 before any).
  const prog = u ? ((Lumio.progressFor(u.name) || {})[level] || {}) : {};
  const attemptedNums = Object.keys(prog).map(Number);
  const nq = parseInt(Lumio.qs("n") || "", 10);
  const targetNum = nq > 0 ? nq : (attemptedNums.length ? Math.max(...attemptedNums) : 1);
  let lessonData = (window.LUMIO_LESSONS && window.LUMIO_LESSONS[level]) ? window.LUMIO_LESSONS[level][targetNum] : null;
  if (!lessonData) {
    try { const res = await fetch(`../lessons/${level}/lesson${String(targetNum).padStart(2, "0")}.json`); if (res.ok) lessonData = await res.json(); } catch (e) {}
  }
  const vocab = lessonData && Array.isArray(lessonData.vocab) ? lessonData.vocab : [];
  if (vocab.length < 3) return; // too few real words: keep the fallback bank
  WORD_BANK = vocab.map(v => ({ en: v.en, ar: v.ar || "", em: v.emoji || "", pic: sdVocabFile(v) }));
  gamesLessonNum = targetNum; gamesUsingRealVocab = true;
}
// The game's own best score per lesson, kept apart from the lesson's prep
// result (lumio_progress): it used to overwrite the prep score/percent the
// map and the teacher show as PREP, and never reached the teacher anyway.
// Local to this device, like the game itself.
function saveGameResultToLesson(stars, score, total) {
  if (!gamesUsingRealVocab || !gamesLessonNum || !u) return { counted: false, reason: "no-lesson" };
  const KEY = "lumio_game_best";
  let all; try { all = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { all = {}; }
  const game = location.pathname.split("/").pop().replace(/\.html$/, "");
  all[u.name] = all[u.name] || {}; all[u.name][level] = all[u.name][level] || {};
  const lv = all[u.name][level], prevBest = lv[gamesLessonNum] && lv[gamesLessonNum][game];
  if (prevBest && stars <= prevBest.stars) return { counted: false, reason: "not-better", lessonNum: gamesLessonNum };
  lv[gamesLessonNum] = Object.assign({}, lv[gamesLessonNum], { [game]: { stars, score, total, date: Lumio.tzNow().date } });
  try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { return { counted: false, reason: "storage-failed" }; }
  return { counted: true, first: !prevBest, lessonNum: gamesLessonNum };
}
function gameResultNote(b) {
  if (b.counted && !b.first) return `<span class="hub-note ok">🎯 New best score for Lesson ${b.lessonNum}'s words!</span>`;
  if (b.reason === "not-better") return `<span class="hub-note">You've done this well before on Lesson ${b.lessonNum}'s words — try beating it!</span>`;
  return "";
}
function gameStars(r) { if (r >= 0.85) return 3; if (r >= 0.6) return 2; return 1; } // same as lesson.js
// Results card: kit card + the hub's own lines (teens see XP, like student.html)
function hubResults(o, lines, quiet) {
  const keepRain = LP.rain, keepLottie = window.lottie;
  if (quiet) { LP.rain = () => {}; window.lottie = null; }
  LP.results(o);
  if (quiet) setTimeout(() => { LP.rain = keepRain; window.lottie = keepLottie; }, 1500);
  const note = document.querySelector(".lp-results .note");
  if (note) note.innerHTML = lines.filter(Boolean).join("") + (TEEN ? `<span class="hub-xp"><b>+${o.stars * 100} XP</b><i><s style="transform:scaleX(${o.stars / 3})"></s></i></span>` : "");
}
const hubCss = document.createElement("style");
hubCss.textContent = `.lp-results .note{display:flex;flex-direction:column;align-items:center;gap:6px}
.hub-line{font-family:var(--lp-display);font-weight:800;font-size:18px}
.hub-note{font-size:14px;opacity:.85;max-width:30em}.hub-note.ok{color:#0D9488;opacity:1}
html[data-lp="teen"] .hub-note.ok{color:#5EEAD4}
.hub-xp{display:flex;align-items:center;gap:10px;margin-top:4px}.hub-xp b{font-family:var(--lp-display);font-size:20px;color:#A78BFA}
.hub-xp i{display:block;width:140px;height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hub-xp s{display:block;height:100%;background:linear-gradient(90deg,#7C5CFF,#3BA0FF);transform-origin:0 50%;text-decoration:none}`;
document.head.appendChild(hubCss);


/* ================= Word Pop (rules from student.html) ================= */
const WP_ROUNDS = 8;
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="#FF4D6D" stroke="#C9184A" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 8.2c.5-1 1.4-1.6 2.4-1.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/></svg>';
const heartsChip = LP.el("div", "lp-chip wp-hearts", [0, 1, 2].map(() => `<span>${HEART}</span>`).join(""));
heartsChip.setAttribute("aria-label", "3 hearts left");
LP.init({
  theme: TEEN ? "teen" : "kid",
  scene: TEEN
    ? { bg: "assets/lesson-bg/level5/09.jpg", particles: "bubbles", tint: "linear-gradient(180deg,rgba(14,10,40,.25),rgba(6,8,24,.5))" }
    : { bg: "assets/lesson-bg-kid/weather-sky.jpg", particles: "bubbles", tint: "linear-gradient(180deg,rgba(255,255,255,0),rgba(30,80,160,.18))" },
  hud: { rounds: WP_ROUNDS, exitHref: backHref, extra: heartsChip }
});
const G = window.gsap, ANIM = !!G && !LP.RM;
const CH = TEEN ? { char: "noor-teen", pose: "point", cheer: "celebrate", oops: "surprised", think: "think" } : { char: "noor", pose: "point", cheer: "celebrate", oops: "surprised", think: "think" };
[CH.pose, CH.cheer, CH.oops, CH.think, "thumbs"].forEach(p => { const i = new Image(); i.src = LP.char(CH.char, p); });
const host = LP.actor(document.getElementById("host"), Object.assign({ alt: "Noor" }, CH));
const field = document.getElementById("field"), orb = document.getElementById("orb"), arTxt = document.getElementById("arTxt"), hint = document.getElementById("hint");
let wpState = null;

/* ---------- bubble physics: spring to a drifting home, wander, soft collisions, walls ---------- */
let bubs = [], raf = 0, lastT = 0, FW = 0, FH = 0, ptr = null;
function measure() { FW = field.clientWidth; FH = field.clientHeight; }
addEventListener("resize", () => { measure(); bubs.forEach(b => { b.hx = b.cx * FW; b.hy = b.cy * FH; }); if (!ANIM) bubs.forEach(place); });
field.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const r = field.getBoundingClientRect(); ptr = { x: e.clientX - r.left, y: e.clientY - r.top }; });
field.addEventListener("pointerleave", () => { ptr = null; });
function place(b, t) {
  const s = ANIM ? Math.sin((t || 0) * .004 + b.p) * .035 : 0;
  b.el.style.transform = `translate3d(${b.x - b.r}px,${b.y - b.r}px,0) scale(${(1 + s) * b.k},${(1 - s) * b.k})`;
}
function tick(t) {
  const dt = Math.min(2.2, (t - (lastT || t)) / 16.67 || 1); lastT = t;
  for (const b of bubs) {
    if (b.dead) continue;
    if (b.free) { b.vy -= .35 * dt; b.y += b.vy * dt; b.x += b.vx * dt; b.k *= 1; place(b, t); continue; }
    const hx = b.hx + Math.sin(t * .00045 + b.p) * FW * .07, hy = b.hy + Math.cos(t * .0005 + b.p * 1.7) * FH * .05;
    b.vx += ((hx - b.x) * .0016 + Math.sin(t * .0011 + b.p) * .012) * dt;
    b.vy += ((hy - b.y) * .0016 + Math.cos(t * .0013 + b.p) * .012) * dt;
    if (ptr) { const dx = b.x - ptr.x, dy = b.y - ptr.y, d = Math.hypot(dx, dy); if (d < b.r + 40 && d > 1) { b.vx += dx / d * .25; b.vy += dy / d * .25; } }
  }
  // soft collisions
  for (let i = 0; i < bubs.length; i++) for (let j = i + 1; j < bubs.length; j++) {
    const a = bubs[i], c = bubs[j]; if (a.dead || c.dead || a.free || c.free) continue;
    const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 1, min = (a.r + c.r) * .98;
    if (d < min) {
      const nx = dx / d, ny = dy / d, push = (min - d) / 2;
      a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push;
      const rel = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
      if (rel < 0) { const imp = -rel * .9; a.vx -= nx * imp / 2; a.vy -= ny * imp / 2; c.vx += nx * imp / 2; c.vy += ny * imp / 2; }
    }
  }
  for (const b of bubs) {
    if (b.dead || b.free) continue;
    b.vx *= Math.pow(.975, dt); b.vy *= Math.pow(.975, dt);
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * .6; }
    if (b.x > FW - b.r) { b.x = FW - b.r; b.vx = -Math.abs(b.vx) * .6; }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * .6; }
    if (b.in && b.y > FH - b.r) { b.y = FH - b.r; b.vy = -Math.abs(b.vy) * .6; }
    if (!b.in && b.y < FH - b.r) b.in = true;
    place(b, t);
  }
  bubs = bubs.filter(b => { const gone = b.free && b.y < -b.r * 2.5; if (gone) b.el.remove(); return !gone; });
  raf = bubs.length ? requestAnimationFrame(tick) : 0;
}
function run() { if (ANIM && !raf) { lastT = 0; raf = requestAnimationFrame(tick); } }

function fitText(b) {
  const t = b.el.firstChild; let fs = b.r * (b.word.length <= 5 ? .5 : b.word.length <= 8 ? .4 : .32);
  t.style.fontSize = fs + "px";
  while (fs > 11 && (t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > b.r * 1.45)) { fs -= 1; t.style.fontSize = fs + "px"; }
}
const HOMES = [[.26, .28], [.74, .32], [.3, .72], [.72, .7]];
function spawn(words, correct) {
  measure();
  const n = words.length, R = Math.max(50, Math.min(FW / (n > 2 ? 4.3 : 3.4), FH / 4.4, innerWidth >= 900 ? 128 : 98));
  const homes = Lumio.shuffle(HOMES.slice(0, Math.max(n, 3))).slice(0, n);
  words.forEach((w, i) => {
    const el = document.createElement("button");
    el.type = "button"; el.className = "wp-bub"; el.dataset.word = w.en; el.dataset.press = "";
    el.innerHTML = `<span class="t">${LP.esc(w.en)}</span>`;
    const r = R * (1 + (w.en.length > 9 ? .08 : 0)) * (.94 + Math.random() * .1);
    el.style.width = el.style.height = r * 2 + "px";
    field.appendChild(el);
    const b = { el, word: w.en, r, k: 1, p: Math.random() * 6.28, cx: homes[i][0] + (Math.random() - .5) * .06, cy: homes[i][1] + (Math.random() - .5) * .06 };
    b.hx = b.cx * FW; b.hy = b.cy * FH;
    if (ANIM) { b.x = b.hx + (Math.random() - .5) * 40; b.y = FH + r + 30 + i * 70; b.vx = (Math.random() - .5) * 2; b.vy = -6 - Math.random() * 3; }
    else { b.x = Math.min(FW - r, Math.max(r, b.hx)); b.y = Math.min(FH - r, Math.max(r, b.hy)); b.vx = b.vy = 0; b.in = true; }
    el.onclick = () => pick(b, w.en === correct.en);
    bubs.push(b); fitText(b); place(b, 0);
  });
  if (!ANIM) { // reduced motion: no floating, but still never overlapping
    for (let k = 0; k < 120; k++) for (let i = 0; i < bubs.length; i++) for (let j = i + 1; j < bubs.length; j++) {
      const p = bubs[i], q = bubs[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1, min = p.r + q.r + 4;
      if (d < min) { const m = (min - d) / 2; p.x -= dx / d * m; p.y -= dy / d * m; q.x += dx / d * m; q.y += dy / d * m; }
      [p, q].forEach(o => { o.x = Math.min(FW - o.r, Math.max(o.r, o.x)); o.y = Math.min(FH - o.r, Math.max(o.r, o.y)); });
    }
    bubs.forEach(o => place(o, 0));
  }
  run();
}
function popFx(b, good) {
  const r = b.el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  LP.burst(x, y, good
    ? { n: 30, colors: TEEN ? ["#fff", "#A5B4FC", "#F0ABFC", "#67E8F9"] : ["#fff", "#BAE6FD", "#FBCFE8", "#FDE68A"], shape: "dot", ringColor: "#fff", r0: b.r * .9, ringSpeed: 2.4, speed: 9 }
    : { n: 14, colors: ["#FDA4AF", "#fff"], shape: "dot", ringColor: "#F43F5E", r0: b.r * .6, speed: 4, up: -1 });
}
function popBubble(b, good) {
  b.dead = true; b.el.disabled = true; LP.sfx("pop");
  popFx(b, good);
  if (!ANIM) { b.el.remove(); return Promise.resolve(); }
  return new Promise(res => G.timeline({ onComplete: () => { b.el.remove(); res(); } })
    .to(b.el, { scale: good ? 1.3 : .8, duration: good ? .1 : .3, ease: good ? "power2.out" : "power2.in" })
    .to(b.el, { opacity: 0, scale: good ? 1.6 : .2, duration: .1 }));
}
function flyAway() {
  // the rest float off the top of the sky
  bubs.forEach(b => { b.el.disabled = true; if (!b.dead) { b.free = true; b.vy = -2 - Math.random() * 2; b.vx = (Math.random() - .5) * 3; } });
  if (!ANIM) { bubs.forEach(b => b.el.remove()); bubs = []; }
  run();
}

function hearts(lost) {
  [...heartsChip.children].forEach((h, i) => h.classList.toggle("off", i >= wpState.lives));
  heartsChip.setAttribute("aria-label", wpState.lives + " hearts left");
  if (lost && ANIM) {
    const h = heartsChip.children[wpState.lives];
    if (h) { G.fromTo(h, { scale: 1.8, rotation: -25 }, { scale: 1, rotation: 0, duration: .7, ease: "elastic.out(1,.4)" }); const c = LP.center(h); LP.burst(c.x, c.y, { n: 10, colors: ["#FF4D6D", "#fff"], shape: "dot", ring: false, speed: 4 }); }
    G.fromTo(heartsChip, { x: -6 }, { x: 0, duration: .5, ease: "elastic.out(1,.3)" });
  }
}
function resetHud() { LP.setStars(0); document.querySelectorAll(".lp-prog i b").forEach(b => { if (G) G.set(b, { scaleX: 0 }); else b.style.transform = "scaleX(0)"; }); }

function startWordPop(source) {
  wpState = { round: 0, score: 0, lives: 3, total: WP_ROUNDS, source, queue: [], lastWord: "" };
  bubs.forEach(b => b.el.remove()); bubs = [];
  resetHud(); hearts();
  nextWpRound();
}
async function nextWpRound() {
  LP.answer = null;
  if (wpState.round >= wpState.total || wpState.lives <= 0) { endWordPop(); return; }
  wpState.round++; wpState.locked = true;
  // Content fix: targets come from a shuffled queue (no word is asked twice until all have been asked),
  // and the other 3 bubbles never share the target's picture or Arabic (no two right answers).
  const bank = wpState.source || WORD_BANK;
  if (!wpState.queue.length) wpState.queue = shuffled(bank).filter(w => w.en !== wpState.lastWord);
  const correct = wpState.queue.shift() || bank[0];
  wpState.lastWord = correct.en;
  const words = distinctWords([correct, ...shuffled(bank.filter(w => w !== correct))], 4);
  wpState.correctWord = correct.en;
  LP.round(wpState.round - 1);
  // the picture swaps inside the big bubble
  if (ANIM && orb.firstChild) await new Promise(r => G.to([orb, arTxt], { scale: .2, opacity: 0, duration: .25, ease: "back.in(2)", onComplete: r }));
  orb.innerHTML = correct.em ? `<span class="emo">${LP.esc(correct.em)}</span>`
    : hasPic(correct) ? `<img src="${LP.esc(picSrc(correct))}" alt="" draggable="false" onerror="this.remove()">`
    : `<span class="noimg" dir="rtl" lang="ar">${LP.esc(correct.ar)}</span>`;
  // the Arabic stays as the helper (when the picture is missing, it is the whole clue, as in student.html)
  arTxt.textContent = hasPic(correct) || correct.em ? correct.ar : "";
  await LP.banner("Round " + wpState.round, "Pop the right word!", 700);
  if (ANIM) G.fromTo([orb, arTxt], { scale: .2, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: "back.out(2)", stagger: .08 });
  else { orb.style.opacity = arTxt.style.opacity = 1; }
  host.nod();
  spawn(Lumio.shuffle(words), correct);
  if (ANIM) LP.sfx("rise");
  await LP.wait(ANIM ? 900 : 50);
  wpState.locked = false;
  LP.answer = correct.en;   // read by the automated play-through tests
}
async function pick(b, isCorrect) {
  if (wpState.locked || b.dead) return;
  wpState.locked = true; LP.answer = null;
  LP.fill(wpState.round - 1);
  if (isCorrect) {
    wpState.score++;
    const c = LP.center(b.el), mark = LP.el("span", ""); mark.style.cssText = `position:fixed;left:${c.x}px;top:${c.y}px;width:2px;height:2px`; document.body.appendChild(mark);
    LP.sfx("correct"); LP.streak(true);
    popBubble(b, true);
    LP.say(b.word);
    host.cheer(CH.cheer, CH.pose);
    if (ANIM) G.fromTo(orb, { scale: 1.12 }, { scale: 1, duration: .7, ease: "elastic.out(1,.4)" });
    hint.textContent = b.word + "!";
    await LP.addStar(mark); mark.remove();
  } else {
    wpState.lives--;
    LP.sfx("wrong"); LP.streak(false);
    b.el.classList.add("bad");
    host.oops(CH.oops, CH.pose);
    hearts(true);
    if (ANIM) await new Promise(r => G.timeline({ onComplete: r }).to(b.el, { rotation: -10, duration: .07 }).to(b.el, { rotation: 9, duration: .09 }).to(b.el, { rotation: 0, duration: .2 }));
    popBubble(b, false);
    // show which one it was
    const rb = bubs.find(x => !x.dead && x.el.dataset.word === wpState.correctWord);
    if (rb) rb.el.classList.add("show");
    hint.textContent = "Oops!";
    await LP.wait(700);
  }
  flyAway();
  await LP.wait(ANIM ? 450 : 100);
  hint.textContent = "Pop the right word!";
  nextWpRound();
}
function endWordPop() {
  LP.answer = null; LP.round(-1);
  const ratio = wpState.score / wpState.total;
  const st = gameStars(ratio);
  const won = wpState.lives > 0;
  const note = gameResultNote(saveGameResultToLesson(st, wpState.score, wpState.total));
  hubResults({ score: wpState.score, total: wpState.total, stars: st, title: won ? "Nice popping! 🎈" : "Out of hearts!", scoreLabel: "Score",
    actor: { char: CH.char, pose: won ? "celebrate" : "thumbs" }, exitHref: backHref, exitLabel: "Back to the Hub",
    onReplay: () => startWordPop(wpState.source) }, [note], !won);
}

const ready = loadLessonVocabForGames().catch(() => {});
LP.title({ kicker: TEEN ? "English Hub · Mini game" : "English Hub · Play", title: "Word Pop", sub: "Look at the picture, then pop the bubble with the right word!",
  ar: "انظر إلى الصورة، ثم افقع الفقاعة التي فيها الكلمة الصحيحة", actor: TEEN ? { char: "noor-teen", pose: "wave", cheer: "laugh" } : { char: "noor", pose: "wave", cheer: "jump" }
}).then(() => ready).then(() => startWordPop());
</script>
