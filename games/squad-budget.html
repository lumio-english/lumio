<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Squad Budget — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800&family=Tajawal:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Squad Budget: market day at dusk. The shopping list (Arabic) is pinned on the left, the stall
     with its striped awning sells the words, Omar shops with you. Pay and the coins really leave the
     wallet and drop into the stall's till, the item flies onto the list and ticks off, and the
     receipt prints a new line. */
  .sb{width:100%;max-width:1280px;display:grid;gap:10px;grid-template-columns:92px 1fr 1fr;
    grid-template-areas:"list list wallet" "list list receipt" "actor ask ask" "stall stall stall";align-items:start}
  .sb [hidden]{display:none!important}
  .sb-list{grid-area:list}.sb-wallet{grid-area:wallet}.sb-receipt{grid-area:receipt}.sb-actor{grid-area:actor}.sb-ask{grid-area:ask}.sb-stall{grid-area:stall}

  /* shopping list: a paper note */
  .sb-list{position:relative;padding:12px 12px 10px;border-radius:6px 6px 14px 14px;color:#3a2a1a;
    background:linear-gradient(180deg,#FFFDF5,#F6EDD6);box-shadow:0 18px 30px -18px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-1.2deg)}
  .sb-list::before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:20px;margin-left:-32px;background:rgba(255,214,102,.75);transform:rotate(3deg);border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .sb-list h3{margin:0 0 6px;font-family:var(--lp-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#7a4b1e;display:flex;align-items:center;gap:6px}
  .sb-list h3 svg{width:18px;height:18px}
  .sb-items{display:grid;grid-template-columns:1fr;gap:3px;list-style:none;margin:0;padding:0}
  .sb-item{position:relative;display:flex;align-items:center;gap:8px;min-height:26px;padding:2px 6px;border-radius:8px;font-weight:700;font-size:15px;line-height:1.15;transition:background .3s}
  .sb-item .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid #b89f7a;position:relative;background:#fff}
  .sb-item .box svg{position:absolute;inset:-4px;width:26px;height:26px;color:#16A34A;overflow:visible}
  .sb-item .box svg path{stroke-dasharray:30;stroke-dashoffset:30}
  .sb-item.bought .box svg path{stroke-dashoffset:0}
  .sb-item .lbl{min-width:0;flex:1;font-family:'Tajawal',var(--lp-body);font-size:16px;overflow-wrap:anywhere}
  .sb-item .lbl .en{font-family:var(--lp-body);font-weight:800;color:#166534}
  .sb-item.bought .lbl{color:#6b5a45}
  .sb-item .strike{position:absolute;left:32px;right:6px;top:50%;height:2px;background:#16A34A;border-radius:2px;transform:scaleX(0);transform-origin:100% 50%}
  .sb-item.bought .strike{transform:scaleX(1)}
  .sb-item.now{background:rgba(255,193,61,.35);box-shadow:0 0 0 2px #F59E0B inset}
  .sb-item.now::after{content:"";position:absolute;left:-14px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:8px solid #F59E0B;animation:sbNudge .9s ease-in-out infinite}
  @keyframes sbNudge{50%{transform:translateX(4px)}}

  /* wallet */
  .sb-wallet{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 12px;border-radius:18px;
    background:linear-gradient(180deg,#5b3a1e,#3d2412);border:1px solid rgba(255,214,140,.35);box-shadow:0 14px 26px -16px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.15);color:#FFE7A8}
  .sb-wallet .lab{font-family:var(--lp-body);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;display:block;line-height:1}
  .sb-wallet b{font-family:var(--lp-display);font-weight:800;font-size:28px;line-height:1;color:#FFD666;font-variant-numeric:tabular-nums}
  .sb-wallet .coinbig{width:34px;height:34px;flex:none}
  .coin{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;vertical-align:-3px;
    background:radial-gradient(circle at 35% 30%,#FFF3B0 0 18%,#FFD33D 40%,#E9A300 75%,#B97800 100%);box-shadow:inset 0 0 0 2px rgba(150,95,0,.55),0 1px 2px rgba(0,0,0,.35)}
  .coin.fly{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;z-index:220;pointer-events:none}

  /* receipt printer */
  .sb-receipt{position:relative;padding-top:12px}
  .sb-receipt .slot{position:absolute;left:-4px;right:-4px;top:0;height:14px;border-radius:8px;background:linear-gradient(180deg,#2b2f45,#151827);box-shadow:inset 0 -3px 0 rgba(0,0,0,.6),0 6px 12px -6px rgba(0,0,0,.8)}
  .sb-paper{position:relative;margin:0 4px;padding:8px 10px 12px;background:#FFFEF8;color:#2b2b2b;font-family:'Courier Prime','Courier New',monospace;font-size:13px;line-height:1.35;
    box-shadow:0 12px 22px -14px rgba(0,0,0,.9);-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 6px) no-repeat,radial-gradient(circle at 5px 0,transparent 4px,#000 4.5px) bottom/10px 6px repeat-x;
    mask:linear-gradient(#000,#000) top/100% calc(100% - 6px) no-repeat,radial-gradient(circle at 5px 0,transparent 4px,#000 4.5px) bottom/10px 6px repeat-x}
  .sb-paper h4{margin:0 0 4px;text-align:center;font-size:12px;letter-spacing:.2em;font-weight:700;border-bottom:1px dashed #bbb;padding-bottom:3px}
  .sb-lines{display:flex;flex-direction:column;min-height:18px}
  .sb-lines .ln{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
  .sb-lines .ln span:first-child{overflow:hidden;text-overflow:ellipsis}
  .sb-lines .empty{color:#aaa;text-align:center;font-size:12px}

  /* Omar + prompt */
  .sb-actor{position:relative;height:118px;display:flex;justify-content:center;align-items:flex-end}
  .sb-actor .lp-actor{height:100%}
  .sb-ask{align-self:center;min-width:0}
  .sb-ask .lp-bubble{width:100%;max-width:100%}
  .sb-ask .lp-bubble .tail{left:-8px;bottom:26px}
  .sb-ask .lp-bubble .txt{font-size:clamp(17px,4.4vw,22px)}

  /* the stall */
  .sb-stall{position:relative;padding-top:34px;width:100%}
  .sb-awning{position:absolute;left:-6px;right:-6px;top:0;height:42px;z-index:2;border-radius:10px 10px 0 0;
    background:repeating-linear-gradient(90deg,#E8452C 0 34px,#FFF3E0 34px 68px);box-shadow:0 10px 18px -10px rgba(0,0,0,.7);
    -webkit-mask:radial-gradient(17px 12px at 17px 30px,#000 99%,transparent) 0 0/34px 42px repeat-x,linear-gradient(#000,#000) 0 0/100% 30px no-repeat;
    mask:radial-gradient(17px 12px at 17px 30px,#000 99%,transparent) 0 0/34px 42px repeat-x,linear-gradient(#000,#000) 0 0/100% 30px no-repeat;transform-origin:50% 0}
  .sb-awning::after{content:"";position:absolute;inset:0 0 auto;height:8px;background:rgba(0,0,0,.18)}
  .sb-counter{position:relative;padding:18px 12px 16px;border-radius:0 0 20px 20px;background:linear-gradient(180deg,rgba(32,20,10,.55),rgba(20,12,6,.72));
    border:1px solid rgba(255,214,140,.18);border-top:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 30px 50px -30px rgba(0,0,0,.9)}
  .sb-counter::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-10px;height:16px;border-radius:6px;background:linear-gradient(180deg,#9a6534,#6d4220);box-shadow:0 8px 14px -6px rgba(0,0,0,.8)}
  .sb-till{position:absolute;right:10px;bottom:-24px;z-index:3;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:10px;background:linear-gradient(180deg,#3f4560,#23273a);color:#FFD666;font-family:var(--lp-display);font-weight:800;font-size:14px;box-shadow:0 8px 14px -8px #000}
  .sb-till .coin{width:14px;height:14px}
  .sb-cards{margin:0 auto;max-width:860px}
  .sb-cards.c4 .lp-card .pic{aspect-ratio:4/3}
  .sb-cards .lp-card .lbl{padding:6px 6px 10px;font-size:clamp(15px,4vw,19px)}
  .sb-tag{position:absolute;top:-10px;left:-6px;z-index:2;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:999px;
    background:linear-gradient(180deg,#FFE27A,#FFB300);color:#5a3500;font-family:var(--lp-display);font-weight:800;font-size:15px;box-shadow:0 4px 0 #C98500,0 8px 14px -6px rgba(0,0,0,.6);transform:rotate(-6deg)}
  .sb-tag .coin{width:16px;height:16px}

  /* dialogue round */
  .sb-chat{max-width:620px;margin:0 auto 12px;display:flex;flex-direction:column;gap:8px}
  .sb-line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
  .sb-line.you{align-self:flex-end;flex-direction:row-reverse}
  .sb-line .who{flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;background:#14B8A6}
  .sb-line .who img{position:absolute;max-width:none;width:auto}
  .sb-line .who.you{display:grid;place-items:center;background:linear-gradient(135deg,#7C5CFF,#3BA0FF);color:#fff;font-family:var(--lp-display);font-weight:800;font-size:13px}
  .sb-line .b{padding:9px 14px;border-radius:18px;font-weight:700;font-size:16.5px;line-height:1.35;color:#F4F6FF;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-bottom-left-radius:6px}
  .sb-line .b small{display:block;font-size:12px;font-weight:800;color:#5EEAD4;margin-bottom:1px}
  .sb-line.you .b{background:linear-gradient(135deg,#7C5CFF,#3BA0FF);border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
  .sb-line.you .b small{color:#E0E7FF}
  .sb-line.q .b{border-style:dashed;color:#C9D2F5;min-width:120px;text-align:center}
  .sb-opts{display:flex;flex-direction:column;gap:10px;max-width:620px;margin:0 auto}
  .lp .sb-opts .lp-word{text-align:start;font-family:var(--lp-body);font-size:17px;line-height:1.3;min-height:52px}

  @media (min-width:900px){
    .sb{grid-template-columns:270px minmax(0,1fr) 230px;column-gap:24px;row-gap:14px;
      grid-template-areas:"list ask wallet" "list stall actor" "receipt stall actor";grid-template-rows:auto auto auto;min-height:calc(100dvh - 110px);align-content:center}
    .sb-items{gap:5px}
    .sb-item{min-height:32px;font-size:16px}
    .sb-item .lbl{font-size:18px}
    .sb-list{padding:16px 16px 14px}
    .sb-list h3{font-size:17px}
    .sb-actor{height:min(48vh,420px);align-self:end}
    .sb-ask{align-self:end}
    .sb-ask .lp-bubble .tail{display:none}
    .sb-stall{align-self:start}
    .sb-counter{padding:24px 18px 22px}
    .sb-wallet{align-self:end;min-height:72px}
    .sb-wallet b{font-size:36px}
    .sb-wallet .coinbig{width:44px;height:44px}
    .sb-paper{font-size:15px}
    .sb-cards .lp-card{max-width:230px;justify-self:center;width:100%}
    .sb-cards.c4 .lp-card .pic{aspect-ratio:1/1}
    .sb-cards .lp-card .lbl{font-size:21px}
    .sb-receipt{align-self:start}
    .sb-list{align-self:start}
  }
  @media (max-width:899px){
    .sb{gap:8px}
    .sb-receipt .sb-lines .ln:nth-last-child(n+4){display:none}
    .sb-actor{height:100px}
    .sb-cards.c4 .lp-card .pic,.sb-cards.c2 .lp-card .pic{aspect-ratio:16/10}
    .sb-cards{gap:12px}
    .sb-counter{padding:16px 10px 14px}
    .sb-list.many .sb-item{min-height:23px;padding:1px 6px}
    .sb-list.many .sb-item .lbl{font-size:15px}
    .sb-item.bought .lbl .en{font-size:13px}
    .sb.talk{grid-template-areas:"actor ask ask" "stall stall stall"}
    .sb.talk .sb-list,.sb.talk .sb-wallet,.sb.talk .sb-receipt{display:none}
    .sb.talk .sb-line .b{font-size:15.5px;padding:8px 12px}
    .lp .sb.talk .sb-opts .lp-word{font-size:16px;min-height:48px;padding:10px 14px}
  }
  @media (max-width:380px){ .sb{grid-template-columns:80px 1fr 1fr} .sb-item .lbl{font-size:15px} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="sb">
    <section class="sb-list" aria-label="Shopping list">
      <h3><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z" fill="#F97316"/><path d="M9 7a3 3 0 016 0" stroke="#7a4b1e" stroke-width="2" stroke-linecap="round"/></svg>Shopping List</h3>
      <ul class="sb-items" id="shopList"></ul>
    </section>
    <div class="sb-wallet" id="wallet" aria-live="polite">
      <span class="coin coinbig" aria-hidden="true"></span>
      <span><span class="lab">Wallet</span><b id="coins">0</b></span>
    </div>
    <div class="sb-receipt" aria-label="Receipt">
      <div class="slot"></div>
      <div class="sb-paper" id="paper"><h4>RECEIPT</h4><div class="sb-lines" id="receiptLines"><div class="empty">— — —</div></div></div>
    </div>
    <div class="sb-actor" id="omarZone"></div>
    <div class="sb-ask">
      <button class="lp-bubble" id="promptCard" type="button" aria-label="Hear it again">
        <span class="lp-speak" id="hearBtn" aria-hidden="true"></span>
        <span class="txt" id="promptText">Find this on the list!</span>
        <span class="tail"></span>
      </button>
    </div>
    <section class="sb-stall" aria-label="Market stall">
      <div class="sb-awning" id="awning"></div>
      <div class="sb-counter">
        <div id="dialogueContext" class="sb-chat" hidden></div>
        <div class="lp-cards c4 sb-cards" id="stallGrid" aria-live="polite"></div>
        <div class="sb-till" id="till" aria-hidden="true"><span class="coin"></span><span id="tillN">0</span></div>
      </div>
    </section>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "level4";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from");
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;

LP.init({ theme: "teen", scene: { bg: "assets/lesson-bg-kid/market.jpg", pos: "center 35%", particles: "motes", tint: "linear-gradient(180deg,rgba(70,30,80,.38),rgba(12,6,20,.62))" }, hud: { rounds: 6, exitHref: backHref } });
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const G = window.gsap, RM = LP.RM, esc = LP.esc;
const $ = id => document.getElementById(id);
$("hearBtn").innerHTML = LP.ICON.speaker;

// Each Level 4 lesson's own Crew Talk chat (the same one the class slides use: lib/crew_talk_level4.py,
// written around that lesson's words). [speaker, line, recorded?]. The chat round shows the first two
// lines and asks for the third; the wrong replies are lines from earlier lessons' chats.
const CREW_TALK = [[["Sara","Does Noor even sleep? She wakes up at five to study.",0],["Ziad","Then she practices piano, then she hangs out with us.",0],["Sara","When does she relax?",0],["Ziad","She takes a nap after school. Ten minutes exactly.",0],["Sara","That's not a hobby, that's a schedule.",0],["Ziad","Don't tell her that. She'll chill even less.",0]],[["Omar","My mom set a new bedtime and a screen-time limit.",0],["Hamad","Same. My schedule is: homework, workout, sleep.",0],["Omar","When's your deadline for the science project?",0],["Hamad","Friday. My rule: finish it before the weekend.",0],["Omar","My rule is different. I finish it Sunday night.",0],["Hamad","That's not a rule, that's panic.",0]],[["Noor","How often do you actually clean your room?",0],["Sara","Weekly. Okay, occasionally. Fine, rarely.",0],["Noor","I do it daily. It takes five minutes.",0],["Sara","You constantly say that, but I never see you do it.",0],["Noor","Because you never visit, you're always gaming.",0],["Sara","Fair. Rarely visiting is also a habit.",0]],[["Hamad","Do you have any plans before the holiday?",0],["Sara","A dentist appointment, then a deadline, then freedom.",0],["Hamad","After the break, the new semester starts already.",0],["Sara","Don't say that. I'm still in weekend mode.",0],["Hamad","It's Tuesday.",0],["Sara","Exactly. Two days before the weekend.",0]],[["Omar","I texted you three times. Why no reply?",0],["Noor","I was on a video chat with my cousin. What's up?",0],["Omar","Ziad wants to invite everyone to meet at the park.",0],["Noor","Call him and say yes. I'll add the contact to the group.",0],["Omar","Done. He replied with twelve emojis.",0],["Noor","That's Ziad for 'great'.",0]],[["Ziad","Whose earbuds are these? They're in my jacket.",0],["Hamad","Those are mine! I left them in your bike basket.",0],["Ziad","And this notebook? And this wallet?",0],["Hamad","The notebook is Sara's. The wallet is yours, look.",0],["Ziad","Oh. That explains the missing sneakers too.",0],["Hamad","Your sneakers are on your feet, Ziad.",0]],[["Sara","Got any snacks? I'm starving.",0],["Omar","There are leftovers in the fridge and chips in the pantry.",0],["Sara","Leftovers of what?",0],["Omar","Pasta. My dad bought the groceries and cooked it.",0],["Sara","What ingredients? I'm not allergic to anything, just curious.",0],["Omar","Tomato, cheese, and a secret. Eat.",0]],[["Noor","How much is that hoodie? I don't see a price tag.",0],["Ziad","Eighty, but there's a discount today. Sixty.",0],["Noor","My allowance is fifty. My budget says no.",0],["Ziad","Use your savings. It's a good deal.",0],["Noor","Savings are for emergencies.",0],["Ziad","A cold day without a hoodie IS an emergency. Keep the receipt.",0]],[["Hamad","I'm saving up for a new bike. Forty coins so far.",0],["Sara","In a moneybox? Seriously?",0],["Hamad","Yes. I earn ten a week helping my uncle.",0],["Sara","Don't spend it on snacks. Or lend it to Ziad.",0],["Hamad","I never lend. I only borrow.",0],["Sara","That's why your wallet is empty.",0]],[["Omar","Noor's drawing won. It was outstanding.",0],["Ziad","Honestly, all the drawings were impressive.",0],["Omar","Hers was unique though. Nobody drew the city at night.",0],["Ziad","She's so talented and she never brags.",0],["Omar","That's why she's popular.",0],["Ziad","And skilled. Don't forget skilled.",0]],[["Noor","I'd like the chicken, please. What do you recommend?",0],["Hamad","I suggest the rice with it. It's the best on the menu.",0],["Noor","I prefer salad. Can I request that instead?",0],["Hamad","Of course. Good choice, this restaurant does great salads.",0],["Noor","And you? What's your order?",0],["Hamad","Everything. I'll decide when it arrives.",0]],[["Sara","Can I give you some advice about the exam?",0],["Ziad","Only if it's a good tip.",0],["Sara","You should try studying in the morning. It's a habit that works.",0],["Ziad","My opinion? Mornings are a warning sign.",0],["Sara","My suggestion is free, take it or leave it.",0],["Ziad","Fine. One morning. Then we'll see.",0]],[["Omar","Did you see Hamad's post? Two hundred likes.",0],["Noor","I commented and shared it. The hashtag is genius.",0],["Omar","My notifications won't stop. Everyone's online.",0],["Noor","Check his profile. He changed the picture again.",0],["Omar","Third time this week.",0],["Noor","That's the group chat's favourite topic now.",0]],[["Hamad","The captain says we need to cooperate more.",0],["Ziad","I contribute! I encourage everyone from the bench.",0],["Hamad","Support is good. Playing is better.",0],["Ziad","Teamwork means everyone has a role. Mine is the loud one.",0],["Hamad","The trophy needs goals, not noise.",0],["Ziad","A true leader accepts both.",0]],[["Sara","I have to decide: art club or robotics.",0],["Omar","Consider the consequence. Robotics has a Saturday class.",0],["Sara","Then the option is clear... but art is my favourite.",0],["Omar","Compromise: robotics now, art next semester.",0],["Sara","That's a real choice. How are you so calm about this?",0],["Omar","Because it's your decision, not mine.",0]],[["Noor","I'm so nervous about the speech tomorrow.",0],["Hamad","You'll be fine. Stay calm and breathe.",0],["Noor","Easy for you, you're always confident.",0],["Hamad","I was anxious last week. Then I practised ten times.",0],["Noor","And after?",0],["Hamad","Relieved. And a little proud. You will be too.",0]],[["Ziad","What's your dream job? Be honest.",0],["Sara","My goal is to be an architect. Buildings are my passion.",0],["Ziad","That's a serious ambition. What career for me?",0],["Sara","Something with games. You'd achieve a lot.",0],["Ziad","Game designer. My future self will thank me.",0],["Sara","Only if your present self starts studying.",0]],[["Omar","I want to explore Japan one day. The culture is fascinating.",0],["Noor","Every country has a custom that surprises you.",0],["Omar","Like what?",0],["Noor","In Japan you take off your shoes inside. That's a tradition.",0],["Omar","We do that too! Same custom, different language.",0],["Noor","That's the point of a journey. You find what's shared.",0]],[["Hamad","The group project deadline is Friday and we disagree on everything.",0],["Sara","Then we compromise. You do the research, I do the design.",0],["Hamad","And Ziad?",0],["Sara","Ziad presents. He loves an audience.",0],["Hamad","That's real teamwork. I'm almost proud.",0],["Sara","Be proud on Friday, after we submit.",0]],[["Noor","Future plans project: what's yours?",0],["Ziad","Wake up late, chill, and never have a bedtime.",0],["Noor","That's a holiday, not a plan.",0],["Ziad","Fine: a schedule with an appointment every day.",0],["Noor","Rarely realistic, but constantly funny.",0],["Ziad","Put that on my profile.",0]]];
const dialoguePool = level === "level4" ? CREW_TALK.slice(0, num) : [];   // only lessons up to and including this one
// lines with a recording in assets/audio play it; the others are read by the browser voice directly
const RECORDED = new Set();
CREW_TALK.forEach(d => d.forEach(l => { if (l[2]) RECORDED.add(l[1]); }));
vocab.forEach(v => { if (v.example) RECORDED.add(v.example); });   // every lesson example sentence has a recording
function speakLine(text, btn) {
  if (RECORDED.has(text)) return LP.say(text, btn);
  try { if (window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .92; speechSynthesis.speak(u); } } catch (e) {}
  if (btn) { btn.classList.add("talking"); clearTimeout(btn._t); btn._t = setTimeout(() => btn.classList.remove("talking"), 1800); }
}

// ---------- content guards ----------
// Some Level 4 lessons give two words the same Arabic (occasionally/sometimes "أحيانا", option/choice
// "خيار", encourage/cheer "يشجع", appointment/deadline "موعد"...). The list never holds two such words
// (so no Arabic appears twice) and an option is never offered next to a word that shares its Arabic or picture.
const normAr = s => String(s || "").replace(/\(.*?\)/g, "").replace(/[\u064B-\u0652]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
// the picture: the lesson's own image name when it has one, else the word
const PIC_FIX = { level4: { goal: "future" } };   // "My goal is to learn coding." — the goal.png picture is a football in a net
const imgName = v => (v.image || (PIC_FIX[level] || {})[v.en.toLowerCase()] || v.en).toLowerCase();
const picOf = v => LP.vocabImg(imgName(v));
function clash(a, b) {
  if (a.en.toLowerCase() === b.en.toLowerCase() || imgName(a) === imgName(b)) return true;
  const x = normAr(a.ar), y = normAr(b.ar); if (!x || !y) return false;
  return x === y || (" " + x + " ").includes(" " + y + " ") || (" " + y + " ").includes(" " + x + " ");
}
const hasWord = (text, w) => new RegExp("\\b" + w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(String(text).toLowerCase());

const CHECK = '<svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M5 13.5l5 5L21 7" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const omar = LP.actor($("omarZone"), { char: "omar-teen", pose: "point", cheer: "celebrate", oops: "surprised", alt: "Omar" });
["celebrate", "surprised", "think", "happy", "explain"].forEach(p => { const i = new Image(); i.src = LP.char("omar-teen", p); });

if (!vocab.length) {
  $("stallGrid").innerHTML = "<p class='lp-panel' style='padding:24px;grid-column:1/-1'>No lesson data found.</p>";
} else {
  const ROUNDS = 6;
  // Round plan mixes the shopping vocab-match rounds with a "what comes
  // next?" conversation round using this lesson's own real dialogue --
  // covers dialogues/conversations alongside vocabulary, not vocabulary
  // alone.
  const myDialogue = dialoguePool[num - 1] || null;
  const dlgDistractors = [];
  dialoguePool.forEach((dlg, i) => {
    if (i === num - 1) return;
    dlg.slice(1).forEach(l => { if (myDialogue && l[1] !== myDialogue[2][1]) dlgDistractors.push(l[1]); });
  });
  // a wrong reply must not sound like a fair answer: drop lines that share a key word (5+ letters) with the
  // two chat lines shown, so e.g. "That's not a hobby, that's a schedule." never follows "My schedule is…"
  if (myDialogue) {
    const keys = new Set((myDialogue[0][1] + " " + myDialogue[1][1]).toLowerCase().match(/[a-z]{5,}/g) || []);
    for (let i = dlgDistractors.length - 1; i >= 0; i--) if ((dlgDistractors[i].toLowerCase().match(/[a-z]{5,}/g) || []).some(w => keys.has(w))) dlgDistractors.splice(i, 1);
  }
  // a chat round needs two wrong lines from earlier lessons; Lesson 1 has none, so it uses a sentence round
  const canTalk = !!myDialogue && dlgDistractors.length >= 2;
  const PLAN = ["shop", "shop", canTalk ? "dialogue" : "sentence", "shop", "shop", "sentence"];
  const shopRounds = PLAN.filter(t => t === "shop").length;

  // the list holds exactly what the shop rounds buy (so every item gets ticked off), never two words with the same Arabic
  const order = [];
  for (const v of Lumio.shuffle([...vocab])) { if (order.length >= shopRounds) break; if (!order.some(o => clash(o, v))) order.push(v); }
  while (order.length < shopRounds) order.push(order[order.length % Math.max(1, order.length)] || vocab[0]);
  // sentence rounds: a word whose own example uses it, different each time
  const sentencePool = Lumio.shuffle(vocab.filter(v => v.example && hasWord(v.example, v.en)));
  const prices = {};
  const priceOf = en => prices[en] || (prices[en] = [10, 15, 20, 25][Math.floor(Math.random() * 4)]);
  order.forEach(w => priceOf(w.en));
  const startCoins = order.reduce((a, w) => a + prices[w.en], 0) + 40;
  let coins = startCoins, spent = 0, shopIdx = 0;
  const bought = [];
  $("coins").textContent = coins;

  let r = 0, score = 0, locked = true;
  const stallGrid = $("stallGrid"), shopList = $("shopList"), receiptLines = $("receiptLines"), dialogueContext = $("dialogueContext");

  if (order.length > 4) document.querySelector(".sb-list").classList.add("many");
  shopList.innerHTML = order.map((w, i) => `<li class="sb-item" id="item${i}"><span class="box">${CHECK}</span><span class="lbl" dir="rtl" lang="ar">${esc(w.ar)}</span><span class="strike"></span></li>`).join("");

  let currentSpeakText = "", talkRound = false;
  const playPrompt = () => talkRound ? speakLine(currentSpeakText, $("hearBtn")) : LP.say(currentSpeakText, $("hearBtn"));

  async function drawRound() {
    locked = true; LP.answer = null;
    LP.round(r);
    stallGrid.innerHTML = "";
    omar.set("point");
    if (PLAN[r] === "dialogue") {
      await LP.banner("What's next?", "Round " + (r + 1) + " of " + ROUNDS);
      drawDialogueRound();
    } else if (PLAN[r] === "sentence" && sentencePool.length) {
      await LP.banner("Text back!", "Round " + (r + 1) + " of " + ROUNDS);
      drawSentenceRound(sentencePool.shift());
    } else {
      await LP.banner("Shop!", "Round " + (r + 1) + " of " + ROUNDS);
      await drawShopRound();
    }
  }

  async function drawShopRound() {
    dialogueContext.hidden = true; stallGrid.hidden = false; talkRound = false;
    document.querySelector(".sb").classList.remove("talk");
    $("promptText").textContent = "Find this on the list!";
    const k = shopIdx % order.length;
    const target = order[k];
    currentSpeakText = target.en;
    document.querySelectorAll(".sb-item").forEach(li => li.classList.toggle("now", li.id === "item" + k));
    if (G && !RM) G.fromTo($("item" + k), { scale: 1.12 }, { scale: 1, duration: .6, ease: "elastic.out(1,.4)" });
    const numOptions = Math.min(4, vocab.length);
    const opts = [target];
    for (const v of Lumio.shuffle(vocab.filter(v => v.en !== target.en))) {
      if (opts.length >= numOptions) break;
      if (!opts.some(o => clash(o, v))) opts.push(v);
    }
    stallGrid.className = "lp-cards sb-cards " + (opts.length >= 4 ? "c4" : opts.length === 3 ? "c3 wrap2" : "c2");
    const cards = Lumio.shuffle(opts).map(o => {
      const c = LP.picCard(o.en, { img: picOf(o) });
      c.dataset.key = o.en;
      c.insertAdjacentHTML("afterbegin", `<span class="sb-tag"><span class="coin"></span>${priceOf(o.en)}</span>`);
      c.onclick = () => choose(c, target.en, true, k);
      stallGrid.appendChild(c); return c;
    });
    if (G && !RM) G.fromTo($("awning"), { scaleY: .6 }, { scaleY: 1, duration: .7, ease: "elastic.out(1,.35)" });
    omar.nod();
    await LP.deal(cards, $("awning"));
    locked = false;
    LP.answer = target.en;   // read by the automated play-through tests
    setTimeout(playPrompt, 150);
  }

  // Dialogue round: shows the first two lines of this lesson's real
  // conversation and asks what comes next -- the correct third line vs.
  // two distractor lines drawn from other already-taught lessons' dialogues.
  const head = who => `<span class="who"><img alt="" src="${LP.char(who.toLowerCase() + "-teen", "happy")}" style="height:385%;top:4%;left:-29%"></span>`;
  const lineHtml = (who, html, id) => who === "you"
    ? `<div class="sb-line you${id ? " q" : ""}"${id ? ` id="${id}"` : ""}><span class="who you">YOU</span><div class="b"><small>You</small>${html}</div></div>`
    : `<div class="sb-line${id ? " q" : ""}"${id ? ` id="${id}"` : ""}>${head(who)}<div class="b"><small>${esc(who)}</small>${html}</div></div>`;
  function drawDialogueRound() {
    const [l1, l2, l3] = myDialogue;
    showChat("What comes next in the chat?",
      lineHtml(l1[0], esc(l1[1])) + lineHtml(l2[0], esc(l2[1])) + lineHtml(l3[0], "…", "dlgSlot"),
      l2[1], l3[1], Lumio.shuffle(dlgDistractors).slice(0, 2));
  }
  // Sentence round (from this lesson's own example sentences): Omar asks for a sentence about a word
  // given in Arabic; the right reply is that word's example sentence, the others are examples of other words.
  function drawSentenceRound(target) {
    const wrong = [];
    for (const v of Lumio.shuffle(vocab.filter(v => v.en !== target.en && v.example && v.example !== target.example))) {
      if (wrong.length >= 2) break;
      if (!clash(v, target) && !hasWord(v.example, target.en) && !wrong.some(w => clash(w, v))) wrong.push(v);
    }
    showChat("Which sentence fits the chat?",
      lineHtml("Omar", `Text me a sentence about <b class="ar" dir="rtl" lang="ar" style="font-family:Tajawal,var(--lp-body);color:#FFD666">«${esc(target.ar)}»</b> 👇`) + lineHtml("you", "…", "dlgSlot"),
      "Which sentence fits the chat?", target.example, wrong.map(v => v.example));
  }
  function showChat(prompt, html, speak, correct, wrongLines) {
    document.querySelectorAll(".sb-item").forEach(li => li.classList.remove("now"));
    $("promptText").textContent = prompt;
    stallGrid.hidden = true; dialogueContext.hidden = false; talkRound = true;
    document.querySelector(".sb").classList.add("talk");
    dialogueContext.innerHTML = html + `<div class="sb-opts" id="dlgOpts"></div>`;
    currentSpeakText = speak;
    const opts = Lumio.shuffle([correct, ...wrongLines]);
    const wrap = $("dlgOpts");
    const btns = opts.map(o => { const b = document.createElement("button"); b.type = "button"; b.className = "lp-word"; b.dataset.key = o; b.textContent = o; b.onclick = () => choose(b, correct, false); wrap.appendChild(b); return b; });
    omar.set("think");
    if (G && !RM) {
      G.fromTo(dialogueContext.querySelectorAll(".sb-line"), { y: 20, opacity: 0, scale: .8 }, { y: 0, opacity: 1, scale: 1, duration: .5, ease: "back.out(2)", stagger: .25, onStart: () => LP.sfx("pop") });
      G.fromTo(btns, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: .45, ease: "back.out(1.6)", stagger: .08, delay: .7 });
    }
    locked = false;
    LP.answer = correct;   // read by the automated play-through tests
    setTimeout(playPrompt, 350);
  }

  async function choose(card, targetKey, isShop, k) {
    if (locked || card.disabled) return;
    const ok = card.dataset.key === targetKey;
    if (!ok) {
      // gentle -- no penalty, no coins lost, they simply try another option
      LP.bad(card); omar.oops("surprised", isShop ? "point" : "think");
      card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
      if (!isShop) { card.classList.add("bad"); setTimeout(() => card.classList.remove("bad"), 650); }
      return;
    }
    locked = true; LP.answer = null; score++;
    const all = isShop ? [...stallGrid.children] : [...$("dlgOpts").children];
    all.forEach(c => c.disabled = true);
    omar.cheer("celebrate", "point");
    LP.fill(r);
    if (isShop) {
      const star = LP.good(card);
      LP.clear(all, card);
      await pay(prices[targetKey]);
      await flyToList(card, k);
      tick(k, targetKey);
      await printLine(targetKey, prices[targetKey]);
      bought.push(targetKey);
      shopIdx++;
      await star;
    } else {
      card.classList.add("good");
      const star = LP.good(card);
      // Omar's next line lands in the chat
      const slot = $("dlgSlot"); slot.classList.remove("q"); const sm = slot.querySelector("small").outerHTML; slot.querySelector(".b").innerHTML = `${sm}${esc(targetKey)}`;
      if (G && !RM) G.fromTo(slot, { scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2.2)", transformOrigin: "0% 100%" });
      LP.sfx("pop"); speakLine(targetKey);
      await star; await LP.wait(900);
    }
    await LP.wait(300);
    r++;
    r < ROUNDS ? drawRound() : endGame();
  }

  // coins leave the wallet one by one and drop into the stall's till
  async function pay(price) {
    const n = Math.max(2, Math.round(price / 5)), from = LP.center($("wallet")), to = LP.center($("till"));
    const per = price / n; let left = coins;
    coins -= price; spent += price;
    const counter = $("coins"), tillN = $("tillN");
    if (!G || RM) { counter.textContent = coins; tillN.textContent = spent; LP.sfx("coin"); return; }
    G.fromTo($("wallet"), { scale: 1.08 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" });
    await new Promise(res => {
      let done = 0;
      for (let i = 0; i < n; i++) {
        const c = document.createElement("span"); c.className = "coin fly"; document.body.appendChild(c);
        const midX = (from.x + to.x) / 2 + (Math.random() - .5) * 80, peak = Math.min(from.y, to.y) - 90 - Math.random() * 50, o = { t: 0 };
        G.to(o, { t: 1, duration: .62, delay: i * .11, ease: "power1.in", onUpdate() {
          const t = o.t, x = (1 - t) * (1 - t) * from.x + 2 * (1 - t) * t * midX + t * t * to.x, y = (1 - t) * (1 - t) * from.y + 2 * (1 - t) * t * peak + t * t * to.y;
          G.set(c, { x, y, rotationY: t * 720, scale: 1.1 - t * .3 });
        }, onComplete() {
          c.remove(); LP.sfx("coin"); left -= per; counter.textContent = Math.round(left); tillN.textContent = Math.round(spent - price + per * (done + 1));
          G.fromTo($("till"), { y: 3, scale: 1.1 }, { y: 0, scale: 1, duration: .35, ease: "back.out(3)" });
          if (++done === n) { counter.textContent = coins; tillN.textContent = spent; res(); }
        } });
      }
    });
  }

  async function flyToList(card, k) {
    const li = $("item" + k);
    if (!G || RM || !li) return;
    const a = LP.center(card), b = LP.center(li);
    await new Promise(res => G.to(card, { x: b.x - a.x, y: b.y - a.y, scale: .18, rotation: -12, opacity: .3, duration: .6, ease: "power2.in", onComplete: res }));
    LP.sfx("pop");
  }
  function tick(k, en) {
    const li = $("item" + k); if (!li) return;
    li.classList.remove("now"); li.classList.add("bought");
    const w = order[k];
    li.querySelector(".lbl").innerHTML = `<span class="en" dir="ltr">${esc(en)}</span> — ${esc(w.ar)}`;
    if (G && !RM) {
      G.fromTo(li.querySelector("path"), { strokeDashoffset: 30 }, { strokeDashoffset: 0, duration: .35, ease: "power2.out" });
      G.fromTo(li.querySelector(".strike"), { scaleX: 0 }, { scaleX: 1, duration: .4, delay: .2, ease: "power2.out" });
      G.fromTo(li, { scale: 1.1 }, { scale: 1, duration: .5, ease: "elastic.out(1,.4)" });
    }
  }
  // the receipt printer feeds a new line
  async function printLine(en, price) {
    const empty = receiptLines.querySelector(".empty"); if (empty) empty.remove();
    const ln = document.createElement("div"); ln.className = "ln";
    ln.innerHTML = `<span>${esc(en)}</span><span>${price}</span>`;
    receiptLines.appendChild(ln);
    if (G && !RM) {
      for (let i = 0; i < 4; i++) setTimeout(() => LP.sfx("tick"), i * 70);
      await new Promise(res => G.fromTo($("paper"), { y: -ln.offsetHeight }, { y: 0, duration: .45, ease: "steps(5)", onComplete: res }));
      G.fromTo(ln, { opacity: 0 }, { opacity: 1, duration: .2 });
    }
  }

  function endGame() {
    LP.round(-1); LP.answer = null;
    LP.results({ score, total: ROUNDS, scoreLabel: "Correct picks", note: "Best squad shopping trip ever!",
      actor: { char: "omar-teen", pose: "celebrate" }, exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
    // the final receipt, under the score
    const note = document.querySelector(".lp-results .note");
    if (note) {
      const rc = document.createElement("div"); rc.className = "sb-paper"; rc.style.cssText = "margin:0 auto 16px;max-width:300px;text-align:left";
      rc.innerHTML = `<h4>RECEIPT</h4>` + bought.map(en => `<div class="ln" style="display:flex;justify-content:space-between"><span>${esc(en)}</span><span>${prices[en]}</span></div>`).join("") +
        `<div style="display:flex;justify-content:space-between;border-top:1px dashed #bbb;margin-top:4px;padding-top:4px;font-weight:700"><span>Total spent</span><span>${spent}</span></div>` +
        `<div style="display:flex;justify-content:space-between;font-weight:700;color:#15803D"><span>Coins left</span><span>${coins}</span></div>`;
      note.after(rc);
      if (G && !RM) G.from(rc, { y: -20, opacity: 0, duration: .6, delay: 1.2, ease: "steps(8)" });
    }
  }

  $("promptCard").onclick = playPrompt;
  LP.title({ kicker: "Level 4 · Market day", title: "Squad Budget", sub: "Shop the list with Omar, pay with your coins and keep the receipt!", ar: "تسوّق من القائمة وادفع بعملاتك",
    button: "Let's shop", actor: { char: "omar-teen", pose: "point", cheer: "celebrate" } }).then(drawRound);
}
</script>
