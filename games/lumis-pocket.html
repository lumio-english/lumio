<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi's Pocket — Lumio English</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body {
    min-height: 100vh; overflow-x: hidden;
    background: linear-gradient(180deg, #FFE9C2 0%, #FFF3D6 45%, #FFFBF5 100%);
    position: relative;
  }
  /* soft decorative sky -- deliberately theme-neutral (works for every
     Pre-A lesson topic: family, animals, food, colors...) rather than a
     single photo background that would only fit one theme */
  .cloud {
    position: absolute; background: #fff; border-radius: 999px; opacity: .8;
    box-shadow: 40px 6px 0 -6px #fff, -40px 10px 0 -10px #fff;
  }
  .sparkle { position: absolute; font-size: 1.4rem; opacity: .55; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.85); } 50% { opacity: .7; transform: scale(1.1); } }

  #hud { position: relative; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
  #hud .pill { background: #fff; border-radius: 999px; padding: 8px 18px; font-family: var(--font-display); font-weight: 800; box-shadow: var(--sh-sm); }

  #stageWrap { position: relative; z-index: 5; max-width: 640px; margin: 0 auto; padding: 6px 20px 40px; text-align: center; }

  #lumiZone { position: relative; height: 150px; display: flex; align-items: center; justify-content: center; }
  #lumiZone img { height: 150px; filter: drop-shadow(0 10px 16px rgba(67,48,31,.18)); transition: transform .25s ease; }
  #lumiZone img.bounce { animation: bounce .5s ease; }
  #lumiZone img.wobble { animation: wobble .5s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-18px) scale(1.06); } 60% { transform: translateY(4px) scale(.98); } }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  #promptCard {
    background: #fff; border-radius: 24px; padding: 16px 26px; margin: 6px auto 22px;
    box-shadow: var(--sh-md); display: inline-flex; align-items: center; gap: 14px; max-width: 90%;
  }
  #promptCard p { font-family: var(--font-display); font-weight: 800; color: var(--cocoa); font-size: 1.15rem; margin: 0; }
  #hearBtn {
    background: var(--grad-sun); border: none; border-radius: 999px; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 6px 14px rgba(255,197,61,.5); transition: transform .15s ease;
  }
  #hearBtn:active { transform: scale(.9); }
  #hearBtn.pulse { animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 14px rgba(255,197,61,.5); } 50% { box-shadow: 0 6px 22px rgba(255,197,61,.85); } }

  #optGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    max-width: 560px; margin: 0 auto;
  }
  @media (max-width: 620px) { #optGrid { grid-template-columns: repeat(2, 1fr); } }
  .opt-card {
    background: #fff; border: 5px solid transparent; border-radius: 26px; padding: 0;
    cursor: pointer; overflow: hidden; box-shadow: var(--sh-md);
    transition: transform .15s ease, border-color .2s ease, opacity .3s ease;
    aspect-ratio: 1 / 1; position: relative;
  }
  .opt-card:active { transform: scale(.94); }
  .opt-card .pic { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .opt-card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 10%; box-sizing: border-box; background: #fff; }
  .opt-card.correct { border-color: var(--green); background: var(--green-soft); }
  .opt-card.correct-pop { animation: correctPop .5s ease; }
  @keyframes correctPop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .opt-card.wrong-dim { opacity: .35; pointer-events: none; }
  .opt-card.wrong-shake { animation: wrongShake .4s ease; }
  @keyframes wrongShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .opt-card.locked { pointer-events: none; }
  .opt-card .check {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 999px;
    background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem; opacity: 0; transform: scale(.5); transition: all .25s ease;
  }
  .opt-card.correct .check { opacity: 1; transform: scale(1); }

  #stickerRow { display: flex; gap: 10px; justify-content: center; margin: 18px 0; flex-wrap: wrap; }
  #stickerRow .sticker {
    width: 46px; height: 46px; border-radius: 999px; background: var(--sun-soft);
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    box-shadow: var(--sh-sm); opacity: .25; transform: scale(.7); transition: all .3s ease;
  }
  #stickerRow .sticker.won { opacity: 1; transform: scale(1); background: var(--grad-sun); }

  #endcard {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(67,48,31,.45); padding: 20px;
  }
  #endcard .box { background: #fff; border-radius: 28px; padding: 36px 40px; text-align: center; box-shadow: var(--sh-lg); max-width: 420px; }
</style>
</head>
<body>

<div class="cloud" style="width:70px;height:26px;top:40px;left:8%"></div>
<div class="cloud" style="width:56px;height:20px;top:90px;right:10%"></div>
<div class="sparkle" style="top:20%;left:6%">✨</div>
<div class="sparkle" style="top:65%;right:5%;animation-delay:.8s">✨</div>
<div class="sparkle" style="top:75%;left:10%;animation-delay:1.4s">✨</div>

<div id="hud">
  <a class="btn btn-ghost" href="../present.html" id="exitBtn" style="background:#fff">Exit</a>
  <span class="pill">★ <span id="score">0</span></span>
  <span class="pill" id="roundPill">1/6</span>
</div>

<div id="stageWrap">
  <div id="lumiZone"><img id="lumiImg" src="../assets/story/characters/lumi-magnify.png" alt="Lumi"></div>

  <div id="promptCard">
    <button id="hearBtn" class="pulse" aria-label="Listen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#43301F"/><path d="M16.5 8.5a5 5 0 010 7M19 6a9 9 0 010 12" stroke="#43301F" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <p>Tap the picture you hear!</p>
  </div>

  <div id="optGrid"></div>

  <div id="stickerRow"></div>
</div>

<div id="endcard">
  <div class="box">
    <img src="../assets/story/characters/lumi-thumbs.png" alt="Lumi" style="width:120px;filter:drop-shadow(0 10px 16px rgba(67,48,31,.2))">
    <h1 style="font-family:var(--font-display);margin-top:8px">Great job!</h1>
    <p style="font-weight:800;font-size:1.2rem;margin:10px 0" id="finalScore"></p>
    <div class="row" style="justify-content:center;gap:10px">
      <button class="btn btn-primary" onclick="location.reload()">↺ Play again</button>
      <a class="btn btn-teal" id="backBtn" href="../present.html">Back</a>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script>
const level = Lumio.qs("level") || "pre-a";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from"); // "lesson" (student solo) sends them back to the map instead of Present
const backHref = source === "lesson" ? "../student.html" : `../present.html?level=${level}&n=${num}`;
document.getElementById("exitBtn").href = backHref;
document.getElementById("backBtn").href = backHref;

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];
const slug = w => w.toLowerCase().replace(/'/g, "").replace(/ /g, "-");

if (!vocab.length) {
  document.getElementById("stageWrap").innerHTML = "<p style='padding:40px'>No lesson data found.</p>";
} else {
  const ROUNDS = Math.min(6, vocab.length);
  const order = Lumio.shuffle([...vocab]).slice(0, ROUNDS);
  let r = 0, score = 0, locked = false;
  const lumiImg = document.getElementById("lumiImg");
  const optGrid = document.getElementById("optGrid");

  // sticker row set up once we know round count
  const stickerRow = document.getElementById("stickerRow");
  for (let i = 0; i < ROUNDS; i++) {
    const s = document.createElement("div");
    s.className = "sticker";
    s.textContent = "⭐";
    stickerRow.appendChild(s);
  }

  function playPrompt() {
    Lumio.speak(order[r].en);
  }

  function drawRound() {
    locked = false;
    document.getElementById("roundPill").textContent = `${r + 1}/${ROUNDS}`;
    lumiImg.src = "../assets/story/characters/lumi-magnify.png";
    lumiImg.className = "";

    const target = order[r];
    const distractorPool = Lumio.shuffle(vocab.filter(v => v.en !== target.en));
    const numOptions = Math.min(3, vocab.length);
    const opts = Lumio.shuffle([target, ...distractorPool.slice(0, numOptions - 1)]);

    optGrid.innerHTML = opts.map(o => `
      <button class="opt-card" data-en="${o.en}">
        <div class="pic">
          <div style="position:absolute;inset:0">${Lumio.letterTile(o.en)}</div>
          <img src="../assets/vocab/${slug(o.en)}.png" alt="${o.en}"
               onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">
        </div>
        <div class="check">✓</div>
      </button>`).join("");

    document.querySelectorAll(".opt-card").forEach(card => {
      card.onclick = () => choose(card, target);
    });

    setTimeout(playPrompt, 350);
  }

  function choose(card, target) {
    if (locked) return;
    const ok = card.dataset.en === target.en;
    if (ok) {
      locked = true;
      score++;
      document.getElementById("score").textContent = score;
      Lumio.beep(true);
      card.classList.add("correct", "correct-pop");
      document.querySelectorAll(".opt-card").forEach(c => c.classList.add("locked"));
      lumiImg.src = "../assets/story/characters/lumi-celebrate.png";
      lumiImg.classList.add("bounce");
      const stickers = stickerRow.querySelectorAll(".sticker");
      if (stickers[r]) stickers[r].classList.add("won");
      setTimeout(() => { r++; r < ROUNDS ? drawRound() : endGame(); }, 1100);
    } else {
      Lumio.beep(false);
      card.classList.add("wrong-shake", "wrong-dim");
      lumiImg.src = "../assets/story/characters/lumi-surprised.png";
      lumiImg.classList.add("wobble");
      setTimeout(() => { lumiImg.classList.remove("wobble"); lumiImg.src = "../assets/story/characters/lumi-magnify.png"; }, 500);
      // gentle -- no scoring penalty, no lockout; they simply try another card
      // until they find the right one, keeping this audio-recognition, not a test
    }
  }

  function endGame() {
    Lumio.confetti(90);
    const pct = Math.round((score / ROUNDS) * 100);
    Lumio.speak(pct >= 80 ? "Wonderful! You found every picture!" : "Great listening! Let's play again soon!");
    document.getElementById("finalScore").textContent = `You found ${score} out of ${ROUNDS} pictures!`;
    document.getElementById("endcard").style.display = "flex";
  }

  document.getElementById("hearBtn").onclick = playPrompt;
  drawRound();
}
</script>
</body>
</html>
