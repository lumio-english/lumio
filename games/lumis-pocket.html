<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lumi's Pocket — Lumio English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="kit/play.css">
<style>
  /* Lumi's Pocket: Lumi stands in the forest with a magnifier; picture cards pop out of
     Lumi's pocket, the child taps the one they hear, and the right card flies back in. */
  .lpk{width:100%;max-width:980px;display:grid;grid-template-columns:1fr;gap:6px;justify-items:center;align-content:start}
  .lpk-top{display:flex;align-items:flex-end;gap:6px;width:100%;max-width:620px}
  .lpk-lumi{position:relative;flex:none;height:clamp(150px,24vh,210px);width:clamp(130px,21vh,184px);display:flex;justify-content:center;align-items:flex-end}
  .lpk-lumi .lp-actor{height:100%}
  .lpk-ask{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:26px}
  .lpk-sign{position:relative;display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;
    background:linear-gradient(180deg,#C98A4B,#A86A33);color:#FFF6E6;font-family:var(--lp-display);font-weight:800;font-size:40px;line-height:1;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25),0 10px 18px -8px rgba(60,30,5,.7);text-shadow:0 2px 0 rgba(80,40,10,.5)}
  .lpk-sign::before{content:"";position:absolute;left:50%;top:-14px;width:4px;height:14px;margin-left:-2px;background:#7A4A22;border-radius:2px}
  .lpk-sign[hidden]{display:none}
  .lpk-ask .lp-bubble{max-width:100%}
  .lpk-ask .lp-bubble .tail{left:-8px;bottom:22px}
  .lpk-cards{margin-top:4px}
  /* every card always has a width: a card whose picture has no intrinsic size would otherwise collapse to a thin bar */
  .lpk-cards .lp-card{width:100%;max-width:200px;justify-self:center}
  .lpk-pocket{position:absolute;left:50%;bottom:28%;width:2px;height:2px}
  @media (min-width:900px){
    .lpk{max-width:1180px;grid-template-columns:340px 1fr;align-items:center;column-gap:36px;row-gap:18px;min-height:calc(100dvh - 120px);align-content:center}
    .lpk-top{display:contents}
    .lpk-lumi{grid-row:1 / span 2;height:min(60vh,480px);width:340px}
    .lpk-cards{max-width:780px}
    .lpk-cards .lp-card{max-width:240px}
    .lpk-ask{padding:0;align-items:flex-start;align-self:end;max-width:620px;width:100%}
    .lpk-cards{align-self:start}
  }
  @media (max-height:700px) and (max-width:899px){ .lpk-lumi{height:130px;width:114px} .lpk-sign{width:52px;height:52px;font-size:32px} }
</style>
</head>
<body>
<main class="lp-stage" id="stage">
  <div class="lpk">
    <div class="lpk-top">
      <div class="lpk-lumi" id="lumiZone"><span class="lpk-pocket" id="pocket"></span></div>
      <div class="lpk-ask">
        <span class="lpk-sign" id="letterBadge" hidden aria-label="Letter">A</span>
        <button class="lp-bubble" id="promptCard" type="button" aria-label="Hear it again">
          <span class="lp-speak" id="hearBtn" aria-hidden="true"></span>
          <span class="txt" id="promptText">Tap the picture you hear!</span>
          <span class="tail"></span>
        </button>
      </div>
    </div>
    <div class="lp-cards c3 lpk-cards" id="optGrid" aria-live="polite"></div>
  </div>
</main>

<script src="../vendor/gsap-3.12.5.min.js"></script>
<script src="../vendor/lottie-light-5.12.2.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lessons-data.js"></script>
<script src="kit/play.js"></script>
<script>
const level = Lumio.qs("level") || "pre-a";
const num = parseInt(Lumio.qs("n") || "1", 10);
const source = Lumio.qs("from"); // "lesson" (student solo) sends them back to the map instead of Present
const backHref = source === "lesson" ? "../student.html" : source === "trial" ? `../present-trial.html?level=${level}` : `../present.html?level=${level}&n=${num}`;

LP.init({ scene: { bg: "assets/story/backgrounds/forest.jpg", particles: "motes", tint: "linear-gradient(180deg,rgba(255,230,170,.10),rgba(40,20,0,.18))" }, hud: { rounds: 6, exitHref: backHref } });
document.getElementById("hearBtn").innerHTML = LP.ICON.speaker;
// From a trial deck the game opened in its own tab: Exit just closes it (the trial is still open in the first tab).
if (source === "trial") LP.hud.exit.onclick = e => { e.preventDefault(); try { window.close(); } catch (x) {} setTimeout(() => { location.href = backHref; }, 250); };

const lesson = window.LUMIO_LESSONS?.[level]?.[num];
const vocab = lesson ? lesson.vocab : [];

// ---------- Curated Pre-A letter word bank (each entry has a real vocab image) ----------
// Kept separate from the general vocab library rather than pulling random words,
// specifically so every option in a letter round genuinely starts with that letter.
const LETTER_BANK = {
  A: ["apple", "ant", "arm"], B: ["ball", "book", "banana"], C: ["cat", "car", "cup"],
  D: ["dog", "duck", "door"], E: ["egg", "elephant", "ear"], F: ["fish", "foot", "flower"],
  G: ["goat", "garden", "game"], H: ["hat", "house", "horse"],
  J: ["juice", "jump", "jacket"], K: ["kite", "kitchen"], L: ["lion", "leg", "lamp"],
  M: ["moon", "monkey", "milk"], N: ["nose", "nine", "nurse"], O: ["orange", "octopus", "oven"],
  P: ["pen", "pig", "pizza"], Q: ["queen", "quiet"], R: ["rabbit", "rain", "roof"],
  S: ["sun", "star", "snake"], T: ["table", "tree", "turtle"], U: ["umbrella", "under", "uncle"],
  V: ["van", "vegetables"], W: ["water", "watch", "window"],
  Y: ["yellow", "young"], Z: ["zebra", "zoo"],
};
// Which ABC lesson unlocks which letters -- so a round never quizzes a letter the
// child hasn't been taught yet, matching wherever they currently are in Pre-A.
function knownLetters(lessonNum) {
  if (lessonNum >= 5) return "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  if (lessonNum >= 4) return "ABCDEFGHIJKLMNOPQR".split("");
  if (lessonNum >= 3) return "ABCDEFGHI".split("");
  return []; // ABC hasn't started yet -- fall back to vocabulary rounds only
}
// Words whose pictures show the same thing (same list as Match It): never shown together.
const SAME_PIC = [["hello", "hi"], ["i", "you", "boy", "hi", "he", "sad"], ["hands", "clap"], ["dog", "puppy", "pet"], ["cat", "kitten"],
  ["big", "elephant"], ["big", "mouse"], ["small", "mouse"], ["small", "ball"], ["happy", "great"], ["fine", "okay"], ["draw", "picture"], ["cousin", "brother"],
  ["clock", "hour", "minute", "o'clock", "half past", "quarter past", "quarter to", "alarm clock"]];
const lookAlike = (a, b) => (a.image || a.en) === (b.image || b.en) || (a.ar && a.ar === b.ar) ||
  SAME_PIC.some(g => g.includes(a.en.toLowerCase()) && g.includes(b.en.toLowerCase()));
const eligibleLetters = knownLetters(num).filter(L => (LETTER_BANK[L] || []).length >= 2);

const lumi = LP.actor(document.getElementById("lumiZone"), { char: "lumi", pose: "magnify", cheer: "celebrate", oops: "surprised", alt: "Lumi" });

if (!vocab.length && !eligibleLetters.length) {
  document.getElementById("optGrid").innerHTML = "<p class='lp-panel' style='padding:24px;grid-column:1/-1'>No lesson data found.</p>";
} else {
  const ROUNDS = 6;
  let r = 0, score = 0, locked = true, firstTry = true;
  const optGrid = document.getElementById("optGrid");
  const letterBadge = document.getElementById("letterBadge");
  const promptText = document.getElementById("promptText");
  const hearBtn = document.getElementById("hearBtn");

  // Round plan: mostly letter rounds (every option really starts with the target letter),
  // with a vocabulary-in-a-sentence round mixed in when this lesson's own vocab supports it.
  const plan = [];
  for (let i = 0; i < ROUNDS; i++) plan.push({ type: eligibleLetters.length && (i % 3 !== 2 || vocab.length < 3) ? "letter" : "sentence" });
  if (!eligibleLetters.length) plan.forEach(p => p.type = "sentence");

  let currentTargetWord = "", currentSpeakText = "";
  // what this game has already asked, so no word (or letter) comes back in a later round
  const usedTargets = new Set(), usedLetters = new Set();
  const fresh = (list, used) => { const f = list.filter(x => !used.has(x)); return f.length ? f : list; };
  const playPrompt = () => LP.say(currentSpeakText, hearBtn);

  async function drawRound() {
    locked = true; firstTry = true; LP.answer = null;
    LP.round(r);
    lumi.set("magnify");
    optGrid.innerHTML = "";
    let words, pics = {};
    if (plan[r].type === "letter") {
      const L = Lumio.shuffle(fresh(eligibleLetters, usedLetters))[0];
      usedLetters.add(L);
      words = Lumio.shuffle(LETTER_BANK[L]).slice(0, Math.min(3, LETTER_BANK[L].length));
      const tw = words.find(w => !usedTargets.has(w)) || words[0];   // the asked word is one not asked before
      words = [tw].concat(words.filter(w => w !== tw));
      usedTargets.add(tw);
      currentTargetWord = currentSpeakText = words[0];
      if (Lumio.preloadSpeech) Lumio.preloadSpeech(currentSpeakText);
      letterBadge.hidden = false; letterBadge.textContent = L; letterBadge.setAttribute("aria-label", "Letter " + L);
      promptText.innerHTML = `Find <q>${LP.esc(words[0])}</q>!`;
      await LP.banner("Letter " + L, "Round " + (r + 1) + " of " + ROUNDS);
      words = Lumio.shuffle(words);
    } else {
      // Sentence/vocabulary round: this lesson's own real vocab + sentence pattern
      letterBadge.hidden = true;
      const target = Lumio.shuffle(fresh(vocab, usedTargets))[0];
      usedTargets.add(target);
      // two words of a lesson can share one sentence ("friend" / "you": "You are my friend."; "clap" / "hands"):
      // then the sentence can't tell the child which picture, and it would play twice -- say the word itself
      const lineOf = v => v.example || `This is a ${v.en}`, norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
      const shared = vocab.some(v => v !== target && norm(lineOf(v)) === norm(lineOf(target)));
      const line = shared ? target.en : lineOf(target);
      if (Lumio.preloadSpeech) Lumio.preloadSpeech(line);
      // never offer a distractor that the spoken sentence also names ("You are my friend." → not "friend")
      const said = (target.example || "").toLowerCase();
      const pool = vocab.filter(v => v.en !== target.en && v.image !== target.image && !new RegExp("\\b" + v.en.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(said));
      // never two cards with the same-looking picture (e.g. Pre-A Lesson 2 draws "I", "you" and "boy" as the same Omar)
      const picked = [target];
      for (const v of Lumio.shuffle(pool.length >= 2 ? pool : vocab.filter(v => v.en !== target.en))) {
        if (picked.length >= 3) break;
        if (!picked.some(x => lookAlike(x, v))) picked.push(v);
      }
      const opts = Lumio.shuffle(picked);
      pics = Object.fromEntries(opts.map(o => [o.en, LP.vocabImg(o.image || o.en)]));
      currentTargetWord = target.en;
      currentSpeakText = line;
      promptText.textContent = "Which one is it?";
      await LP.banner("Listen!", "Round " + (r + 1) + " of " + ROUNDS);
      words = opts.map(o => o.en);
    }
    optGrid.className = "lp-cards c3 lpk-cards" + (words.length === 3 ? " wrap2" : "");
    if (words.length === 2) optGrid.className = "lp-cards c2 lpk-cards";
    const cards = words.map(w => { const c = LP.picCard(w, { label: false, aria: "Picture", img: pics[w] }); c.onclick = () => choose(c); optGrid.appendChild(c); return c; });
    if (window.gsap && !LP.RM) gsap.fromTo([letterBadge, document.getElementById("promptCard")], { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(2)", stagger: .08 });
    lumi.nod();
    await LP.deal(cards, document.getElementById("pocket"));
    locked = false;
    LP.answer = currentTargetWord;   // read by the automated play-through tests
    playPrompt();
  }

  async function choose(card) {
    if (locked) return;
    const ok = card.dataset.word === currentTargetWord;
    if (!ok) {
      // gentle: no penalty, no lockout; they simply try another card (audio recognition, not a test)
      firstTry = false;
      LP.bad(card); lumi.oops("surprised", "magnify");
      card.disabled = true; setTimeout(() => card.classList.add("dim"), 350);
      return;
    }
    locked = true; score++; LP.answer = null;
    const cards = [...optGrid.children];
    cards.forEach(c => c.disabled = true);
    lumi.cheer("celebrate", false);
    LP.fill(r);
    await LP.good(card);
    LP.clear(cards, card);
    // the found picture hops back into Lumi's pocket
    if (window.gsap && !LP.RM) {
      const a = LP.center(card), b = LP.center(document.getElementById("pocket"));
      await new Promise(res => gsap.to(card, { x: b.x - a.x, y: b.y - a.y, scale: .15, rotation: 200, opacity: .2, duration: .55, ease: "power2.in", onComplete: res }));
      LP.sfx("pop"); lumi.nod();
    }
    await LP.wait(250);
    r++;
    r < ROUNDS ? drawRound() : endGame();
  }

  function endGame() {
    LP.round(-1);
    LP.results({ score, total: ROUNDS, scoreLabel: "Pictures found", note: score === ROUNDS ? "You found every picture!" : "Great listening!", actor: { char: "lumi", pose: "celebrate" },
      exitHref: backHref, exitLabel: source === "lesson" ? "Back to my map" : "Done" });
  }

  document.getElementById("promptCard").onclick = playPrompt;
  LP.title({ kicker: "Pre-A · Listen and find", title: "Lumi's Pocket", sub: "Listen and tap the right picture with Lumi!", ar: "استمع واضغط على الصورة الصحيحة",
    actor: { char: "lumi", pose: "wave-book", cheer: "celebrate" } }).then(drawRound);
}
</script>
</body>
</html>
