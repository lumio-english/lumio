<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumio">
<title>Story Time — Lumio English</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Bricolage+Grotesque:wght@600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games/kit/play.css">
<style>
/* ============================================================
   Lumio story reader v3: an animated picture book.
   The picture is always shown whole (its frame has the art's own
   16:9 shape), text sits on a storybook page sized to its content,
   pages really turn, words light up while they are read aloud.
   ============================================================ */
:root{
  --hdr:58px; --fs:20px;
  --paper:#FFF9EE; --paper2:#FCEBD0; --ink:#3A2716; --ink2:#86664B; --acc:#F97316; --acc-d:#EA580C; --acc2:#FFC93C;
  --q:#C2410C; --mark:#FFE07A; --markInk:#3A2716; --edge:#E8CFA6; --chip:rgba(255,251,243,.9); --chipInk:#43301F; --chipLine:rgba(255,255,255,.95);
  --display:'Baloo 2','Fredoka','Segoe UI',system-ui,sans-serif; --read:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  --arf:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --c-lumi:#B7791F; --c-sara:#E05A0C; --c-omar:#8A5A2B; --c-noor:#0F8A6A; --c-ziad:#1D4ED8; --c-hamad:#9F1239;
}
html[data-lp="teen"]{
  --paper:#151B36; --paper2:#0D1229; --ink:#EEF1FF; --ink2:#AAB5DD; --acc:#6D7CFF; --acc-d:#4F5BE8; --acc2:#22D3EE;
  --q:#FDBA74; --mark:#7C8CFF; --markInk:#fff; --edge:rgba(140,160,255,.22); --chip:rgba(14,18,38,.72); --chipInk:#EEF1FF; --chipLine:rgba(255,255,255,.18);
  --display:'Bricolage Grotesque','Baloo 2',system-ui,sans-serif; --read:'Nunito','Segoe UI',system-ui,sans-serif;
  --c-lumi:#FACC15; --c-sara:#FB923C; --c-omar:#F5D0A9; --c-noor:#5EEAD4; --c-ziad:#93C5FD; --c-hamad:#FDA4AF;
}
html,body{height:100%;overflow:hidden}
body.lp{min-height:0;height:100%;user-select:none;-webkit-user-select:none}
 /* backdrop: the page's own painting, pre-blurred once into a tiny canvas and scaled up (cheap on phones) */
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:#1b130b;pointer-events:none}
html[data-lp="teen"] #backdrop{background:#070a18}
#backdrop .bk{position:absolute;left:-5%;top:-5%;width:110%;height:110%;opacity:0;transition:opacity 1.1s ease}
#backdrop .bk.on{opacity:1}
#backdrop .tint{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(30,15,0,.18),rgba(20,8,0,.62))}
html[data-lp="teen"] #backdrop .tint{background:radial-gradient(120% 90% at 50% 40%,rgba(8,10,30,.45),rgba(3,5,18,.82))}
#backdrop .motes{position:absolute;inset:0;width:100%;height:100%}
#nav[hidden],#bookWrap[hidden]{display:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- header ---------------- */
#top{position:fixed;left:0;right:0;top:0;height:var(--hdr);z-index:60;display:flex;align-items:center;gap:8px;
  padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(15,8,0,.55),rgba(15,8,0,0));pointer-events:none}
#top > *{pointer-events:auto}
.chip{height:44px;min-width:44px;border-radius:999px;border:1px solid var(--chipLine);background:var(--chip);color:var(--chipInk);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;box-shadow:0 8px 22px -10px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-decoration:none;font-weight:800;font-size:.9rem;flex:none}
.chip svg{width:22px;height:22px}
.chip.ico{width:44px;padding:0}
.chip[aria-pressed="false"] .on,.chip[aria-pressed="true"] .off{display:none}
#ttl{flex:1;min-width:0;color:#fff;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#ttl b{display:block;font-family:var(--display);font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl small{display:block;font-weight:800;font-size:.74rem;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#exitBtn .t{display:none}
@media (min-width:700px){ #exitBtn .t{display:inline} #ttl b{font-size:1.2rem} #ttl small{font-size:.82rem} }

/* ---------------- the book ---------------- */
#bookWrap{position:absolute;inset:0;perspective:2400px;pointer-events:none}
#book{position:absolute;transform-style:preserve-3d;pointer-events:auto;touch-action:pan-y}
.pageL,.pageR{position:absolute}
.pageL{z-index:2}
.pageR{z-index:1}
.anim .pageL,.anim .pageR,.anim#book{transition:left .5s cubic-bezier(.3,.8,.3,1),top .5s cubic-bezier(.3,.8,.3,1),width .5s cubic-bezier(.3,.8,.3,1),height .5s cubic-bezier(.3,.8,.3,1),opacity .35s}
/* picture */
.pic{position:absolute;inset:0;overflow:hidden;background:#1a120a;border-radius:18px}
.pic .fill{display:none;position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(22px) brightness(.75) saturate(1.2)}
body.notext.mode-stack .pic .fill{display:block}
.pic img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.pic .sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.32) 48%,rgba(255,250,230,.12) 55%,transparent 66%);transform:translateX(-120%);mix-blend-mode:soft-light}
.pic .glints{position:absolute;inset:0;pointer-events:none}
.pic .glints i{position:absolute;width:10px;height:10px;margin:-5px;background:radial-gradient(circle,#fff 0 18%,rgba(255,240,180,.75) 30%,transparent 65%);opacity:0;animation:twinkle 4.2s ease-in-out infinite}
.pic .glints i::before,.pic .glints i::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:2px;margin:-1px -11px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);border-radius:2px}
.pic .glints i::after{transform:rotate(90deg)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:.95;transform:scale(1) rotate(40deg)}60%{opacity:0;transform:scale(.4) rotate(70deg)}}
.zoomBtn{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(20,12,4,.38);
  color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:6;opacity:.85}
.zoomBtn svg{width:22px;height:22px}
.pic.sleepy .zoomBtn{top:8px;bottom:auto}
.mode-stack .pageL .pic{box-shadow:0 0 0 4px rgba(255,255,255,.95),0 22px 40px -16px rgba(0,0,0,.7)}
html[data-lp="teen"] .mode-stack .pageL .pic{box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 30px -6px rgba(110,130,255,.55),0 22px 40px -16px rgba(0,0,0,.8)}
.mode-spread .pageL .pic{border-radius:20px 3px 3px 20px;box-shadow:-10px 26px 50px -22px rgba(0,0,0,.75)}
.mode-spread.notext .pageL .pic{border-radius:20px}
/* storybook paper page */
.paper{position:absolute;inset:0;border-radius:20px;overflow:hidden;color:var(--ink);
  background:radial-gradient(120% 70% at 90% 0%,rgba(255,255,255,.75),transparent 60%),radial-gradient(90% 60% at 0% 100%,var(--paper2),transparent 70%),var(--paper);
  box-shadow:0 26px 50px -22px rgba(0,0,0,.7),inset 0 0 0 1px var(--edge)}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(150,110,60,.08) 1px,transparent 1.2px);background-size:7px 7px}
html[data-lp="teen"] .paper{background:radial-gradient(120% 70% at 100% 0%,rgba(109,124,255,.22),transparent 60%),radial-gradient(90% 60% at 0% 100%,rgba(34,211,238,.10),transparent 70%),linear-gradient(180deg,var(--paper),var(--paper2));
  box-shadow:0 26px 50px -22px rgba(0,0,0,.85),inset 0 0 0 1px var(--edge)}
html[data-lp="teen"] .paper::before{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px)}
.mode-spread .pageR .paper{border-radius:3px 20px 20px 3px}
.mode-spread .pageR .paper::after{content:"";position:absolute;left:0;top:0;bottom:0;width:46px;pointer-events:none;
  background:linear-gradient(90deg,rgba(90,55,20,.28),rgba(90,55,20,.08) 40%,transparent)}
html[data-lp="teen"] .mode-spread .pageR .paper::after{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 40%,transparent)}
/* page stack edges (book thickness) */
.mode-spread .pageR::after{content:"";position:absolute;top:6px;bottom:6px;right:-7px;width:8px;border-radius:0 6px 6px 0;z-index:-1;
  background:repeating-linear-gradient(90deg,#f3e3c6 0 1px,#e2cba5 1px 2px);box-shadow:0 10px 20px -8px rgba(0,0,0,.6)}
html[data-lp="teen"] .mode-spread .pageR::after{background:repeating-linear-gradient(90deg,#2a3260 0 1px,#1a2048 1px 2px)}
.spine{position:absolute;top:0;width:28px;margin-left:-14px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(40,20,0,.22) 45%,rgba(255,255,255,.18) 52%,transparent);display:none}
.mode-spread .spine{display:block}
.mode-spread.notext .spine{display:none}

/* text page */
.tp{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 16px 12px 18px}
.mode-spread .tp{padding:18px 26px 18px 40px}
.mode-short .tp{padding:10px 12px 58px 22px}
.tpHead{display:flex;align-items:center;gap:8px;flex:none;min-height:44px}
.pgLbl{font-family:var(--display);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d);white-space:nowrap}
html[data-lp="teen"] .pgLbl{color:var(--acc2)}
.pgLbl i{font-style:normal;opacity:.6}
.cast{display:flex;padding-left:6px}
.cast img{width:30px;height:30px;border-radius:50%;margin-left:-7px;border:2px solid var(--paper);background:#FDE7C8;box-shadow:0 3px 8px -3px rgba(0,0,0,.4)}
html[data-lp="teen"] .cast img{background:#2a3260}
.readBtn{margin-left:auto;height:44px;border-radius:999px;border:0;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#FF9A3D,var(--acc-d));color:#fff;font-family:var(--display);font-weight:800;font-size:.95rem;
  box-shadow:0 8px 18px -8px rgba(234,88,12,.8),inset 0 -3px 0 rgba(0,0,0,.12);flex:none}
html[data-lp="teen"] .readBtn{background:linear-gradient(180deg,#8B97FF,var(--acc-d));box-shadow:0 8px 20px -8px rgba(79,91,232,.9)}
.readBtn svg{width:22px;height:22px}
.readBtn .wv{opacity:.35}
.readBtn.talking .wv{animation:wave .9s ease-in-out infinite}
.readBtn.talking .wv2{animation-delay:.25s}
.readBtn .stopI{display:none}.readBtn.talking .stopI{display:block}.readBtn.talking .spkI{display:none}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.mode-short .readBtn .lbl{display:none}
.mode-short .readBtn{padding:0;width:44px;justify-content:center}
.tpBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--edge) transparent;margin-right:-6px;padding-right:6px;position:relative}
.tpIn{margin:auto 0;padding:4px 0 6px}
.tpBody.more{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent)}
p.en{margin:0;font-family:var(--read);font-weight:600;font-size:var(--fs);line-height:1.5;color:var(--ink);user-select:text;-webkit-user-select:text}
html[data-lp="teen"] p.en{font-weight:700;line-height:1.55}
.w{border-radius:.3em;transition:background-color .18s,color .18s,box-shadow .18s;cursor:pointer;display:inline-block}
.w.on{background:var(--mark);color:var(--markInk);box-shadow:0 0 0 .12em var(--mark),0 .2em .5em -.1em rgba(0,0,0,.25)}
.w.pop{animation:wpop .5s ease}
@keyframes wpop{40%{transform:scale(1.18)}}
p.en b{font-weight:800;color:var(--q)}
p.en b .w.on{color:var(--markInk)}
.nm{font-weight:800;color:var(--nc)}
.theEnd{display:block;text-align:center;margin-top:.45em;font-family:var(--display);font-weight:800;font-size:1.3em;letter-spacing:.02em;color:var(--acc-d)}
html[data-lp="teen"] .theEnd{color:var(--acc2)}
.orn{display:flex;align-items:center;gap:10px;margin:.55em 0 .45em;color:var(--acc);opacity:.7}
.orn::before,.orn::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{background:linear-gradient(270deg,transparent,currentColor)}
.orn svg{width:16px;height:16px}
p.ar{margin:0;direction:rtl;text-align:right;font-family:var(--arf);font-weight:500;font-size:calc(var(--fs)*.86);line-height:1.75;color:var(--ink2);user-select:text;-webkit-user-select:text}
p.ar b{font-weight:700;color:var(--q);opacity:.9}
.tp.hideAr .orn,.tp.hideAr p.ar{display:none}
.arBtn{display:none;height:44px;min-width:44px;border-radius:999px;border:1.5px solid var(--edge);background:transparent;color:var(--ink2);font-family:var(--arf);font-weight:700;font-size:.95rem;padding:0 10px;flex:none}
.arBtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.mode-short .arBtn{display:inline-flex;align-items:center;justify-content:center}
.mode-short .tp.arOff .orn,.mode-short .tp.arOff p.ar{display:none}
.mode-short .cast{display:none}
/* word reveal */
.tp.veil .w,.tp.veil p.ar,.tp.veil .orn{opacity:0}

/* ---------------- nav ---------------- */
#nav{position:absolute;z-index:40;display:flex;align-items:center;gap:10px;pointer-events:auto}
.nb{flex:none;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
#prevBtn{width:52px;height:52px;border-radius:50%;background:var(--chip);color:var(--chipInk);border:1px solid var(--chipLine);box-shadow:0 10px 24px -12px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#prevBtn svg,#nextBtn svg{width:24px;height:24px}
#prevBtn:disabled{opacity:.35;pointer-events:none}
#nextBtn{height:54px;min-width:128px;padding:0 20px 0 24px;border-radius:999px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.12rem;
  background:linear-gradient(180deg,#FF9A3D,var(--acc-d));box-shadow:0 12px 26px -10px rgba(234,88,12,.9),inset 0 -4px 0 rgba(0,0,0,.14)}
html[data-lp="teen"] #nextBtn{background:linear-gradient(180deg,#8B97FF,var(--acc-d));box-shadow:0 12px 26px -10px rgba(79,91,232,.95),inset 0 -4px 0 rgba(0,0,0,.18)}
#nextBtn.ready{animation:readyGlow 1.8s ease-in-out infinite}
@keyframes readyGlow{0%,100%{box-shadow:0 12px 26px -10px rgba(234,88,12,.9),0 0 0 0 rgba(255,201,60,.0),inset 0 -4px 0 rgba(0,0,0,.14)}50%{box-shadow:0 12px 26px -10px rgba(234,88,12,.9),0 0 0 8px rgba(255,201,60,.35),inset 0 -4px 0 rgba(0,0,0,.14)}}
.trail{flex:1;min-width:0;height:44px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.trail::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:rgba(255,255,255,.35)}
.trail .fillLn{position:absolute;left:10px;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:var(--acc2);width:0;transition:width .5s ease}
.trail .d{position:relative;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(0,0,0,.12);transition:background .3s,transform .3s}
.trail .d.done{background:var(--acc2)}
.trail .me{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;background:#FDE7C8;
  box-shadow:0 6px 14px -4px rgba(0,0,0,.6);transition:left .55s cubic-bezier(.3,1.4,.5,1)}
html[data-lp="teen"] .trail .me{border-color:var(--acc2);background:#2a3260}
.mode-short #prevBtn{width:44px;height:44px}
.mode-short #nextBtn{height:44px;min-width:0;padding:0 14px 0 16px;font-size:1rem}
.mode-short .trail .me{width:28px;height:28px;margin:-14px 0 0 -14px}
.mode-short .trail .d{width:7px;height:7px}
.mode-short #nav .trail::before{background:var(--edge)}
.mode-short .trail .d{background:var(--edge)}
.mode-short .trail .d.done{background:var(--acc)}

/* ---------------- page-turn leaf ---------------- */
.leaf{position:absolute;transform-style:preserve-3d;z-index:20;pointer-events:none}
.leaf > .face{position:absolute;top:0;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform-style:flat}
.leaf > .face.back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;z-index:9}
.leaf .front .shade{background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.leaf .back .shade{background:linear-gradient(270deg,rgba(0,0,0,.05),rgba(0,0,0,.5))}
.leaf .gloss{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%)}
.leaf.stackLeaf > *{-webkit-backface-visibility:hidden;backface-visibility:hidden}

/* ---------------- colour game ---------------- */
.pic .magic{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.pic.sleepy img.art{filter:grayscale(calc(1 - var(--wake,0))) brightness(calc(.68 + .32 * var(--wake,0))) contrast(calc(.9 + .1 * var(--wake,0)));transition:filter 1s ease}
.pic.awake img.art{animation:awake 2.4s ease-in-out infinite}
@keyframes awake{0%,100%{filter:saturate(1.05) brightness(1)}50%{filter:saturate(1.3) brightness(1.08)}}
.asleepTag{position:absolute;left:50%;top:8%;transform:translateX(-50%);z-index:5;padding:6px 14px;border-radius:999px;background:rgba(20,12,4,.55);color:#fff;
  font-family:var(--display);font-weight:800;font-size:clamp(.72rem,1.6vw,1rem);white-space:nowrap;max-width:92%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px;transition:opacity .4s}
.asleepTag svg{width:18px;height:18px;flex:none}
.asleepTag span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.asleepTag{white-space:normal;text-align:center;line-height:1.2;border-radius:14px}}
.palette{display:flex;gap:var(--sg,10px);justify-content:center;align-items:center;z-index:7}
.pic .palette{position:absolute;left:0;right:0;bottom:5%}
.gameBox .palette{display:grid;grid-template-columns:repeat(4,56px);gap:10px 14px;justify-content:center;margin:8px 0 2px}
.sw{width:var(--ss,56px);height:var(--ss,56px);border-radius:50%;border:4px solid #fff;padding:0;position:relative;background:var(--c);
  box-shadow:0 8px 16px -6px rgba(40,20,0,.6),inset 0 -6px 10px rgba(0,0,0,.18),inset 0 6px 8px rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;transition:opacity .3s,filter .3s}
.sw[data-name="white"]{border-color:#E6DED2;color:#3A2716}
.sw[data-name="yellow"]{color:#3A2716}
.sw svg{width:60%;height:60%;opacity:0}
.sw.done{opacity:.5;filter:saturate(.6)}
.sw.done svg{opacity:1}
.sw.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-6deg)}50%{transform:translateX(8px) rotate(5deg)}75%{transform:translateX(-4px)}}
.slots{display:flex;gap:6px;justify-content:center;margin:8px 0 0;flex-wrap:wrap}
.slot{width:28px;height:28px;border-radius:50%;border:2.5px dashed var(--edge);display:grid;place-items:center;transition:background .4s,border-color .4s,transform .3s}
html:not([data-lp="teen"]) .slot{border-color:#D9C29C}
.slot.next{border-style:solid;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent);animation:slotP 1.2s ease-in-out infinite}

  if (MO) {
    G.from($(".ovCard", ov), { y: 40, scale: .9, opacity: 0, duration: .6, ease: "back.out(1.6)" });
    G.fromTo(".lockI", { rotation: 0 }, { rotation: 9, duration: .1, yoyo: true, repeat: 7, delay: .7, ease: "sine.inOut", transformOrigin: "50% 40%" });
    G.to(bar, { width: pct * 100 + "%", duration: 1, delay: .5, ease: "power2.out" });
  } else bar.style.width = pct * 100 + "%";
}

/* ============================================================ end of part: same progress save as story.html, then celebrate */
function finishPart() {
  if (finished) return;
  finished = true; stopSpeech();
  // Saved for the signed-in student only (a teacher preview never counts).
  try { const u = Lumio.user(); if (u && u.name && !previewMode && Lumio.saveStoryPart) Lumio.saveStoryPart(u.name, storyLevel, part.id); } catch (e) {}
  const nextPart = PARTS.find(p => p.id === part.id + 1);
  const nextOpen = nextPart && partState(nextPart).unlocked;
  const lastPart = !nextPart;
  const ov = document.createElement("section"); ov.id = "celebrate"; ov.className = "ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", `Part ${part.id} complete`);
  ov.innerHTML = `<div class="dim"></div><div class="rays"></div>
    <div class="ceCard"><div class="ceL"><div class="ceCast"></div>
      <h2 id="ceH">${lastPart ? "You finished the story!" : `Part ${part.id} complete!`}</h2>
      <p class="sub">Great reading! Come back after more lessons for the next part.</p>
      <div class="ceStars">${[0, 1, 2].map(() => `<span>${IC.star}</span>`).join("")}</div>
      <div class="ceCount">${IC.book}<b id="ceN">${MO ? 0 : part.pages}</b> pages read</div></div>
      <div class="ceR"><div class="ptrail"><svg class="path" aria-hidden="true"><path class="bg" d="" fill="none" stroke="var(--edge)" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 9"/><path class="fg" d="" fill="none" stroke="var(--acc2)" stroke-width="5" stroke-linecap="round"/></svg>
        ${PARTS.map(p => { const s = partState(p); const me = p.id === part.id; const cls = me ? "open" : !s.unlocked ? "locked" : s.done ? "done" : "open";
          return `<div class="stop ${cls}" data-id="${p.id}"><img class="th" src="assets/story/scenes/${esc(LEVEL)}/p${p.id}-01.jpg" alt=""><span class="bd">${cls === "locked" ? IC.lock : cls === "done" ? IC.check : p.id}</span><small>Part ${p.id}</small></div>`; }).join("")}
        <img class="tok" src="${avatar("lumi")}" alt=""></div>
      <div class="btns">${nextOpen ? `<button type="button" class="btnP" id="ceNext" data-press><span>Read Part ${nextPart.id}</span>${IC.arrow}</button>` : ""}
        <a class="${nextOpen ? "btnG" : "btnP"}" href="${HOME}" data-press>${IC.home}<span>${HOME_LABEL}</span></a>
        <button type="button" class="btnG" id="ceAgain" data-press>${IC.again}<span>Read again</span></button></div></div></div>`;
  document.body.appendChild(ov);
  if (nextOpen) $("#ceNext").onclick = () => goPart(nextPart.id);
  $("#ceAgain").onclick = () => goPart(part.id);
  splitTitle($("#ceH", ov), $("#ceH", ov).textContent);
  const actors = addActors($(".ceCast", ov), "celebrate"); fitCast($(".ceCast", ov));
  // story trail path between the part stops
  const trail = $(".ptrail", ov), stops = $$(".stop", trail), tokEl = $(".tok", trail);
  const myStop = stops[part.id - 1], nextStop = stops[part.id];
  const drawTrail = () => {
    const tr = trail.getBoundingClientRect(); const svg = $("svg.path", trail); svg.setAttribute("viewBox", `0 0 ${tr.width} ${tr.height}`);
    const pts = stops.map(s => { const r = s.getBoundingClientRect(); return [r.left - tr.left + r.width / 2, r.top - tr.top + r.height / 2]; });
    let d = `M${pts[0][0]},${pts[0][1]}`, df = d;
    for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], mx = (a[0] + b[0]) / 2, seg = ` C${mx},${a[1] - 26} ${mx},${b[1] + 26} ${b[0]},${b[1]}`; d += seg; if (i <= part.id) df += seg; }
    $("path.bg", svg).setAttribute("d", d); $("path.fg", svg).setAttribute("d", df);
    return pts;
  };
  const pts = drawTrail();
  const fg = $("path.fg", trail); let fl = 0; try { fl = fg.getTotalLength(); } catch (e) {}
  const segLenTo = k => { try { const tmp = document.createElementNS("http://www.w3.org/2000/svg", "path"); let d = `M${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < k; i++) { const a = pts[i - 1], b = pts[i], mx = (a[0] + b[0]) / 2; d += ` C${mx},${a[1] - 26} ${mx},${b[1] + 26} ${b[0]},${b[1]}`; } tmp.setAttribute("d", d); $("svg.path", trail).appendChild(tmp); const l = tmp.getTotalLength(); tmp.remove(); return l; } catch (e) { return 0; } };
  const segLen = segLenTo(part.id);
  const placeTok = s => { tokEl.style.left = (s.offsetLeft + s.offsetWidth / 2) + "px"; };
  placeTok(myStop);
  const markDone = () => { myStop.classList.remove("open"); myStop.classList.add("done"); $(".bd", myStop).innerHTML = IC.check; };
  const stars = $$(".ceStars span", ov);
  nav.hidden = true;
  if (!MO) { markDone(); fg.style.strokeDasharray = fl; fg.style.strokeDashoffset = Math.max(0, fl - (nextOpen ? segLenTo(part.id + 1) : segLen)); if (nextOpen && nextStop) placeTok(nextStop); actors.forEach(a => a.idle && a.idle()); return; }
  fg.style.strokeDasharray = fl; fg.style.strokeDashoffset = Math.max(0, fl - segLen);
  sfx("win");
  G.to($(".rays", ov), { rotation: 360, duration: 40, repeat: -1, ease: "none" });
  const tl = G.timeline();
  tl.from($(".dim", ov), { opacity: 0, duration: .4 })
    .from($(".rays", ov), { opacity: 0, scale: .4, duration: 1, ease: "power2.out" }, .1)
    .from($(".ceCard", ov), { y: 120, scale: .75, opacity: 0, duration: .7, ease: TEEN ? "power3.out" : "back.out(1.5)" }, .15)
    .add(() => { try { LP.rain({ n: TEEN ? 90 : 150 }); } catch (e) {} }, .5)
    .from($$("#ceH .cc", ov), { yPercent: 110, opacity: 0, scale: TEEN ? 1 : .3, duration: .5, stagger: .025, ease: TEEN ? "power3.out" : "back.out(2.2)" }, .55)
    .from($(".sub", ov), { y: 12, opacity: 0, duration: .45 }, .9);
  actors.forEach((a, i) => tl.add(() => { a.enter("bottom").then(() => { a.idle(); setTimeout(() => a.cheer(null, false), 150 + i * 140); }); }, .45 + i * .12));
  stars.forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 3, rotation: -70 }, { opacity: 1, scale: 1, rotation: 0, duration: .5, ease: "back.out(2)", onComplete: () => { sfx("star"); const c = ctr(s); burst(c.x, c.y, { n: 16, shape: "star", colors: ["#FFD666", "#FFB300", "#fff"] }); } }, 1.05 + i * .3));
  const cnt = { v: 0 };
  tl.from($(".ceCount", ov), { y: 10, opacity: 0, duration: .4 }, 1.9)
    .to(cnt, { v: part.pages, duration: Math.min(1.2, .12 * part.pages + .3), ease: "power1.out", onUpdate: () => { $("#ceN").textContent = Math.round(cnt.v); } }, 1.95)
    .from(trail, { y: 14, opacity: 0, duration: .45 }, 2.1)
    .add(() => { markDone(); sfx("coin"); burst(ctr(myStop).x, ctr(myStop).y, { n: 18, colors: ["#22C55E", "#FFD666", "#fff"] }); }, 2.6)
    .fromTo(myStop, { scale: .6 }, { scale: 1, duration: .7, ease: "elastic.out(1.2,.4)" }, 2.6);
  if (nextOpen && nextStop) {
    tl.add(() => { G.to(fg, { strokeDashoffset: Math.max(0, fl - segLenTo(part.id + 1)), duration: .8, ease: "power2.inOut" }); }, 2.95)
      .add(() => { tokEl.style.transition = "left .8s cubic-bezier(.4,0,.2,1)"; placeTok(nextStop); G.fromTo(tokEl, { y: 0 }, { y: -18, duration: .4, yoyo: true, repeat: 1, ease: "power2.out" }); sfx("rise"); }, 2.95);
  } else if (nextStop) {
    tl.add(() => { const lk = $(".bd", nextStop); G.fromTo(lk, { rotation: 0 }, { rotation: 14, duration: .09, yoyo: true, repeat: 5 }); G.fromTo(tokEl, { x: 0 }, { x: 16, duration: .18, yoyo: true, repeat: 1, ease: "power2.out" }); }, 3);
  }
  tl.from($$(".ceCard .btns > *", ov), { y: 20, opacity: 0, duration: .45, stagger: .08, ease: "back.out(2)", clearProps: "transform,opacity" }, 2.4);
}

/* ============================================================ start */
(async function start() {
  if (!STORY_AVAILABLE) {
    nav.hidden = true; $("#bookWrap").hidden = true;
    const lvName = ((window.Lumio && Lumio.LEVELS) || []).filter(l => l.id === storyLevel).map(l => l.name)[0] || storyLevel;
    const back = isTeacherSession() && !(window.Lumio && Lumio.user && Lumio.user()) ? "teacher.html" : "student.html";
    document.title = "Story not available yet — Lumio English";
    $("#ttlStory").textContent = "Story time";
    $("#exitBtn").setAttribute("href", back);
    document.body.insertAdjacentHTML("beforeend", `<section class="ov" id="noStory" style="display:flex;align-items:center;justify-content:center"><div class="ovBg" style="background:#2a1c10"></div><div class="ovCard"><h2>Story not available for this level yet</h2><p>${esc(lvName)} doesn't have a story yet — it's still being written. Check back soon!</p><div class="btns"><a class="btnP" href="${back}">${IC.home}<span>Back to my lessons</span></a></div></div></section>`);
    return;
  }
  if (!part) {
    nav.hidden = true; $("#bookWrap").hidden = true;
    document.body.insertAdjacentHTML("beforeend", `<section class="ov" style="display:flex;align-items:center;justify-content:center"><div class="ovBg" style="background:#2a1c10"></div><div class="ovCard"><h2>Story part not found</h2><p>This part of the story doesn't exist.</p><div class="btns"><a class="btnP" href="${HOME}">${IC.home}<span>${HOME_LABEL}</span></a></div></div></section>`);
    return;
  }
  const firstSrc = `assets/story/scenes/${LEVEL}/p${part.id}-01.jpg`;
  Back.to(firstSrc);
  if (doneCount < part.unlockLesson && !previewMode) { showLock(); return; }
  buildTrail(); layout();
  let d1;
  try { d1 = await getPage(1); } catch (e) { toast("This story could not load. Check the connection and try again."); return; }
  $("#bookWrap").style.visibility = "hidden";
  const coverDone = showCover(d1);
  await go(1, 0);
  await coverDone;
  layout();
  const tp = $(".tp", pageR), pic = $(".pic", pageL);
  if (tp && pic) enterPage(pic, tp);
  if (MO) {
    G.from(pageL, { x: -30, opacity: 0, duration: .6, ease: "power3.out" });
    G.from(pageR, { x: 30, opacity: 0, duration: .6, ease: "power3.out", delay: .08 });
    G.from(nav, { y: 30, opacity: 0, duration: .5, ease: "power3.out", delay: .2 });
  }
})();
</script>
